ten und machen eigentlich alle Aufgaben auf [30] Computer.\n\nViele Grüße\nJack", "q": [{"n": 21, "opts": {"a": "erzähle", "b": "erzählen", "c": "erzählt"}, "key": "c", "why": "Perfekt with 'habe' needs the Partizip II: erzählt."}, {"n": 22, "opts": {"a": "diese", "b": "dies", "c": "dieses"}, "key": "c", "why": "'das Land' is neuter, accusative: dieses Land."}, {"n": 23, "opts": {"a": "aber", "b": "obwohl", "c": "sondern"}, "key": "a", "why": "Contrast after a positive clause (not small, but many languages): aber + normal word order. 'sondern' only after a negation that is corrected."}, {"n": 24, "opts": {"a": "an", "b": "für", "c": "vor"}, "key": "b", "why": "'Das ist für mich unglaublich' – für + Akkusativ = in my opinion."}, {"n": 25, "opts": {"a": "als", "b": "wann", "c": "wenn"}, "key": "c", "why": "General/repeated situation in present tense: wenn. 'als' is for one event in the past, 'wann' for questions."}, {"n": 26, "opts": {"a": "denn", "b": "ganz", "c": "schon"}, "key": "c", "why": "'hat mich schon sehr verwirrt' – schon = really, certainly (admitting something)."}, {"n": 27, "opts": {"a": "früher", "b": "jetzt", "c": "seit"}, "key": "b", "why": "Contrast 'am Anfang … aber jetzt'; verb in position 2 after jetzt."}, {"n": 28, "opts": {"a": "Unterschied", "b": "Unterschiede", "c": "Unterschieden"}, "key": "b", "why": "'einige' needs plural, accusative: einige Unterschiede (no -n, that is dative plural)."}, {"n": 29, "opts": {"a": "brauchen", "b": "haben", "c": "müssen"}, "key": "c", "why": "Modal verb + infinitive at the end (behalten oder aufschreiben): müssen. 'brauchen' would need 'zu'."}, {"n": 30, "opts": {"a": "dem", "b": "den", "c": "der"}, "key": "a", "why": "'auf' + location (wo?) = Dativ; der Computer → auf dem Computer."}]}, "sprach2": {"text": "Das Lotterie-Systemspiel\nOtto-Suhr-Allee 100, D-10120 Berlin\n\nSehr geehrte Lottospieler,\n\nwer möchte nicht auch [31] bei sechs Richtigen im Lotto dabei sein? Vertrauen Sie beim Lottospiel nicht [32] auf das Glück, denn Sie [33] Ihre Chancen selbst stark verbessern, [34] Sie mit unserem Lotterie-System spielen – und das für nur 5 Euro in der Woche!\n\n[35] allein zu spielen, spielen Sie mit uns in einer starken Spielergemeinschaft. Dadurch erhöhen sich [36] automatisch Ihre Chancen!\n\nUnd was Sie gewinnen können? [37] unserem Quantum-System spielen Sie mit einer Chance auf einen Gewinn von 1 Million Euro! Alle Gewinne erhalten Sie umgehend und ungekürzt zu 100 % – das [38] wir Ihnen! Davon habe ich mich selbst überzeugt! Spielen Sie mit uns das Quantum-System: [39] 700 Quantum-Systemspielgruppen haben zusammen schon über sieben Millionen Euro gewonnen.\n\nHerzliche Grüße\nIhre Sabine Meier-Pütz\n\nPS: Als besondere Gewinnchance erhalten Sie heute das Vier-Richtige-Gratisspiel. [40] Sie hier unbedingt mit und gewinnen Sie! Ich drücke Ihnen die Daumen …", "words": {"a": "bei", "b": "bereits", "c": "einmal", "d": "eure", "e": "ganz", "f": "garantieren", "g": "gestern", "h": "können", "i": "machen", "j": "nur", "k": "statt", "l": "technisch", "m": "über", "n": "unser", "o": "wenn"}, "key": ["c", "j", "h", "o", "k", "e", "a", "f", "b", "i"], "why": ["'auch einmal' = for once, one day.", "'nicht nur auf das Glück vertrauen' = not only.", "Modal verb in position 2 with infinitive 'verbessern' at the end: können.", "Condition, verb at the end (spielen): wenn.", "'statt … zu + Infinitiv' = instead of.", "'ganz automatisch' = completely automatically.", "'bei unserem System' – bei + Dativ = with/in the case of.", "Verb needed with 'wir': garantieren (we guarantee).", "'bereits 700 Gruppen' = already.", "'mitmachen' – separable verb: Machen Sie … mit!"]}, "hoeren1": [{"n": 41, "s": "Die Sprecherin wäre lieber ein Einzelkind.", "a": "f", "t": "Ich hatte nie das Gefühl, dass ich lieber ein Einzelkind gewesen wäre. Meine Schwester war zwar manchmal nervig, aber ich konnte immer mit ihr reden. Alleine hätte ich mich oft gelangweilt. Deshalb bin ich froh, dass ich eine Schwester habe.", "e": "'Ich hatte nie das Gefühl, dass ich lieber ein Einzelkind gewesen wäre' – she is happy to have a sister."}, {"n": 42, "s": "Der Sprecher hat heute ein gutes Verhältnis zu seinem Bruder.", "a": "r", "t": "Früher hatten mein Bruder und ich oft Streit, aber heute verstehen wir uns sehr gut. Wir telefonieren regelmäßig und besuchen uns auch, wenn wir Zeit haben. Unser Verhältnis ist heute wirklich stark und ehrlich geworden. Ich bin sehr dankbar dafür.", "e": "Trap 'früher Streit', but 'heute verstehen wir uns sehr gut'."}, {"n": 43, "s": "Die Sprecherin würde heute gern noch eine Schwester haben.", "a": "f", "t": "Ich bin mit zwei Schwestern aufgewachsen, und ehrlich gesagt möchte ich keine weitere Schwester haben. Wir sind genug, um Spaß zu haben, aber mehr wäre mir zu viel. Ich bin mit meiner Familie sehr zufrieden, so wie sie ist.", "e": "'möchte ich keine weitere Schwester haben'."}, {"n": 44, "s": "Die Sprecherin hat schon früh lernen müssen, dass man im Zusammenleben viel Rücksicht nehmen muss.", "a": "r", "t": "Ich habe schon früh verstanden, dass man Rücksicht nehmen muss, wenn man mit anderen zusammenlebt. Besonders mit meinen Geschwistern musste ich oft teilen und Kompromisse machen. Das hat mir später im Leben sehr geholfen.", "e": "'schon früh verstanden, dass man Rücksicht nehmen muss'."}, {"n": 45, "s": "Die Sprecherin versteht sich sehr gut mit ihrem Bruder.", "a": "r", "t": "Meine Beziehung zu meinem Bruder ist gut. Wir reden oft, verstehen uns in vielen Dingen und können auch zusammen lachen. Natürlich gibt es ab und zu Meinungsverschiedenheiten, aber im Großen und Ganzen haben wir ein sehr harmonisches Verhältnis.", "e": "Small disagreements, 'aber im Großen und Ganzen … sehr harmonisches Verhältnis'."}], "hoeren2": {"intro": "Radio Europa spricht mit Frau Wallner-Calletti, einer Österreicherin, die mit ihrer Familie in Rom lebt und dort ein Wiener Restaurant führt.", "speakers": ["Moderator", "Frau Wallner-Calletti"], "lines": [["A", "Herzlich willkommen bei Radio Europa. Heute sprechen wir mit Frau Wallner-Calletti über ihr Leben in Italien. Frau Wallner-Calletti, wie lange leben Sie schon in Italien?"], ["B", "Inzwischen schon zwölf Jahre. Manchmal kann ich es selbst kaum glauben, wie schnell die Zeit vergangen ist."], ["A", "Können Sie uns erzählen, wie alles angefangen hat?"], ["B", "Natürlich. Mein Mann und ich haben damals entschieden, etwas Neues auszuprobieren. Wir wollten erst einmal für ein Jahr an einem Gymnasium in Italien unterrichten. Ursprünglich dachten wir, dass wir nur eine kurze Zeit dort bleiben. Später wurde daraus mehr, aber der erste Plan war wirklich nur für ein Jahr."], ["A", "Viele interessieren sich auch für Ihre Kennenlerngeschichte. Haben Sie Ihren Mann in einem Italienischkurs kennengelernt?"], ["B", "Nein, das war anders. Wir haben uns an der Universität in Wien getroffen, wir waren beide Studenten. Später habe ich dann auch einen Italienischkurs gemacht, aber da kannten wir uns schon."], ["A", "In Rom gibt es ja ein Restaurant mit Ihrem Namen. Wie kam es dazu?"], ["B", "Wir hatten immer die Idee, ein Stück Österreich nach Italien zu bringen. Vor ein paar Jahren haben wir dann ein Wiener Restaurant in Rom eröffnet. Die Gäste freuen sich besonders über unsere Spezialitäten wie Wiener Schnitzel, Sachertorte und Wiener Kaffee."], ["A", "War das am Anfang schwierig? Mussten Sie das Kochen erst lernen?"], ["B", "Nein, gar nicht. Ich koche seit meiner Kindheit gern und hatte in der Küche schon viel Erfahrung. Die Rezepte meiner Großmutter kannte ich auswendig. Schwierig war eher, gutes Personal zu finden."], ["A", "Viele denken, dass Sie auch ein italienisches Weinlokal besitzen. Stimmt das?"], ["B", "Ich trinke gern italienischen Wein und probiere gern neue Sorten, aber ein eigenes Weinlokal habe ich nicht. Unser Fokus liegt wirklich nur auf dem Restaurant."], ["A", "Gab es Schwierigkeiten mit den Behörden?"], ["B", "Manchmal dauert es ein bisschen, bis man alle Formulare hat. Aber meistens hatte ich Glück, und die Leute in den Ämtern waren hilfsbereit. Große Probleme hatte ich eigentlich nie."], ["A", "Wie ist das mit den Sprachen in Ihrer Familie? Lernt Ihre Tochter beide Sprachen?"], ["B", "Ja, das ist für uns ganz normal. Zu Hause sprechen wir viel Deutsch, in der Schule und mit ihren Freunden spricht sie natürlich Italienisch. Sie fühlt sich in beiden Sprachen wohl."], ["A", "Haben Sie schon einmal daran gedacht, ein Café wie das Wiener Café Central in Rom zu eröffnen?"], ["B", "Die Idee ist schön, aber wir konzentrieren uns auf unser Restaurant. So ein großes Kaffeehaus ist ein ganz anderes Projekt, dafür habe ich im Moment keine Pläne."], ["A", "Und was denken Sie über Erfolg? Ist Glück das Wichtigste?"], ["B", "Ein bisschen Glück braucht jeder. Aber ich bin überzeugt: Wenn man sich wirklich bemüht, fleißig ist und nicht aufgibt, kann man überall Erfolg haben – in Wien genauso wie in Rom."], ["A", "Vielen Dank für das nette Gespräch, Frau Wallner-Calletti."], ["B", "Ich danke Ihnen. Es war ein sehr angenehmes Interview."]], "items": [{"n": 46, "s": "Frau Wallner-Calletti lebt seit fünf Jahren in Italien.", "a": "f", "e": "'Inzwischen schon zwölf Jahre.'"}, {"n": 47, "s": "Sie wollten zuerst nur ein Jahr an einem italienischen Gymnasium unterrichten.", "a": "r", "e": "'Wir wollten erst einmal für ein Jahr an einem Gymnasium in Italien unterrichten.'"}, {"n": 48, "s": "Sie hat ihren Mann bei einem Italienischkurs kennengelernt.", "a": "f", "e": "'Wir haben uns an der Universität in Wien getroffen' – the course came later."}, {"n": 49, "s": "Sie eröffnete ein Wiener Restaurant in Rom.", "a": "r", "e": "'haben wir dann ein Wiener Restaurant in Rom eröffnet.'"}, {"n": 50, "s": "Sie hatte am Anfang große Probleme, da sie das Kochen erst lernen musste.", "a": "f", "e": "'Ich koche seit meiner Kindheit gern und hatte in der Küche schon viel Erfahrung.'"}, {"n": 51, "s": "Frau Wallner-Calletti besitzt inzwischen auch ein italienisches Weinlokal.", "a": "f", "e": "'ein eigenes Weinlokal habe ich nicht.'"}, {"n": 52, "s": "Sie hatte immer große Schwierigkeiten mit den Behörden.", "a": "f", "e": "'Große Probleme hatte ich eigentlich nie.'"}, {"n": 53, "s": "Ihre Tochter lernt die deutsche und die italienische Sprache.", "a": "r", "e": "'Zu Hause sprechen wir viel Deutsch, in der Schule … Italienisch.'"}, {"n": 54, "s": "Sie möchte bald eine Filiale des Wiener Café Central in Rom eröffnen.", "a": "f", "e": "'dafür habe ich im Moment keine Pläne.'"}, {"n": 55, "s": "Sie glaubt, dass man überall Erfolg haben kann, wenn man sich bemüht.", "a": "r", "e": "'Wenn man sich wirklich bemüht … kann man überall Erfolg haben.'"}]}, "hoeren3": [{"n": 56, "s": "Sie müssen in Ingolstadt die Regionalbahn nach Regensburg nehmen.", "a": "f", "t": "Die Regionalbahn nach Regensburg fällt heute aus. Fahrgäste werden gebeten, ab Ingolstadt auf den Ersatzbus umzusteigen. Die Verbindung ist wegen Bauarbeiten unterbrochen. Weitere Informationen erhalten Sie am Bahnhof oder online auf der Seite der Deutschen Bahn.", "e": "The regional train is cancelled ('fällt heute aus'); from Ingolstadt you take a replacement bus."}, {"n": 57, "s": "Clara kann wegen einer Prüfung die Theaterkarten nicht abholen.", "a": "f", "t": "Hallo, hier ist Clara. Ich bin total aufgeregt! Eine berühmte Theatergruppe ist in der Stadt, und ich habe gestern noch Karten bekommen. Obwohl ich heute eine Prüfung habe, habe ich die Tickets schon heute Morgen abgeholt. Jetzt freue ich mich riesig auf die Vorstellung – das wollte ich nicht verpassen!", "e": "Trap 'Prüfung': 'obwohl ich heute eine Prüfung habe' – she already has the tickets."}, {"n": 58, "s": "Im Schwarzwald können die Straßen morgen glatt werden.", "a": "r", "t": "Der Deutsche Wetterdienst warnt vor Glättegefahr im Schwarzwald. In den frühen Morgenstunden kann es in höheren Lagen zu Straßenglätte kommen. Autofahrer werden gebeten, vorsichtig zu fahren und mehr Zeit einzuplanen. Auch im Busverkehr kann es zu Verspätungen kommen.", "e": "'warnt vor Glättegefahr im Schwarzwald … Straßenglätte'."}, {"n": 59, "s": "Der Liederabend findet zu einem späteren Termin statt.", "a": "r", "t": "Der für heute geplante Liederabend wurde verschoben. Die Veranstaltung findet nun am kommenden Freitag statt. Grund für die Terminänderung ist eine Erkrankung der Sängerin. Bereits gekaufte Karten behalten ihre Gültigkeit oder können zurückgegeben werden.", "e": "'wurde verschoben … findet nun am kommenden Freitag statt'."}, {"n": 60, "s": "Im Untergeschoss gibt es Winterkleidung zum halben Preis.", "a": "f", "t": "Im Untergeschoss unseres Kaufhauses gibt es zurzeit keine Preisreduzierungen auf Winterkleidung. Die angekündigten Rabatte starten erst nächste Woche. Bitte fragen Sie unsere Verkaufsmitarbeiter nach den genauen Terminen.", "e": "'zurzeit keine Preisreduzierungen … starten erst nächste Woche'."}], "schreiben": {"letter": "Liebe(r) …,\n\ndu hast schon so lange nicht mehr geschrieben. Wie geht es dir? Heute habe ich eine Bitte. Vielleicht kannst du uns helfen?\n\nEine 16-jährige Schülerin aus deinem Land wird uns besuchen und zwei Wochen bei uns in Goldbach bleiben. Natürlich möchten wir, dass sie sich wohlfühlt. Dein Land kennen wir nur von deinen Erzählungen, denn wir waren selbst noch nicht da. Bitte gib uns ein paar Informationen, z. B. über typische Gewohnheiten oder typisches Essen. Was können wir tun und wie können wir uns vorbereiten?\n\nWir freuen uns schon auf deine Antwort. Schon einmal vielen Dank und liebe Grüße\nCaroline", "task": "Antworten Sie Caroline. Schreiben Sie etwas zu den folgenden vier Punkten.", "points": ["Reaktion auf den Besuch der Schülerin", "Vorschlag zu Essen und Trinken", "Warum Sie so lange nicht geschrieben haben", "Unternehmungen/Programm mit der Schülerin"], "model": "Köln, 12. März 2025\n\nLiebe Caroline,\n\nvielen Dank für deine E-Mail! Entschuldige bitte, dass ich so lange nicht geschrieben habe. Ich hatte in den letzten Wochen viele Prüfungen und außerdem bin ich umgezogen. Deshalb hatte ich kaum Zeit.\n\nEs freut mich sehr, dass eine Schülerin aus meinem Land zu euch kommt. Das ist eine tolle Idee! Bei uns isst man gern warm, auch am Abend. Reis mit Gemüse oder Hähnchen mag fast jeder. Viele junge Leute trinken lieber Tee als Kaffee. Schweinefleisch essen viele bei uns nicht, deshalb solltet ihr sie am besten vorher fragen.\n\nIch würde mit ihr nicht nur Sehenswürdigkeiten besuchen. Vielleicht könnt ihr einen Ausflug in die Berge machen oder zusammen ins Schwimmbad gehen. Junge Leute gehen auch gern einkaufen oder ins Kino. Wichtig ist, dass sie auch Kontakt zu Jugendlichen in ihrem Alter hat.\n\nIch bin sicher, sie wird sich bei euch wohlfühlen. Schreib mir, wie es war!\n\nLiebe Grüße\ndein(e) …", "phrases": ["Entschuldige bitte, dass ich so lange nicht geschrieben habe.", "Ich hatte in letzter Zeit viel zu tun, weil …", "Es freut mich sehr, dass …", "Bei uns isst man gern …", "Ihr könntet zum Beispiel … / Wie wäre es mit …?", "Schreib mir bald, wie es war!"]}, "vocab": [["der Flughafen, die Flughäfen", "airport"], ["ausbauen (baut aus, baute aus, hat ausgebaut)", "to expand"], ["der Ausbau", "expansion"], ["sich einsetzen für + Akk", "to campaign for"], ["der Umweltschutz", "environmental protection"], ["der Lärm", "noise"], ["die Auswirkung, -en", "effect"], ["die Veranstaltung, -en", "event"], ["die Tagung, -en", "conference"], ["der Teilnehmer, -", "participant"], ["das Jubiläum, Jubiläen", "anniversary"], ["der Dolmetscher, -", "interpreter"], ["der Arbeitsplatz, -plätze", "job, workplace"], ["zweifelhaft", "doubtful"], ["im Anschluss an + Akk", "following, after"], ["Beruf und Familie vereinbaren", "to combine work and family"], ["die Geburt, -en", "birth"], ["die Entspannung", "relaxation"], ["die Anmeldung, -en", "registration"], ["spätestens", "at the latest"], ["der Kindergarten, -gärten", "kindergarten"], ["die Erzieherin, -nen", "nursery teacher"], ["sich auskennen mit + Dat", "to know a lot about"], ["begeistert", "enthusiastic"], ["die Angst, Ängste", "fear"], ["überflüssig", "unnecessary"], ["achten auf + Akk", "to pay attention to"], ["sich gegenseitig helfen", "to help each other"], ["sich konzentrieren auf + Akk", "to concentrate on"], ["die Spezialität, -en", "speciality"], ["übernachten", "to stay overnight"], ["der Aufenthalt, -e", "stay"], ["der Unterschied, -e", "difference"], ["verwirren", "to confuse"], ["die Chance, -n", "chance"], ["der Gewinn, -e", "prize, win"], ["garantieren", "to guarantee"], ["mitmachen", "to take part"], ["Rücksicht nehmen auf + Akk", "to be considerate of"], ["das Einzelkind, -er", "only child"], ["sich verstehen mit + Dat", "to get on with"], ["das Verhältnis, -se", "relationship"], ["die Behörde, -n", "authority, office"], ["sich bemühen", "to make an effort"], ["eröffnen", "to open (a business)"], ["ausfallen (fällt aus, fiel aus, ist ausgefallen)", "to be cancelled"], ["umsteigen", "to change (trains)"], ["verschieben (verschob, hat verschoben)", "to postpone"], ["die Glätte", "slippery roads, ice"], ["die Gewohnheit, -en", "habit"], ["sich wohlfühlen", "to feel comfortable"]], "grammar": ["Perfekt: haben + Partizip II (ich habe erzählt)", "Demonstrativartikel: dieses Land (neutrum, Akkusativ)", "aber vs. sondern vs. obwohl: aber = contrast (word order normal), sondern after negation, obwohl = verb at end", "für + Akkusativ: Das ist für mich unglaublich", "wenn (repeated/present, verb at end) vs. als (one time in the past) vs. wann (question)", "Plural after einige: einige Unterschiede", "Modalverb + Infinitiv: Die Schüler müssen vieles behalten", "Wechselpräposition auf + Dativ (wo?): auf dem Computer", "statt … zu + Infinitiv: Statt allein zu spielen …", "Trennbare Verben: mitmachen → Machen Sie mit!", "bei + Dativ: bei unserem System"]}, {"n": 10, "title": "Zeitung · Bus zur Arbeit · Spielpark Torgau", "lesen1": {"headlines": {"a": "Abendwanderungen ab 89 Euro", "b": "Ausflugsziele für Literaturinteressierte", "c": "Hinweis für Besucher der Bregenzer Festspiele", "d": "Ihre Zeitung folgt Ihnen in den Urlaub", "e": "Laute Musik stört den Nachbarn", "f": "Musikveranstaltungen am Nachmittag", "g": "Neue Zeitung für Ihre Urlaubsplanung", "h": "Rekord: 70.000 Besucher im Bücherdorf", "i": "Schlechtes Wetter: Festspiele abgesagt", "j": "Wandern ohne Gepäck"}, "texts": ["Wenn Sie verreisen, wünschen wir Ihnen erholsame und angenehme Ferientage. Bitte denken Sie daran, sich Ihre Zeitung an den Urlaubsort nachsenden zu lassen. Denn mit den Neuigkeiten von zu Hause und aus aller Welt lässt sich die schönste Zeit des Jahres erst richtig genießen. Wir liefern in ganz Europa kostenlos, die Höhe des Bezugsgeldes bleibt unverändert. Ausführliche Informationen und entsprechende Coupons finden Sie in unserem großen Reise-Service-Anzeigenteil, oder rufen Sie uns einfach an: Telefon 0130-18 58 50 zum Nulltarif.\nHannoversche Allgemeine / Neue Presse", "Im Luftkurort Stadtkyll in der Mittelgebirgslandschaft des Oberen Kylltals werden dreitägige Wanderungen ohne Gepäck veranstaltet. Die Rundwanderung im deutsch-belgischen Naturpark führt abends zu reservierten Zimmern. Die Betriebe übernehmen den Gepäcktransport zum nächsten Tagesziel. Die Wanderungen werden ganzjährig angeboten. Im Wanderprogramm sind drei Übernachtungen mit Frühstück, dreimal Gepäcktransport, eine Wanderkarte, eine Wegbeschreibung und ein Wanderpass enthalten. Der Pauschalbetrag beträgt pro Person 89 Euro.\nAuskünfte: Verkehrsverein Erholungsgebiet Oberes Kylltal, Kurallee, 54589 Stadtkyll, Telefon (06597) 28 78.", "Für den einen ist es musikalischer Hochgenuss, für den anderen schlicht Lärm. Gemeint ist Musik, die aus Lautsprechern, Radios oder von Musikinstrumenten durch geöffnete Türen und Fenster bei sommerlichen Temperaturen ins Freie dringt. Die Gemeinde weist darauf hin, dass während der Mittagsruhe von 13 bis 15 Uhr und nachts von 22 bis 7 Uhr keine musikalische Ruhestörung erfolgen darf. Gartengeräte mit Motoren dürfen montags bis freitags nur von 8 bis 13 und von 15 bis 19 Uhr benutzt werden, an Sonnabenden von 9 bis 13 Uhr. An Sonn- und Feiertagen dürfen die Geräte nicht zum Einsatz kommen.", "Im Bücherdorf Mühlbeck/Friedersdorf (Sachsen-Anhalt) warten in acht Antiquariaten über 70.000 Bücher aus allen Bereichen der Literatur auf Interessenten. Das in reizvoller landschaftlicher Umgebung liegende Bücherdorf nahe Bitterfeld, unweit der A9 und des Flughafens Leipzig, ist aus allen Teilen Deutschlands leicht zu erreichen. Geöffnet sind die Antiquariate auch am Samstag und Sonntag. In Europa gibt es bereits zahlreiche solcher Bücherdörfer, u. a. in Belgien, Frankreich und Großbritannien. Initiatorin des deutschen Bücherdorfes ist Heidi Dehne (Tel. 03493/4 30 43).", "Die Bregenzer Festspiele sind bemüht, die Vorstellungen auch bei zweifelhafter Witterung bzw. leichtem Regen auf der Seebühne abzuhalten, weshalb es zu Verzögerungen des Beginns oder zu Unterbrechungen kommen kann. Sollte die Seeaufführung nicht stattfinden können, wird eine halbszenische Version von „Porgy and Bess“ im Festspielhaus gegeben. Wir empfehlen unseren Gästen, bei unsicherer Wetterlage regenfester Kleidung den Vorzug zu geben und auf Schirme zu verzichten, da diese die Sicht beeinträchtigen. Das Spiel auf dem See wird ohne Pause gespielt. Die Spieldauer beträgt ca. 2 Std. 45 Min."], "key": ["d", "j", "e", "b", "c"], "why": ["'sich Ihre Zeitung an den Urlaubsort nachsenden lassen' – your paper follows you. It is not a new paper (trap g).", "'Wanderungen ohne Gepäck', luggage is transported. 89 Euro is for 3 days, not evening walks (trap a).", "Music through open windows is 'Lärm' and disturbs others.", "70,000 BOOKS (not visitors – trap h) in a book village: a destination for literature fans.", "Advice for visitors (rain clothes, no umbrellas). The festival is NOT cancelled – it moves indoors (trap i)."]}, "lesen2": {"title": "Computerprobleme – ein Kinderspiel", "text": "Computerprobleme – ein Kinderspiel\nAnne und Melanie (beide 6) stehen Erzieherinnen mit Vorschlägen hilfreich zur Seite\nVon Christiane Altenberger\n\nSie sind die Problemlöser im Kindergarten an der Munckerstraße. Wenn das Malprogramm spinnt oder plötzlich ein Spiel auftaucht, das keiner kennt, dann rufen die Erzieherinnen nach Anne und Melanie. Die sind zwar erst sechs Jahre alt, aber mit den Computerspielen kennen sie sich aus. „Die Kinder wissen manchmal mehr als wir“, sagt Eva Schilling, Leiterin des Kindergartens. Gelernt haben die beiden ihr Know-how bei „Multimedia-Landschaften für Kinder“, einem Projekt, das das Schulamt zusammen mit dem „Studio im Netz“ gestartet hat.\n\nIm Rahmen dieses Projekts werden in städtischen Kindergärten zwei Wanderstationen mit je drei Multimedia-Computern und einem Farbdrucker installiert. Die Stationen wandern durch 14 Kindergärten, wo sie jeweils für vier Wochen installiert werden. Mit dabei in den Kindergärten: ein ganzer Satz von Spiel-Software.\n\nVierjährige am Computer? „In Pädagogenkreisen sind viele Berührungsängste da“, weiß Edith Ilg, Fachberaterin für Kindergärten beim Schulamt, „aber wir können uns aus dieser Entwicklung nicht ausklinken. Die Kinder wollen sich mit ihrer Umwelt auseinandersetzen.“ Angefangen hat diese Auseinandersetzung im „Studio im Netz“ – 193 Kinder waren eingeladen, um erste Erfahrungen am Computer zu sammeln. „Die Kinder waren absolut begeistert, haben immer wieder gefragt: Wann gehen wir da wieder hin?“, so Frau Ilg.\n\nBevor jedoch die Computer in die Kindergärten kamen, waren die Eltern aufzuklären. Bei manchen Eltern löste das Stichwort „Computer“ akute Ängste aus nach dem Motto: Mein fröhliches, gesundes Kind setzt sich vor den Computer und steht sechs Stunden später krank, sprachlos und einsam wieder auf.\n\nDiese Ängste haben sich inzwischen gelegt, und die Erfahrung vor Ort zeigt, dass sie weitgehend überflüssig sind. Die Erzieherinnen achten auch darauf, dass die Kinder nie länger als 15 bis 20 Minuten vor den Computern sitzen, und holen vor allem kreative Software auf den Bildschirm.\n\nDas einsame Dämmern vor dem Computer ist wohl ohnehin eher Sache der Erwachsenen – die Kinder spielen immer zu zweit oder zu dritt an der Maschine. Eva Schilling hat beobachtet, dass die Kinder am Computer sehr friedlich miteinander umgehen: Sie helfen sich gegenseitig, es gibt wenig Konflikte. Dabei entwickeln gerade Kinder, die sich sonst nur schwer auf etwas konzentrieren können, plötzlich ungeahnte Konzentrationszeiten. Eva Schilling kann sich deshalb die Computer als Dauereinrichtung im Kindergarten vorstellen.", "q": [{"n": 6, "stem": "Das Schulamt hat ein Projekt gestartet, bei dem", "opts": {"a": "Kinder in Kindergärten mit Computern spielen können.", "b": "Computerspiele für Vierjährige entwickelt werden sollen.", "c": "Erzieherinnen einen Computerkurs machen."}, "key": "a", "why": "'Multimedia-Landschaften für Kinder': computer stations with game software travel through 14 kindergartens. Nobody develops new games (b)."}, {"n": 7, "stem": "Die Kinder", "opts": {"a": "wollten immer wieder ins Studio im Netz gehen.", "b": "wussten nicht, wann sie ins Studio im Netz gehen sollten.", "c": "hatten Angst vor dem Computer."}, "key": "a", "why": "'haben immer wieder gefragt: Wann gehen wir da wieder hin?' – the question 'wann' shows enthusiasm, not confusion (trap b)."}, {"n": 8, "stem": "Eltern fürchten, dass", "opts": {"a": "ihre Kinder durch den Computer krank und einsam werden.", "b": "die Computer im Kindergarten zu teuer sind.", "c": "ihre Kinder zu Hause keinen Computer haben."}, "key": "a", "why": "'steht sechs Stunden später krank, sprachlos und einsam wieder auf' – that was the parents' fear."}, {"n": 9, "stem": "Die Erzieherinnen", "opts": {"a": "lassen die Kinder so lange spielen, wie sie wollen.", "b": "wissen mehr über Computer als die Kinder.", "c": "wählen für die Kinder die Software aus."}, "key": "c", "why": "'holen vor allem kreative Software auf den Bildschirm' – they choose the programs; time is limited to 15–20 minutes (not a)."}, {"n": 10, "stem": "Wenn die Kinder am Computer sitzen, dann", "opts": {"a": "spielt jedes Kind allein.", "b": "hilft ein Kind dem anderen.", "c": "gibt es oft Streit."}, "key": "b", "why": "'sie helfen sich gegenseitig, es gibt wenig Konflikte' – they play in twos or threes."}]}, "lesen3": {"note": "reconstructed", "situations": ["Sie haben von einer noch unbekannten Schauspielerin gehört und möchten gern einen Film mit ihr sehen.", "Sie haben bereits in einem Hotel gearbeitet und suchen wieder eine neue interessante Stelle.", "Sie interessieren sich für Umweltschutz und suchen eine passende Sendung.", "Ihr Freund, der am Institut für Film und Bild studiert, sucht einen geeigneten Praktikumsplatz.", "In einer Sendereihe wird im Fernsehen über die neue politische Entwicklung in Deutschland berichtet. Sie wollen sich informieren.", "Sie interessieren sich für moderne Stadtentwicklung und suchen dazu eine Sendung im Rundfunk.", "Sie wollen bei der Deutschen Bahn eine Ausbildung machen.", "Sie interessieren sich für politisches Theater und möchten am Wochenende dazu etwas hören oder sehen.", "Sie arbeiten gern mit anderen zusammen und suchen eine Tätigkeit bei einer Werbefirma.", "Sie studieren Fremdsprachen und suchen einen Job, bei dem Sie mit Kindern arbeiten können."], "ads": {"a": "Praktikum beim Fernsehen! Die Filmproduktion SonnenFilm GmbH in Potsdam sucht für 3 Monate Praktikantinnen und Praktikanten aus den Bereichen Film, Kamera und Schnitt. Studierende von Film- und Medienhochschulen bevorzugt. Bewerbung an: praktikum@sonnenfilm.de", "b": "Radio Europa – Sendereihe „Job ohne Grenzen“: Jeden Dienstag um 20.05 Uhr berichten junge Menschen, wie sie in Frankreich, Spanien oder Polen arbeiten und leben. Mit Tipps zu Arbeitserlaubnis, Versicherung und Wohnungssuche in der EU.", "c": "Deutsche Bahn – Sommer-Spezial: Mit dem Schöne-Reise-Ticket fahren Sie bis zu fünf Personen einen Tag lang durch ganz Deutschland – für nur 44 Euro. Erhältlich an allen Fahrkartenautomaten.", "d": "Kino im Zentrum: „Bergsommer“ – das Spielfilmdebüt der jungen Schauspielerin Lea Brunner aus Zürich. Die bisher unbekannte Schweizerin begeistert in der Rolle einer Bauerntochter. Täglich 18.00 und 20.30 Uhr.", "e": "Hotel Seeblick sucht ab sofort Zimmermädchen und Küchenhilfen für die Sommersaison (Juni–September). Keine Ausbildung nötig, Unterkunft im Personalhaus möglich. Tel. 08821/45 67.", "f": "ZDF, Donnerstag, 21.00 Uhr: „Planet in Gefahr“ – Die Dokumentationsreihe zeigt, wie Plastikmüll die Meere verschmutzt und was jeder Einzelne für den Umweltschutz tun kann.", "g": "Grandhotel Am Park sucht freundliche Rezeptionistin / freundlichen Rezeptionisten. Wir erwarten eine abgeschlossene Ausbildung im Hotelfach; Berufserfahrung ist willkommen, aber auch Berufsanfänger sind herzlich eingeladen. Bewerbung an die Personalabteilung.", "h": "Sprachcamp Sonnenberg sucht für die Sommerferien Betreuerinnen und Betreuer, die mit Kindern zwischen 8 und 12 Jahren spielerisch Englisch und Französisch üben. Ideal für Studierende der Fremdsprachen. Gute Bezahlung, freie Unterkunft.", "i": "ARD, ab Montag, 22.15 Uhr: „Berlin direkt – Deutschland im Wandel“. In einer sechsteiligen Reihe berichten unsere Korrespondenten über die neue politische Entwicklung in Deutschland nach der Wahl.", "j": "Deutschlandradio Kultur, Samstag, 19.30 Uhr: Hörspiel „Die Mauer im Kopf“ – ein politisches Theaterstück von Rolf Hochhuth, live aus dem Berliner Ensemble übertragen.", "k": "WDR 5, Sonntag, 10.00 Uhr: „Stadt der Zukunft“ – eine Radiosendung über Großstädte und ihre Entwicklung: Wie werden wir in Tokio, Berlin oder New York in 30 Jahren wohnen, arbeiten und uns bewegen?", "l": "Werbeagentur IdeenReich sucht kreative Mitarbeiterinnen und Mitarbeiter für unser junges Team. Sie arbeiten gern mit anderen zusammen und haben Spaß an Kommunikation? Dann bewerben Sie sich! Teilzeit möglich."}, "key": ["d", "g", "f", "a", "i", "k", "x", "j", "l", "h"], "why": ["Ad d: debut film of a so far unknown young actress.", "Ad g: hotel reception job, 'Berufserfahrung ist willkommen'. Ad e is only a seasonal job without training.", "Ad f: documentary about plastic in the sea and environmental protection.", "Ad a: internship at a film production company for film students.", "Ad i: TV series (ARD) about the new political development in Germany.", "Ad k: radio programme about cities of the future.", "Ad c is only a cheap DB ticket, not a training place – so x.", "Ad j: political theatre play on the radio on Saturday.", "Ad l: advertising agency looking for team players.", "Ad h: language camp needs language students to work with children."]}, "sprach1": {"text": "Liebe Beatrice,\n\nwie du ja weißt, sind meine Eltern seit Anfang Mai in einem Haus [21] Mittelmeer in Spanien. Zuerst wollten meine Eltern warten, bis ich mit dem Gymnasium fertig bin. Aber dann sind sie doch [22] früher gefahren.\n\nAls ich im Sommer 18 wurde, wollte ich mit [23] älteren Bruder zusammen eine kleine Wohnung mieten. Das hat aber nicht geklappt. Eine Freundin hat [24] dann ein Zimmer in ihrer Wohngemeinschaft angeboten. Ich wohne jetzt mit drei [25] zusammen in der Innenstadt. Ich bin sehr zufrieden, [26] mein Zimmer recht klein ist.\n\nIn der Schule habe ich keine Probleme. Ich staune selbst über meine Noten, wenn ich [27] denke, wie [28] Zeit ich mir für Hausaufgaben nehme.\n\nManchmal schicken mir meine Eltern eine E-Mail, [29] sie rufen an. [30] jetzt habe ich jede Woche von ihnen gehört.\n\nDas war's für heute, bis bald und liebe Grüße\nSaskia", "q": [{"n": 21, "opts": {"a": "am", "b": "im", "c": "in"}, "key": "a", "why": "Location next to the sea: am (an + dem) Mittelmeer."}, {"n": 22, "opts": {"a": "bloß", "b": "noch", "c": "schon"}, "key": "c", "why": "'schon früher' = earlier than planned."}, {"n": 23, "opts": {"a": "mein", "b": "meinem", "c": "meinen"}, "key": "b", "why": "mit + Dativ, der Bruder (masculine) → mit meinem älteren Bruder."}, {"n": 24, "opts": {"a": "ihr", "b": "mich", "c": "mir"}, "key": "c", "why": "jemandem etwas anbieten – the person is Dativ: mir."}, {"n": 25, "opts": {"a": "Freund", "b": "Freundin", "c": "Freundinnen"}, "key": "c", "why": "'drei' needs a plural noun: mit drei Freundinnen (Dativ plural)."}, {"n": 26, "opts": {"a": "trotz", "b": "obwohl", "c": "weil"}, "key": "b", "why": "Concession with a clause (verb 'ist' at the end): obwohl. 'trotz' is a preposition + Genitiv."}, {"n": 27, "opts": {"a": "daran", "b": "darauf", "c": "darüber"}, "key": "a", "why": "denken an + Akk → daran."}, {"n": 28, "opts": {"a": "wenig", "b": "wenigen", "c": "weniger"}, "key": "a", "why": "'wie wenig Zeit' – wenig without ending before uncountable nouns."}, {"n": 29, "opts": {"a": "aber", "b": "oder", "c": "und"}, "key": "b", "why": "Alternative: an e-mail OR a phone call."}, {"n": 30, "opts": {"a": "Ab", "b": "Bis", "c": "Seit"}, "key": "b", "why": "'Bis jetzt' = up to now (with Perfekt)."}]}, "sprach2": {"text": "Sehr geehrter Unbekannter,\n\nmein Mann und ich haben Ihre Anzeige in den Mitteilungen des Deutschen Alpenvereins [31]. Wir wohnen etwa 40 km außerhalb von Nürnberg und schreiben Ihnen, [32] wir Lust hätten, etwas in einer Gruppe zu machen.\n\nUnseren Sommerurlaub verbringen wir eigentlich regelmäßig in den Bergen. Und [33] es unser Terminkalender erlaubt, gehen wir auch noch am Wochenende wandern. [34] fahren wir in die Gegend vom Wilden Kaiser, wo wir inzwischen alle Wanderwege [35].\n\nWir fahren zwar beide auch Ski, [36] der Winter in den Bergen ist nicht so unbedingt unsere Sache.\n\nDagegen macht es [37] viel Spaß, Fahrrad zu fahren; hier in Leupoldstein haben wir tolle Radwege, die durch die Felder führen. Daher [38] wir uns auch auf gemeinsame Radtouren hier bei uns freuen.\n\nZum Schluss noch ein [39] Worte zu uns selbst: Wir sind 64 und 62 Jahre alt, lieben Musik und gehen ab und zu gern ins Theater.\n\nRufen Sie uns doch [40] an: Tel. 09243/7448.\n\nViele Grüße\nIlka und Heiner Grossmann", "words": {"a": "aber", "b": "außen", "c": "einmal", "d": "entdeckt", "e": "etwas", "f": "hatten", "g": "kennen", "h": "lernen", "i": "oft", "j": "paar", "k": "uns", "l": "wann", "m": "weil", "n": "wenn", "o": "würden"}, "key": ["d", "m", "n", "i", "g", "a", "k", "o", "j", "c"], "why": ["Perfekt 'haben … entdeckt' (we found your ad).", "Reason, verb at the end (hätten): weil.", "Condition, verb at the end (erlaubt): wenn.", "'Oft fahren wir …' – adverb in position 1, verb second.", "'alle Wanderwege kennen' – verb at the end of the wo-clause.", "'zwar …, aber …' = it is true …, but …", "'es macht uns Spaß' – Dativ uns.", "Konjunktiv II for a polite wish: wir würden uns freuen.", "'ein paar Worte' = a few words.", "'doch einfach einmal anrufen' – einmal softens the request."]}, "hoeren1": [{"n": 41, "s": "Die Sprecherin könnte sich vorstellen, mit dem Bus zur Arbeit zu fahren.", "a": "f", "t": "Ich fahre jeden Tag mit dem Auto zur Arbeit. Morgens ist das für mich am bequemsten, auch wenn es manchmal Stau gibt. Der Bus wäre vielleicht günstiger, aber ich habe noch nie ernsthaft darüber nachgedacht, ihn zu nehmen. Ich möchte flexibel sein und nicht an Fahrpläne gebunden.", "e": "Trap 'Der Bus wäre vielleicht günstiger', but 'noch nie ernsthaft darüber nachgedacht' and she wants to stay flexible."}, {"n": 42, "s": "Die Sprecherin geht den ganzen Weg zur Arbeit zu Fuß.", "a": "f", "t": "Ich arbeite in der Innenstadt und laufe morgens ein kleines Stück zu Fuß. Das tut mir gut, weil ich frische Luft bekomme und den Kopf frei machen kann. Danach nehme ich die Straßenbahn. Ich finde diese Kombination aus Bewegung und öffentlichem Verkehrsmittel sehr angenehm.", "e": "Only 'ein kleines Stück zu Fuß', then the tram."}, {"n": 43, "s": "Der Sprecher fährt nie mit dem Auto zur Arbeit.", "a": "r", "t": "Früher bin ich oft mit dem Auto zur Arbeit gefahren, aber seit einem Jahr mache ich das nicht mehr. Jetzt nehme ich mein Fahrrad oder gehe zu Fuß. Das ist besser für die Umwelt und für meine Gesundheit. Ich habe festgestellt, dass ich das Auto eigentlich gar nicht mehr brauche.", "e": "'früher' with the car, but 'seit einem Jahr mache ich das nicht mehr'."}, {"n": 44, "s": "Der Sprecher benutzt für den Weg zur Arbeit zurzeit verschiedene Verkehrsmittel.", "a": "f", "t": "Ich fahre immer auf dieselbe Weise zur Arbeit: mit dem Bus. Ich steige morgens ein und fahre direkt bis zur Haltestelle in der Nähe meines Büros. Ich benutze nie andere Verkehrsmittel. Der Bus ist für mich zuverlässig und bequem.", "e": "'Ich benutze nie andere Verkehrsmittel' – only the bus."}, {"n": 45, "s": "Für die Sprecherin ist der Firmenbus die einzige Möglichkeit, zur Arbeit zu kommen.", "a": "f", "t": "Zur Arbeit fahre ich manchmal mit dem Fahrrad, manchmal mit dem Bus. Wenn das Wetter schlecht ist, nehme ich auch das Auto oder fahre mit Kollegen. Der Firmenbus ist nur eine von vielen Möglichkeiten. Ich finde es gut, verschiedene Optionen zu haben.", "e": "'Der Firmenbus ist nur eine von vielen Möglichkeiten.'"}], "hoeren2": {"intro": "Im Interview erzählt Frau Nicole Zimmermann, Mutter und Lehrerin, vom neuen Spielpark Hartenfels in Torgau.", "speakers": ["Moderator", "Frau Zimmermann"], "lines": [["A", "Willkommen bei unserem heutigen Interview. Bei uns zu Gast ist Frau Nicole Zimmermann, Mutter und Lehrerin, die uns von einem besonderen Ort in Torgau erzählt. Frau Zimmermann, was macht diesen Ort für Familien so interessant?"], ["B", "Vielen Dank. Also, Torgau ist ja allgemein bekannt für seine historischen Sehenswürdigkeiten. Viele Touristen kommen gerade deshalb in die Stadt. Aber für Familien mit Kindern ist der neue Spielpark Hartenfels ein echtes Highlight geworden."], ["A", "Spielpark Hartenfels, das klingt spannend. Seit wann gibt es diesen Park denn?"], ["B", "Der Park wurde erst vor zwei Jahren eröffnet, er ist also noch ziemlich neu. Das merkt man auch: Alles ist modern gestaltet, sicher und gut gepflegt."], ["A", "Und was genau bietet dieser Spielpark für Kinder?"], ["B", "Oh, sehr viel. Es gibt dort Spielgeräte, die man zu Hause in der Wohnung natürlich nicht hat: große Kletterburgen, Wasserspiele und sogar eine kleine Baustelle, auf der Kinder selbst mit Sand, Holz und Steinen etwas bauen dürfen. Das ist besonders beliebt."], ["A", "Gibt es auch andere Freizeitangebote in der Umgebung?"], ["B", "Ehrlich gesagt nicht wirklich viele. Die Region ist eher ruhig. Abgesehen vom Spielpark gibt es ein paar kleinere Grünflächen, aber keine speziellen Angebote für Kinder, wie zum Beispiel Schwimmbäder oder Kinderbauernhöfe."], ["A", "Manche Eltern haben ja Sorge, dass solche freien Spielangebote gefährlich sein könnten. Gibt es da Risiken?"], ["B", "Natürlich sollen die Kinder frei spielen dürfen, aber Sicherheit ist auch wichtig. Das Spielen am Bach war früher ein Problem, aber dieser Bereich wurde inzwischen gesichert und ist derzeit sogar gesperrt. Also kein Grund zur Sorge."], ["A", "Und wie ist es mit der Aufsicht? Müssen beide Elternteile dabei sein?"], ["B", "Nein, das ist gar nicht nötig. Die meisten Eltern sitzen auf den Bänken rund um den Spielbereich, und oft ist nur ein Elternteil mit den Kindern da. Man hat als Erwachsener von fast überall einen guten Überblick."], ["A", "Gibt es auch professionelle Betreuung für kleinere Kinder?"], ["B", "Im Moment leider nicht. Es war geplant, dass Kinder bis sieben Jahre betreut werden, aber das Angebot wurde bisher nicht umgesetzt. Es gibt freiwillige Helfer, aber keine feste Betreuung."], ["A", "Wie sieht es mit dem Eintritt aus?"], ["B", "Der Eintritt in den Spielpark ist zurzeit kostenlos. Ich denke, das ist auch ein Grund, warum so viele Familien regelmäßig kommen."], ["A", "Gibt es auch andere Angebote, zum Beispiel Führungen durch das Schloss?"], ["B", "Ja, Schlossführungen werden angeboten, aber sie sind eher historisch ausgerichtet. Für Kinder ist das oft zu trocken. Mein Sohn fand es langweilig, er wollte lieber wieder auf die Rutsche. Für Erwachsene kann es interessant sein, aber die Kinder haben meist nicht so viel Spaß daran."], ["A", "Frau Zimmermann, vielen Dank für das Gespräch."], ["B", "Sehr gerne. Es hat mich gefreut."]], "items": [{"n": 46, "s": "Viele Touristen besuchen Torgau wegen seiner historischen Sehenswürdigkeiten.", "a": "r", "e": "'bekannt für seine historischen Sehenswürdigkeiten. Viele Touristen kommen gerade deshalb.'"}, {"n": 47, "s": "Den Spielpark Hartenfels gibt es schon seit vielen Jahren.", "a": "f", "e": "'erst vor zwei Jahren eröffnet'."}, {"n": 48, "s": "Außer dem Spielpark gibt es in der Umgebung viele andere Freizeitmöglichkeiten für die Kinder.", "a": "f", "e": "'Ehrlich gesagt nicht wirklich viele.'"}, {"n": 49, "s": "Der Spielpark bietet den Kindern Spielmöglichkeiten, die sie zu Hause nicht haben.", "a": "r", "e": "'Spielgeräte, die man zu Hause in der Wohnung natürlich nicht hat'."}, {"n": 50, "s": "Die Kinder können im Spielpark auch selbst etwas bauen.", "a": "r", "e": "'eine kleine Baustelle, auf der Kinder selbst … etwas bauen dürfen'."}, {"n": 51, "s": "Das Spielen am Bach kann für die Kinder gefährlich werden.", "a": "f", "e": "'war früher ein Problem … inzwischen gesichert und derzeit sogar gesperrt'."}, {"n": 52, "s": "Beide Elternteile müssen auf die Kinder aufpassen.", "a": "f", "e": "'Nein, das ist gar nicht nötig … oft ist nur ein Elternteil da.'"}, {"n": 53, "s": "Im Spielpark können Kinder bis zum Alter von sieben Jahren von Aufsichtspersonen betreut werden.", "a": "f", "e": "'Es war geplant … aber das Angebot wurde bisher nicht umgesetzt.'"}, {"n": 54, "s": "Der Eintritt in den Spielpark ist zurzeit frei.", "a": "r", "e": "'Der Eintritt … ist zurzeit kostenlos.'"}, {"n": 55, "s": "Die Schlossführung bereitet Kindern und Erwachsenen viel Spaß.", "a": "f", "e": "'Für Kinder ist das oft zu trocken. Mein Sohn fand es langweilig.'"}]}, "hoeren3": [{"n": 56, "s": "Sie können zwei Flüge nach Griechenland gewinnen.", "a": "f", "t": "Und hier unser Gewinnspiel der Woche: Beantworten Sie unsere Frage zum Thema Griechenland und gewinnen Sie mit etwas Glück einen Flug nach Athen für eine Person – oder einen von zehn griechischen Kochbüchern. Rufen Sie an unter 0137-20 20 20.", "e": "Only one flight for one person ('einen Flug … für eine Person'), not two.", "note": "reconstructed"}, {"n": 57, "s": "Für Ihre Gruppe ist ein Wagen im Zug nach Aschaffenburg reserviert.", "a": "r", "t": "Achtung, eine Durchsage für die Reisegruppe „Sonnenschein“ aus Fulda: Für Ihre Gruppe ist im Regionalexpress nach Aschaffenburg der Wagen 3 reserviert. Der Zug fährt um 10.17 Uhr von Gleis 5. Bitte steigen Sie im hinteren Zugteil ein.", "e": "'Für Ihre Gruppe ist … der Wagen 3 reserviert.'", "note": "reconstructed"}, {"n": 58, "s": "Auf der Internetseite kann man auch günstige Angebote für Haushaltsgeräte finden.", "a": "r", "t": "Sie suchen ein neues Handy oder einen Computer? Dann besuchen Sie unsere Internetseite www.elektro-markt.de. Dort finden Sie nicht nur Unterhaltungselektronik, sondern auch günstige Angebote für Haushaltsgeräte wie Waschmaschinen, Kühlschränke und Kaffeemaschinen.", "e": "'nicht nur …, sondern auch günstige Angebote für Haushaltsgeräte'.", "note": "reconstructed"}, {"n": 59, "s": "Erst morgen Abend bildet sich Nebel.", "a": "f", "t": "Und nun das Wetter: Schon heute Abend bildet sich in den Flusstälern dichter Nebel, der sich morgen erst gegen Mittag auflöst. Am Nachmittag scheint dann die Sonne bei Temperaturen bis 12 Grad.", "e": "Fog comes 'schon heute Abend', not tomorrow evening.", "note": "reconstructed"}, {"n": 60, "s": "Am besten fahren Sie ab Northeim mit dem Bus.", "a": "r", "t": "Eine Information für Reisende nach Göttingen: Wegen Bauarbeiten fahren zwischen Northeim und Göttingen heute keine Züge. Wir empfehlen Ihnen, in Northeim auszusteigen und den Ersatzbus zu nehmen. Die Busse fahren direkt vor dem Bahnhof ab.", "e": "'Wir empfehlen Ihnen, in Northeim … den Ersatzbus zu nehmen.'", "note": "reconstructed"}], "schreiben": {"letter": "Liebe(r) …,\n\nwie geht es dir und deiner Familie?\n\nBei mir läuft alles prima. Endlich habe ich eine neue Arbeitsstelle. Ich habe nur ein kleines Problem: Es ist ein bisschen zu weit, um zu Fuß zu gehen. Und der Bus fährt nur alle 30 Minuten. Früher bin ich meist mit dem Fahrrad gefahren, aber hier gibt es keine Fahrradwege. Und da ist ja auch noch mein Daniel, den ich morgens in den Kindergarten bringen muss. Der liegt zum Glück gleich neben meiner neuen Firma. – Wie kommst du denn zur Arbeit oder zum Deutschkurs?\n\nWollen wir uns nicht mal wieder treffen und alle zusammen was unternehmen? Ich würde mich freuen.\n\nLiebe Grüße\nVera", "task": "Antworten Sie Vera. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Was es bei Ihnen Neues gibt", "Wie Sie zur Arbeit kommen", "Was Sie über Veras neue Stelle wissen wollen", "Vorschlag für eine gemeinsame Unternehmung"], "model": "Hamburg, 5. Mai 2025\n\nLiebe Vera,\n\nvielen Dank für deinen Brief! Herzlichen Glückwunsch zu deiner neuen Stelle! Was machst du denn genau dort und wie sind deine Kollegen? Hast du jetzt bessere Arbeitszeiten?\n\nBei mir gibt es auch etwas Neues: Seit März besuche ich einen Deutschkurs am Abend, denn ich möchte im Sommer die B1-Prüfung machen. Das ist anstrengend, aber es macht mir viel Spaß.\n\nZur Arbeit fahre ich meistens mit der S-Bahn. Das dauert nur 20 Minuten und ich kann unterwegs lesen. Zum Kurs fahre ich mit dem Fahrrad, weil es hier gute Radwege gibt. Vielleicht kannst du mit einer Kollegin zusammen fahren? Dann musst du nicht auf den Bus warten.\n\nIch würde mich auch sehr freuen, wenn wir uns bald sehen. Wie wäre es mit einem Ausflug in den Tierpark am Sonntag, den 18. Mai? Daniel findet die Tiere bestimmt toll, und danach können wir zusammen picknicken. Was meinst du?\n\nSchreib mir bald!\n\nLiebe Grüße\ndein(e) …", "phrases": ["Herzlichen Glückwunsch zu deiner neuen Stelle!", "Was machst du denn genau dort?", "Bei mir gibt es auch etwas Neues: …", "Zur Arbeit fahre ich meistens mit …", "Wie wäre es mit einem Ausflug …?", "Ich würde mich sehr freuen, wenn …"]}, "vocab": [["verreisen", "to go away on a trip"], ["nachsenden (sendet nach, hat nachgesandt)", "to forward"], ["der Urlaubsort, -e", "holiday destination"], ["kostenlos", "free of charge"], ["unverändert", "unchanged"], ["das Gepäck", "luggage"], ["die Übernachtung, -en", "overnight stay"], ["enthalten sein", "to be included"], ["pro Person", "per person"], ["der Lärm", "noise"], ["die Mittagsruhe", "quiet time at midday"], ["stören", "to disturb"], ["der Feiertag, -e", "public holiday"], ["das Antiquariat, -e", "second-hand bookshop"], ["erreichen", "to reach"], ["die Vorstellung, -en", "performance"], ["stattfinden (fand statt, hat stattgefunden)", "to take place"], ["absagen", "to cancel"], ["verzichten auf + Akk", "to do without"], ["die Sicht", "view"], ["die Sendung, -en", "programme (TV/radio)"], ["das Praktikum, Praktika", "internship"], ["die Ausbildung, -en", "vocational training"], ["die Werbung", "advertising"], ["die Wohngemeinschaft (WG), -en", "shared flat"], ["anbieten (bot an, hat angeboten)", "to offer"], ["zufrieden", "satisfied"], ["staunen über + Akk", "to be amazed at"], ["die Note, -n", "mark, grade"], ["die Anzeige, -n", "advertisement"], ["entdecken", "to discover"], ["regelmäßig", "regularly"], ["erlauben", "to allow"], ["der Wanderweg, -e", "hiking trail"], ["der Stau, -s", "traffic jam"], ["flexibel", "flexible"], ["das Verkehrsmittel, -", "means of transport"], ["umsteigen", "to change"], ["die Sehenswürdigkeit, -en", "sight, attraction"], ["eröffnen", "to open"], ["die Aufsicht", "supervision"], ["betreuen", "to look after"], ["der Eintritt", "admission"], ["gefährlich", "dangerous"], ["gesperrt", "closed off"], ["die Führung, -en", "guided tour"], ["langweilig", "boring"], ["gewinnen (gewann, hat gewonnen)", "to win"], ["reservieren", "to reserve"], ["der Nebel", "fog"], ["das Haushaltsgerät, -e", "household appliance"], ["die Arbeitsstelle, -n", "job"], ["unternehmen", "to do (an activity)"]], "grammar": ["an + Dativ for location by water: am Mittelmeer", "mit + Dativ: mit meinem älteren Bruder (adjective ending -en)", "jemandem etwas anbieten: Dativ for the person (mir)", "obwohl + verb at end vs. trotz + Genitiv", "Pronominaladverb: denken an → daran", "wenig (+ uncountable noun, no ending): wie wenig Zeit", "oder / aber / und: connectors with normal word order", "bis jetzt + Perfekt", "weil / wenn: verb at the end", "zwar …, aber …", "Konjunktiv II: wir würden uns freuen, wir hätten Lust", "es macht uns Spaß (Dativ)"]}, {"n": 11, "title": "Disco · Popper-Schule · Praktikum bei Herrn Maler", "lesen1": {"headlines": {"a": "Früh übt sich: Hotels bieten Skikurse für Zweijährige an", "b": "Neu: Mit dem Taxi gratis zur Disco", "c": "Straßenbahn und Bus im Flugticket enthalten", "d": "Neu: Taxi-Tickets für Discobesucher", "e": "Skikurs für Eltern und Kinder", "f": "Angebot für Reisende: Für wenig Geld öffentliche Verkehrsmittel benutzen", "g": "Buchtipp: Babys im Garten", "h": "Schulkinder schreiben spannende Geschichten", "i": "Ratschläge für Hobby-Fotografen", "j": "Ein Schüler mit vielen Ideen"}, "texts": ["„Ich möchte, dass Menschen, die meine Fotos gesehen haben, von nun an die Welt mit anderen Augen betrachten.“ Das könnte der neuseeländischen Fotografin Anne Geddes gelingen. Denn die Bilder, die sie für das Buch „Drunten im Garten“ von den kleinen Menschenkindern gemacht hat, sind ungewöhnlich und wunderschön: Babys auf Blumen, Blättern, Beeren, verkleidet als Morcheln, Melonen oder Marienkäfer, Babys in Tulpen und als Schmetterlinge. Ein Bildband, angereichert mit poetischen Texten und Ratschlägen.", "Die meisten Skikurse für Kinder beginnen im Alter von vier Jahren. Im Kärntner Babydorf Trebesing ist das anders: Hier werden im „Windel-Wedel-Camp“ bereits Kleinkinder ab zwei Jahren unterrichtet. Täglich zwei Stunden können die Skihasen unter fachkundiger Anleitung auf einem flachen Hügel erste Geh- bzw. Fahrversuche auf zwei Brettern machen. Nach einigen Tagen Übung geht es dann mit dem Baby-Bus ins Skigebiet Innerkrems. Auch Ginas Baby- und Kinderhotel am Falkertsee bietet seinen jüngsten Gästen Skikurse. Fast 1000 Knirpse haben in der „Windelschule“ schon Skifahren gelernt. Auskunft: Tourismusverband Lieser-Maltatal und die Kinderhotels.", "Berlins jüngster Schriftsteller hat deutlich mehr Texte verfasst, als er Jahre zählt. Rund 50 Gedichte und Erzählungen tippte Daniel Storz, 12, schon in seinen Computer. „Ich schreibe fast, seitdem es mich gibt“, sagt der Sechstklässler. Bereits mit sieben dichtete er die ersten Verse, jetzt mit zwölf ist er stolz auf seine erste Autorenlesung. Wenn Freunde Fußball spielen, tobt Daniels Fantasie im Kinderzimmer. Warum er lieber schreibt? Daniel: „Ich schreibe, weil ich nicht alles erleben kann, was ich denke.“", "Ob Sie privat oder geschäftlich unterwegs sind: Mit dem City-Ticket können Sie billig die öffentlichen Verkehrsmittel nutzen. Voraussetzung: Sie sind mit dem Flugzeug oder mit der Deutschen Bahn (über 100 km) angereist. Gegen einen Aufpreis von nur 2,50 Euro ermöglicht Ihnen das City-Ticket auch nach der Ankunft am Zielort freie Fahrt mit U-, S- oder Straßenbahnen sowie Bussen – bis zu 48 Stunden. Übrigens: Ihr City-Ticket gilt an zwei aufeinanderfolgenden Tagen, die Sie beim Kauf Ihres Fahrscheins selbst bestimmen.", "In Mecklenburg-Vorpommern können junge Leute jetzt für den halben Fahrpreis mit dem Taxi auf Discotour gehen. Tickets dafür sind bei allen Geschäftsstellen der Allgemeinen Ortskrankenkasse (AOK) sowie an Esso-Tankstellen zum halben Preis erhältlich. Junge Leute zwischen 16 und 25 Jahren können sie an Wochenenden und Feiertagen in der Zeit von 20 Uhr bis morgens 6 Uhr benutzen. Die Taxifahrer erhalten bei ihrer Zentrale dann den vollen Fahrpreis erstattet."], "key": ["g", "a", "j", "f", "d"], "why": ["A photo book ('Bildband') of babies in flowers and leaves: 'Drunten im Garten'. It contains some 'Ratschläge', but not for hobby photographers (trap i).", "Ski courses for children 'ab zwei Jahren' in children's hotels. Parents are not taught (trap e).", "One 12-year-old boy who writes many texts – not a group of school children (trap h).", "For 2.50 Euro extra you can use buses and trams – cheap, but not included in the ticket (trap c).", "Taxi tickets for half price – not free ('gratis', trap b)."]}, "lesen2": {"title": "Die neue Sir-Karl-Popper-Schule", "text": "Die neue Sir-Karl-Popper-Schule\nEin Schulversuch für besonders kluge Schüler\n\nWIEN. Es ist eine ganz normale Schulstunde – Geschichte – in einer ganz normalen Klasse. Während der Lehrer einen Vortrag über das alte Rom hält, unterhalten sich die Schüler über den Schulball, kritisieren die Kleidung des Lehrers, reichen Zettel unter der Schulbank weiter.\n\nGanz normale Kinder\n„Auch überdurchschnittlich intelligente Kinder sind ganz normale Kinder“, betont Elfriede Wegricht, Psychologin an der Sir-Karl-Popper-Schule, die im vergangenen September ihren Betrieb aufgenommen hat. „Nur weil sie in der Schule gut sind, heißt das nicht, dass sie nicht genauso wie alle anderen Schüler Liebeskummer, Ärger mit den Eltern und andere Pubertätsprobleme haben.“ Der Unterschied zwischen normalen und hochbegabten Schülern liegt vor allem darin, dass sich die Hochbegabten in ihrer bisherigen Schulkarriere nicht besonders anstrengen mussten und es nicht gewohnt sind, mit ihrer Zeit gut hauszuhalten.\n\nFörderung durch Forderung\nUm überdurchschnittlich intelligente Kinder nun entsprechend zu fördern, sieht das Konzept der Sir-Karl-Popper-Schule mehr Fremdsprachen, projektorientiertes Arbeiten in kleinen Klassen und vor allem mehr Eigenverantwortung für den Lernenden vor. Dazu kommt die Förderung der individuellen Fähigkeiten: Wer in einem Fach gut ist und sich besonders für ein Thema interessiert, bekommt Sonderaufgaben und tiefer gehende Unterlagen. Anfangs war der plötzliche Mehraufwand ein Schock für die Schüler, die eine 40-Stunden-Woche zu bewältigen haben. „Aber es ist besser, sie erleben den Schock jetzt als zu Beginn des Studiums“, meint Herr Peters, Lehrer und Schülerbetreuer an der Popper-Schule, „denn oft scheitern besonders kluge Menschen später, weil sie mit ihrer Intelligenz nichts anzufangen wissen.“ Denn zumeist erreichten sie mit wenig Aufwand und Mitarbeit relativ gute Ergebnisse.\n\nWer ist hochbegabt?\nZielgruppe der Sir-Karl-Popper-Schule sind Kinder, die in mindestens einem Fach hochbegabt sind und überdurchschnittlich gute Ergebnisse haben; das sind 20 bis 30 Prozent der Schüler. Nach einer Aufnahmeprüfung wurden von 64 Bewerbern 28 aufgenommen, die auf zwei Klassen aufgeteilt sind und von insgesamt 28 Lehrern betreut werden. „In diesen Klassen können die überdurchschnittlich intelligenten Schüler dann endlich so sein, wie sie sind, ohne bei jeder Wortmeldung von ihren Klassenkameraden beschimpft zu werden“, meint die Schulpsychologin. Ziel des Schulversuchs sei es jedoch laut Peters nicht, besonders kluge Schüler von normalen Kindern zu trennen, sondern Erfahrungen im Umgang mit überdurchschnittlich Begabten zu sammeln und die Begabtenförderung in die Normalschule zu übernehmen.", "note": "reconstructed (answer options a–c missing in the book; stems and key from the book)", "q": [{"n": 6, "stem": "Die Psychologin der Popper-Schule meint, dass", "opts": {"a": "hochbegabte Kinder keine Probleme in der Pubertät haben.", "b": "hochbegabte Kinder die gleichen Probleme haben wie andere Kinder.", "c": "hochbegabte Kinder im Unterricht besser aufpassen."}, "key": "b", "why": "'Auch überdurchschnittlich intelligente Kinder sind ganz normale Kinder … Liebeskummer, Ärger mit den Eltern'."}, {"n": 7, "stem": "Für überdurchschnittlich intelligente Schüler ist typisch, dass sie", "opts": {"a": "bisher wenig lernen mussten und ihre Zeit schlecht einteilen.", "b": "sich in der Schule immer sehr anstrengen.", "c": "keinen Kontakt zu anderen Schülern haben."}, "key": "a", "why": "'nicht besonders anstrengen mussten und es nicht gewohnt sind, mit ihrer Zeit gut hauszuhalten'."}, {"n": 8, "stem": "Im Unterricht der Popper-Schule sollen die Schüler", "opts": {"a": "vor allem Geschichte lernen.", "b": "mehr Verantwortung für das eigene Lernen übernehmen.", "c": "weniger Fremdsprachen lernen."}, "key": "b", "why": "'vor allem mehr Eigenverantwortung für den Lernenden'. There are MORE foreign languages (not c)."}, {"n": 9, "stem": "Die erste Zeit in der Popper-Schule war für die Schüler schwer, weil", "opts": {"a": "die Lehrer sehr streng waren.", "b": "sie plötzlich viel mehr arbeiten mussten.", "c": "sie keine Freunde in der Klasse hatten."}, "key": "b", "why": "'Anfangs war der plötzliche Mehraufwand ein Schock … 40-Stunden-Woche'."}, {"n": 10, "stem": "In der Popper-Schule werden nur Schüler aufgenommen,", "opts": {"a": "die eine Aufnahmeprüfung bestanden haben.", "b": "die in allen Fächern sehr gut sind.", "c": "die schon studieren wollen."}, "key": "a", "why": "'Nach einer Aufnahmeprüfung wurden von 64 Bewerbern 28 aufgenommen'. They must be gifted in at least ONE subject (not b)."}]}, "lesen3": {"note": "reconstructed", "situations": ["Sie haben von einer Schweizer Schauspielerin gehört und möchten gern einen Film mit ihr sehen.", "Sie haben gerade Ihre Ausbildung beendet und suchen eine Stelle an der Rezeption.", "Sie interessieren sich für Umweltschutz und suchen eine passende Sendung.", "Ihr Freund, der am Institut für Film und Bild studiert, sucht einen geeigneten Praktikumsplatz.", "In einer Sendereihe wird im Fernsehen über die neue politische Entwicklung in Deutschland berichtet. Sie wollen sich informieren.", "Sie interessieren sich für Großstädte und ihre Entwicklung und suchen dazu eine Sendung im Rundfunk.", "Sie sind mit der Schule fertig und wollen bei der Deutschen Bahn eine Ausbildung machen.", "Sie interessieren sich für politisches Theater und möchten dazu am Wochenende etwas hören oder sehen.", "Sie arbeiten gern mit anderen zusammen und suchen eine Tätigkeit bei einer Werbefirma.", "Sie wollen mehr über das Thema Arbeiten in Europa erfahren."], "ads": {"a": "Praktikum beim Fernsehen! Die Filmproduktion SonnenFilm GmbH in Potsdam sucht für 3 Monate Praktikantinnen und Praktikanten aus den Bereichen Film, Kamera und Schnitt. Studierende von Film- und Medienhochschulen bevorzugt. Bewerbung an: praktikum@sonnenfilm.de", "b": "Radio Europa – Sendereihe „Job ohne Grenzen“: Jeden Dienstag um 20.05 Uhr berichten junge Menschen, wie sie in Frankreich, Spanien oder Polen arbeiten und leben. Mit Tipps zu Arbeitserlaubnis, Versicherung und Wohnungssuche in der EU.", "c": "Deutsche Bahn – Sommer-Spezial: Mit dem Schöne-Reise-Ticket fahren Sie bis zu fünf Personen einen Tag lang durch ganz Deutschland – für nur 44 Euro. Erhältlich an allen Fahrkartenautomaten.", "d": "Kino im Zentrum: „Bergsommer“ – das Spielfilmdebüt der jungen Schauspielerin Lea Brunner aus Zürich. Die bisher unbekannte Schweizerin begeistert in der Rolle einer Bauerntochter. Täglich 18.00 und 20.30 Uhr.", "e": "Hotel Seeblick sucht ab sofort Zimmermädchen und Küchenhilfen für die Sommersaison (Juni–September). Keine Ausbildung nötig, Unterkunft im Personalhaus möglich. Tel. 08821/45 67.", "f": "ZDF, Donnerstag, 21.00 Uhr: „Planet in Gefahr“ – Die Dokumentationsreihe zeigt, wie Plastikmüll die Meere verschmutzt und was jeder Einzelne für den Umweltschutz tun kann.", "g": "Grandhotel Am Park sucht freundliche Rezeptionistin / freundlichen Rezeptionisten. Wir erwarten eine abgeschlossene Ausbildung im Hotelfach; Berufserfahrung ist willkommen, aber auch Berufsanfänger sind herzlich eingeladen. Bewerbung an die Personalabteilung.", "h": "Sprachcamp Sonnenberg sucht für die Sommerferien Betreuerinnen und Betreuer, die mit Kindern zwischen 8 und 12 Jahren spielerisch Englisch und Französisch üben. Ideal für Studierende der Fremdsprachen. Gute Bezahlung, freie Unterkunft.", "i": "ARD, ab Montag, 22.15 Uhr: „Berlin direkt – Deutschland im Wandel“. In einer sechsteiligen Reihe berichten unsere Korrespondenten über die neue politische Entwicklung in Deutschland nach der Wahl.", "j": "Deutschlandradio Kultur, Samstag, 19.30 Uhr: Hörspiel „Die Mauer im Kopf“ – ein politisches Theaterstück von Rolf Hochhuth, live aus dem Berliner Ensemble übertragen.", "k": "WDR 5, Sonntag, 10.00 Uhr: „Stadt der Zukunft“ – eine Radiosendung über Großstädte und ihre Entwicklung: Wie werden wir in Tokio, Berlin oder New York in 30 Jahren wohnen, arbeiten und uns bewegen?", "l": "Werbeagentur IdeenReich sucht kreative Mitarbeiterinnen und Mitarbeiter für unser junges Team. Sie arbeiten gern mit anderen zusammen und haben Spaß an Kommunikation? Dann bewerben Sie sich! Teilzeit möglich."}, "key": ["d", "g", "f", "a", "i", "k", "x", "j", "l", "b"], "why": ["Ad d: film with the young actress Lea Brunner from Zürich.", "Ad g: reception job, 'auch Berufsanfänger sind herzlich eingeladen'.", "Ad f: environmental documentary on ZDF.", "Ad a: internship for film students at a film company.", "Ad i: six-part TV series about politics in Germany.", "Ad k: radio programme 'Stadt der Zukunft' about big cities.", "Ad c is a cheap DB ticket, not a training place – x.", "Ad j: political theatre play on Saturday on the radio.", "Ad l: advertising agency, team work.", "Ad b: radio series about living and working in other EU countries."]}, "sprach1": {"text": "Liebe Olivia,\n\nwie du ja weißt, mache ich gerade Urlaub auf Fehmarn. Und dass ich mein Fahrrad mitgenommen habe, war wirklich eine gute Idee. Radfahren macht hier nämlich viel Spaß trotz [21] Windes. Und es gibt auch Angebote für Radfahrer wie [22], die sich vor allem erholen und nicht besonders anstrengen wollen.\n\nSo kann man hier zum Beispiel [23] Fahrkarten kaufen, um mit dem Bus in einen anderen Ort zu fahren und mit dem Rad zurück. Oder es gibt Angebote mit Schiffen, die das Rad [24] wenig Geld transportieren.\n\nBesonders [25] hat mich aber die Stadt Burg auf Fehmarn. Schon [26] Hafen sind mir die vielen Fahrräder aufgefallen. [27] gibt es Markierungen auf den Straßen, die den Radfahrern [28], sich bei roten Ampeln vor die Autos zu stellen. [29] Ampeln schalten für Radfahrer sogar früher auf Grün als für Autos.\n\nDu siehst also: Es hat sich gelohnt, das Fahrrad [30].\n\nLiebe Grüße", "note": "answer options partly reconstructed (OCR garbled); key from the book", "q": [{"n": 21, "opts": {"a": "dem", "b": "den", "c": "des"}, "key": "c", "why": "trotz + Genitiv: trotz des Windes."}, {"n": 22, "opts": {"a": "ich", "b": "mich", "c": "mir"}, "key": "b", "why": "'für Radfahrer wie mich' – same case as 'Radfahrer' after für (Akkusativ)."}, {"n": 23, "opts": {"a": "besondere", "b": "besonderen", "c": "besonders"}, "key": "a", "why": "Adjective before a plural noun without article, Akkusativ: besondere Fahrkarten."}, {"n": 24, "opts": {"a": "durch", "b": "für", "c": "mit"}, "key": "b", "why": "Price: für wenig Geld."}, {"n": 25, "opts": {"a": "beeindrucken", "b": "beeindruckend", "c": "beeindruckt"}, "key": "c", "why": "Perfekt 'hat … beeindruckt' – Partizip II."}, {"n": 26, "opts": {"a": "am", "b": "im", "c": "zum"}, "key": "a", "why": "'am Hafen' – an + dem: at the harbour."}, {"n": 27, "opts": {"a": "Aber", "b": "Deshalb", "c": "Außerdem"}, "key": "c", "why": "Adds another point: Außerdem (verb follows in position 2)."}, {"n": 28, "opts": {"a": "erlauben", "b": "erlaubt", "c": "erlaubte"}, "key": "a", "why": "Relative clause, subject 'die' (= Markierungen, plural), present tense: erlauben."}, {"n": 29, "opts": {"a": "Einige", "b": "Einiges", "c": "Einigen"}, "key": "a", "why": "Plural noun 'Ampeln', nominative: Einige Ampeln."}, {"n": 30, "opts": {"a": "mitgenommen", "b": "mitzunehmen", "c": "mitnehmen"}, "key": "b", "why": "'Es hat sich gelohnt, … zu + Infinitiv'; separable verb: mitzunehmen."}]}, "sprach2": {"note": "gap positions 36-38 slightly adapted (OCR text did not fit the book key)", "text": "Sehr geehrte Damen und Herren,\n\nunsere Organisation hat den [31], eine deutsch-französische Konferenz zu europäischen Entwicklungsprogrammen vorzubereiten. Diese Veranstaltung könnte in Breisach [32], und daher brauchen wir von Ihnen nähere [33]. In Ihrer Anzeige [34] Sie die Sehenswürdigkeiten von Breisach und die verschiedenen touristischen Möglichkeiten. Deshalb erscheint uns Ihre Stadt als sehr [35], auch [36] ihrer Lage als Brücke zu Europa.\n\n[37] haben wir folgende Bitte: Für diese Veranstaltung suchen wir ein gutes Hotel, möglichst [38] Ufer des Rheins, mit Konferenz- und Arbeitsräumen, ausgestattet mit den notwendigen technischen Anlagen, Internetanschluss usw. Es sollte ruhig gelegen sein. Können Sie uns dazu Vorschläge schicken? Der [39] wäre der 15.–21. November.\n\nBitte geben Sie uns möglichst bald Bescheid. Für Prospekte und Informationen zu Preisen und Buchungsbedingungen [40] wir Ihnen dankbar.\n\nMit freundlichen Grüßen\nAdrian Schöller\nEVD Trans GmbH", "words": {"a": "am", "b": "Auftrag", "c": "Fragen", "d": "geeignet", "e": "gegenüber", "f": "Informationen", "g": "könnten", "h": "nennen", "i": "nun", "j": "stattfinden", "k": "Termin", "l": "trotzdem", "m": "vor", "n": "wären", "o": "wegen"}, "key": ["b", "j", "f", "h", "d", "o", "i", "a", "k", "n"], "why": ["'den Auftrag haben, etwas zu tun' = to be commissioned.", "Modal verb 'könnte' + infinitive at the end: stattfinden.", "'nähere Informationen' = more detailed information.", "Verb with 'Sie' in position 2: Sie nennen (you name).", "'erscheint uns als sehr geeignet' = seems very suitable.", "wegen + Genitiv: wegen ihrer Lage (gap text slightly adapted so 'wegen' fits).", "'Nun haben wir folgende Bitte' – nun = now, verb second.", "'am Ufer' – an + dem.", "'Der Termin wäre …' = the date.", "Polite Konjunktiv II: wir wären Ihnen dankbar."]}, "hoeren1": [{"n": 41, "s": "Herr Pawliczek erledigt alle seine Einkäufe im Internet.", "a": "r", "t": "Pawliczek: Ich erledige meine Einkäufe eigentlich nur noch online. Das spart mir viel Zeit, besonders nach einem langen Arbeitstag. Selbst Lebensmittel lasse ich mir liefern. In ein Geschäft gehe ich gar nicht mehr – warum auch? Im Internet bekomme ich wirklich alles.", "e": "'nur noch online … Selbst Lebensmittel … In ein Geschäft gehe ich gar nicht mehr.'"}, {"n": 42, "s": "Frau Zimmermann legt beim Einkaufen großen Wert auf persönlichen Kontakt.", "a": "f", "t": "Zimmermann: Ehrlich gesagt ist mir das Zwischenmenschliche beim Einkaufen nicht so wichtig. Ich bevorzuge es, meine Sachen schnell und ohne lange Gespräche zu besorgen. Deshalb nutze ich oft Onlineshops, besonders wenn ich wenig Zeit oder keine Lust auf Menschenmengen habe.", "e": "'das Zwischenmenschliche … nicht so wichtig'."}, {"n": 43, "s": "Frau Schmidt findet zu Hause nicht genug Ruhe, um im Internet einzukaufen.", "a": "r", "t": "Schmidt: Mit zwei kleinen Kindern ist es zu Hause oft sehr laut und hektisch. Wenn ich dann im Internet etwas bestellen möchte, werde ich ständig unterbrochen. Ich finde einfach keine ruhige Minute, um in Ruhe Preise zu vergleichen oder Bewertungen zu lesen.", "e": "'Ich finde einfach keine ruhige Minute'."}, {"n": 44, "s": "Frau Ruttnigg ist vom Einkaufen im Internet nicht überzeugt.", "a": "f", "t": "Ruttnigg: Ich kaufe regelmäßig im Internet ein. Für mich ist das sehr praktisch, vor allem wenn ich spezielle Produkte suche, die es im Laden nicht gibt. Ich hatte bisher keine schlechten Erfahrungen und finde es angenehm, alles bequem von zu Hause aus zu erledigen.", "e": "She buys online regularly and has had no bad experiences – she is convinced."}, {"n": 45, "s": "Herr Krause kauft seine Medikamente am liebsten in der nächsten Stadt.", "a": "f", "t": "Krause: Ich bestelle meine Medikamente immer über eine Onlineapotheke. Das ist einfacher und meist auch günstiger. Früher bin ich dafür in die Stadt gefahren, aber jetzt finde ich den Lieferservice viel bequemer. Das spart mir den Weg und die Wartezeit.", "e": "Trap 'Früher bin ich … in die Stadt gefahren' – now he orders online."}], "hoeren2": {"intro": "Im Radio sprechen Herr Maler, Geschäftsführer einer mittelgroßen Firma, und Frau Bach aus der Personalabteilung über Praktika.", "speakers": ["Moderatorin", "Herr Maler", "Frau Bach"], "lines": [["A", "Guten Tag und herzlich willkommen. Heute sprechen wir über das Thema Praktikum, ein wichtiger Schritt in die Arbeitswelt. Bei uns zu Gast sind Herr Maler, Geschäftsführer einer mittelgroßen Firma, und Frau Bach aus der Personalabteilung. Herr Maler, wie sehen Sie die Rolle eines Praktikums?"], ["B", "Danke für die Einladung. Ich finde, ein Praktikum kann jungen Menschen helfen, den richtigen Beruf zu finden. Es geht nicht nur ums Lernen, sondern darum, erste Erfahrungen in einem Betrieb zu sammeln. Als Vorbereitung auf das Studium ist es eigentlich nicht gedacht – dafür ist die Schule da."], ["A", "Bieten Sie in Ihrer Firma regelmäßig Praktikumsplätze an?"], ["B", "Ja, wir bieten Praktika in verschiedenen Abteilungen an: im Lager, im Büro oder auch in der Produktion. So können die Praktikanten verschiedene Bereiche kennenlernen. Ein Praktikum dauert bei uns meistens zwei bis vier Wochen."], ["A", "Bekommen die Praktikanten danach auch eine Stelle bei Ihnen?"], ["B", "Manche ja, aber natürlich nicht alle. Wir können leider nur wenige übernehmen – vielleicht zwei oder drei pro Jahr."], ["A", "Und was ist Ihnen bei einer Bewerbung besonders wichtig?"], ["B", "Natürlich achten wir auf ein ordentliches Anschreiben und einen Lebenslauf. Aber am wichtigsten ist für mich das persönliche Gespräch: wie motiviert jemand ist und ob er gut ins Team passt. Die Schulnoten sind ein Hinweis, aber nicht das Entscheidende."], ["A", "Erwarten Sie von den Praktikanten bestimmte Eigenschaften?"], ["B", "Ja, auf jeden Fall. Sie sollen aufmerksam sein und sich im Betrieb umsehen. Sie sollen nicht warten, bis jemand sie anspricht, sondern selbst erkennen, wo man sie brauchen könnte."], ["A", "Und wenn ein Praktikant eigene Ideen hat?"], ["B", "Ideen sind bei uns willkommen. Sie stören den Arbeitsablauf nicht – im Gegenteil, sie bringen oft frischen Wind."], ["A", "Wie sieht es mit der Teamarbeit aus?"], ["B", "Die ist für uns zentral. Auch Praktikanten sind ein Teil des Teams. Wer nicht gern mit anderen zusammenarbeitet, wird sich bei uns schwertun."], ["A", "Frau Bach, Sie betreuen die Praktikanten. Welche Erfahrungen machen Sie?"], ["C", "Ich habe gemerkt, dass sich viele Praktikanten am Anfang so verhalten, als wären sie noch in der Schule oder an der Uni. Sie warten auf Aufgaben wie auf Hausaufgaben. Nach ein paar Tagen verstehen sie aber, dass der Arbeitsalltag anders läuft. Und wer Interesse an der Arbeit zeigt und Fragen stellt, der hat es viel leichter."], ["A", "Herr Maler, was würden Sie jungen Leuten zum Schluss empfehlen?"], ["B", "Zeigt Interesse, stellt Fragen, seid offen. Und unterstützt das Team mit Fleiß und guter Laune – dann lernt ihr viel, und wir merken uns so jemanden auch für spätere Jobs."], ["A", "Vielen Dank für das Gespräch."]], "items": [{"n": 46, "s": "Mit einem Praktikum können sich Jugendliche auf das Studium vorbereiten.", "a": "f", "e": "'Als Vorbereitung auf das Studium ist es eigentlich nicht gedacht'."}, {"n": 47, "s": "Herrn Malers Firma bietet jungen Leuten in verschiedenen Abteilungen ein Praktikum an.", "a": "r", "e": "'Praktika in verschiedenen Abteilungen: im Lager, im Büro … Produktion'."}, {"n": 48, "s": "Herrn Malers Firma stellt alle Praktikanten nach der Ausbildung ein.", "a": "f", "e": "'Manche ja, aber natürlich nicht alle.'"}, {"n": 49, "s": "Bei einer Bewerbung ist das Schulzeugnis für Herrn Maler das Wichtigste.", "a": "f", "e": "'am wichtigsten ist für mich das persönliche Gespräch … Schulnoten … nicht das Entscheidende'."}, {"n": 50, "s": "Praktikanten sollten selbst erkennen, wo man sie brauchen könnte.", "a": "r", "e": "'selbst erkennen, wo man sie brauchen könnte'."}, {"n": 51, "s": "Herr Maler meint, dass die Ideen der Praktikanten bei der Arbeit stören.", "a": "f", "e": "'Sie stören den Arbeitsablauf nicht – im Gegenteil'."}, {"n": 52, "s": "Herr Maler legt großen Wert auf Teamarbeit.", "a": "r", "e": "'Die ist für uns zentral.'"}, {"n": 53, "s": "Nach Frau Bachs Meinung verhalten sich Praktikanten im Betrieb oft wie in der Schule oder an der Universität.", "a": "r", "e": "'als wären sie noch in der Schule oder an der Uni'."}, {"n": 54, "s": "Für den Praktikanten ist es gut, wenn er Interesse an der Arbeit zeigt.", "a": "r", "e": "'wer Interesse an der Arbeit zeigt …, der hat es viel leichter'."}, {"n": 55, "s": "Herr Maler empfiehlt den Praktikanten, das Team mit Fleiß und guter Laune zu unterstützen.", "a": "r", "e": "'unterstützt das Team mit Fleiß und guter Laune'."}]}, "hoeren3": [{"n": 56, "s": "In Norddeutschland steigen die Temperaturen morgen auf 5 bis 7 Grad.", "a": "f", "t": "Morgen bleibt es in Norddeutschland kühl. Die Temperaturen erreichen höchstens 3 Grad. Es kann sogar leichten Schneefall geben. Autofahrer sollen vorsichtig fahren, besonders am frühen Morgen.", "e": "Maximum is only 3 degrees ('höchstens 3 Grad'), not 5 to 7."}, {"n": 57, "s": "Hamburg hat öfter gewonnen als Stuttgart.", "a": "r", "t": "Im letzten Jahr war Hamburg im Fußball erfolgreicher als Stuttgart. Die Mannschaft hat mehr Spiele gewonnen und auch bessere Platzierungen erreicht. Viele Fans hoffen nun auf den Aufstieg in die erste Liga.", "e": "'Die Mannschaft hat mehr Spiele gewonnen' – Hamburg won more often."}, {"n": 58, "s": "Nach zwei Monaten müssen Sie für die Zeitschrift bezahlen.", "a": "r", "t": "Sie können die Zeitschrift zwei Monate kostenlos testen. Danach kostet das Abo 5,90 Euro pro Monat. Wenn Sie nicht kündigen, verlängert sich das Abo automatisch.", "e": "Two months free, 'danach kostet das Abo 5,90 Euro pro Monat'."}, {"n": 59, "s": "Auf dem Mittleren Ring in München wird die Geschwindigkeit kontrolliert.", "a": "f", "t": "Die Stadt München plant neue Kontrollen in Wohngebieten. Auf dem Mittleren Ring gibt es aktuell jedoch keine Radarüberwachung. Es wird aber über neue Blitzer diskutiert.", "e": "'Auf dem Mittleren Ring gibt es aktuell jedoch keine Radarüberwachung' – only discussed, not done."}, {"n": 60, "s": "Janas Geburtstagsfest findet nicht im LEO statt.", "a": "f", "t": "Hey, hast du schon gehört? Jana feiert ihren Geburtstag doch im LEO, nicht bei sich zu Hause. Sie hat es gestern noch mal gesagt: Ab 15 Uhr geht's los. Ich bringe Kuchen mit. Kommst du auch?", "e": "'Jana feiert ihren Geburtstag doch im LEO' – the party IS in the LEO."}], "schreiben": {"letter": "Liebe(r) …,\n\nentschuldige, dass ich mich erst jetzt wieder melde. Ich weiß, wir hatten ausgemacht, uns öfter mal zu schreiben. Aber es war so viel los in letzter Zeit. Ich habe eine Neuigkeit für dich: Meine kleine Schwester Janine heiratet im Oktober, und ich habe ihr versprochen, schon mal allen Freunden zu schreiben und Bescheid zu sagen. Die offizielle Einladung bekommst du natürlich noch von ihr direkt. Eddi, ihr zukünftiger Mann, ist echt nett, und wir mögen ihn alle sehr. Er ist Koch und arbeitet hier in einem Hotel.\n\nWir planen jetzt alles. Gib mir deshalb möglichst bald Bescheid, ob du kommst und mit wem.\n\nHerzliche Grüße\nJennifer", "task": "Antworten Sie auf den Brief. Schreiben Sie etwas zu den folgenden vier Punkten.", "points": ["Reaktion auf die Neuigkeit", "Übernachtungsmöglichkeit", "Sie möchten zur Hochzeit kommen", "Hochzeitsgeschenk"], "model": "München, 20. Juni 2025\n\nLiebe Jennifer,\n\nvielen Dank für deinen Brief! Was für eine schöne Neuigkeit! Ich freue mich sehr für Janine und Eddi. Bitte grüß die beiden herzlich von mir.\n\nNatürlich komme ich gern zur Hochzeit. Ich bringe meinen Freund Marco mit, wenn das in Ordnung ist. Wir kommen mit dem Zug und sind am Freitagabend da.\n\nKannst du uns vielleicht ein günstiges Hotel oder eine Pension in der Nähe empfehlen? Wir brauchen ein Doppelzimmer für zwei Nächte. Vielleicht kann Eddi in seinem Hotel ja einen guten Preis bekommen?\n\nIch habe auch eine Frage zum Geschenk: Was wünschen sich die beiden? Gibt es eine Wunschliste? Sonst würde ich ihnen gern etwas für die Küche schenken, weil Eddi doch Koch ist – oder vielleicht einen Gutschein für eine Reise.\n\nIch freue mich schon sehr auf das Fest und darauf, dich wiederzusehen!\n\nHerzliche Grüße\ndein(e) …", "phrases": ["Was für eine schöne Neuigkeit!", "Ich freue mich sehr für …", "Natürlich komme ich gern zur Hochzeit.", "Kannst du mir ein Hotel in der Nähe empfehlen?", "Was wünschen sich die beiden?", "Ich freue mich schon darauf, dich wiederzusehen."]}, "vocab": [["der Bildband, -bände", "illustrated book"], ["ungewöhnlich", "unusual"], ["der Ratschlag, -schläge", "piece of advice"], ["der Skikurs, -e", "ski course"], ["unterrichten", "to teach"], ["die Anleitung, -en", "instruction"], ["verfassen", "to write"], ["das Gedicht, -e", "poem"], ["die Erzählung, -en", "story"], ["stolz auf + Akk", "proud of"], ["öffentliche Verkehrsmittel (Pl.)", "public transport"], ["die Voraussetzung, -en", "requirement"], ["der Aufpreis", "extra charge"], ["gelten (gilt, galt, hat gegolten)", "to be valid"], ["der Fahrpreis, -e", "fare"], ["erhältlich", "available"], ["erstatten", "to refund"], ["hochbegabt", "highly gifted"], ["überdurchschnittlich", "above average"], ["sich anstrengen", "to make an effort"], ["fördern", "to support"], ["die Eigenverantwortung", "personal responsibility"], ["die Aufnahmeprüfung, -en", "entrance exam"], ["scheitern", "to fail"], ["die Fähigkeit, -en", "ability"], ["trennen", "to separate"], ["sich erholen", "to relax, recover"], ["auffallen (fiel auf, ist aufgefallen)", "to be noticed"], ["sich lohnen", "to be worth it"], ["die Ampel, -n", "traffic light"], ["der Auftrag, Aufträge", "task, order"], ["geeignet", "suitable"], ["die Lage, -n", "location"], ["der Termin, -e", "date, appointment"], ["Bescheid geben/sagen", "to let someone know"], ["dankbar", "grateful"], ["bestellen", "to order"], ["liefern", "to deliver"], ["vergleichen (verglich, hat verglichen)", "to compare"], ["überzeugt sein von + Dat", "to be convinced of"], ["die Abteilung, -en", "department"], ["einstellen", "to hire"], ["die Bewerbung, -en", "application"], ["das Zeugnis, -se", "school report"], ["sich verhalten (verhält, verhielt, hat verhalten)", "to behave"], ["der Fleiß", "diligence"], ["die Laune", "mood"], ["kündigen", "to cancel (a subscription)"], ["heiraten", "to marry"], ["die Hochzeit, -en", "wedding"], ["versprechen (verspricht, versprach, hat versprochen)", "to promise"], ["das Geschenk, -e", "present"]], "grammar": ["trotz + Genitiv: trotz des Windes", "Personalpronomen Akkusativ after 'wie' in comparison: Radfahrer wie mich", "Adjektivendung ohne Artikel, Plural: besondere Fahrkarten", "für + Preis: für wenig Geld", "Perfekt: hat … beeindruckt", "an + dem = am (am Hafen, am Ufer)", "Konnektor außerdem + Verb an Position 2", "Relativsatz im Plural: Markierungen, die … erlauben", "Infinitiv mit zu bei trennbaren Verben: mitzunehmen", "wegen + Genitiv", "Konjunktiv II der Höflichkeit: wir wären Ihnen dankbar"]}, {"n": 12, "title": "Kirche · Taxifahrer Schütz · Andreas", "lesen1": {"note": "texts 3–5 partly reconstructed (words missing in the book scan)", "headlines": {"a": "Bilder mit dem Computer bearbeiten", "b": "Kirche bietet Backkurs für Kinder an", "c": "Kirche eröffnet neuen Treffpunkt", "d": "Neu: Kochbuch über Wiener Fleischgerichte", "e": "Neue Computerprogramme werden getestet", "f": "Preis für bestes Lernprogramm", "g": "Rezepte für Kuchen und Torten", "h": "Studie zeigt: Kaffeetrinker sind glücklicher", "i": "Warum die Wiener ins Café gehen", "j": "Zürcher Fotografen stellen aus"}, "texts": ["Die Kunst- und Medienschule F+F Zürich bietet bereits zum dritten Mal den Computerkurs „Digitale Bildbearbeitung“ an. Im neuen Semester steht an zehn Samstagen „Fotografie nach der Fotografie“, also die digit
