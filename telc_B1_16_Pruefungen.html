alf the price."]}, "lesen2": {"title": "Leipzigerin geht in den USA auf Sendung", "text": "Drei Monate Praktikum für junge Sachsen im Land der unbegrenzten Möglichkeiten\n\n„Manchmal fühle ich mich wie ein Missionar“, scherzt Ulrike Rudelt. Das Bild vom Deutschen, der Lederhosen trägt, Bier trinkt und Sauerkraut isst, hält sich ihrer Meinung nach in der Öffentlichkeit Amerikas ganz stark und wird vor allem in der Fernsehwerbung ständig wiederholt. „Dagegen kämpfe ich“, sagt die 25-Jährige selbstbewusst, die derzeit ein dreimonatiges Praktikum am Institute of International Studies in Kalifornien absolviert und so oft es geht über die Heimat erzählt.\n\nAn der Uni in Monterey darf die Leipziger Studentin neben dem Hospitieren auch selbst unterrichten. Das Interesse der Studenten und Dozenten an der deutschen Sprache, an Geschichte und Gegenwart Deutschlands ist groß. Richtig in Fahrt kommt Ulrike, wenn es um den Mauerfall geht und darum, wie sich der Osten nach der Wende entwickelt hat. „Die Chancen, die ich jetzt habe, hatten meine Eltern nicht“, sagt sie. So ging sie nach dem Studium als Au-pair-Mädchen nach England und machte im Rahmen studentischer Austauschprogramme bereits Praktika in den USA und den Niederlanden.\n\n„Einen Vorgeschmack vom American Way of Life gab es bereits während des einwöchigen Einführungsseminars in New York“, schwärmt Cornelia Schiemenz. „Die Stadt pulsiert, und wir hatten jede Menge Spaß.“ Auf dem Programm standen Ausflüge, und dazu hörten sie jede Menge Vorträge zum Welthandel, zum Kampf gegen Arbeitslosigkeit, zur wirtschaftlichen Entwicklung der USA und zur Kriminalitätsbekämpfung. In Denver, wo die Studentin für Kommunikations- und Medienwissenschaft die Arbeit eines TV-Senders kennen lernt, steht sie nach einigen Tagen selbst vor der Kamera und darf Beiträge für den Sender produzieren. „Ich bin absolut glücklich“, sagt die 23-Jährige.\n\nAntje Kutzer, die dritte Leipzigerin in der Gruppe, hat es nach Los Angeles verschlagen. Nach de "Ad a: a party room where you bring your own food and drinks; ad h is a restaurant with a menu, which you do not want.", "No ad offers a flat in Salzburg – all flats are in Vienna, so x.", "Ad e: an office job with PC skills, beginners welcome.", "Ad d is about stars but is a course for adults, ad k is a book about animals – so x.", "Ad c: children's films in the afternoon at 3 pm.", "Ad i: open-air cinema in the evening in summer.", "Ad l: a family looks for a nanny, ideally with pedagogical training."]}, "sprach1": {"note": "reconstructed (some answer options missing in book)", "text": "Sehr geehrter Herr Meyerhofer,\n\nwie Sie wissen, miete ich nun schon seit drei Jahren eine Wohnung in [21] Haus. Ich [22] die ganze Zeit sehr zufrieden, denn im Haus war es immer ruhig, sauber und sicher. In der Zwischenzeit [23] sich die Wohnqualität durch die Eröffnung des Restaurants im Erdgeschoss aber deutlich verschlechtert. [24] spät abends höre ich nun täglich [25] Lärm der Restaurantgäste im Garten, die Mülleimer im Hof sind immer überfüllt, die Parkplätze vor dem Haus, [26] eigentlich für die Mieter reserviert sind, sind immer besetzt, und das Treppenhaus ist ständig verschmutzt. Außerdem fühle ich mich [27] Haus nicht mehr sicher, weil das Restaurant oft die ganze Nacht [28] hat. Ich möchte Sie dringend bitten, sich um diese [29] zu kümmern und mit den Restaurantbesitzern zu sprechen. Vielleicht könnte [30] gemeinsam eine Lösung finden.\n\nMit freundlichen Grüßen\nIhre Anneliese Kühne", "q": [{"n": 21, "opts": {"a": "Ihr", "b": "Ihrem", "c": "Ihren"}, "key": "b", "why": "'in' + location (wo?) takes dative; Haus is neuter → in Ihrem Haus."}, {"n": 22, "opts": {"a": "war", "b": "bin", "c": "habe"}, "key": "a", "why": "Past state with 'sein': ich war zufrieden (Präteritum, like 'war es immer ruhig')."}, {"n": 23, "opts": {"a": "hat", "b": "ist", "c": "wird"}, "key": "a", "why": "'sich verschlechtern' is reflexive → Perfekt with haben: hat sich verschlechtert."}, {"n": 24, "opts": {"a": "Bis", "b": "Seit", "c": "Ab"}, "key": "a", "why": "'bis spät abends' = until late in the evening."}, {"n": 25, "opts": {"a": "der", "b": "den", "c": "dem"}, "key": "b", "why": "'hören' takes an accusative object; der Lärm → den Lärm."}, {"n": 26, "opts": {"a": "denen", "b": "die", "c": "deren"}, "key": "b", "why": "Relative pronoun, subject, plural (die Parkplätze) → die."}, {"n": 27, "opts": {"a": "im", "b": "am", "c": "ins"}, "key": "a", "why": "Location (wo?) → in + dem = im Haus."}, {"n": 28, "opts": {"a": "geöffnet", "b": "öffnen", "c": "öffnet"}, "key": "a", "why": "'geöffnet haben' = to be open; Partizip II after haben."}, {"n": 29, "opts": {"a": "Problem", "b": "Probleme", "c": "Problemen"}, "key": "b", "why": "'diese' + many problems listed → plural accusative: diese Probleme."}, {"n": 30, "opts": {"a": "mich", "b": "man", "c": "wir"}, "key": "b", "why": "'könnte' is 3rd person singular → man könnte (wir would need 'könnten')."}]}, "sprach2": {"text": "Sehr geehrte Damen und Herren,\n\nich schreibe Ihnen auf die Anzeige, die [31] in der heutigen Bild-Zeitung aufgefallen ist. Da ich [32] einige Monate beruflich nach Südamerika gehe, muss ich sehr schnell Spanisch lernen. Für einen richtigen Sprachkurs habe ich leider [33] Zeit. Aber Ihre Methode interessiert mich, vor allem die Sprachübungen [34] den CDs. Ich denke, damit könnte ich ganz [35] Fortschritte machen. Ich arbeite [36] liebsten mit meinem PC. Sie schreiben, [37] Ihr Programm besonders die alltägliche Kommunikation fördert. Wie lange wird es dauern, [38] ich mich mit meinen Geschäftsfreunden richtig unterhalten kann? Und wie viele Stunden [39] Woche sollte man mindestens üben? Können Sie mir eine Musterlektion schicken? Ich [40] gerne ausprobieren, wie Ihre Methode funktioniert.\n\nMit freundlichen Grüßen\nIhre Karin Überschär", "words": {"a": "am", "b": "bis", "c": "dass", "d": "für", "e": "gute", "f": "keine", "g": "mich", "h": "mir", "i": "mit", "j": "möchte", "k": "ohne", "l": "pro", "m": "während", "n": "wäre", "o": "würden"}, "key": ["h", "d", "f", "i", "e", "a", "c", "b", "l", "j"], "why": ["'auffallen' takes dative: die Anzeige ist mir aufgefallen.", "'für einige Monate' = for a period of time.", "'keine Zeit' = no time (negation of a noun).", "'Übungen mit den CDs' – mit + dative.", "'gute Fortschritte machen' – adjective before plural noun.", "'am liebsten' – superlative of gern.", "'Sie schreiben, dass …' – verb at the end.", "'bis' as conjunction = until: Wie lange dauert es, bis …", "'pro Woche' = per week.", "'Ich möchte gerne ausprobieren' – modal verb + infinitive."]}, "hoeren1": [{"n": 41, "s": "Die Sprecherin wünscht sich einen Arbeitsplatz für ihren Vater.", "a": "f", "t": "Mein Vater hat eine Arbeit. Er ist nicht immer glücklich, aber er mag seinen Job. Ich finde, er braucht keinen neuen Arbeitsplatz. Wichtiger ist, dass er genug Freizeit hat. Wir könnten dann mehr Zeit zusammen verbringen. Das wäre für uns beide besser.", "e": "Her father already has a job; she wishes he had more free time, not a job."}, {"n": 42, "s": "Der Sprecher ist kein besonders guter Schüler.", "a": "r", "t": "Ich bin kein sehr guter Schüler. Manche Fächer sind schwer für mich. Ich versuche, besser zu werden, aber das klappt nicht immer. Meine Eltern sagen, ich soll mehr lernen. Ich finde Schule oft langweilig. Trotzdem weiß ich, dass gute Noten wichtig sind.", "e": "He says: 'Ich bin kein sehr guter Schüler.'"}, {"n": 43, "s": "Die Sprecherin möchte nicht immer gestört werden.", "a": "r", "t": "Ich bin gern allein. Manchmal lese ich oder höre Musik. Dann will ich nicht gestört werden. Aber meine Familie klopft oft an meine Tür. Sie fragen etwas oder wollen reden. Ich finde das nervig. Jeder braucht auch mal Zeit für sich.", "e": "'Dann will ich nicht gestört werden.'"}, {"n": 44, "s": "Der Sprecher versteht sich nicht gut mit seiner Mutter.", "a": "r", "t": "Meine Mutter und ich streiten oft. Sie sagt, ich mache zu wenig im Haushalt. Sie will, dass ich meine Aufgaben besser mache. Manchmal verstehe ich sie nicht. Ich finde, sie ist zu streng. Aber vielleicht will sie nur das Beste für mich.", "e": "'Meine Mutter und ich streiten oft.'"}, {"n": 45, "s": "Die Sprecherin ist am liebsten mit ihren Eltern zusammen.", "a": "f", "t": "Meine Eltern sind nett, aber ich verbringe meine Zeit lieber mit Freunden. Wir gehen ins Kino oder treffen uns im Park. Mit ihnen kann ich mehr Spaß haben. Natürlich liebe ich meine Familie, aber ich brauche auch meine Freiheit.", "e": "She prefers her friends: 'ich verbringe meine Zeit lieber mit Freunden'."}], "hoeren2": {"intro": "Frau Schäfer stellt in einem Radiogespräch ihren Verein vor, der Familien, Senioren und Kinder im Alltag unterstützt.", "speakers": ["Moderator", "Frau Schäfer"], "lines": [["A", "Herzlich willkommen zu unserem heutigen Gespräch. Bei uns zu Gast ist Frau Schäfer, die uns ihren Verein näher vorstellen wird. Hallo, Frau Schäfer, herzlich willkommen! Erste Frage: Haben Sie den Verein kurz nach der Gründung kennengelernt?"], ["B", "Danke für die Einladung. Nein, ich bin erst viele Jahre später auf den Verein aufmerksam geworden."], ["A", "Kommen Ihre Mitglieder aus ganz Deutschland?"], ["B", "Ach nein, unsere Mitglieder stammen hauptsächlich aus der näheren Umgebung, nicht aus ganz Deutschland."], ["A", "Haben die Mitglieder Erfahrung mit Hausarbeit?"], ["B", "Natürlich. Sie kennen sich in diesem Bereich sehr gut aus und sind bestens geschult. Viele unserer Mitglieder bringen langjährige praktische Erfahrung mit und unterstützen die Familien professionell im Alltag."], ["A", "Wie sieht es denn mit Veranstaltungen aus? Werden im Verein oft Feste gefeiert?"], ["B", "Selten ja, aber nicht oft. Solche Veranstaltungen finden nur gelegentlich statt."], ["A", "Aber grundsätzlich organisiert Ihr Verein auf Anfrage auch Feste, oder?"], ["B", "Ja, genau. Das machen wir gerne. Wenn jemand eine Feier plant, helfen wir bei der Organisation."], ["A", "Vermittelt der Verein auch Senioren, die tagsüber auf Kinder aufpassen?"], ["B", "Ja, genau. Ältere Menschen aus unserem Verein betreuen tagsüber Kinder. Das ist eine unserer wichtigsten Dienstleistungen."], ["A", "Vertrauen die Familien Ihren Mitarbeiterinnen mehr als anderen Leuten?"], ["B", "Auf jeden Fall. Viele Familien sagen uns, dass sie unseren Mitarbeiterinnen mehr vertrauen als fremden Personen aus einer Anzeige."], ["A", "Muss man eine Berufsausbildung haben, um Mitglied zu werden?"], ["B", "Ja, richtig. Bei uns ist eine abgeschlossene Berufsausbildung Voraussetzung."], ["A", "Bekommen Ihre Mitarbeiterinnen wirklich 10 Euro pro Stunde?"], ["B", "Nein, ganz so hoch ist der Stundenlohn bei uns nicht. Wir zahlen etwas weniger."], ["A", "Können Kunden mit wenig Geld Ihren Service kostenlos nutzen?"], ["B", "Nein, ganz kostenlos ist der Service nicht. Auch Kunden mit wenig Geld zahlen einen kleinen Betrag."], ["A", "Vielen Dank, Frau Schäfer, dass Sie uns so ausführlich über Ihren Verein informiert haben."], ["B", "Sehr gern. Es hat mich gefreut, hier zu sein."]], "items": [{"n": 46, "s": "Frau Schäfer hat von dem Verein kurz nach der Gründung zum ersten Mal gehört.", "a": "f", "e": "'ich bin erst viele Jahre später auf den Verein aufmerksam geworden.'"}, {"n": 47, "s": "Die Mitglieder des Vereins kommen aus ganz Deutschland.", "a": "f", "e": "'hauptsächlich aus der näheren Umgebung, nicht aus ganz Deutschland.'"}, {"n": 48, "s": "Die Mitglieder des Vereins wissen über Hausarbeit gut Bescheid.", "a": "r", "e": "'Sie kennen sich in diesem Bereich sehr gut aus.'"}, {"n": 49, "s": "Im Verein werden oft Feste gefeiert.", "a": "f", "e": "'nur gelegentlich' – not often."}, {"n": 50, "s": "Der Verein bietet auch die Organisation von Festen an.", "a": "r", "e": "'Wenn jemand eine Feier plant, helfen wir bei der Organisation.'"}, {"n": 51, "s": "Der Verein vermittelt Senioren, die tagsüber Kinder betreuen.", "a": "r", "e": "'Ältere Menschen aus unserem Verein betreuen tagsüber Kinder.'"}, {"n": 52, "s": "Laut Frau Schäfer vertrauen viele Familien den Mitarbeiterinnen des Vereins mehr als anderen.", "a": "r", "e": "'… dass sie unseren Mitarbeiterinnen mehr vertrauen als fremden Personen.'"}, {"n": 53, "s": "Vereinsmitglied kann nur werden, wer einen Beruf gelernt hat.", "a": "r", "e": "'eine abgeschlossene Berufsausbildung ist Voraussetzung.'"}, {"n": 54, "s": "Die Mitarbeiterinnen bekommen für ihre Arbeiten 10 Euro pro Stunde.", "a": "f", "e": "'Wir zahlen etwas weniger.'"}, {"n": 55, "s": "Kunden mit wenig Geld zahlen für den Service nichts.", "a": "f", "e": "'Auch Kunden mit wenig Geld zahlen einen kleinen Betrag.'"}]}, "hoeren3": [{"n": 56, "s": "Sie sollen um 19:30 Uhr bei Georg und Claudia sein.", "a": "f", "t": "Hallo, ich bin's. Ich habe gerade mit Georg telefoniert. Er meinte, dass sie erst um 21 Uhr zu Hause sind. Deshalb sollen wir nicht wie geplant um halb acht kommen, sondern erst später. Mir passt das sowieso besser, ich habe heute Abend noch einige Sachen zu erledigen.", "e": "Not 19:30 – Georg and Claudia are only home at 21:00."}, {"n": 57, "s": "Im südlichen Österreich ist es tagsüber sonnig, später windig und regnerisch.", "a": "r", "t": "In Südösterreich bleibt es tagsüber sonnig und angenehm warm. Erst später am Nachmittag ändert sich das Wetter deutlich: Es wird zuerst windig, und dann folgt auch Regen. Besonders in den Bergen ist mit stärkeren Böen zu rechnen. Am Abend kann es sogar gewittern.", "e": "Sunny during the day, later wind and rain."}, {"n": 58, "s": "Der Speisewagen befindet sich im hinteren Teil des Zuges.", "a": "f", "t": "Meine Damen und Herren, falls Sie während der Fahrt etwas essen möchten: Der Speisewagen befindet sich ganz vorne im Zug, direkt hinter der Lok. Bitte beachten Sie, dass das Mitbringen eigener Speisen im Speisewagen nicht gestattet ist. Wir wünschen Ihnen eine angenehme Reise.", "e": "The dining car is at the front ('ganz vorne'), not at the back."}, {"n": 59, "s": "Die Schweizer geben für Urlaub mehr Geld aus als für ihre Gesundheit.", "a": "f", "t": "Laut aktuellen Daten geben die Schweizerinnen und Schweizer nicht mehr Geld für Urlaub aus als für ihre Gesundheit. Im Gegenteil: Sie investieren vor allem in medizinische Versorgung und Krankenkassen. Urlaubsreisen spielen finanziell eine geringere Rolle.", "e": "They spend more on health, not on holidays."}, {"n": 60, "s": "Der Sänger beginnt seine Konzertreise mit einer Vorstellung in Wien.", "a": "r", "t": "Die große Europatournee des bekannten Sängers startet heute Abend in Wien. In der Wiener Stadthalle findet das erste Konzert statt. Danach folgen Auftritte in München, Zürich und Mailand. Die Tickets für die Show in Wien waren bereits nach wenigen Stunden ausverkauft.", "e": "'startet heute Abend in Wien … das erste Konzert'."}], "schreiben": {"letter": "Liebe(r) …,\n\nich habe eine tolle Überraschung. Stell dir vor, was mir mein Onkel angeboten hat! Er rief mich am Samstag an. Er hat ein großes Ferienhaus im Schwarzwald. Das Haus kann ich für die Ferien kostenlos haben. Ich kann auch Freunde mitbringen! Wäre das nichts für uns? Wir könnten uns alle dort treffen: du, deine Eltern und Freunde, und ich mit meiner Familie und meinen Freunden. Ich würde mich wahnsinnig freuen, wenn das klappen würde. Bitte schreib mir, so schnell du kannst, damit wir alles planen können. Urlaub im Schwarzwald – das wird traumhaft schön!\n\nHerzliche Grüße\nPetra", "task": "Antworten Sie auf den Brief. Schreiben Sie etwas zu den folgenden Punkten.", "points": ["Warum Sie gern nach Deutschland kommen möchten", "Wie Sie anreisen wollen", "Was Sie gemeinsam machen könnten", "Wen Sie mitbringen möchten"], "model": "Damaskus, 17.10.2026\n\nLiebe Petra,\n\nvielen Dank für deinen netten Brief und die tolle Einladung! Ich habe mich riesig darüber gefreut.\n\nIch komme sehr gern nach Deutschland, denn ich möchte mein Deutsch verbessern und den Schwarzwald wollte ich schon immer kennenlernen. Außerdem haben wir uns schon lange nicht mehr gesehen.\n\nIch möchte meine Schwester Lina und meine Freundin Sara mitbringen. Meine Eltern können leider nicht kommen, weil sie im Sommer arbeiten müssen.\n\nWir fliegen nach Frankfurt und fahren dann mit dem Zug nach Freiburg. Kannst du uns vielleicht vom Bahnhof abholen?\n\nIm Schwarzwald könnten wir zusammen wandern, Fahrrad fahren und abends im Garten grillen. Wir könnten auch einen Ausflug an den Titisee machen und dort schwimmen.\n\nSchreib mir bitte, wann genau die Ferien beginnen, dann buche ich die Tickets.\n\nIch freue mich schon sehr auf unseren Urlaub!\n\nHerzliche Grüße\ndeine Rana", "phrases": ["Vielen Dank für deinen netten Brief.", "Ich habe mich sehr über deine Einladung gefreut.", "Ich komme sehr gern, weil …", "Wir könnten zusammen … (wandern / grillen).", "Ich möchte gern … mitbringen.", "Ich freue mich schon sehr auf …"]}, "vocab": [["der Bildband, -bände", "illustrated book"], ["das Blatt, Blätter", "leaf"], ["verkleidet", "dressed up"], ["der Ratschlag, -schläge", "piece of advice"], ["unterrichten", "to teach"], ["die Anleitung, -en", "instruction"], ["die Auskunft, -künfte", "information"], ["der Schriftsteller, -", "writer"], ["das Gedicht, -e", "poem"], ["die Erzählung, -en", "story"], ["erleben", "to experience"], ["die öffentlichen Verkehrsmittel (Pl.)", "public transport"], ["der Aufpreis, -e", "extra charge"], ["die Voraussetzung, -en", "requirement"], ["gelten (gilt, galt, hat gegolten)", "to be valid"], ["der Fahrpreis, -e", "fare"], ["erhältlich", "available"], ["erstatten", "to refund"], ["das Praktikum, Praktika", "internship"], ["absolvieren", "to complete"], ["die Werbung", "advertising"], ["das Heimweh", "homesickness"], ["der Vortrag, -träge", "lecture, talk"], ["die Arbeitslosigkeit", "unemployment"], ["die Auslandserfahrung, -en", "experience abroad"], ["die Anforderung, -en", "demand, requirement"], ["der Bewerber, -", "applicant"], ["auswählen", "to select"], ["die Mietwohnung, -en", "rented flat"], ["verlässlich", "reliable"], ["aufpassen auf + Akk.", "to look after"], ["dazuverdienen", "to earn extra"], ["sich kümmern um + Akk.", "to take care of"], ["umziehen (ist umgezogen)", "to move house"], ["die Vorstellung, -en", "show, performance"], ["die Erzieherin, -nen", "nursery teacher"], ["arbeitslos", "unemployed"], ["mieten", "to rent"], ["sich verschlechtern", "to get worse"], ["der Lärm", "noise"], ["überfüllt", "overcrowded"], ["verschmutzt", "dirty"], ["auffallen (fällt auf) + Dat.", "to catch someone's eye"], ["der Fortschritt, -e", "progress"], ["fördern", "to promote, support"], ["sich unterhalten mit + Dat.", "to talk with"], ["der Verein, -e", "club, association"], ["die Gründung, -en", "foundation"], ["Bescheid wissen über + Akk.", "to know about"], ["vermitteln", "to arrange, place"], ["betreuen", "to look after"], ["vertrauen + Dat.", "to trust"], ["der Speisewagen, -", "dining car"], ["ausgeben (gibt aus)", "to spend (money)"], ["das Ferienhaus, -häuser", "holiday home"], ["kostenlos", "free of charge"], ["anreisen", "to travel there"]], "grammar": ["in + Dativ for location: in Ihrem Haus, im Haus (wo?)", "Perfekt of reflexive verbs with haben: hat sich verschlechtert", "bis spät abends (bis = until)", "hören + Akkusativ: den Lärm", "Relative pronoun nominative plural: die Parkplätze, die …", "etwas geöffnet haben = to be open", "sich kümmern um + Akk.: um diese Probleme", "man + 3rd person singular verb: man könnte", "auffallen + Dativ: die Anzeige ist mir aufgefallen", "am liebsten (superlative of gern)", "dass-clause: verb at the end", "bis as conjunction (until)", "pro Woche = per week"]}, {"n": 2, "title": "Lachen · Schlaf · Herr Thurnherr", "lesen1": {"headlines": {"a": "Zufriedenheit im Job schützt vor Stress", "b": "Erfolgreiche Männer können auch gute Väter sein", "c": "Keiner lacht so fröhlich wie der Weihnachtsmann", "d": "Wie Männer und Frauen lachen", "e": "Weniger Arbeit – weniger Stress", "f": "Schlechte Nachrichten? Sagen Sie es mit einem Lächeln", "g": "Der Beruf ist für Männer wichtiger als die Familie", "h": "Auch ältere Menschen leiden unter Stress", "i": "Frauen reagieren besser auf schlechte Nachrichten als Männer", "j": "Mit 70 Jahren macht das Leben am meisten Spaß"}, "texts": ["Frauen lachen auf viele Arten: Sie kichern, glucksen und manchmal singen sie fast. Bei Männern dagegen kommt das viel seltener vor. Aber gemeinsam ist Männern und Frauen, dass sie in Vokalen lachen, die im Mundzentrum gebildet werden. Und das ist entscheidend: Nur wenn die Vokale im Mundzentrum gebildet werden, ist das Lachen für uns fröhlich und positiv. Damit ist bewiesen, dass das Lachen vom Weihnachtsmann, das wie ein tiefes „Ho, ho, ho“ klingt, kaum als fröhlich empfunden wird. Denn dieser Laut wird im hinteren Teil des Mundraums gebildet.", "Viel Arbeit, viel Stress? Wer viel arbeitet, muss nicht unbedingt gestresst sein. Frauen in medizinischen Berufen zum Beispiel klagen trotz teilweise hoher Belastung deutlich weniger über stressbedingte Krankheiten als Raumpflegerinnen, Kindergärtnerinnen oder Berufsschullehrerinnen. Dies zeigt eine Untersuchung des Hamburger IPO-Instituts, das für eine Studie 1000 Frauen und Männer befragt hat. Vor Stress schützen laut Studie ein angenehmes Betriebsklima, ein gutes Verhältnis zur Chefin oder zum Chef und die Möglichkeit, die eigene Arbeit selbstständig zu planen.", "Ein neues Buch zeigt, wie Männer Fähigkeiten aus dem Arbeitsleben auf die Erziehung übertragen können und so zu erfolgreichen Vätern werden. Da wird die gemeinsame Kindererziehung zur Partnerarbeit (oder sogar zum Joint Venture), geschicktes Verhandeln heißt, das Kind zu überzeugen, dass die Zähne geputzt werden müssen, und der Familienurlaub hat alle Qualitäten einer Tagung oder eines Seminars: Man erhält die Gelegenheit, die Kinder intensiv zu studieren.", "Eine Studie der Universität Essex hat ergeben, dass wir mit siebzig Jahren am glücklichsten sind. Zwar haben die meisten Menschen in diesem Alter gesundheitliche Probleme, aber dafür genießen sie viel Freizeit und haben keinen Stress mehr. Deshalb macht ihnen das Leben so viel Spaß wie nie zuvor. Die Studie besagt auch, dass wir einen ersten Höhepunkt der Lebensfreude mit fünfzehn Jahren erreichen. Danach geht es bergab: Zwischen dreißig und fünfzig Jahren tragen wir am meisten Verantwortung, das Leben ist geprägt von Sachzwängen.", "Warum bleiben manche Managerinnen erfolgreich, obwohl sie Nachrichten mitteilen, die ihr Publikum lieber nicht hören möchte? Ganz einfach: Sie verkaufen die schlechte Nachricht mit Humor. Ein Londoner Soziologe hat während einer Studie beobachtet, dass gerade bei Reden unangenehmen Inhalts oft heiter gelacht wird. Das Lachen wird bewusst provoziert, etwa durch bestimmte Wörter oder durch ein eigenes breites Lächeln. Die fröhliche Stimmung soll dafür sorgen, dass die Zuhörenden das Gefühl haben, mehr zu wissen als alle anderen."], "key": ["d", "a", "b", "j", "f"], "why": ["The text compares how women and men laugh = d; trap c: the Weihnachtsmann's laugh is NOT felt as happy.", "A good working climate and planning your own work protect from stress = a; trap e: the text says much work does not have to mean stress.", "Men use skills from work to become successful fathers = b; trap g says work is more important than family – not in the text.", "At 70 we are happiest = j; trap h: older people have NO stress any more.", "Managers tell bad news with humour and a smile = f; trap i compares women and men – not in the text."]}, "lesen2": {"title": "Geheimnisse des Schlafes – Schlafstörungen: die meisten Ursachen sind harmlos", "text": "Lange Zeit hat man geglaubt, dass der Schlaf nur so etwas ist wie der kleine Bruder des Todes: ein Zustand, in dem der Körper Energie spart und alles langsamer läuft. Erst in den 50er-Jahren des letzten Jahrhunderts fand man heraus, dass Schlafen etwas sehr Aktives ist und Nacht für Nacht in unterschiedlichen Abschnitten verläuft. Der Schweizer Schlafforscher Alexander Borbély hat diesen Vorgang mit einer Treppe verglichen, über die wir jede Nacht mehrmals gehen.\n\nZunächst sind wir wach, dann schlafen wir ein und gehen bis tief hinab in den Keller, in einen tiefen Schlaf. Danach geht es wieder hoch in einen leichten Schlaf, der von lebhaften, intensiven Träumen und schnellen Augenbewegungen begleitet wird. Daher wird diese Phase auch REM-Schlaf (rapid eye movements = schnelle Augenbewegungen) genannt. Dieser Abschnitt ist im Gegensatz zu den anderen Phasen mit etwa 20 Minuten sehr kurz, soll aber äußerst wichtig für die psychische Erholung sein.\n\nDamit hat die Wissenschaft aber noch lange nicht alle Rätsel des Schlafes gelöst. Erwiesen ist nur: Wir brauchen ihn zur körperlichen Erholung, auch wenn wir ihn manchmal als Zeitverschwendung empfinden – immerhin verbringen wir ein Drittel unseres Lebens mit Schlafen.\n\nWarum können wir aber nicht immer sofort einschlafen, wenn wir müde sind? Tatsächlich klagen viele Menschen in den westlichen Industrienationen über gelegentliche oder dauernde Schlafstörungen. So muss unser Körper, insbesondere das Gehirn, die Eindrücke des Tages erst einmal verarbeiten, damit wir gesund schlafen. Dieses System reagiert so sensibel, dass schon kleine Ursachen – äußere und innere – störend wirken können.\n\nÄußere Ursachen können sein: Lärm, eine ungewohnte Umgebung, ein zu spätes, zu reichliches Essen, Kälte oder Wärme – alles wirkt sich auf unser Wohlbefinden und somit auch auf den Schlaf aus. Als innere Ursachen kommen Schmerzen, Angst oder Ärger über ungelöste Konflikte in Frage. Erkrankungen beeinflussen den Schlaf, auch Medikamente können eine störende Rolle spielen. Alles, was uns gedanklich stark beschäftigt, kann unseren Schlaf beeinträchtigen. Wer aber nur gelegentlich nachts aufwacht oder auch einmal einige Tage schlecht schläft, braucht sich keine Sorgen zu machen. Ein paar schlaflose Nächte lassen sich schnell wieder nachholen.\n\nEine echte Schlafstörung liegt erst dann vor, wenn unsere Leistungsfähigkeit oder unsere Gesundheit auf Dauer stark beeinträchtigt werden. Dann sollte man auf jeden Fall ärztlichen Rat suchen.", "note": "reconstructed (question options; stems in book)", "q": [{"n": 6, "stem": "Der Schweizer Schlafforscher Alexander Borbély …", "opts": {"a": "hat herausgefunden, dass der Körper im Schlaf Energie spart.", "b": "hat in den 50er-Jahren den REM-Schlaf entdeckt.", "c": "vergleicht den Schlaf mit einer Treppe."}, "key": "c", "why": "'… hat diesen Vorgang mit einer Treppe verglichen.'"}, {"n": 7, "stem": "Während der Leichtschlafphase …", "opts": {"a": "schläft man besonders tief.", "b": "träumt man besonders viel.", "c": "bewegen sich die Augen nicht."}, "key": "b", "why": "'leichten Schlaf, der von lebhaften, intensiven Träumen … begleitet wird.'"}, {"n": 8, "stem": "Die Wissenschaft ist heute der Meinung, dass …", "opts": {"a": "alle Probleme des Schlafes gelöst sind.", "b": "wir den Schlaf für die körperliche Erholung brauchen.", "c": "Schlaf Zeitverschwendung ist."}, "key": "b", "why": "'Erwiesen ist nur: Wir brauchen ihn zur körperlichen Erholung.'"}, {"n": 9, "stem": "Vor allem die Menschen in westlichen Ländern …", "opts": {"a": "haben Probleme beim Schlafen.", "b": "schlafen ein Drittel des Tages.", "c": "nehmen oft Medikamente."}, "key": "a", "why": "'viele Menschen in den westlichen Industrienationen klagen über … Schlafstörungen.'"}, {"n": 10, "stem": "Zum Arzt sollen die Menschen gehen, die …", "opts": {"a": "lange Zeit nicht mehr leistungsfähig sind.", "b": "manchmal in der Nacht aufwachen.", "c": "ein paar Tage schlecht geschlafen haben."}, "key": "a", "why": "'wenn unsere Leistungsfähigkeit … auf Dauer stark beeinträchtigt werden. Dann sollte man … ärztlichen Rat suchen.'"}]}, "lesen3": {"note": "reconstructed (ads missing in book)", "situations": ["Ihr Bekannter ist Sportlehrer und sucht eine Nebenbeschäftigung in einem Verein.", "Ein guter Bekannter (39) sucht eine Partnerin. Er ist reiselustig und geht gern spazieren.", "Ihre Freundin ist besonders hübsch, Studentin und sucht für die Semesterferien im Sommer einen Job.", "Sie suchen für das kommende Wochenende eine Konzertkarte.", "Ihre 30-jährige Freundin hat in einem Hotel in Spanien gearbeitet und sucht jetzt eine ähnliche Arbeit in Deutschland.", "Ihre 55-jährige Nachbarin sucht jemanden, mit dem sie reisen und klassische Konzerte besuchen kann.", "Sie möchten lernen, wie Sie kleinere Reparaturen an Ihrem Auto selbst machen können.", "Die Tochter Ihrer russischen Bekannten sucht eine Au-pair-Stelle in Deutschland. Sie ist erst 18 Jahre alt.", "Ihre 21-jährige Bekannte sucht eine Stelle als Kindergärtnerin.", "Eine Freundin braucht ein paar Ratschläge, wie sie erfolgreich eine neue Arbeit finden kann."], "ads": {"a": "Witwe, 58, gepflegt, kulturell interessiert, sucht Begleiter oder Begleiterin für Reisen, Oper und klassische Konzerte. Zuschriften unter Chiffre 4471 an die Zeitung.", "b": "Ratgeber „Der Weg zum neuen Job“: Wie schreibe ich eine gute Bewerbung? Wie verhalte ich mich im Vorstellungsgespräch? Jetzt im Buchhandel, 12,90 Euro.", "c": "Hotel Sonnenhof am Bodensee sucht ab sofort Rezeptionistin mit Berufserfahrung im Hotel und Fremdsprachenkenntnissen (Spanisch von Vorteil). Tel. 07531/88 20", "d": "Konzertkarten für das Rockfestival im August zu verkaufen, 2 Stück, je 45 Euro. Tel. 0171/552 31 90", "e": "Turnverein TV Eintracht sucht Übungsleiter (Sportlehrer) für Kinder- und Jugendgruppen, zweimal wöchentlich abends. Gute Bezahlung. Tel. 089/72 11 80", "f": "Sie, bis 40, natürlich und unternehmungslustig? Ich, 42, reise gern und mache lange Spaziergänge in der Natur. Ich freue mich auf deine Zuschrift! Chiffre 2210", "g": "Fitnessstudio sucht Trainer in Vollzeit, Ausbildung als Fitnesstrainer erforderlich. Bewerbung an info@fitplus.de", "h": "Fotomodelle gesucht! Für unsere Sommerkataloge suchen wir attraktive junge Frauen und Männer, Juli bis September, auch ohne Erfahrung. Agentur Look, Tel. 040/38 77 61", "i": "Städtischer Kindergarten sucht ab September ausgebildete Erzieherin. Wir freuen uns auf Berufsanfängerinnen. Bewerbung an: Kita Sonnenschein, Gartenweg 3", "j": "Familie in Hamburg sucht Au-pair-Mädchen ab 21 Jahren mit Führerschein für zwei Kinder (3 und 6). Tel. 040/66 30 12", "k": "Kurs an der Volkshochschule: „Autopflege und kleine Reparaturen selbst gemacht“ – Ölwechsel, Reifenwechsel, Lampen tauschen. 6 Abende, 60 Euro.", "l": "Kinderbetreuung gesucht: Wer passt dienstags und donnerstags nachmittags auf unseren Sohn (4) auf? Tel. 0711/23 45 10"}, "key": ["e", "f", "h", "x", "c", "a", "k", "x", "i", "b"], "why": ["Ad e: a sports club looks for a sports teacher twice a week (side job); ad g is full-time in a gym.", "Ad f: a man who travels and walks looks for a woman (written from his side; age fits).", "Ad h: models for the summer, July to September – a summer job for a pretty student.", "Ad d is for a festival in August, not this weekend → x.", "Ad c: a hotel job with experience and Spanish.", "Ad a: a widow looks for someone to travel and go to classical concerts with.", "Ad k: a course on small car repairs.", "Ad j wants au pairs from 21 – she is only 18 → x.", "Ad i: a kindergarten looks for a trained nursery teacher, beginners welcome.", "Ad b: a guide book with tips for finding a new job."]}, "sprach1": {"note": "reconstructed (some answer options missing in book)", "text": "DAS COMPUTER-MAGAZIN\nHerrn Matthias Buschhaus\nAlte Gasse 19\nD-80344 München\n\nMünchen, den 21. Mai …\n\nIhre Kündigung vom 15. Mai\n\nSehr geehrter Herr Buschhaus,\n\nschade, [21] Sie CHIP nicht weiter beziehen [22]. Die Belieferung beenden wir mit unserem [23] Heft. Sie erhalten daher die darauf folgende Ausgabe nicht [24].\n\nWir [25] Sie natürlich nur ungern als Abonnenten und würden uns freuen, wenn Sie CHIP [26] ab und zu am Kiosk kaufen. Vielleicht gelingt es uns, [27] wieder von der Qualität von CHIP zu überzeugen.\n\n[28] Sie noch Fragen haben oder sich wieder für ein Abonnement entscheiden, stehen wir Ihnen gerne unter [29] Nummer 0781/639 6259 von montags bis freitags von 8 bis 18 Uhr zur Verfügung.\n\nMit [30] Grüßen\nIhr CHIP-Aboservice", "q": [{"n": 21, "opts": {"a": "darum", "b": "dass", "c": "weil"}, "key": "b", "why": "'schade, dass …' introduces the content clause."}, {"n": 22, "opts": {"a": "möchte", "b": "möchten", "c": "möchtest"}, "key": "b", "why": "Subject is 'Sie' (polite) → möchten."}, {"n": 23, "opts": {"a": "nächste", "b": "nächsten", "c": "nächster"}, "key": "b", "why": "mit + dative, neuter: mit unserem nächsten Heft."}, {"n": 24, "opts": {"a": "mehr", "b": "noch", "c": "schon"}, "key": "a", "why": "'nicht mehr' = no longer."}, {"n": 25, "opts": {"a": "verlieren", "b": "verloren", "c": "verliert"}, "key": "a", "why": "Present tense with 'wir': wir verlieren."}, {"n": 26, "opts": {"a": "obwohl", "b": "trotzdem", "c": "deshalb"}, "key": "b", "why": "'trotzdem' = nevertheless (key in the book is written 'trotz'); obwohl would need verb at the end."}, {"n": 27, "opts": {"a": "Ihnen", "b": "sie", "c": "Sie"}, "key": "c", "why": "'überzeugen' takes accusative; polite form → Sie."}, {"n": 28, "opts": {"a": "Aber", "b": "Falls", "c": "Wann"}, "key": "b", "why": "'Falls' = in case; conditional clause with verb at the end."}, {"n": 29, "opts": {"a": "die", "b": "der", "c": "dem"}, "key": "b", "why": "unter + dative, feminine (die Nummer) → unter der Nummer."}, {"n": 30, "opts": {"a": "freundlich", "b": "freundlichem", "c": "freundlichen"}, "key": "c", "why": "mit + dative plural without article: mit freundlichen Grüßen."}]}, "sprach2": {"text": "Sehr geehrter Herr Maier,\n\nich habe Ihre Anzeige in der Zeitung vom letzten [31] gelesen und interessiere mich sehr [32] das Angebot. Ich [33] mit meiner Mutter und ihrer Schwester, die beide schon etwas ältere Damen sind, im September ein paar [34] Urlaub machen und benötige daher einige Informationen.\n\nIst die Benutzung des Hallenbads und der Sauna im Preis enthalten oder [35] wir diese extra bezahlen? Weiters würde mich noch interessieren, [36] Pensionisten eine Ermäßigung bekommen. Sie schreiben darüber leider [37] in Ihrer Anzeige. [38] möchte ich wissen, ob man in der Gegend um das Hotel einfache Wanderungen unternehmen kann.\n\nIch wäre Ihnen sehr dankbar, [39] Sie mir Bildmaterial zum Hotel und der Landschaft sowie eine Preisliste zukommen lassen könnten.\n\nIch bedanke mich im [40] für die Informationen.\n\nMit freundlichen Grüßen\nAnneliese Schneeberger", "words": {"a": "außerdem", "b": "dürfen", "c": "erstens", "d": "für", "e": "keines", "f": "möchte", "g": "müssen", "h": "nichts", "i": "ob", "j": "obwohl", "k": "Tage", "l": "über", "m": "voraus", "n": "wenn", "o": "Wochenende"}, "key": ["o", "d", "f", "k", "g", "i", "h", "a", "n", "m"], "why": ["'vom letzten Wochenende' – a time noun after letzten.", "'sich interessieren für + Akk.'", "'Ich möchte … Urlaub machen' – modal verb + infinitive at the end.", "'ein paar Tage' – a few days.", "'müssen wir … bezahlen?' – obligation.", "Indirect yes/no question → ob.", "'darüber schreiben Sie leider nichts' – nothing.", "'Außerdem' = in addition; verb follows in position 2.", "'dankbar, wenn Sie …' – condition.", "'im Voraus' = in advance."]}, "hoeren1": [{"n": 41, "s": "Herr Pawliczek erledigt alle seine Einkäufe im Internet.", "a": "r", "t": "Pawliczek: Ich erledige alle meine Einkäufe online. Das spart mir viel Zeit, besonders nach einem langen Arbeitstag. Sogar Lebensmittel lasse ich mir liefern. In ein Geschäft gehe ich eigentlich gar nicht mehr – warum auch? Im Internet finde ich alles, was ich brauche.", "e": "He does all his shopping online, even food."}, {"n": 42, "s": "Frau Zimmermann legt beim Einkaufen großen Wert auf persönlichen Kontakt.", "a": "f", "t": "Zimmermann: Ehrlich gesagt ist mir das Zwischenmenschliche beim Einkaufen nicht so wichtig. Ich bevorzuge es, meine Sachen schnell und ohne lange Gespräche zu besorgen. Deshalb nutze ich oft Onlineshops, besonders wenn ich wenig Zeit oder keine Lust auf Menschenmengen habe.", "e": "Personal contact is not important to her."}, {"n": 43, "s": "Frau Schmidt findet zu Hause nicht genug Ruhe, um im Internet einzukaufen.", "a": "r", "t": "Schmidt: Mit zwei kleinen Kindern ist es zu Hause oft sehr laut und hektisch. Wenn ich dann im Internet etwas bestellen möchte, werde ich ständig unterbrochen. Ich finde einfach keine ruhige Minute, um Preise zu vergleichen oder Bewertungen zu lesen.", "e": "'Ich finde einfach keine ruhige Minute.'"}, {"n": 44, "s": "Frau Ruttnigg ist vom Einkaufen im Internet nicht überzeugt.", "a": "f", "t": "Ruttnigg: Ich kaufe regelmäßig im Internet ein. Für mich ist das sehr praktisch, vor allem wenn ich spezielle Produkte suche, die es im Laden nicht gibt. Ich hatte bisher keine schlechten Erfahrungen und finde es angenehm, alles bequem von zu Hause aus zu erledigen.", "e": "She buys online regularly and likes it."}, {"n": 45, "s": "Herr Krause kauft seine Medikamente am liebsten in der nächsten Stadt.", "a": "f", "t": "Krause: Ich bestelle meine Medikamente immer über eine Online-Apotheke. Das ist einfacher und meist auch günstiger. Früher bin ich dafür in die Stadt gefahren, aber jetzt finde ich den Lieferservice viel bequemer. Das spart mir den Weg und die Wartezeit.", "e": "He used to go to town ('früher'), now he orders online."}], "hoeren2": {"intro": "Im Radio spricht der Moderator mit Herrn Thurnherr, dem Leiter eines großen Reisebüros in Bern, über die Ausbildung im Reisebüro.", "speakers": ["Moderator", "Herr Thurnherr"], "lines": [["A", "Guten Tag und willkommen zu unserer Sendung. Wir sprechen heute über Berufe im Tourismus, besonders über die Ausbildung in einem Reisebüro. Bei uns ist ein erfahrener Fachmann aus Bern."], ["A", "Guten Tag, Herr Thurnherr. Sie arbeiten im Reisebüro Berntour. Was ist Ihre Aufgabe?"], ["B", "Ich bin seit vielen Jahren dort und leite das Büro. Berntour ist eines der größten Reisebüros in Bern. Wir sind auf individuelle Reisen spezialisiert."], ["A", "Gibt es viele Bewerbungen für eine Ausbildung bei Ihnen?"], ["B", "Oh ja. Jedes Jahr sind es über 100 junge Leute, die bei uns eine Ausbildung machen möchten. Letztes Jahr war es sogar ein neuer Rekord."], ["A", "Was erleben die Auszubildenden bei Ihnen?"], ["B", "Viel Praxis. Sie helfen bei der Beratung und planen Reisen mit. Und einiges sehen sie auch selbst."], ["A", "Dürfen die Auszubildenden auch auf Studienreisen gehen?"], ["B", "Ja, natürlich. Schon während der Ausbildung machen sie mehrere Studienreisen. Das gehört einfach dazu."], ["A", "Ist die Arbeit stressig?"], ["B", "Ja, das muss man ehrlich sagen. Die Arbeit ist anstrengend. In der Hochsaison wird es hektisch, dann bleibt kaum Zeit für Pausen."], ["A", "Muss man oft länger bleiben?"], ["B", "Ja, gerade vor den Sommerferien kommen Überstunden regelmäßig vor."], ["A", "Und wie ist das Gehalt?"], ["B", "Wer viel Geld verdienen will, wählt besser einen anderen Beruf. Reich wird man im Reisebüro nicht. Es geht um Leidenschaft."], ["A", "Was passiert auf den Studienreisen?"], ["B", "Die Azubis besichtigen zehn oder mehr Hotels, vergleichen Angebote und lernen, worauf Kunden achten."], ["A", "Was fragen Sie im schriftlichen Test?"], ["B", "Hauptsächlich Geografie, Rechnen und Sprachen. Politik spielt kaum eine Rolle."], ["A", "Wie viele Jugendliche dürfen am Eignungstest teilnehmen?"], ["B", "Meistens um die 30. Mehr Plätze haben wir leider nicht."], ["A", "Was passiert, wenn bei einer Buchung etwas schiefgeht?"], ["B", "Dann ist das Reisebüro verantwortlich und muss für den Fehler bezahlen. Der Kunde darf nicht darunter leiden."], ["A", "Vielen Dank, Herr Thurnherr, für Ihre Zeit."], ["B", "Ich danke Ihnen. Vielleicht buchen Sie ja mal bei uns."]], "items": [{"n": 46, "s": "Herr Thurnherr ist Chef in einem großen Reisebüro in Bern.", "a": "r", "e": "'ich … leite das Büro. Berntour ist eines der größten Reisebüros in Bern.'"}, {"n": 47, "s": "Jährlich wollen über 100 Personen eine Ausbildung in einem Reisebüro machen.", "a": "r", "e": "'Jedes Jahr sind es über 100 junge Leute.'"}, {"n": 48, "s": "Während der Ausbildung kann man noch keine Studienreisen machen.", "a": "f", "e": "'Schon während der Ausbildung machen sie mehrere Studienreisen.'"}, {"n": 49, "s": "Herr Thurnherr meint, die Arbeit in einem Reisebüro sei anstrengend.", "a": "r", "e": "'Die Arbeit ist anstrengend.'"}, {"n": 50, "s": "In einem Reisebüro muss man oft Überstunden machen.", "a": "r", "e": "'vor den Sommerferien kommen Überstunden regelmäßig vor.'"}, {"n": 51, "s": "In einem Reisebüro verdient man gut.", "a": "f", "e": "'Wer viel Geld verdienen will, wählt besser einen anderen Beruf.'"}, {"n": 52, "s": "Auf Studienreisen besichtigt man viele Hotels.", "a": "r", "e": "'Die Azubis besichtigen zehn oder mehr Hotels.'"}, {"n": 53, "s": "Im schriftlichen Teil des Tests wird vor allem politisches Wissen geprüft.", "a": "f", "e": "'Hauptsächlich Geografie, Rechnen und Sprachen. Politik spielt kaum eine Rolle.'"}, {"n": 54, "s": "Jährlich können 50 Jugendliche an einem Eignungstest teilnehmen.", "a": "f", "e": "'Meistens um die 30.'"}, {"n": 55, "s": "Das Reisebüro muss für die Fehler der Mitarbeitenden bezahlen.", "a": "r", "e": "'Dann ist das Reisebüro verantwortlich und muss für den Fehler bezahlen.'"}]}, "hoeren3": [{"n": 56, "s": "Sie müssen in Ingolstadt die Regionalbahn nach Regensburg nehmen.", "a": "f", "t": "Achtung, eine Durchsage: Die Regionalbahn nach Regensburg fällt heute wegen Bauarbeiten aus. Fahrgäste werden gebeten, in Ingolstadt in den Ersatzbus umzusteigen. Weitere Informationen erhalten Sie am Bahnhof oder im Internet.", "e": "The train is cancelled; you take a replacement bus."}, {"n": 57, "s": "Clara kann wegen einer Prüfung die Theaterkarten nicht abholen.", "a": "f", "t": "Hallo, hier ist Clara. Ich habe morgen zwar eine Prüfung, aber die Theaterkarten hole ich trotzdem heute Nachmittag ab. Das klappt schon. Wir treffen uns dann am Freitag um sieben vor dem Theater. Tschüs!", "e": "Despite the exam ('trotzdem') she will pick up the tickets."}, {"n": 58, "s": "Im Schwarzwald können die Straßen morgen glatt werden.", "a": "f", "t": "Der Deutsche Wetterdienst warnt vor Glätte in den Alpen: In der kommenden Nacht kann es dort in höheren Lagen zu Straßenglätte kommen. Im Schwarzwald bleibt es dagegen mild und trocken, die Straßen sind frei. Ab morgen wird es überall wärmer.", "e": "Ice is only expected in the Alps; in the Black Forest roads stay dry. (Book key: falsch.)"}, {"n": 59, "s": "Der Liederabend findet zu einem späteren Termin statt.", "a": "r", "t": "Der für heute geplante Liederabend in der Stadthalle wurde verschoben. Die Veranstaltung findet nun am kommenden Freitag statt. Grund ist eine Erkrankung der Sängerin. Bereits gekaufte Karten bleiben gültig oder können zurückgegeben werden.", "e": "It was moved to next Friday."}, {"n": 60, "s": "Im Untergeschoss gibt es Winterkleidung zum halben Preis.", "a": "r", "t": "Liebe Kundinnen und Kunden, nutzen Sie unseren großen Winterschlussverkauf! Im Untergeschoss bekommen Sie ab sofort alle Mäntel, Jacken und Pullover um 50 Prozent reduziert. Das Angebot gilt nur noch bis Samstag.", "e": "Winter clothes are 50 % cheaper in the basement. (Book key: richtig.)"}], "schreiben": {"letter": "Liebe(r) …,\n\nwie geht es denn so mit dem Deutschlernen? Kommst du gut voran, und was machst du im Moment so? Stell dir vor, ich habe die neue Stelle bei der Zeitschrift VIA bekommen! Ich arbeite jetzt als Journalistin, und das war ja immer mein Traumberuf!\n\nVIA wird vor allem von jüngeren Leuten gelesen. Deshalb schreiben wir viel über Berufe und Ausbildungen und auch über Freizeit und Sport. Für die nächsten Hefte von VIA planen wir jetzt eine neue Serie über Berufswünsche. Was ist eigentlich dein Traumberuf? Wenn du möchtest, schicke ich dir gerne einmal ein Exemplar von VIA, damit du siehst, was ich so mache.\n\nIch freue mich schon auf deine Antwort.\n\nHerzliche Grüße\nEva", "task": "Schreiben Sie Ihrer Bekannten einen Antwortbrief, der die folgenden Punkte enthält.", "points": ["Fortschritte beim Deutschlernen", "Auf Evas neue Stelle reagieren", "Was es Neues bei Ihnen gibt", "Ihr Traumberuf"], "model": "Damaskus, 17.10.2026\n\nLiebe Eva,\n\nvielen Dank für deinen netten Brief. Ich habe mich sehr darüber gefreut.\n\nHerzlichen Glückwunsch zu deiner neuen Stelle! Ich freue mich sehr, dass du endlich als Journalistin arbeiten kannst. Das ist wirklich toll!\n\nMit meinem Deutsch komme ich gut voran. Ich besuche zweimal pro Woche einen Kurs und kann jetzt schon viele Probleme allein lösen, zum Beispiel beim Arzt oder auf dem Amt.\n\nBei mir gibt es auch etwas Neues: Im Moment bereite ich mich auf die B1-Prüfung vor. Außerdem haben wir eine neue Wohnung gefunden, die viel größer ist.\n\nMein Traumberuf ist Lehrerin, weil ich Kinder sehr liebe und gern erkläre. Nach der Prüfung möchte ich eine Ausbildung als Erzieherin machen.\n\nIch würde mich sehr freuen, wenn du mir ein Heft von VIA schickst. Dann kann ich auch meine Lesefähigkeit trainieren.\n\nIch freue mich auf deine Antwort.\n\nHerzliche Grüße\ndeine Rana", "phrases": ["Herzlichen Glückwunsch zu deiner neuen Stelle!", "Ich freue mich sehr für dich, dass …", "Mit meinem Deutsch komme ich gut voran.", "Im Moment bereite ich mich auf … vor.", "Mein Traumberuf ist …, weil …", "Ich würde mich freuen, wenn du mir … schickst."]}, "vocab": [["kichern", "to giggle"], ["entscheidend", "decisive"], ["beweisen (bewies, hat bewiesen)", "to prove"], ["empfinden als", "to perceive as"], ["klagen über + Akk.", "to complain about"], ["die Belastung, -en", "strain, load"], ["die Untersuchung, -en", "study, examination"], ["das Betriebsklima", "working atmosphere"], ["das Verhältnis, -se", "relationship"], ["selbstständig", "independently"], ["die Fähigkeit, -en", "ability"], ["die Erziehung", "upbringing"], ["überzeugen", "to convince"], ["die Verantwortung", "responsibility"], ["genießen", "to enjoy"], ["mitteilen", "to inform, tell"], ["der Zustand, -stände", "state, condition"], ["vergleichen mit + Dat.", "to compare with"], ["die Erholung", "recovery, rest"], ["die Zeitverschwendung", "waste of time"], ["die Schlafstörung, -en", "sleep disorder"], ["die Ursache, -n", "cause"], ["verarbeiten", "to process"], ["die Umgebung, -en", "surroundings"], ["beeinträchtigen", "to impair"], ["sich Sorgen machen", "to worry"], ["nachholen", "to make up for"], ["die Nebenbeschäftigung, -en", "side job"], ["die Semesterferien (Pl.)", "semester break"], ["die Au-pair-Stelle, -n", "au pair position"], ["der Ratschlag, -schläge", "advice"], ["die Kündigung, -en", "cancellation, notice"], ["beziehen (bezog, hat bezogen)", "to subscribe to"], ["die Ausgabe, -n", "issue, edition"], ["der Abonnent, -en", "subscriber"], ["zur Verfügung stehen", "to be available"], ["sich interessieren für + Akk.", "to be interested in"], ["enthalten sein", "to be included"], ["die Ermäßigung, -en", "discount"], ["im Voraus", "in advance"], ["erledigen", "to get done"], ["liefern", "to deliver"], ["vergleichen", "to compare"], ["die Ausbildung, -en", "vocational training"], ["die Bewerbung, -en", "application"], ["anstrengend", "exhausting"], ["die Überstunde, -n", "overtime"], ["verdienen", "to earn"], ["besichtigen", "to visit, view"], ["der Eignungstest, -s", "aptitude test"], ["ausfallen (fällt aus)", "to be cancelled"], ["umsteigen (ist umgestiegen)", "to change (trains)"], ["verschieben (verschob, hat verschoben)", "to postpone"], ["glatt", "slippery"], ["die Fortschritte (Pl.)", "progress"], ["der Traumberuf, -e", "dream job"]], "grammar": ["schade, dass … (dass-clause, verb at end)", "Modal verb with polite Sie: Sie möchten", "mit + Dativ: mit unserem nächsten Heft / mit freundlichen Grüßen", "nicht mehr = no longer", "trotzdem (adverb) vs. obwohl (conjunction)", "überzeugen + Akkusativ: Sie überzeugen", "falls / wenn – conditional clauses", "unter + Dativ: unter der Nummer", "sich interessieren für + Akk.", "ob for indirect yes/no questions", "außerdem + verb in position 2", "im Voraus, ein paar Tage"]}, {"n": 3, "title": "Arbeitsplatz · Die Maus · Herr Bachinger", "lesen1": {"headlines": {"a": "Arbeitsplatz: Bezahlung wichtiger als Zufriedenheit", "b": "Ausstellungseröffnung an bayerischem Gymnasium", "c": "Frauen: mehr Spaß am Beruf als Männer", "d": "Gründe für Zufriedenheit am Arbeitsplatz", "e": "Immer mehr Teilzeitarbeitsplätze für Männer", "f": "Karriere ist Männern weniger wichtig als Frauen", "g": "Technik für Kleinkinder", "h": "Technisches Museum vergibt Umwelt- und Technikpreis", "i": "Umwelt- und Technikpreis", "j": "Wünsche von berufstätigen Eltern"}, "texts": ["Eine aktuelle Umfrage der Arbeiterkammer unter berufstätigen Eltern zeigt den dringenden Wunsch nach flexiblen Arbeitszeiten (60 % der Eltern) und nach Kindergärten im oder in der Nähe des Betriebes (58 %). Frauen verlangen aber deutlich mehr Teilzeitarbeitsplätze (50 %) als Männer (36 %). 52 % aller Eltern wünschen eine Ersatzperson, die den Vater oder die Mutter bei Krankheit des Kindes im Betrieb vertritt. Die Arbeiterkammer fordert, dass sich die Arbeitszeiten stärker am Bedarf der Eltern orientieren.", "MÜNCHEN. Schüler an bayerischen Gymnasien, die sich für Umwelt oder Technik interessieren, können sich auch dieses Jahr wieder um den Carl-Friedrich-von-Martius-Umwelt- und Technikpreis bewerben. Bei diesem Wettbewerb werden Facharbeiten aus dem letzten Schuljahr bewertet. Nähere Informationen sind beim GSF-Forschungszentrum unter der Telefonnummer 089/311 87 27 12 erhältlich.", "WIEN. Eine einmalige Abteilung für drei- bis sechsjährige Kinder wurde im Technischen Museum (15., Mariahilfer Straße 212) eröffnet. In einem speziell für Kinder eingerichteten Bereich können die jüngsten Besucher Technik angreifen. Dort gibt es unter anderem Plasmascheiben, die Blitze erzeugen, ein Laufrad und ein Hüpfklavier, mit dem die Kinder Töne erspringen können. Viel Spaß macht den Kleinen auch, in einem Elektroauto herumzukurven und sich in verschiedenen Zerrspiegeln zu betrachten.", "HAMBURG. Männer haben mehr Karrierechancen, Frauen dafür mehr Freude am Beruf: Das ergab eine große Umfrage in Hamburg. Obwohl nur 8 % der weiblichen Arbeitnehmer an ihre Aufstiegschancen glauben, geben 61 % an, dass ihre Arbeit ihnen Spaß mache. Bei den Männern ist dieses Verhältnis 23 zu 57 Prozent.", "Für Zufriedenheit am Arbeitsplatz kann Geld allein nicht entscheidend sein. Dies gilt in besonderem Maß für hochqualifizierte europäische Arbeitskräfte, wie eine vergleichende internationale Management-Studie zeigt. Sowohl in Europa wie auch unter japanischen und amerikanischen Managern wird der Möglichkeit, neben der Arbeit auch Zeit für das Privatleben zu haben, ein zentraler Stellenwert beigemessen. Viel stärker als in Japan spielt es unter europäischen Angestellten eine Rolle, dass die Arbeit Spaß macht. Die Analysen zeigen auch, dass neben dem Gehalt der Ruf des Unternehmens für die Arbeitsplatzwahl von europäischen Arbeitnehmern besonders wichtig ist."], "key": ["j", "i", "g", "c", "d"], "why": ["A survey of working parents and what they want (flexible hours, kindergartens) = j; trap e: women, not men, want more part-time jobs.", "Pupils can apply for an environment and technology prize = i; trap h: the prize is not given by a museum.", "A new technology area for children aged 3–6 in the museum = g.", "Women enjoy their job more (61 % vs. 57 %) = c; trap f is not in the text.", "Money alone is not decisive; free time, fun and the company's reputation matter = d; trap a says the opposite."]}, "lesen2": {"title": "Die Sendung mit der Maus – Eine Ausstellung über die berühmte Fernsehserie", "text": "SPEYER. Mit dem Fragebogen in der Hand marschieren die Grundschüler durch das Historische Museum in Speyer. „Wie heißt doch noch mal der, der die Maus gezeichnet hat?“, fragt Anna. Lisa entdeckt den Namen neben dem Zeichenpult. „Friedrich Streich“, kritzelt sie auf ihr Blatt – allerdings erst, nachdem sie sich bei einem erwachsenen Ausstellungsbesucher vergewissert hat, dass diese Information auch richtig ist.\n\n„Maus-Oleum“ heißt die Ausstellung im Jungen Museum, die sich mit einem Stück Fernsehgeschichte beschäftigt. Sie zeigt über 30 Jahre aus der Geschichte der „Sendung mit der Maus“. In den farbenfrohen Räumen wird gezeigt, was und wer hinter den Lach- und Sachgeschichten steckt. Eine Weltkarte beweist, dass die Maus international bekannt ist. Kaum ein Land, in dem die beliebte Kindersendung nicht zu sehen ist.\n\nDie orangefarbene Maus erklärt die Welt, indem sie selbstverständlich gewordene Dinge hinterfragt. Mit welchen Mitteln dies geschieht, das zeigt die Ausstellung. Was steckt in einer Parkuhr? Wie funktioniert eine Luftpumpe? Woraus wird Creme gemacht? Wie kommen die Löcher in den Käse? Mit solchen und anderen Fragen verblüfft und fasziniert die Maus auch ihre großen Zuschauer, die sich schlagartig daran erinnern, dass sie einst entschieden neugieriger waren. Wie Detektive, die im Auftrag der Kinder ganz genau hingucken, gehen die Macher an jede Sendung heran. Sie wollen genauso viel wissen und verstehen wie die Kinder selbst. Deshalb wird zum Beispiel die Parkuhr einfach aufgeschraubt oder das Innere einer Fahrradpumpe gezeigt.\n\nAn Vorschlägen, was die Maus erklären könnte, fehlt es nicht. Woche für Woche kommen Briefe aus aller Welt. Einige davon sind auch in der Ausstellung zu lesen. „Liebe Maus“, heißt es da, „wir sind heute an einem Druckzentrum vorbeigefahren. Bitte sage uns doch, wie eine Zeitung gemacht wird.“ Seit 1971 ist die Maus aktiv: Sie reist in die Vergangenheit oder blickt in die Zukunft, sie beantwortet Fragen und lässt Kinder aus verschiedenen Ländern selbst erzählen. Auch schwierige Themen wie Politik sind dank der Maus kinderleicht zu verstehen.\n\nÜberall da, wo man in der Ausstellung etwas anfassen und ausprobieren kann, wo kleine und große Geheimnisse gelüftet werden, staunen die kleinen Besucher. Bilder werden zum Laufen gebracht, Töne erzeugt und Kameras getestet.\n\nDie Maus ist inzwischen auch bei Künstlern beliebt. Sie ist auf Bildern, Postkarten und Plakaten auf der ganzen Welt zu sehen. Schöner aber sind die kleinen Kunstwerke aus Kinderhand, die die Fernsehmacher im Laufe der Jahre gesammelt haben: Figuren aus Holz und Papier, bunte Bilder und sogar ein Puppentheater ganz aus Pappe – alles für die Maus.\n\nÖffnungszeiten: Die Ausstellung in Speyer ist noch bis zum 27. Oktober geöffnet, dienstags bis sonntags von 10 bis 18 Uhr, mittwochs bis 20 Uhr.", "note": "reconstructed (question stems/options partly missing in book)", "q": [{"n": 6, "stem": "Die Grundschüler in der Ausstellung …", "opts": {"a": "haben die Maus selbst gezeichnet.", "b": "treffen den Zeichner Friedrich Streich.", "c": "beantworten Fragen auf einem Fragebogen."}, "key": "c", "why": "'Mit dem Fragebogen in der Hand marschieren die Grundschüler durch das Museum.'"}, {"n": 7, "stem": "Das Thema der Ausstellung …", "opts": {"a": "ist die Geschichte einer Fernsehsendung.", "b": "ist die Geschichte des Fernsehens.", "c": "sind Kinder aus aller Welt."}, "key": "a", "why": "'Sie zeigt über 30 Jahre aus der Geschichte der Sendung mit der Maus.'"}, {"n": 8, "stem": "Die Sendung mit der Maus …", "opts": {"a": "erklärt, wie alltägliche Dinge funktionieren.", "b": "ist nur in Deutschland bekannt.", "c": "zeigt keine schwierigen Themen."}, "key": "a", "why": "'Was steckt in einer Parkuhr? Wie funktioniert eine Luftpumpe?' – everyday things are explained."}, {"n": 9, "stem": "Die Ausstellung …", "opts": {"a": "bietet viele Möglichkeiten zum Ausprobieren.", "b": "ist jeden Tag bis 20 Uhr geöffnet.", "c": "ist nur für Kinder geöffnet."}, "key": "a", "why": "'Überall da, wo man in der Ausstellung etwas anfassen und ausprobieren kann …'"}, {"n": 10, "stem": "Die Maus …", "opts": {"a": "erhält von den Kindern Geschenke aus verschiedenen Materialien.", "b": "wird nur von Kindern gemalt.", "c": "schreibt Briefe an Kinder in aller Welt."}, "key": "a", "why": "'kleine Kunstwerke aus Kinderhand … Figuren aus Holz und Papier … Puppentheater aus Pappe – alles für die Maus.'"}]}, "lesen3": {"note": "reconstructed (ads missing in book)", "situations": ["Sie möchten als Student nebenbei Geld verdienen. Sie reisen gern.", "Sie interessieren sich für Literatur aus arabischen Ländern.", "Ihr Freund möchte gerne in einem Kino arbeiten.", "Sie wollen in einem Restaurant arbeiten und dort auch wohnen.", "Ihre Freundin sucht einen Kindergartenplatz für ihren kleinen Sohn.", "Sie möchten am nächsten Wochenende in eine Diskothek gehen.", "Sie möchten tanzen lernen.", "Sie haben große Berufserfahrung in Gaststätten. Jetzt möchten Sie ein Restaurant leiten.", "Sie möchten Filme aus afrikanischen Ländern sehen.", "Sie möchten einen Fotografiekurs besuchen und haben nur abends Zeit."], "ads": {"a": "Landgasthof Seeblick sucht Koch/Köchin und Servicekräfte. Unterkunft im Haus möglich, Verpflegung frei. Tel. 08821/45 60", "b": "Afrikanische Filmwoche im Kino Arsenal: 12 Filme aus Senegal, Mali, Kenia und Südafrika, im Original mit deutschen Untertiteln. 3.–10. Mai, täglich ab 18 Uhr.", "c": "Disco „Nachtwerk“: Wegen Renovierung bis Ende des Monats geschlossen! Große Neueröffnung am 1. Juni.", "d": "Reiseleiter/-innen gesucht! Wir suchen Studenten für Busreisen in den Semesterferien. Gute Bezahlung, freie Reisen durch ganz Europa. Reisen Weltweit GmbH, Tel. 069/24 17 00", "e": "Kino-Kiosk: Popcorn und Getränke für Ihre Filmabende zu Hause – Lieferung frei Haus. www.kinokiosk.de", "f": "Restaurant in bester Innenstadtlage sucht erfahrene/n Geschäftsführer/in mit langjähriger Berufserfahrung in der Gastronomie. Bewerbung an Postfach 1188.", "g": "Fotoausstellung „Arabien heute“ im Rathaus, täglich 10–17 Uhr, Eintritt frei.", "h": "Kindergarten Regenbogen hat ab September wieder freie Plätze für Kinder von 3 bis 6 Jahren. Anmeldung: Tel. 0221/56 78 90", "i": "Tanzschule Weber: Neue Kurse für Anfänger und Fortgeschrittene – Walzer, Tango, Salsa. Kursbeginn jeden Monat. Tel. 0221/33 44 55", "j": "Das Filmtheater am Markt sucht Mitarbeiter/-innen für Kasse und Einlass, auch Teilzeit und am Wochenende. Bewerbung an der Kinokasse.", "k": "Buchhandlung Orient: Romane, Gedichte und Erzählungen aus Ägypten, Syrien, dem Libanon und Marokko – auf Arabisch und in deutscher Übersetzung. Lesungen jeden ersten Freitag im Monat.", "l": "Fotokurs für Anfänger: Lernen Sie, mit Ihrer Kamera richtig umzugehen! Montag bis Freitag, jeweils 9–12 Uhr, Volkshochschule Mitte."}, "key": ["d", "k", "j", "a", "h", "x", "i", "f", "b", "x"], "why": ["Ad d: tour guides – students earn money and travel.", "Ad k: bookshop with literature from Arab countries; ad g is a photo exhibition, not literature.", "Ad j: a cinema looks for staff; ad e only sells popcorn.", "Ad a: work in a restaurant with accommodation in the house.", "Ad h: free kindergarten places.", "The only disco (c) is closed until the end of the month → x.", "Ad i: dance school for beginners.", "Ad f: a restaurant looks for an experienced manager.", "Ad b: African film week.", "The photo course (l) is only in the morning, 9–12 → x."]}, "sprach1": {"note": "reconstructed (some answer options missing in book)", "text": "Liebe Frau Vollzwinkler,\n\nwir wohnen jetzt schon [21] sechs Wochen in unserer neuen Wohnung. Zwar ist immer noch nicht alles so eingerichtet, wie wir [22] das wünschen, aber wir wussten ja, dass das einige Zeit [23] würde, bis alles fertig ist. Natürlich haben wir uns zuerst um das Kinderzimmer gekümmert. Unsere beiden Kinder durften sich die Farben für die Wände selbst [24]. Sie haben sich für Blau und Gelb entschieden. Meinem Mann [25] das am Anfang gar nicht gefallen, aber jetzt hat er sich [26] gewöhnt. Jetzt fehlt eigentlich nur noch das Wohnzimmer.\n\nWir warten auf die neuen Möbel, [27] wir gekauft haben. In der [28] Woche kommen sie endlich. Dann können auch wieder Gäste zu uns kommen. Wir würden uns alle sehr freuen, wenn Sie und Ihr Mann uns bald besuchen [29]. Wir waren schließlich fünf Jahre lang Nachbarn! Und trotz [30] schönen neuen Wohnung sind wir ein bisschen traurig, dass wir nicht mehr neben Ihnen wohnen.\n\nViele liebe Grüße\nIhre Familie Berger", "q": [{"n": 21, "opts": {"a": "vor", "b": "seit", "c": "für"}, "key": "b", "why": "Action started in the past and continues → seit sechs Wochen."}, {"n": 22, "opts": {"a": "wir", "b": "mich", "c": "uns"}, "key": "c", "why": "'sich etwas wünschen' – reflexive dative for wir → uns."}, {"n": 23, "opts": {"a": "dauern", "b": "dauert", "c": "gedauert"}, "key": "a", "why": "'würde' + infinitive at the end: dauern würde."}, {"n": 24, "opts": {"a": "aussuchten", "b": "aussuchen", "c": "ausgesucht"}, "key": "b", "why": "'durften … aussuchen' – modal verb + infinitive."}, {"n": 25, "opts": {"a": "hat", "b": "ist", "c": "wird"}, "key": "a", "why": "'gefallen' forms the Perfekt with haben: hat gefallen."}, {"n": 26, "opts": {"a": "daran", "b": "darauf", "c": "damit"}, "key": "a", "why": "'sich gewöhnen an + Akk.' → daran."}, {"n": 27, "opts": {"a": "das", "b": "den", "c": "die"}, "key": "c", "why": "Relative pronoun, plural accusative (die Möbel) → die."}, {"n": 28, "opts": {"a": "nächsten", "b": "nächste", "c": "nächstes"}, "key": "a", "why": "in der + adjective (dative feminine) → nächsten."}, {"n": 29, "opts": {"a": "werden", "b": "worden", "c": "würden"}, "key": "c", "why": "Konjunktiv II in a wish: wenn Sie uns besuchen würden."}, {"n": 30, "opts": {"a": "unser", "b": "unserer", "c": "unseres"}, "key": "b", "why": "trotz + genitive, feminine (die Wohnung) → unserer."}]}, "sprach2": {"text": "Sehr geehrte Damen und Herren,\n\nvielen Dank für die [31] Zusendung der Informationsmaterialien. Ich interessiere mich sowohl für das Seminar „Schutz gegen Computerviren“ als [32] für „Einführung ins Internet“.\n\nDazu habe ich noch [33] Fragen: Ist die Veranstaltung „Einführung ins Internet“ auch wirklich für Anfänger gedacht? Da ich noch gar keine Erfahrung habe, möchte ich mich [34] jetzt auf das Seminar vorbereiten. [35] Sie mir die Schulungsunterlagen bereits vorher schicken?\n\nGibt es für die [36] Seminare noch genügend freie Plätze? Bis [37] muss ich mich spätestens anmelden?\n\nUnd nun noch eine Frage zur Bezahlung: Auslandsüberweisungen sind sehr teuer, daher [38] ich wissen, [39] man im Voraus bezahlen muss oder auch vor Ort bar bezahlen kann.\n\n[40] ich auch eine Kursbestätigung am Ende des Seminars erhalten?\n\nMit freundlichen Grüßen\nWilly Gates", "words": {"a": "auch", "b": "beiden", "c": "eine", "d": "einige", "e": "könnten", "f": "möchte", "g": "müssen", "h": "ob", "i": "schnelle", "j": "schon", "k": "soll", "l": "sondern", "m": "vorne", "n": "wann", "o": "werde"}, "key": ["i", "a", "d", "j", "e", "b", "n", "f", "h", "o"], "why": ["Adjective before noun: die schnelle Zusendung.", "'sowohl … als auch' = both … and.", "'einige Fragen' – plural, some questions.", "'schon jetzt' = already now.", "Polite request: Könnten Sie mir … schicken?", "'die beiden Seminare' – both seminars.", "'Bis wann?' = by when?", "'daher möchte ich wissen' – verb in position 2 after daher.", "Indirect yes/no question → ob.", "Future: Werde ich … erhalten?"]}, "hoeren1": [{"n": 41, "s": "Der Sprecher hat zu Hause keinen Computer.", "a": "f", "t": "Ich habe zu Hause einen Computer und benutze ihn oft, besonders um E-Mails zu schreiben oder Filme zu schauen. Manchmal spiele ich auch Computerspiele mit meinen Freunden. Für die Arbeit brauche ich ihn nicht, aber zu Hause ist er sehr praktisch.", "e": "He has a computer at home."}, {"n": 42, "s": "Der Sprecher benutzt den Computer nur am Arbeitsplatz.", "a": "f", "t": "Ich benutze meinen Computer nicht nur am Arbeitsplatz. Im Büro schreibe ich Berichte und beantworte E-Mails, aber auch zu Hause bearbeite ich Fotos, höre Musik oder surfe im Internet. Für mich ist der Computer überall nützlich.", "e": "'nicht nur am Arbeitsplatz' – also at home."}, {"n": 43, "s": "Die Sprecherin lehnt Computer ab.", "a": "r", "t": "Computer mag ich überhaupt nicht. Ich finde, sie machen das Leben komplizierter. Ich schreibe lieber Briefe mit der Hand und telefoniere direkt mit Freunden. Privat benutze ich nie einen Computer. Sie nehmen nur Platz weg.", "e": "'Computer mag ich überhaupt nicht.'"}, {"n": 44, "s": "Die Sprecherin hat kein großes Vertrauen zu Computern.", "a": "r", "t": "Ich habe kein großes Vertrauen zu Computern. Oft funktionieren sie nicht richtig, und dann weiß ich nicht, was ich machen soll. Wenn ich etwas am Computer machen muss, frage ich meistens meine Tochter, weil ich Angst habe, Fehler zu machen.", "e": "'Ich habe kein großes Vertrauen zu Computern.'"}, {"n": 45, "s": "Die Sprecherin braucht den Computer im täglichen Leben.", "a": "f", "t": "Im täglichen Leben brauche ich eigentlich keinen Computer. Informationen suche ich in der Bibliothek, Notizen schreibe ich mit der Hand, und einkaufen gehe ich im Laden. Nur für die Arbeit muss ich ihn manchmal benutzen. Sonst komme ich gut ohne ihn zurecht.", "e": "She does not need it in daily life."}], "hoeren2": {"intro": "Im Radio spricht ein Moderator mit Herrn Bachinger, einem Vater in Elternzeit, der ein Buch über seine Erfahrungen geschrieben hat.", "speakers": ["Moderator", "Herr Bachinger"], "lines": [["A", "Sie hören jetzt eine Sendung zum Thema Familie und Rollenverteilung. Im Mittelpunkt steht ein Gespräch mit einem Mann, der als moderner Vater von seinen Erfahrungen erzählt."], ["A", "Herr Bachinger, schön, dass Sie heute bei uns sind. Sie haben ein Buch geschrieben, nicht wahr?"], ["B", "Ja, genau. Ich habe ein Buch über meine Erfahrungen als Vater geschrieben – über meinen Alltag mit meinem Sohn, aber auch über gesellschaftliche Themen, die damit zusammenhängen."], ["A", "Seit wann sind Sie Vater? Und sind Sie verheiratet?"], ["B", "Mein Sohn ist jetzt fast zwei Jahre alt. Ich lebe schon länger mit meiner Partnerin zusammen, aber geheiratet haben wir nicht."], ["A", "In Ihrem Buch schreiben Sie auch über Rollenbilder. Berichten die Medien genug darüber?"], ["B", "Ehrlich gesagt, über moderne Familien liest man eher selten etwas. Aber manche Dinge sollten auch privat bleiben. Ich denke nicht, dass die Zeitungen mehr darüber schreiben müssen."], ["A", "Wie war es, als Sie Ihrem Chef gesagt haben, dass Sie Elternzeit nehmen möchten?"], ["B", "Am Anfang war ich unsicher, aber mein Chef hat sofort Verständnis gezeigt. Er fand es gut, dass ich Verantwortung übernehme. Ich musste ihn also gar nicht lange überzeugen."], ["A", "War Hausarbeit für Sie eine neue Erfahrung?"], ["B", "Überhaupt nicht. Schon vor der Geburt meines Sohnes habe ich zu Hause mitgeholfen – kochen, putzen, alles. Das ist doch selbstverständlich, wenn man zusammenlebt."], ["A", "Haben Ihre Kollegen Sie vermisst?"], ["B", "Ich denke, nicht besonders. Es gab genug Vertretung, und ich hatte sowieso eine recht unabhängige Position im Team."], ["A", "Gab es Vorurteile, gegen die Sie kämpfen mussten?"], ["B", "Eigentlich nein. In meinem Umfeld gab es eher Neugier als Kritik. Viele fanden es interessant und haben Fragen gestellt, aber negative Reaktionen habe ich kaum erlebt."], ["A", "Für wen haben Sie Ihr Buch geschrieben?"], ["B", "In erster Linie für mich selbst. Es war wie ein Tagebuch, das mir geholfen hat, meine Gedanken zu ordnen. Ich hätte nie gedacht, dass so viele andere Menschen es lesen würden."], ["A", "Und wie sehen Ihre beruflichen Pläne aus?"], ["B", "Ich möchte wieder arbeiten, wenn mein Sohn in die Schule kommt. Bis dahin will ich die Zeit mit ihm nutzen."], ["A", "Wäre Teilzeitarbeit nicht eine gute Lösung?"], ["B", "Teilzeitarbeit wäre zwar möglich, aber im Moment passt das nicht zu meiner Lebenssituation. Für mich ist das nicht das Beste."], ["A", "Vielen Dank, Herr Bachinger, für das Gespräch."], ["B", "Ich danke Ihnen für die Einladung."]], "items": [{"n": 46, "s": "Herr Bachinger hat ein Buch über Väter geschrieben.", "a": "r", "e": "'Ich habe ein Buch über meine Erfahrungen als Vater geschrieben.'"}, {"n": 47, "s": "Herr Bachinger hat vor zehn Monaten geheiratet.", "a": "f", "e": "'aber geheiratet haben wir nicht.'"}, {"n": 48, "s": "Herr Bachinger meint, dass die Zeitungen mehr über moderne Familien berichten sollen.", "a": "f", "e": "'Ich denke nicht, dass die Zeitungen mehr darüber schreiben müssen.'"}, {"n": 49, "s": "Herr Bachinger konnte seinen Chef sofort überzeugen.", "a": "r", "e": "'mein Chef hat sofort Verständnis gezeigt.'"}, {"n": 50, "s": "Hausarbeit war für Herrn Bachinger nichts Neues.", "a": "r", "e": "'Schon vor der Geburt meines Sohnes habe ich zu Hause mitgeholfen.'"}, {"n": 51, "s": "Seine Kollegen haben ihn anfangs sehr vermisst.", "a": "f", "e": "'Ich denke, nicht besonders.'"}, {"n": 52, "s": "Herr Bachinger hat gegen viele Vorurteile kämpfen müssen.", "a": "f", "e": "'Eigentlich nein … eher Neugier als Kritik.'"}, {"n": 53, "s": "Herr Bachinger hat das Buch für andere Väter geschrieben.", "a": "f", "e": "'In erster Linie für mich selbst.'"}, {"n": 54, "s": "Er will erst wieder arbeiten gehen, wenn sein Sohn in die Schule kommt.", "a": "r", "e": "'Ich möchte wieder arbeiten, wenn mein Sohn in die Schule kommt.'"}, {"n": 55, "s": "Herr Bachinger meint, dass Teilzeitarbeit für ihn das Beste sei.", "a": "f", "e": "'im Moment passt das nicht zu meiner Lebenssituation.'"}]}, "hoeren3": [{"n": 56, "s": "Der Fahrer des Wagens mit dem Kennzeichen HB-D 256 soll ins Erdgeschoss kommen.", "a": "r", "t": "Achtung, eine Durchsage: Der Fahrer des Fahrzeugs mit dem Kennzeichen HB-D 256 wird dringend gebeten, sofort ins Erdgeschoss zu kommen. Das Fahrzeug steht im Halteverbot und blockiert eine Ausfahrt. Bitte melden Sie sich an der Information im Eingangsbereich.", "e": "'… gebeten, sofort ins Erdgeschoss zu kommen.'"}, {"n": 57, "s": "Die Firma liefert das bestellte Sofa am Dienstag ab drei Uhr nachmittags.", "a": "f", "t": "Guten Tag, hier ist Möbel Krämer. Die Lieferung Ihres bestellten Sofas erfolgt nicht am Dienstag, sondern am Mittwoch zwischen 10 und 12 Uhr. Bitte sorgen Sie dafür, dass jemand zu Hause ist. Bei Fragen rufen Sie uns gerne an.", "e": "Delivery is on Wednesday, 10–12, not Tuesday."}, {"n": 58, "s": "Der Gasthof Lindner ist neben einer Tankstelle.", "a": "r", "t": "Willkommen im Gasthof Lindner! Unser Haus liegt direkt neben einer Tankstelle, was besonders für Autofahrer sehr praktisch ist. Dort können Sie rund um die Uhr tanken oder Snacks kaufen. Wir wünschen Ihnen einen angenehmen Aufenthalt.", "e": "'direkt neben einer Tankstelle'."}, {"n": 59, "s": "Der Film Komiker läuft täglich um 20 Uhr.", "a": "r", "t": "Hier ist Ihr Kinoprogramm: Der beliebte Film „Komiker“ läuft jeden Tag um 20 Uhr im großen Saal. Die Vorstellung dauert etwa 90 Minuten. Karten gibt es online oder an der Kasse.", "e": "'jeden Tag um 20 Uhr'."}, {"n": 60, "s": "Das Wetter ist am Abend noch gut.", "a": "f", "t": "Der Wetterdienst meldet für heute wechselhaftes Wetter. Am Nachmittag ziehen Wolken auf, und am Abend wird mit starkem Regen gerechnet. Es besteht die Gefahr von Gewittern und starkem Wind.", "e": "In the evening there will be heavy rain."}], "schreiben": {"letter": "Liebe(r) …,\n\nwir haben lange nichts mehr voneinander gehört. Ich hoffe, es geht dir gut. Gibt es bei dir Neuigkeiten? Ich bin nun schon seit zwei Monaten in Würzburg, und mein neuer Job gefällt mir sehr gut. In der Firma fühle ich mich wohl, mit meinen Kollegen verstehe ich mich prima und die Arbeit macht mir großen Spaß.\n\nAllerdings habe ich ein Problem: Außer meinen Kollegen kenne ich hier in der Stadt noch niemanden. In meiner Freizeit bin ich oft allein und weiß nicht, was ich machen soll. Wie könnte ich neue Leute kennenlernen? Hast du vielleicht einen Tipp für mich?\n\nWürzburg ist wirklich eine schöne Stadt mit vielen Sehenswürdigkeiten. Hast du Lust, mich mal an einem Wochenende zu besuchen? Ich würde mich sehr freuen.\n\nViele Grüße\nSophie", "task": "Antworten Sie Sophie. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Was es Neues bei Ihnen gibt", "Was Sie selbst gerne in Ihrer Freizeit machen", "Tipps für Sophie", "Reaktion auf den Vorschlag"], "model": "Damaskus, 17.10.2026\n\nLiebe Sophie,\n\nvielen Dank für deine E-Mail! Es freut mich sehr, dass dir dein neuer Job so gut gefällt.\n\nBei mir gibt es auch Neuigkeiten: Ich habe einen neuen Deutschkurs angefangen und bereite mich auf die B1-Prüfung vor. Deshalb habe ich im Moment nicht so viel Zeit.\n\nIn meiner Freizeit gehe ich gern schwimmen, lese Bücher und treffe mich mit Freunden im Café.\n\nIch habe ein paar Tipps für dich: Du könntest in einen Sportverein gehen oder einen Kurs an der Volkshochschule machen, zum Beispiel Tanzen oder Kochen. Dort lernt man schnell nette Leute kennen. Vielleicht kannst du auch mit deinen Kollegen nach der Arbeit etwas unternehmen.\n\nDeine Einladung nehme ich sehr gern an! Ich würde dich gern im nächsten Monat besuchen, vielleicht am zweiten Wochenende. Passt dir das? Dann kannst du mir die Sehenswürdigkeiten von Würzburg zeigen.\n\nIch freue mich schon auf dich!\n\nViele liebe Grüße\ndeine Rana", "phrases": ["Es freut mich sehr, dass …", "Bei mir gibt es auch Neuigkeiten:", "In meiner Freizeit … ich gern …", "Du könntest zum Beispiel …", "Deine Einladung nehme ich gern an.", "Passt dir das?"]}, "vocab": [["berufstätig", "working, employed"], ["die Umfrage, -n", "survey"], ["flexible Arbeitszeiten (Pl.)", "flexible working hours"], ["der Betrieb, -e", "company, workplace"], ["der Teilzeitarbeitsplatz, -plätze", "part-time job"], ["vertreten (vertritt)", "to stand in for"], ["fordern", "to demand"], ["sich bewerben um + Akk.", "to apply for"], ["der Wettbewerb, -e", "competition"], ["erhältlich", "available"], ["die Abteilung, -en", "department"], ["eröffnen", "to open"], ["die Aufstiegschance, -n", "chance of promotion"], ["die Zufriedenheit", "satisfaction"], ["das Gehalt, Gehälter", "salary"], ["der Ruf", "reputation"], ["die Ausstellung, -en", "exhibition"], ["sich vergewissern", "to make sure"], ["sich beschäftigen mit + Dat.", "to deal with"], ["beweisen", "to prove"], ["hinterfragen", "to question"], ["neugierig", "curious"], ["der Vorschlag, -schläge", "suggestion"], ["anfassen", "to touch"], ["ausprobieren", "to try out"], ["staunen", "to be amazed"], ["die Öffnungszeiten (Pl.)", "opening hours"], ["nebenbei", "on the side"], ["leiten", "to manage"], ["die Berufserfahrung", "work experience"], ["einrichten", "to furnish"], ["sich kümmern um + Akk.", "to take care of"], ["aussuchen", "to choose"], ["sich entscheiden für + Akk.", "to decide on"], ["sich gewöhnen an + Akk.", "to get used to"], ["die Möbel (Pl.)", "furniture"], ["die Zusendung, -en", "sending, delivery"], ["sowohl … als auch", "both … and"], ["sich vorbereiten auf + Akk.", "to prepare for"], ["die Unterlagen (Pl.)", "documents, materials"], ["sich anmelden", "to register"], ["die Überweisung, -en", "bank transfer"], ["bar bezahlen", "to pay cash"], ["die Bestätigung, -en", "confirmation"], ["ablehnen", "to reject"], ["das Vertrauen", "trust"], ["die Elternzeit", "parental leave"], ["überzeugen", "to convince"], ["vermissen", "to miss"], ["das Vorurteil, -e", "prejudice"], ["die Teilzeitarbeit", "part-time work"], ["das Kennzeichen, -", "number plate"], ["das Erdgeschoss, -e", "ground floor"], ["die Lieferung, -en", "delivery"], ["die Tankstelle, -n", "petrol station"], ["die Sehenswürdigkeit, -en", "sight, attraction"], ["kennenlernen", "to get to know"]], "grammar": ["seit + Dativ for ongoing time: seit sechs Wochen", "sich etwas wünschen (reflexive dative: uns)", "würde + infinitive: dauern würde", "Modal verb + infinitive: durften aussuchen", "gefallen → Perfekt with haben", "sich gewöhnen an + Akk. → daran", "Relative pronoun plural: die Möbel, die …", "Konjunktiv II: wenn Sie uns besuchen würden", "trotz + Genitiv: trotz unserer schönen Wohnung", "sowohl … als auch", "Könnten Sie …? (polite request)", "Bis wann? / ob (indirect question)", "Futur I: Werde ich … erhalten?"]}, {"n": 4, "title": "Kirche · Handy und Computer · Klassenfahrt", "lesen1": {"headlines": {"a": "Bilder mit dem Computer bearbeiten", "b": "Kirche bietet Backkurs für Kinder an", "c": "Kirche eröffnet neuen Treffpunkt", "d": "Neu: Kochbuch über Wiener Fleischgerichte", "e": "Neue Computerprogramme werden getestet", "f": "Preis für bestes Lernprogramm", "g": "Rezepte für Kuchen und Torten", "h": "Studie zeigt: Kaffeetrinker sind glücklicher", "i": "Warum die Wiener ins Café gehen", "j": "Zürcher Fotografen stellen aus"}, "note": "reconstructed (texts 4 and 5 unreadable in book; rewritten to fit the key)", "texts": ["Die Kunst- und Medienschule F+F Zürich bietet bereits zum dritten Mal den Computerkurs „Digitale Bildbearbeitung“ an. Im neuen Semester steht an zehn Samstagen „Fotografie nach der Fotografie“, also die digitale Bearbeitung von Bildern, im Mittelpunkt. Dabei kommen verschiedene Softwareprodukte zum Einsatz. Der Kurs befasst sich aber nicht nur mit dem Vermitteln von Technik, sondern auch mit Themen und Problembereichen rund um die digitale Foto- und Bildbearbeitung. Kurskosten: 800 Franken. Nähere Informationen und Anmeldung unter www.ff-zuerich.ch.", "Neuperlach-Süd – Nach dem Einkaufen einen Kaffee genießen, mit anderen ins Gespräch kommen, sich mit Bekannten treffen oder einfach entspannen – all das geht ab 11. Juli immer dienstags zwischen 14 und 18 Uhr im neuen Eiscafé der Dietrich-Bonhoeffer-Kirche. „Wir wollen damit einen Ort der Begegnung für Jung und Alt anbieten und zur Belebung des Stadtteils beitragen“, erklärt Pfarrer Sebastian Kühnen. Neben kalten und heißen Getränken sowie Kuchen steht während der Öffnungszeiten auch eine Mitarbeiterin für Gespräche zur Verfügung.", "Geheimnisse der modernen Konditorkunst verrät der Meister des Süßen, Herwig Gasser. Über Jahre hinweg sammelte der Bäcker des berühmten Wiener Café Landtmann Mehlspeisenrezepte – von der Birnentorte über den Apfelstrudel bis hin zum Heidelbeerstollen. Verlag Kettel, 110 Fotos, 300 Seiten.", "Am Montag wird in Stuttgart die Bildungsmesse Didacta eröffnet. Dort werden vor allem neue Lehrmaterialien vorgestellt; bei vielen handelt es sich um Bildungssoftware. Lehrerinnen, Lehrer und Schüler können die neuen Lern- und Computerprogramme an den Ständen selbst ausprobieren und testen. Ihre Meinung wird auf Fragebögen gesammelt und an die Hersteller weitergegeben, damit die Programme noch besser werden.", "Das Gallup-Institut hat sich mit dem Kaffeehausverhalten der Wiener beschäftigt. Ein Vorurteil hat sich dabei bestätigt: Der Wiener liebt sein Kaffeehaus und seine Melange. 72 Prozent der Befragten gaben an, zumindest einmal im Monat in ein Café in der Nähe ihrer Wohnung zu gehen. Durchschnittlich 54 Minuten verbringen die Befragten in ihrem Stammcafé. Gegessen wird dort eher wenig. Der wichtigste Grund für einen Besuch im Kaffeehaus ist das Plaudern mit Freunden: 77 Prozent der Befragten nannten ihn als Grund."], "key": ["a", "c", "g", "e", "i"], "why": ["A computer course for digital image editing = a; trap j: no exhibition of photographers.", "A church opens a café as a meeting place for young and old = c; trap b: cake is sold, but there is no baking course.", "A book with recipes for cakes, strudel and tarts = g; trap d: it is not about meat dishes.", "New learning software is presented and tested at the fair = e (book key); trap f: no prize is mentioned.", "A study on why the Viennese go to cafés (chatting with friends) = i; trap h: the study does not say coffee drinkers are happier."]}, "lesen2": {"title": "Verheiratet mit Handy und Computer", "text": "Die Woche mit sechzig bis achtzig Arbeitsstunden war für Volkmar Bergmann ganz normal. Der Gründer und Chefingenieur einer Software-Firma hatte von montags bis freitags einen Zwölfstundentag und arbeitete auch an Samstagen und Sonntagen. Das Geschäft ging sehr gut. Die Firma wurde immer größer: 1100 Mitarbeiterinnen und
