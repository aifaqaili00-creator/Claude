Mitarbeiter – darauf konnte Volkmar Bergmann wirklich stolz sein.\n\nDie Arbeit machte ihm Spaß, jedenfalls so lange, bis sein Sohn geboren wurde. „Auf einmal fing ich an, die Dinge in einem anderen Licht zu sehen.“ Er versuchte, aus dem Stress mit Nacht- und Wochenendarbeit herauszukommen. Jahrelang gelang ihm das nicht. Erst als er sich entschlossen hatte, sein Leben vollkommen zu ändern, wurde es besser: Heute arbeitet Bergmann nur 20 Stunden die Woche, als Berater für die Firma, die ihm früher einmal gehörte. Er hat Zeit für die Kinder und sagt: „Ich bin zufriedener als jemals zuvor in meinem Leben.“\n\nGlück gehabt. Anderen Vielarbeitern ist eine solche Änderung nicht möglich, sie bleiben mit ihrem Schreibtisch verheiratet. „Ein 24-Stunden-Arbeitstag ist der Trend“, sagt Bryan E. Robinson, Professor in den USA. Millionen von Arbeitnehmern geben ihre ganze Kraft für ihren Job. „Wir leben in einer Welt, die vor allem den Menschen alle Chancen bietet, für die die Arbeit das Wichtigste im Leben ist, den so genannten Workaholics.“ Diese Menschen können Gutes nur noch in ihrer Arbeit tun. Sie haben längst die Fähigkeit verloren, ein Privatleben zu führen und sich um ihre Familie und die Freunde zu kümmern.\n\nDie Schwierigkeiten der Menschen, die an der Krankheit Workaholismus leiden, nehmen ständig zu. Immer mehr Menschen laufen Gefahr, von ihrer Arbeit regelrecht aufgefressen zu werden. Das Ende dieser Entwicklung lässt sich leicht absehen: Die Mitarbeiter werden häufiger krank, Arbeitsfreude und Motivation nehmen ab, es kommt zu Fehlern und Pannen. Das Familienleben leidet.\n\nModerne Technik und Medien machen es möglich: Durch das Handy ist man überall und jederzeit erreichbar. Mit Laptops und Mini-Computern ist man unabhängig vom Arbeitsplatz und kann von jedem Ort der Welt aus im Internet surfen oder seine elektronische Post erledigen. Die räumliche Grenze zwischen dem Zuhause und dem Büro besteht für viele nicht mehr. Der Arbeitsplatz wird als Zuhause angesehen, und das Zuhause wird zum Arbeitsplatz. Eigentlich waren die neuen Medien dazu gedacht, die Arbeit einfacher zu machen. In Wirklichkeit führen sie dazu, dass die Arbeit immer tiefer in den Bereich der Freizeit eindringt. Ein Privatleben, in dem man von der Arbeit einmal ganz abschalten kann, gibt es schon heute für viele nicht mehr.\n\nInzwischen gibt es Seminare für Arbeitskranke, in denen die Teilnehmenden lernen sollen, wieder zu leben und nicht nur zu funktionieren. Der Psychologe Ulrich Beer gibt seinen Patienten einen einfachen Rat: Im Kalender müssen genauso viele private wie berufliche Termine stehen. Familie und Beruf sind gleich wichtig.", "note": "reconstructed (question options; stems in book)", "q": [{"n": 6, "stem": "Volkmar Bergmann …", "opts": {"a": "arbeitet heute noch 60 Stunden pro Woche.", "b": "hat sein Leben nach der Geburt seines Sohnes geändert.", "c": "hat seine Firma verloren."}, "key": "b", "why": "'Die Arbeit machte ihm Spaß, jedenfalls so lange, bis sein Sohn geboren wurde … sein Leben vollkommen zu ändern.'"}, {"n": 7, "stem": "Es gibt viele Menschen, …", "opts": {"a": "die gern weniger arbeiten möchten.", "b": "die ihr Leben nicht ändern können.", "c": "die als Berater arbeiten."}, "key": "b", "why": "'Anderen Vielarbeitern ist eine solche Änderung nicht möglich.'"}, {"n": 8, "stem": "Durch die moderne Technik …", "opts": {"a": "wird die Arbeit einfacher.", "b": "gibt es für viele keine Grenze mehr zwischen Arbeit und Freizeit.", "c": "hat man mehr Zeit für die Familie."}, "key": "b", "why": "'Die räumliche Grenze zwischen dem Zuhause und dem Büro besteht für viele nicht mehr.'"}, {"n": 9, "stem": "Laut Professor Robinson …", "opts": {"a": "arbeiten die Amerikaner weniger als früher.", "b": "leben viele Menschen nur noch für ihren Beruf.", "c": "sind Workaholics glücklicher."}, "key": "b", "why": "'Millionen von Arbeitnehmern geben ihre ganze Kraft für ihren Job.'"}, {"n": 10, "stem": "In Seminaren sollen die Teilnehmer lernen, …", "opts": {"a": "noch besser zu funktionieren.", "b": "Familie und Beruf gleich wichtig zu nehmen.", "c": "mehr berufliche Termine zu planen."}, "key": "b", "why": "'Im Kalender müssen genauso viele private wie berufliche Termine stehen. Familie und Beruf sind gleich wichtig.'"}]}, "lesen3": {"note": "reconstructed (ads missing in book)", "situations": ["Sie wollen am Wochenende gerne in ein Klavierkonzert gehen.", "Sie sind in Füssen und wollen am Montag ins Museum gehen.", "Sie sind in Süddeutschland im Urlaub und möchten gerne eine bayerische Spezialität essen.", "Sie haben sich mit Bekannten zu einem Fischessen verabredet.", "Sie sind in Bayern und wollen Käsespezialitäten einkaufen.", "Sie möchten einen Deutschkurs in Wien besuchen.", "Ihr 16-jähriger Sohn soll in den Ferien im Ausland Englisch lernen.", "Sie interessieren sich für einen Sprachkurs auf CD.", "Sie wollen, dass Ihre 10-jährige Tochter in den Ferien eine Fremdsprache lernt.", "Eine Bekannte will ihren Geburtstag in einem Restaurant feiern und dort auch übernachten."], "ads": {"a": "Gitarrenabend im Kurhaus Füssen: Spanische Musik live, Freitag 20 Uhr. Karten an der Abendkasse.", "b": "Gasthaus Alte Post, Oberammergau: Original bayerische Weißwürste mit Brezn und süßem Senf, jeden Tag bis 12 Uhr. Dazu frisches Weißbier.", "c": "Allgäuer Käsehof: Bergkäse, Emmentaler und Weißlacker aus eigener Herstellung – direkt ab Hof in unserem Laden bei Kempten. Mo–Sa 8–18 Uhr.", "d": "Museum der Stadt Füssen im Kloster St. Mang: Dienstag bis Sonntag 11–17 Uhr, montags geschlossen.", "e": "Klavierabend mit Anna Berger: Werke von Mozart und Chopin. Samstag und Sonntag, jeweils 19.30 Uhr, Festsaal Hohenschwangau.", "f": "Museum für Musikinstrumente Füssen: täglich geöffnet, auch montags, 10–17 Uhr. Führungen auf Anfrage.", "g": "Englisch für Kinder von 6 bis 9 Jahren – spielend lernen in kleinen Gruppen, jeden Nachmittag in den Sommerferien. Sprachschule Little Stars, München.", "h": "Sommer-Sprachcamps in England und Irland für Jugendliche von 15 bis 18 Jahren: Englischunterricht am Vormittag, Sport und Ausflüge am Nachmittag. Info: Tel. 089/45 67 80", "i": "Spanisch lernen am Computer! Unser neues Sprachprogramm als Download – mit Übungen zum Hören und Sprechen. www.lingua-online.de", "j": "Deutsch lernen in Wien! Intensivkurse auf allen Niveaustufen, Beginn jeden Montag, Kulturprogramm inklusive. Sprachinstitut Wien-Mitte, Tel. 01/512 40 40", "k": "Fischrestaurant Seeblick am Starnberger See: Forelle, Zander und Renke frisch aus dem See. Reservierung empfohlen: Tel. 08151/77 88", "l": "Landgasthof Zum Hirschen: Feiern Sie Ihr Fest in unserem Restaurant für bis zu 60 Gäste – und übernachten Sie anschließend in unseren gemütlichen Gästezimmern. Tel. 08362/91 20"}, "key": ["e", "f", "b", "k", "c", "j", "h", "x", "x", "l"], "why": ["Ad e: a piano evening on Saturday and Sunday; ad a is guitar music on Friday.", "Ad f: museum in Füssen open also on Mondays; ad d is closed on Mondays.", "Ad b: Bavarian white sausages – a Bavarian speciality.", "Ad k: a fish restaurant.", "Ad c: a cheese farm shop in Bavaria (Allgäu).", "Ad j: German courses in Vienna.", "Ad h: English camps abroad (England, Ireland) for 15–18-year-olds.", "Ad i is a computer download, not a CD → x.", "Ad g is for children aged 6–9 only; the daughter is 10 → x.", "Ad l: restaurant for parties with guest rooms to stay overnight."]}, "sprach1": {"note": "reconstructed (some answer options missing in book; same text as exam 1)", "text": "Sehr geehrter Herr Meyerhofer,\n\nwie Sie wissen, miete ich nun schon seit drei Jahren eine Wohnung in [21] Haus. Ich [22] die ganze Zeit sehr zufrieden, denn im Haus war es immer ruhig, sauber und sicher. In der Zwischenzeit [23] sich die Wohnqualität durch die Eröffnung des Restaurants im Erdgeschoss aber deutlich verschlechtert. [24] spät abends höre ich nun täglich [25] Lärm der Restaurantgäste im Garten, die Mülleimer im Hof sind immer überfüllt, die Parkplätze vor dem Haus, [26] eigentlich für die Mieter reserviert sind, sind immer besetzt, und das Treppenhaus ist ständig verschmutzt. Außerdem fühle ich mich [27] Haus nicht mehr sicher, weil das Restaurant oft die ganze Nacht [28] hat.\n\nIch möchte Sie dringend bitten, sich um diese [29] zu kümmern und mit den Restaurantbesitzern zu sprechen. Vielleicht könnte [30] gemeinsam eine Lösung finden.\n\nMit freundlichen Grüßen\nIhre Anneliese Kühne", "q": [{"n": 21, "opts": {"a": "Ihr", "b": "Ihrem", "c": "Ihren"}, "key": "b", "why": "'in' + location (wo?) takes dative; Haus is neuter → in Ihrem Haus."}, {"n": 22, "opts": {"a": "war", "b": "bin", "c": "habe"}, "key": "a", "why": "Past state with 'sein': ich war zufrieden (Präteritum, like 'war es immer ruhig')."}, {"n": 23, "opts": {"a": "hat", "b": "ist", "c": "wird"}, "key": "a", "why": "'sich verschlechtern' is reflexive → Perfekt with haben: hat sich verschlechtert."}, {"n": 24, "opts": {"a": "Bis", "b": "Seit", "c": "Ab"}, "key": "a", "why": "'bis spät abends' = until late in the evening."}, {"n": 25, "opts": {"a": "der", "b": "den", "c": "dem"}, "key": "b", "why": "'hören' takes an accusative object; der Lärm → den Lärm."}, {"n": 26, "opts": {"a": "denen", "b": "die", "c": "deren"}, "key": "b", "why": "Relative pronoun, subject, plural (die Parkplätze) → die."}, {"n": 27, "opts": {"a": "im", "b": "am", "c": "ins"}, "key": "a", "why": "Location (wo?) → in + dem = im Haus."}, {"n": 28, "opts": {"a": "geöffnet", "b": "öffnen", "c": "öffnet"}, "key": "a", "why": "'geöffnet haben' = to be open; Partizip II after haben."}, {"n": 29, "opts": {"a": "Problem", "b": "Probleme", "c": "Problemen"}, "key": "b", "why": "'diese' + many problems listed → plural accusative: diese Probleme."}, {"n": 30, "opts": {"a": "mich", "b": "man", "c": "wir"}, "key": "b", "why": "'könnte' is 3rd person singular → man könnte (wir would need 'könnten')."}]}, "sprach2": {"text": "Sehr geehrte Damen und Herren,\n\nich habe Ihre Anzeige gelesen und interessiere mich sehr für Ihr Angebot. Ich komme aus Kroatien und möchte [31] den nächsten Sommerferien mein Deutsch verbessern. Klagenfurt ist für mich der ideale Ort, [32] das nicht so weit weg von meiner Heimatstadt Zagreb ist. Da kann ich an den Wochenenden vielleicht auch [33] nach Hause fahren.\n\nNun aber zu meiner Person: Ich bin 24 Jahre alt und habe in der Schule vier Jahre lang Deutsch gelernt. Ich kann zwar [34] ganz gut schreiben, [35] ich habe immer wieder Probleme beim freien Sprechen. Im Herbst möchte ich in Hamburg ein Studium beginnen, für das ich ebenfalls gute Deutschkenntnisse brauche.\n\nAm liebsten wäre mir ein vierwöchiger Deutschkurs, [36] nur vormittags stattfindet, [37] ich nachmittags etwas anderes machen kann. Ich hätte den ganzen August bis Mitte September Zeit.\n\n[38] Sie einen passenden Kurs für mich haben, schicken Sie mir bitte so bald [39] möglich nähere Informationen zu. Mich interessieren auch Ihre Freizeitprogramme, Spezialkurse, die Unterkunftsmöglichkeiten und natürlich die Preise.\n\nBitte empfehlen Sie mir auch ein [40] gute Webseiten über Klagenfurt und den Wörthersee.\n\nVielen Dank im Voraus und freundliche Grüße\nIvica Palić", "words": {"a": "aber", "b": "damit", "c": "der", "d": "in", "e": "manchmal", "f": "mit", "g": "paar", "h": "schon", "i": "sehr", "j": "trotz", "k": "wann", "l": "weil", "m": "wenn", "n": "wie", "o": "zu"}, "key": ["d", "l", "e", "h", "a", "c", "b", "m", "n", "g"], "why": ["'in den Sommerferien' – in + dative for time.", "'weil' gives the reason; verb at the end (ist).", "'manchmal' = sometimes.", "'schon ganz gut' = already quite well.", "'zwar … aber' = it is true … but.", "Relative pronoun, masculine nominative (der Kurs) → der.", "'damit' = so that (purpose clause).", "'Wenn Sie … haben' – condition.", "'so bald wie möglich' = as soon as possible.", "'ein paar' = a few."]}, "hoeren1": [{"n": 41, "s": "Die Sprecherin wäre lieber ein Einzelkind.", "a": "f", "t": "Ich hatte nie das Gefühl, dass ich lieber ein Einzelkind gewesen wäre. Meine Schwester war zwar manchmal nervig, aber ich konnte immer mit ihr reden. Alleine hätte ich mich oft gelangweilt. Deshalb bin ich froh, dass ich eine Schwester habe.", "e": "She never wanted to be an only child."}, {"n": 42, "s": "Der Sprecher hat heute ein gutes Verhältnis zu seinem Bruder.", "a": "r", "t": "Früher hatten mein Bruder und ich oft Streit, aber heute verstehen wir uns sehr gut. Wir telefonieren regelmäßig und besuchen uns, wenn wir Zeit haben. Unser Verhältnis ist heute wirklich stark und ehrlich.", "e": "'früher Streit, aber heute verstehen wir uns sehr gut' – trap: früher."}, {"n": 43, "s": "Die Sprecherin würde heute gern noch eine Schwester haben.", "a": "f", "t": "Ich bin mit zwei Schwestern aufgewachsen, und ehrlich gesagt möchte ich keine weitere Schwester haben. Wir sind genug, um Spaß zu haben, aber mehr wäre mir zu viel. Ich bin mit meiner Familie zufrieden, so wie sie ist.", "e": "'ich möchte keine weitere Schwester haben.'"}, {"n": 44, "s": "Die Sprecherin hat schon früh lernen müssen, dass man im Zusammenleben viel Rücksicht nehmen muss.", "a": "r", "t": "Ich habe schon früh verstanden, dass man Rücksicht nehmen muss, wenn man mit anderen zusammenlebt. Besonders mit meinen Geschwistern musste ich oft teilen und Kompromisse machen. Das hat mir später im Leben sehr geholfen.", "e": "'schon früh verstanden, dass man Rücksicht nehmen muss'."}, {"n": 45, "s": "Die Sprecherin versteht sich sehr gut mit ihrem Bruder.", "a": "r", "t": "Meine Beziehung zu meinem Bruder ist sehr gut. Wir reden oft, verstehen uns in vielen Dingen und können zusammen lachen. Natürlich gibt es ab und zu Meinungsverschiedenheiten, aber im Großen und Ganzen haben wir ein sehr harmonisches Verhältnis.", "e": "'ein sehr harmonisches Verhältnis'."}], "hoeren2": {"intro": "Im Radio spricht ein Moderator mit der Lehrerin Frau Lehmann über die geplante Klassenfahrt ihrer Klasse.", "speakers": ["Moderator", "Frau Lehmann"], "lines": [["A", "Guten Tag und herzlich willkommen! Unser Thema ist die bevorstehende Klassenfahrt. Zu Gast ist Frau Lehmann, die Klassenlehrerin und Organisatorin der Reise. Frau Lehmann, wohin genau geht die Klassenfahrt?"], ["B", "Vielen Dank für die Einladung. Viele denken, wir fahren an die Nordsee, aber das stimmt nicht. Unser Ziel ist ein wunderschönes Gebiet in den Bergen. Dort haben wir viele Aktivitäten im Freien geplant."], ["A", "Es gab offenbar Probleme bei der Kommunikation. Herr Kühne sagt, er habe Ihren Brief nicht bekommen. Stimmt das?"], ["B", "Ja, das ist richtig. Obwohl die Briefe an alle Eltern verschickt wurden, ist sein Brief anscheinend nicht angekommen. Wir kümmern uns darum."], ["A", "Wann beginnt die Klassenfahrt? Stimmt es, dass die Reise an einem Samstag startet?"], ["B", "Das ist ein Missverständnis. Wir fahren schon am Freitag früh los, damit wir mehr Zeit am Ziel haben."], ["A", "Ein weiteres Thema betrifft Herrn Kühnes Sohn Martin. Stimmt es, dass ihm bei Busfahrten oft schlecht wird?"], ["B", "Ja, das ist korrekt. Martin hat Probleme bei längeren Fahrten. Wir sorgen dafür, dass er vorne sitzt und dass wir regelmäßig Pausen machen."], ["A", "Die Schüler fahren auch mit dem Schiff. Wie lange dauert die Überfahrt?"], ["B", "Das ist eine Fehlinformation. Es gibt keine Schiffsfahrt. Die ganze Anreise erfolgt mit dem Bus."], ["A", "Und die Unterkunft? Wohnen die Schüler in einem Hotel?"], ["B", "Nein. Wir haben uns bewusst gegen ein Hotel entschieden. Die Schüler übernachten in einer Jugendherberge, die besser für Gruppen geeignet ist."], ["A", "Begleitet nur eine Lehrkraft die Klasse?"], ["B", "Nein, die Klassenfahrt wird von einer Lehrerin und einem Lehrer betreut. Wir sind beide jederzeit für die Schüler da."], ["A", "Wie viel Taschengeld empfehlen Sie?"], ["B", "Damit es fair für alle ist, empfehle ich, dass die Kinder nicht mehr als 50 Euro mitnehmen. Das reicht für kleine Ausgaben völlig aus."], ["A", "Katerina ist in einer besonderen Situation. Welche Möglichkeiten hat sie?"], ["B", "Sie kann entweder an der Klassenfahrt teilnehmen oder in dieser Woche in eine andere Klasse gehen. Das entscheiden sie und ihre Eltern."], ["A", "Letzte Frage: Wie ist das mit dem Rauchen auf der Klassenfahrt?"], ["B", "Rauchen ist während der ganzen Reise streng verboten – auch mit einer Erlaubnis der Eltern."], ["A", "Vielen Dank, Frau Lehmann, und eine schöne Reise!"], ["B", "Danke! Ich bin sicher, dass es für alle ein unvergessliches Erlebnis wird."]], "items": [{"n": 46, "s": "Die Lehrerin fährt mit ihrer Klasse an die Nordsee.", "a": "f", "e": "'Viele denken, wir fahren an die Nordsee, aber das stimmt nicht … in den Bergen.'"}, {"n": 47, "s": "Herr Kühne hat den Brief der Lehrerin nicht erhalten.", "a": "r", "e": "'sein Brief ist anscheinend nicht angekommen.'"}, {"n": 48, "s": "Die Klassenfahrt beginnt an einem Samstag.", "a": "f", "e": "'Wir fahren schon am Freitag früh los.'"}, {"n": 49, "s": "Herrn Kühnes Sohn Martin wird bei Busfahrten oft schlecht.", "a": "r", "e": "'Ja, das ist korrekt. Martin hat Probleme bei längeren Fahrten.'"}, {"n": 50, "s": "Die Fahrt mit dem Schiff dauert fünf bis sechs Stunden.", "a": "f", "e": "'Es gibt keine Schiffsfahrt.'"}, {"n": 51, "s": "Das Haus, in dem die Schüler wohnen, gehört zu einem Hotel.", "a": "f", "e": "'in einer Jugendherberge' – not a hotel."}, {"n": 52, "s": "Die Klassenfahrt wird von einer Lehrerin und einem Lehrer geleitet.", "a": "r", "e": "'von einer Lehrerin und einem Lehrer betreut.'"}, {"n": 53, "s": "Die Lehrerin empfiehlt, dass die Kinder nicht mehr als 50 Euro Taschengeld mitnehmen.", "a": "r", "e": "'nicht mehr als 50 Euro mitnehmen.'"}, {"n": 54, "s": "Katerina kann entweder mitfahren oder in eine andere Klasse gehen.", "a": "r", "e": "'Sie kann entweder an der Klassenfahrt teilnehmen oder … in eine andere Klasse gehen.'"}, {"n": 55, "s": "Auf der Klassenfahrt darf nur mit Erlaubnis der Eltern geraucht werden.", "a": "f", "e": "'streng verboten – auch mit einer Erlaubnis der Eltern.'"}]}, "hoeren3": [{"n": 56, "s": "Sie müssen in Ingolstadt die Regionalbahn nach Regensburg nehmen.", "a": "f", "t": "Achtung, eine Durchsage: Die Regionalbahn nach Regensburg fällt heute wegen Bauarbeiten aus. Fahrgäste werden gebeten, ab Ingolstadt in den Ersatzbus umzusteigen. Weitere Informationen erhalten Sie am Bahnhof oder auf der Internetseite der Deutschen Bahn.", "e": "The train is cancelled – you take a replacement bus."}, {"n": 57, "s": "Clara kann wegen einer Prüfung die Theaterkarten nicht abholen.", "a": "f", "t": "Hallo, hier ist Clara. Ich bin total aufgeregt! Eine berühmte Theatergruppe ist in der Stadt, und ich habe gestern noch Karten bekommen. Obwohl ich heute eine Prüfung habe, habe ich sie gleich abgeholt. Das wollte ich nicht verpassen!", "e": "Despite the exam ('obwohl') she already got the tickets."}, {"n": 58, "s": "Im Schwarzwald können die Straßen morgen glatt werden.", "a": "r", "t": "Der Deutsche Wetterdienst warnt vor Glätte im Schwarzwald. Morgen in den frühen Morgenstunden kann es in höheren Lagen zu Straßenglätte kommen. Autofahrer sollten vorsichtig fahren und mehr Zeit einplanen.", "e": "'Glättegefahr im Schwarzwald … morgen früh'."}, {"n": 59, "s": "Der Liederabend findet zu einem späteren Termin statt.", "a": "r", "t": "Der für heute geplante Liederabend wurde verschoben. Die Veranstaltung findet nun am kommenden Freitag statt. Grund ist eine Erkrankung der Sängerin. Bereits gekaufte Karten bleiben gültig oder können zurückgegeben werden.", "e": "Moved to next Friday."}, {"n": 60, "s": "Im Untergeschoss gibt es Winterkleidung zum halben Preis.", "a": "f", "t": "Liebe Kundinnen und Kunden, im Untergeschoss gibt es zurzeit noch keine Preisreduzierungen auf Winterkleidung. Die angekündigten Rabatte starten erst nächste Woche. Bitte fragen Sie unsere Verkäuferinnen nach den genauen Terminen.", "e": "There are no reductions yet – they start only next week."}], "schreiben": {"letter": "Liebe(r) …,\n\nich hoffe, dir geht's gut. Stell dir vor, bei mir gibt es Neuigkeiten! Du weißt doch, dass wir schon lange von einem Garten geträumt haben. Jetzt haben wir endlich einen am Stadtrand gefunden. Da er sehr groß ist, wollte ich dich fragen, ob du nicht Lust hast, den Garten mit uns zu teilen.\n\nDie Miete ist gar nicht so hoch. Du könntest dort Salat und Gemüse anpflanzen, natürlich auch Blumen, ganz wie du willst. Es gibt auch Obstbäume und eine große Wiese, auf der man sich einfach hinlegen kann, und wir könnten im Garten auch grillen. Was denkst du? Wäre das nicht toll?\n\nAntworte mir bald.\n\nAlles Liebe\ndeine Nadja", "task": "Antworten Sie auf den Brief. Schreiben Sie etwas zu den folgenden vier Punkten.", "points": ["Reaktion auf den Vorschlag", "Fragen zum Garten", "Weg zum Garten", "Was es bei Ihnen Neues gibt"], "model": "Damaskus, 17.10.2026\n\nLiebe Nadja,\n\nvielen Dank für deinen lieben Brief! Herzlichen Glückwunsch zu eurem Garten – das ist ja eine tolle Nachricht.\n\nDein Vorschlag gefällt mir sehr gut. Ich habe schon immer davon geträumt, eigenes Gemüse anzupflanzen. Ich mache sehr gern mit!\n\nAber ich habe noch ein paar Fragen: Wie viel müsste ich im Monat für die Miete bezahlen? Gibt es im Garten Wasser und eine kleine Hütte für die Werkzeuge?\n\nWie komme ich am besten zum Garten? Ich habe leider kein Auto. Fährt dorthin ein Bus, oder kann ich mit dem Fahrrad fahren? Vielleicht kannst du mich am ersten Tag abholen.\n\nBei mir gibt es auch Neuigkeiten: Ich habe eine neue Arbeit in einem Hotel gefunden und mache jetzt abends einen Deutschkurs.\n\nIch freue mich schon auf unseren ersten Grillabend im Garten!\n\nAlles Liebe\ndeine Rana", "phrases": ["Dein Vorschlag gefällt mir sehr gut.", "Ich mache sehr gern mit!", "Ich habe noch ein paar Fragen:", "Wie komme ich am besten zum Garten?", "Bei mir gibt es auch Neuigkeiten:", "Ich freue mich schon auf …"]}, "vocab": [["bearbeiten", "to edit"], ["die Anmeldung, -en", "registration"], ["genießen", "to enjoy"], ["sich treffen mit + Dat.", "to meet"], ["entspannen", "to relax"], ["die Begegnung, -en", "encounter"], ["zur Verfügung stehen", "to be available"], ["das Rezept, -e", "recipe"], ["die Messe, -n", "trade fair"], ["ausprobieren", "to try out"], ["das Vorurteil, -e", "prejudice"], ["sich bestätigen", "to be confirmed"], ["plaudern", "to chat"], ["der Gründer, -", "founder"], ["stolz sein auf + Akk.", "to be proud of"], ["sich entschließen", "to decide"], ["gehören + Dat.", "to belong to"], ["zufrieden", "satisfied"], ["die Kraft, Kräfte", "strength"], ["sich kümmern um + Akk.", "to take care of"], ["leiden an + Dat.", "to suffer from"], ["zunehmen (nimmt zu)", "to increase"], ["erreichbar", "reachable"], ["unabhängig von + Dat.", "independent of"], ["die Grenze, -n", "border, boundary"], ["abschalten", "to switch off, relax"], ["der Rat", "advice"], ["der Termin, -e", "appointment"], ["die Spezialität, -en", "speciality"], ["sich verabreden", "to arrange to meet"], ["übernachten", "to stay overnight"], ["mieten", "to rent"], ["der Lärm", "noise"], ["sich verschlechtern", "to get worse"], ["verbessern", "to improve"], ["die Heimatstadt, -städte", "home town"], ["stattfinden", "to take place"], ["die Unterkunft, -künfte", "accommodation"], ["empfehlen", "to recommend"], ["das Einzelkind, -er", "only child"], ["das Verhältnis, -se", "relationship"], ["Rücksicht nehmen auf + Akk.", "to be considerate of"], ["sich verstehen mit + Dat.", "to get on with"], ["die Klassenfahrt, -en", "school trip"], ["die Jugendherberge, -n", "youth hostel"], ["das Taschengeld", "pocket money"], ["die Erlaubnis", "permission"], ["verboten", "forbidden"], ["ausfallen", "to be cancelled"], ["der Ersatzbus, -se", "replacement bus"], ["glatt", "slippery"], ["verschieben", "to postpone"], ["die Preisreduzierung, -en", "price reduction"], ["teilen", "to share"], ["anpflanzen", "to plant"], ["die Wiese, -n", "meadow"]], "grammar": ["in + Dativ (location/time): in Ihrem Haus, in den Sommerferien", "Perfekt of reflexive verbs: hat sich verschlechtert", "hören + Akkusativ: den Lärm", "Relative pronouns: die Parkplätze, die … / ein Kurs, der …", "etwas geöffnet haben", "man + 3rd person singular", "weil (reason) vs. damit (purpose) – verb at the end", "zwar … aber", "wenn-clauses (condition)", "so bald wie möglich", "ein paar + plural noun"]}, {"n": 5, "title": "Computer · Krapfenbauer · Frau Thoma", "lesen1": {"headlines": {"a": "Sportkurse für ältere Menschen", "b": "Für Jugendliche ist der Computer etwas Alltägliches", "c": "Das Interesse am Handel über Internet nimmt stark ab", "d": "Arbeiten am Computer verursacht häufig Rückenschmerzen", "e": "Internetnutzer machen viele Dinge gleichzeitig", "f": "Firmen müssen auch über Internet für Produkte werben", "g": "Auch Freizeitsportarten sollten trainiert werden", "h": "Was man gegen Rückenschmerzen tun kann", "i": "Kinder wollen mit dem Computer nur spielen", "j": "Internetnutzer interessieren sich nicht fürs Fernsehen"}, "texts": ["Falsche Körperhaltung, mangelnde Bewegung und psychische Faktoren sind meistens die Hauptfaktoren für Rückenschmerzen. Hier finden Sie ein ganzheitliches Trainingsprogramm, das hilft: Alle Übungen lassen sich im Alltag gut umsetzen und sind auch bei Vorschäden der Wirbelsäule durchführbar. Mit speziellem Entspannungstraining. 114 Seiten, durchgehend Farbabbildungen, 18 × 25 cm, gebunden.", "Der Computer gehört heute wie selbstverständlich ins Jugendzimmer – wie früher die Modelleisenbahn oder die Barbie-Puppe. Was aber genau treiben die Kids mit den hochgerüsteten Rechenmaschinen auf dem Schreibtisch? Das wollte die Jugendzeitschrift Bravo wissen. Selbstverständlich spielen sie, aber sie machen auch andere, nützlichere Dinge wie Texte schreiben oder Hausaufgaben für die Schule erledigen, Tabellen erstellen – und natürlich im Internet herumsurfen.", "Inline-Skating ist ein idealer Ausdauersport – nicht nur für die jüngere Generation. Das haben jetzt Untersuchungen am Institut für Sportwissenschaften an der Universität Frankfurt bestätigt. Danach trainiert Inline-Skating das Herz-Kreislauf-System, beansprucht die wichtigsten Muskelgruppen und fördert die Koordination. Die Faszination dieser rasanten Freizeitsportart wirke generationenübergreifend und erfasse die Jungen wie die Alten, sagt Dr. Hans Jürgen Ahrens. Allerdings fragt der Arzt kritisch, warum jeder Skifahrer, Windsurfer oder Tennisspieler zu Beginn Trainingsstunden bei einem Profi belege, oft aber nicht der Inliner. Dabei lässt sich das Verletzungsrisiko durch regelmäßiges Fahrtraining deutlich verringern. In einem Kurs sollten die wichtigsten Sturz-, Brems- und Fahrtechniken erlernt werden.", "Eine Studie der Fernsehgesellschaften ARD und ZDF besagt, dass deutsche Internetnutzer sich auch mit anderen Dingen beschäftigen, wenn sie im Internet sind. Ein Großteil der beobachteten Personen telefoniert beim Surfen, hört nebenbei Musik oder arbeitet mit anderen Computerprogrammen. Aber auch Konkurrenzmedien wie Fernsehen und Zeitschriften finden große Aufmerksamkeit, während im Internet nach Informationen gesucht wird.", "Geschäfte über das Internet werden in Deutschland auch in Zukunft Milliarden Euro einbringen. In spätestens zwei Jahren werden 20 Prozent aller europäischen Geschäfte über das Internet abgewickelt, sagen die Fachleute. Heutzutage ist es kaum vorstellbar, dass ein Unternehmen allein mit klassischen Verkaufsmethoden und ohne zusätzliches Online-Marketing erfolgreich sein wird. Wer heute nicht anfängt, diese Möglichkeiten zu nutzen, kann in Zukunft seine Kunden verlieren. Das Argument, dass die angebotene Ware sich ja auch ohne Internet gut verkaufe, stimmt so nicht mehr. Denn das Internet beeinflusst auch das Käuferverhalten auf der Straße."], "key": ["h", "b", "g", "e", "f"], "why": ["It is a book with a training programme that helps against back pain (h); trap d: the text is not about computers causing back pain.", "'Der Computer gehört wie selbstverständlich ins Jugendzimmer' = something everyday for teenagers (b); trap i: they do not ONLY play.", "Inline-skating is a 'Freizeitsportart' and the doctor says people should take a course/training (g); trap a: it is not about courses for old people.", "Users telephone, listen to music and use other programs while surfing = many things at the same time (e); trap j: they DO pay attention to TV.", "Without 'Online-Marketing' a company will lose customers, so firms must advertise online (f); trap c: internet trade is growing, not falling."]}, "lesen2": {"title": "Computerkurse sind schon für Kinder spannend", "text": "Schreiben, Rechnen, Programme installieren\n\nSchaden oder nützen Computer unseren Kindern? Das fragen sich viele Eltern. Ein Computerkurs-Veranstalter ist sich ganz sicher: Wenn man den Kindern beibringt, den Computer richtig einzusetzen, ist er sogar eine Lernhilfe. Seit fünf Jahren bietet Franz „Krapfi“ Krapfenbauer Computerkurse für Kinder zwischen sieben und vierzehn Jahren an und ist von seinen Schülern begeistert. Am liebsten würden die Kinder drei Stunden ohne Pause durcharbeiten. Und das, obwohl in seinen Kursen nicht gespielt wird, sondern der Computer als Lernhilfe genutzt wird. Im ersten Kurs lernen die Kinder den Umgang mit dem Betriebssystem und erste Grundzüge der Textverarbeitung.\n\nDas Geheimnis von Krapfenbauer: „Ich erkläre die Programme in der Sprache der Kinder und langweile sie nicht mit technischen Details.“ Sein Talent entdeckte er, als sich seine eigenen Kinder für den PC zu interessieren begannen. Seine Tochter brachte immer mehr Mitschüler zum sonntäglichen PC-Training mit, bis eines Tages klar war: Das muss auf professionelle Beine gestellt werden.\n\nDas Schwierigste war, einen passenden und vor allem kostengünstigen Raum zu finden, denn Geld brachten die Kinderkurse am Anfang sehr wenig ein. Ein Bekannter, der Direktor eines Hotels ist, hatte schließlich die passende Lösung: Die Schulungsräume im Hotel stehen den Kindern nun an den Wochenenden zur Verfügung.\n\nAllgemein rät Krapfenbauer, Kinder so früh wie möglich an den Computer zu lassen, allerdings nur unter Aufsicht und mit den richtigen Programmen. „Beim Computer ist es wie beim Fernseher: Wenn man ihn als Kindermädchen einsetzt, ohne sich darum zu kümmern, was die Kinder damit machen, kann das negative Folgen haben.“ Schon für drei- bis vierjährige Kinder gebe es sehr gute Spielprogramme, die mit Vorschulaufgaben vergleichbar seien.\n\nGerade in der Zeit nach Weihnachten haben Krapfis Kindercomputerkurse Hochsaison. Viele Eltern haben einen Computer unter den Christbaum gestellt und wollen jetzt, dass ihre Kinder frühzeitig damit umgehen lernen. Wobei der Seminarleiter für manche Eltern sogar zu viel Wissen weitergibt: „Einige Eltern haben sich schon beschwert, weil ihre Kinder jetzt Hausaufgaben am Computer lösen.“ Die manchmal befürchtete Überforderung der Kinder hat Krapfenbauer noch nicht erlebt. Ganz im Gegenteil, die Kleinen sind oft gar nicht zu stoppen, wenn sie wieder etwas Neues gelernt haben. Viele Teilnehmer kommen dann auch gern zu den nächsten Kursen. Zeichenprogramme oder Spiele kommen in den Computerkursen höchstens als Belohnung am Rande vor.\n\nDas größte Hindernis auf dem Weg zum Computerexperten ist für die Kinder in manchen Fällen die negative Einstellung der Eltern. „Die Erwachsenen kennen oft nur die komplizierten Datenbankanwendungen und Programme aus dem Büro und können sich gar nicht vorstellen, was man mit dem Computer noch alles machen kann“, bedauert Krapfenbauer. Natürlich wirkt sich diese negative Grundeinstellung auch auf die Kinder aus. Überraschenderweise sind es dann oft die Großeltern, die für Computerkurse das Geld geben, damit ihre Enkelkinder mit dem PC richtig umgehen lernen.\n\nInformation und Anmeldung: Tel. 0664 / 33 33 14, E-Mail: Krapfi@aon.at", "note": "reconstructed (question options; stems partly from the book)", "q": [{"n": 6, "stem": "In den Computerkursen von Franz Krapfenbauer", "opts": {"a": "spielen die Kinder vor allem Computerspiele.", "b": "lernen die Kinder hauptsächlich technische Details.", "c": "wird der Computer als Lernhilfe benutzt."}, "key": "c", "why": "'in seinen Kursen nicht gespielt wird, sondern der Computer als Lernhilfe genutzt wird' – games only as a reward; he does NOT bore them with technical details."}, {"n": 7, "stem": "Am Anfang war es für Franz Krapfenbauer schwierig,", "opts": {"a": "einen günstigen Kursraum zu finden.", "b": "genug Kinder für seine Kurse zu finden.", "c": "die Programme kindgerecht zu erklären."}, "key": "a", "why": "'Das Schwierigste war, einen passenden und vor allem kostengünstigen Raum zu finden.'"}, {"n": 8, "stem": "Herr Krapfenbauer meint,", "opts": {"a": "Kinder sollten schon früh, aber unter Aufsicht, an den Computer.", "b": "Kinder unter sieben Jahren sollten nicht am Computer sitzen.", "c": "der Computer kann wie ein Kindermädchen eingesetzt werden."}, "key": "a", "why": "'Kinder so früh wie möglich an den Computer zu lassen, allerdings nur unter Aufsicht' – using it as a babysitter has negative effects."}, {"n": 9, "stem": "Viele Kinder", "opts": {"a": "sind nach drei Stunden Kurs überfordert.", "b": "möchten nach dem ersten Kurs weitere Kurse besuchen.", "c": "machen ihre Hausaufgaben nicht mehr."}, "key": "b", "why": "'Viele Teilnehmer kommen dann auch gern zu den nächsten Kursen.' He has never seen children overtaxed (Überforderung)."}, {"n": 10, "stem": "Franz Krapfenbauer erzählt,", "opts": {"a": "dass oft die Großeltern die Kurse bezahlen.", "b": "dass die Eltern seine Kurse immer positiv finden.", "c": "dass die Eltern die Computerprogramme aus dem Büro gut erklären können."}, "key": "a", "why": "'Überraschenderweise sind es dann oft die Großeltern, die für Computerkurse das Geld geben.' Many parents have a negative attitude."}]}, "lesen3": {"note": "reconstructed (all ads missing in the book; built to match the key)", "situations": ["Sie suchen für Ihren 5-jährigen Sohn einen Skikurs.", "Sie möchten am Wochenende in den Zoo gehen.", "Sie suchen eine Zeitschrift für Ihre Freundin, die sich für Mode interessiert.", "Ihre Bekannte sucht einen Job in einem Modegeschäft.", "Sie möchten Ihre Freunde am Montagabend in den Zirkus einladen.", "Ihre 10-jährige Tochter möchte sich gern einen Tierfilm ansehen.", "Sie möchten für Ihre Familie billige Winterkleidung kaufen.", "Sie möchten einen Skikurs machen und sich dafür Skier leihen.", "Sie machen in Österreich Urlaub und möchten sich einen Film im englischen Original ansehen.", "Sie interessieren sich für Tiere und möchten ihnen helfen."], "ads": {"a": "Zirkus Roncalli – Gastspiel auf der Festwiese! Vorstellungen Dienstag bis Sonntag, 15 und 19.30 Uhr. Montag Ruhetag. Karten an der Zirkuskasse.", "b": "Skischule Alpenblick – Kurse für Anfänger und Fortgeschrittene ab 16 Jahren. Verleih von Skiern, Schuhen und Stöcken direkt an der Talstation. Anmeldung täglich ab 8 Uhr.", "c": "NEU am Kiosk: „Trend & Style“ – die Zeitschrift für alle, die Mode lieben. Die neuesten Kollektionen, Styling-Tipps und Interviews mit Designern. Jeden Monat nur 3,50 €.", "d": "Bambini-Skikurs: Die Skischule Schneefloh bietet spielerische Skikurse für Kinder von 4 bis 7 Jahren. Kleine Gruppen, erfahrene Skilehrer, Kinderland mit Zauberteppich.", "e": "Tierpark Hellabrunn – über 700 Tierarten! Geöffnet täglich, auch samstags und sonntags, von 9 bis 18 Uhr. Am Wochenende Fütterungen mit Erklärungen.", "f": "Winter-Mode für die ganze Familie! Neue Kollektion: Mäntel, Jacken und Stiefel von Top-Marken. Exklusive Qualität – exklusive Beratung. Modehaus Lindner.", "g": "Kino am Ring: „Die Reise der Pinguine“ – der neue Tierfilm in deutscher Fassung. Nur für Erwachsene: Spätvorstellung um 22.30 Uhr. Freigegeben ab 16 Jahren.", "h": "Tierschutzverein sucht Helferinnen und Helfer! Wer hat Zeit, mit unseren Hunden spazieren zu gehen oder im Tierheim mitzuhelfen? Jede Hilfe ist willkommen. Tel. 089/55 21 34.", "i": "Kino Metropol, Innsbruck: Alle Filme in deutscher Sprache – jeden Dienstag Kinotag mit ermäßigten Preisen.", "j": "Kinderkino im Filmcasino: „Mein Freund, der Delfin“ – ein spannender Tierfilm für Kinder ab 8 Jahren. Samstag und Sonntag um 14 Uhr.", "k": "Modeboutique Chic sucht ab sofort eine freundliche Verkäuferin (Teilzeit). Erfahrung im Verkauf erwünscht. Bewerbungen bitte an Boutique Chic, Hauptstraße 12.", "l": "Sportgeschäft Huber: Skier, Snowboards und Skibekleidung zu Top-Preisen. Großer Ausverkauf nur für Sportartikel – keine Alltagskleidung."}, "key": ["d", "e", "c", "k", "x", "j", "x", "b", "x", "h"], "why": ["Ad d: ski course for children from 4 to 7 years.", "Ad e: the zoo (Tierpark) is open on Saturdays and Sundays.", "Ad c: a fashion magazine.", "Ad k: a fashion boutique is looking for a saleswoman.", "x – the circus (a) is closed on Mondays ('Montag Ruhetag').", "Ad j: animal film for children from 8 years; ad g is only from 16.", "x – ad f sells exclusive (expensive) clothes and ad l only sports articles; nothing cheap.", "Ad b: ski course for adults with ski rental ('Verleih').", "x – the cinema in Innsbruck (i) shows all films in German.", "Ad h: the animal protection society looks for helpers."]}, "sprach1": {"note": "options partly reconstructed (OCR lost several options; correct words from the key)", "text": "Genuss mit Kaffee Partner\n\nSehr geehrte Frau Thoma,\n\nschade, [21] Sie bisher noch nicht Kunde bei Kaffee Partner [22]. Vielleicht liegt das an uns, weil wir [23] nicht das richtige Angebot gemacht haben, seit wir uns vor einiger Zeit in Köln auf der ANUGA, der großen Messe für Nahrung und Genussmittel, [24] haben. Wir [25] das jetzt mit dem aktuellen Katalog nachholen, den Sie heute erhalten.\n\nSie [26] darin viele nützliche und attraktive Dinge rund um das Thema Kaffee und Trinkwasser [27] Mitarbeiter und Besucher. Aber auch Tee, kleine Leckereien und nette Kalender für Büro und Zuhause [28] Ihnen unser Geschenkkatalog.\n\nViel Spaß beim Blättern und Aussuchen. Wir freuen [29] auf Sie!\n\n[30] Grüße aus Wallenhorst\nIhr Kaffee Partner-Team\nManfred Pflüger", "q": [{"n": 21, "opts": {"a": "dass", "b": "darum", "c": "weil"}, "key": "b", "why": "The book's key gives 'darum' here (in standard German 'dass' would also be expected after 'schade,')."}, {"n": 22, "opts": {"a": "seid", "b": "sein", "c": "sind"}, "key": "c", "why": "Polite 'Sie' takes the verb form 'sind'; in a subordinate clause the verb goes to the end."}, {"n": 23, "opts": {"a": "Sie", "b": "Ihnen", "c": "Ihr"}, "key": "b", "why": "'jemandem ein Angebot machen' takes the dative: Ihnen."}, {"n": 24, "opts": {"a": "kennen gelernt", "b": "kennen lernen", "c": "kennen lernte"}, "key": "a", "why": "Perfect tense with 'haben' needs the participle: kennen gelernt haben."}, {"n": 25, "opts": {"a": "mögen", "b": "möchten", "c": "mochten"}, "key": "b", "why": "'möchten' + infinitive (nachholen) = polite wish in the present."}, {"n": 26, "opts": {"a": "findet", "b": "finden", "c": "fanden"}, "key": "b", "why": "Subject 'Sie' (polite) → 'finden', present tense."}, {"n": 27, "opts": {"a": "für", "b": "von", "c": "wegen"}, "key": "b", "why": "The book's key gives 'von' (things for/from employees and visitors); follow the key."}, {"n": 28, "opts": {"a": "zeigen", "b": "zeigte", "c": "zeigt"}, "key": "c", "why": "The subject is 'unser Geschenkkatalog' (singular) → 'zeigt', present tense."}, {"n": 29, "opts": {"a": "sich", "b": "euch", "c": "uns"}, "key": "c", "why": "Reflexive verb 'sich freuen auf': wir freuen uns."}, {"n": 30, "opts": {"a": "Freundlich", "b": "Freundliche", "c": "Freundlichen"}, "key": "b", "why": "Adjective without article, plural nominative: freundliche Grüße."}]}, "sprach2": {"text": "Sehr geehrte Damen und Herren,\n\nmit großem Interesse und auch mit Hoffnung habe ich Ihre Anzeige gelesen. Leider [31] ich Sie im Moment nicht anrufen, da das Telefon immer belegt ist. [32] schreibe ich Ihnen diese Mail. Mein Sohn Matthias macht [33] zwei Jahren sein Abitur, [34] seine Leistungen sind zurzeit nicht so gut. Ich mache [35] vor allem bei den Fächern Physik und Mathematik große Sorgen. Matthias ist nicht dumm, aber er ist etwas faul und denkt, er brauche [36] Fächer nicht.\n\nFragen wollte ich nun, [37] es bei Ihnen auch individuelle Physik- und Mathematiknachhilfe gibt. Und [38] finden die Stunden statt? Am späten Nachmittag oder am frühen Abend? Mir wäre es jedenfalls sehr wichtig, dass Sie meinem Sohn helfen [39].\n\nAb 19.30 Uhr bin ich telefonisch [40] der Nummer 0428-1734 zu erreichen.\n\nMit freundlichen Grüßen\nJosef Martinell", "words": {"a": "ABER", "b": "DARF", "c": "DASS", "d": "DESHALB", "e": "DIESE", "f": "IN", "g": "KANN", "h": "KÖNNTEN", "i": "MICH", "j": "MIR", "k": "OB", "l": "OBWOHL", "m": "UNTER", "n": "VOR", "o": "WANN"}, "key": ["g", "d", "f", "a", "j", "e", "k", "o", "h", "m"], "why": ["Modal verb in position 2: 'Leider kann ich Sie nicht anrufen.'", "'Deshalb' = that is why; verb follows directly: 'Deshalb schreibe ich'.", "Future time span: 'in zwei Jahren'.", "'aber' connects two main clauses with contrast (no change in word order).", "'sich Sorgen machen' – the reflexive pronoun is dative here: Ich mache mir Sorgen.", "'diese Fächer' – demonstrative before a plural noun.", "Indirect yes/no question: 'fragen, ob ...'.", "W-question about time: 'Wann finden die Stunden statt?'", "Polite subjunctive at the end of the dass-clause: 'helfen könnten'.", "Fixed expression: 'unter der Nummer ... erreichen'."]}, "hoeren1": [{"n": 41, "s": "Der Sprecher interessiert sich mehr für Sport als für Kultur.", "a": "r", "t": "Sport spielt eine viel größere Rolle in meinem Leben als Kultur. Ich treibe regelmäßig Sport, weil es mir hilft, fit zu bleiben und Stress abzubauen. Natürlich schätze ich kulturelle Veranstaltungen, aber sie sind für mich nicht so wichtig wie körperliche Aktivität. Ohne Sport würde mir etwas fehlen.", "e": "'Sport spielt eine viel größere Rolle ... als Kultur' – true."}, {"n": 42, "s": "Die Sprecherin geht so oft sie kann ins Theater.", "a": "r", "t": "Sobald sich die Gelegenheit ergibt, besuche ich eine Theateraufführung. Ich genieße es, verschiedene Inszenierungen zu erleben und mich von den Geschichten fesseln zu lassen. Theater ist für mich eine der schönsten Formen der Kunst, weil es lebendig ist. Wenn ich mehr Zeit hätte, würde ich noch häufiger hingehen.", "e": "'Sobald sich die Gelegenheit ergibt' = whenever she can – true."}, {"n": 43, "s": "Der Sprecher hört besonders gern moderne Musik.", "a": "f", "t": "Ehrlich gesagt kann ich mit moderner Musik wenig anfangen. Viele Lieder klingen für mich gleich und haben keine wirkliche Tiefe. Ich bevorzuge klassische Musik oder Jazz, weil sie mir mehr Emotionen vermitteln. Elektronische Beats oder Mainstream-Pop empfinde ich oft als oberflächlich und monoton.", "e": "He prefers classical music and jazz; 'mit moderner Musik wenig anfangen' – false."}, {"n": 44, "s": "Die Sprecherin geht oft in Kunstausstellungen.", "a": "f", "t": "Kunstausstellungen besuche ich nur selten. Natürlich ist Kunst wichtig, aber ich habe nie wirklich großes Interesse daran entwickelt. Oft verstehe ich die Werke nicht, oder sie sprechen mich einfach nicht an. Theater oder Musik sind für mich viel ansprechender, weil sie mich emotional mehr berühren.", "e": "'nur selten' = rarely, not often – false."}, {"n": 45, "s": "Die Sprecherin hätte gerne mehr Zeit für die Kultur.", "a": "r", "t": "Ich bedauere es sehr, dass ich nicht mehr Zeit für kulturelle Erlebnisse habe. Ich liebe es, mich mit Kunst, Musik und Literatur zu beschäftigen, aber mein Alltag lässt mir kaum Raum dafür. Wenn ich weniger Verpflichtungen hätte, würde ich auf jeden Fall öfter kulturelle Veranstaltungen besuchen.", "e": "'Ich bedauere es sehr, dass ich nicht mehr Zeit ... habe' – true."}], "hoeren2": {"intro": "Im Radio spricht ein Moderator mit Frau Lehmann, einer Lehrerin, über die geplante Klassenfahrt.", "speakers": ["Moderator", "Frau Lehmann"], "lines": [["A", "Guten Tag und herzlich willkommen zu unserer heutigen Sendung. Unser Thema ist die bevorstehende Klassenfahrt. Ich habe heute Frau Lehmann zu Gast, eine der Organisatorinnen dieser Reise. Schön, dass Sie da sind."], ["B", "Vielen Dank für die Einladung. Ich freue mich, über die Planung und alle wichtigen Details zu sprechen."], ["A", "Lassen Sie uns direkt einsteigen. Wohin genau führt die Klassenfahrt?"], ["B", "Viele denken, wir fahren an die Nordsee, aber das stimmt nicht. Unser Ziel ist ein wunderschönes Gebiet in den Bergen. Dort haben wir zahlreiche Aktivitäten im Freien geplant."], ["A", "Es gab anscheinend Unklarheiten bei der Kommunikation. Herr Kühne sagt, er habe den Brief der Lehrerin nicht bekommen. Können Sie das bestätigen?"], ["B", "Ja, das ist richtig. Obwohl die Briefe an alle Eltern verschickt wurden, ist sein Brief offenbar nicht angekommen. Wir kümmern uns darum."], ["A", "Wann genau beginnt die Klassenfahrt? Stimmt es, dass die Reise an einem Samstag startet?"], ["B", "Das ist ein weit verbreitetes Missverständnis. Tatsächlich starten wir schon am Freitag früh, damit wir mehr Zeit am Zielort haben und die Schüler sich besser einleben können."], ["A", "Ein weiteres Thema betrifft Herrn Kühnes Sohn Martin. Stimmt es, dass ihm bei Busfahrten oft schlecht wird?"], ["B", "Ja, das ist korrekt. Martin hat Probleme mit längeren Fahrten und leidet manchmal unter Reiseübelkeit. Wir sorgen dafür, dass er sich wohlfühlt und regelmäßig Pausen machen kann."], ["A", "Kommen wir zu einem weiteren Punkt. Die Schüler sind während der Fahrt auch mit dem Schiff unterwegs. Wie lange dauert diese Überfahrt?"], ["B", "Das ist eine Fehlinformation. Es gibt keine Schiffsfahrt. Die gesamte Anreise erfolgt mit dem Bus, da unser Ziel nicht mit dem Schiff erreichbar ist."], ["A", "Und wie sieht es mit der Unterkunft aus? Stimmt es, dass die Schüler in einem Hotel untergebracht sind?"], ["B", "Nein, das ist nicht korrekt. Wir haben uns bewusst gegen ein Hotel entschieden. Stattdessen übernachten die Schüler in einer Jugendherberge, die besser für Gruppen geeignet ist."], ["A", "Werden die Schüler nur von einer Lehrkraft begleitet, oder gibt es noch weitere Aufsichtspersonen?"], ["B", "Die Klassenfahrt wird von einer Lehrerin und einem Lehrer betreut. Beide sind für die Organisation verantwortlich und stehen den Schülern jederzeit zur Verfügung."], ["A", "Wie viel Taschengeld wird für die Reise empfohlen?"], ["B", "Tja, um eine faire Regelung für alle zu treffen, hat die Lehrerin empfohlen, dass die Schüler nicht mehr als 50 Euro mitnehmen. Dieser Betrag reicht für kleine Ausgaben während der Reise völlig aus."], ["A", "Katerina scheint in einer besonderen Situation zu sein. Welche Möglichkeiten hat sie?"], ["B", "Sie kann entweder an der Klassenfahrt teilnehmen oder in dieser Zeit in eine andere Klasse gehen. Die Entscheidung liegt bei ihr und ihren Eltern."], ["A", "Kommen wir zur letzten Frage. Wie wird das Thema Rauchen auf der Klassenfahrt gehandhabt?"], ["B", "Rauchen ist während der gesamten Reise streng verboten. Auch mit einer Erlaubnis der Eltern ist es nicht gestattet, da wir auf die Gesundheit aller Schüler achten müssen."], ["A", "Vielen Dank, Frau Lehmann, für diese ausführlichen Informationen. Ich wünsche Ihnen und Ihrer Klasse eine spannende Reise."], ["B", "Danke. Ich bin sicher, dass es für alle ein unvergessliches Erlebnis wird."]], "items": [{"n": 46, "s": "Die Lehrerin fährt mit ihrer Klasse an die Nordsee.", "a": "f", "e": "'Viele denken, wir fahren an die Nordsee, aber das stimmt nicht ... in den Bergen.'"}, {"n": 47, "s": "Herr Kühne hat den Brief der Lehrerin nicht erhalten.", "a": "r", "e": "'Ja, das ist richtig ... sein Brief ist offenbar nicht angekommen.'"}, {"n": 48, "s": "Die Klassenfahrt beginnt an einem Samstag.", "a": "f", "e": "'Tatsächlich starten wir schon am Freitag früh.'"}, {"n": 49, "s": "Herrn Kühnes Sohn Martin wird bei Busfahrten oft schlecht.", "a": "r", "e": "'Ja, das ist korrekt ... leidet manchmal unter Reiseübelkeit.'"}, {"n": 50, "s": "Die Fahrt mit dem Schiff dauert fünf bis sechs Stunden.", "a": "f", "e": "'Es gibt keine Schiffsfahrt.'"}, {"n": 51, "s": "Das Haus, in dem die Schüler wohnen, gehört zu einem Hotel.", "a": "f", "e": "'Stattdessen übernachten die Schüler in einer Jugendherberge.'"}, {"n": 52, "s": "Die Klassenfahrt wird von einer Lehrerin und einem Lehrer geleitet.", "a": "r", "e": "'Die Klassenfahrt wird von einer Lehrerin und einem Lehrer betreut.'"}, {"n": 53, "s": "Die Lehrerin empfiehlt, dass die Kinder nicht mehr als 50 Euro Taschengeld mitnehmen.", "a": "r", "e": "'... dass die Schüler nicht mehr als 50 Euro mitnehmen.'"}, {"n": 54, "s": "Katerina kann entweder mitfahren oder in eine andere Klasse gehen.", "a": "r", "e": "'Sie kann entweder ... teilnehmen oder ... in eine andere Klasse gehen.'"}, {"n": 55, "s": "Auf der Klassenfahrt darf nur mit Erlaubnis der Eltern geraucht werden.", "a": "f", "e": "'Auch mit einer Erlaubnis der Eltern ist es nicht gestattet.'"}]}, "hoeren3": [{"n": 56, "s": "Sie können mit dem Bus in die Innenstadt fahren.", "a": "r", "t": "Die Busverbindungen in die Innenstadt sind zuverlässig und gut ausgebaut. Dadurch kann man bequem und ohne Stress fahren, besonders zu den Stoßzeiten. Ich nutze den Bus regelmäßig, da ich mir die Parkplatzsuche ersparen möchte. Außerdem ist es umweltfreundlicher, als mit dem Auto zu fahren.", "e": "There are good bus connections into the city centre – true."}, {"n": 57, "s": "Sie können noch eine Stunde durch alle Geschäfte laufen.", "a": "f", "t": "Nein, die Geschäfte bleiben nicht eine Stunde länger geöffnet. Tatsächlich schließen viele Läden schon in wenigen Minuten. Wer noch etwas einkaufen möchte, muss sich beeilen. Ich finde es unpraktisch, dass die Öffnungszeiten nicht flexibler sind, vor allem für Berufstätige.", "e": "Shops close in a few minutes, not in one hour – false."}, {"n": 58, "s": "Dr. Krausch ist ab dem 18. Oktober wieder in der Praxis.", "a": "r", "t": "Dr. Krausch ist ab dem 18. Oktober wieder in seiner Praxis. Patienten, die dringend einen Termin brauchen, sollten sich frühzeitig anmelden. In letzter Zeit war es schwierig, kurzfristig einen Ersatzarzt zu finden. Viele sind erleichtert, dass Dr. Krausch wieder da ist, denn er ist sehr beliebt.", "e": "'ab dem 18. Oktober wieder in seiner Praxis' – true."}, {"n": 59, "s": "Alle Kunden müssen an der Kasse nebenan bezahlen.", "a": "f", "t": "Die Information, dass alle Kunden an der Kasse nebenan bezahlen müssen, ist nicht korrekt. Es gibt mehrere Kassen, und man kann frei entscheiden, welche man benutzt. So werden die Wartezeiten kürzer, und der Einkauf ist insgesamt entspannter.", "e": "Customers can choose any till – false."}, {"n": 60, "s": "Die Polizei informiert, dass alle Parkhäuser bei der Ausstellung besetzt sind.", "a": "f", "t": "Die Polizei informiert: Die Meldung, dass alle Parkhäuser an der Ausstellung belegt sind, stimmt nicht. Das Parkplatzangebot ist zwar begrenzt, aber einige Parkhäuser haben noch freie Plätze. Wer früh anreist, findet sicher einen Stellplatz. Sie können aber auch öffentliche Verkehrsmittel benutzen.", "e": "Some car parks still have free spaces – false."}], "schreiben": {"letter": "Liebe(r) ...,\n\nentschuldige, dass ich dir so lange nicht mehr geschrieben habe. Aber weißt du, mein älterer Bruder, der schon lange im Ausland lebt, ist jetzt für zwei Monate bei uns. Wir unternehmen einiges zusammen, z. B. gehen wir nachmittags ins Schwimmbad oder abends ins Kino.\n\nWir verstehen uns eigentlich ganz gut, aber trotzdem habe ich ein Problem mit ihm: Wenn es im Fernsehen Sportsendungen gibt, dann bekomme ich ihn nicht mehr weg vom Fernseher! Er sitzt dann stundenlang nur da und sieht fern, ganz egal, wie schön das Wetter draußen ist! Was soll ich bloß tun? Überhaupt nichts sagen oder soll ich mit ihm deswegen streiten? Er fährt bald wieder weg, und ich möchte doch mit ihm zusammen sein. Was würdest du machen?\n\nHast du vielleicht ein paar Tipps oder Ratschläge für mich?\n\nHerzliche Grüße\nNicole", "task": "Schreiben Sie Nicole einen Antwortbrief, der die folgenden Punkte enthält.", "points": ["Eigene Erfahrungen mit Geschwistern, Freunden ...", "Tipps für Nicole", "Was Sie über den Bruder denken", "Was Sie selbst gern gemeinsam mit anderen machen"], "model": "Hamburg, 12. März 20..\n\nLiebe Nicole,\n\nvielen Dank für deinen Brief! Schön, dass dein Bruder gerade bei euch ist.\n\nIch kenne dein Problem gut. Mein jüngerer Bruder hat früher jedes Wochenende stundenlang Computer gespielt, und ich habe mich oft darüber geärgert. Streit hat aber nie geholfen.\n\nIch glaube, dein Bruder meint es nicht böse. Im Ausland kann er die deutschen Sportsendungen wahrscheinlich nicht sehen, deshalb genießt er sie jetzt so sehr.\n\nMein Tipp: Sprich ruhig mit ihm und sag ihm, dass du gern mehr Zeit mit ihm verbringen möchtest. Vielleicht könnt ihr ein Spiel zusammen ansehen und danach etwas unternehmen, was du magst. Oder ihr geht zusammen joggen oder Fußball spielen – dann macht er selbst Sport!\n\nIch selbst koche sehr gern mit Freunden und gehe am Wochenende mit ihnen wandern. Das macht zusammen viel mehr Spaß.\n\nIch hoffe, meine Tipps helfen dir. Schreib mir bald, wie es gelaufen ist!\n\nHerzliche Grüße\ndeine Anna", "phrases": ["Vielen Dank für deinen Brief.", "Ich kenne dein Problem gut.", "An deiner Stelle würde ich ...", "Wie wäre es, wenn ihr ...?", "Ich glaube, dass dein Bruder ...", "Schreib mir bald, wie es gelaufen ist!"]}, "vocab": [["die Körperhaltung, -en", "posture"], ["die Bewegung, -en", "movement, exercise"], ["der Rückenschmerz, -en", "back pain"], ["die Übung, -en", "exercise"], ["umsetzen (setzt um)", "to put into practice"], ["die Entspannung", "relaxation"], ["selbstverständlich", "naturally, a matter of course"], ["erledigen", "to get done"], ["die Hausaufgabe, -n", "homework"], ["der Ausdauersport", "endurance sport"], ["die Untersuchung, -en", "study, examination"], ["bestätigen", "to confirm"], ["fördern", "to promote, support"], ["das Verletzungsrisiko", "risk of injury"], ["verringern", "to reduce"], ["die Studie, -n", "study"], ["sich beschäftigen mit + Dat", "to be busy with"], ["nebenbei", "at the same time, on the side"], ["die Aufmerksamkeit", "attention"], ["das Geschäft, -e", "business, shop"], ["das Unternehmen, -", "company"], ["erfolgreich", "successful"], ["der Kunde, -n / die Kundin, -nen", "customer"], ["beeinflussen", "to influence"], ["schaden + Dat", "to harm"], ["nützen + Dat", "to be useful"], ["beibringen (brachte bei, beigebracht)", "to teach"], ["die Lernhilfe, -n", "learning aid"], ["begeistert sein von + Dat", "to be enthusiastic about"], ["kostengünstig", "inexpensive"], ["zur Verfügung stehen", "to be available"], ["die Aufsicht", "supervision"], ["sich kümmern um + Akk", "to take care of"], ["die Folge, -n", "consequence"], ["sich beschweren über + Akk", "to complain about"], ["die Überforderung", "being overtaxed"], ["die Belohnung, -en", "reward"], ["die Einstellung, -en", "attitude"], ["die Anmeldung, -en", "registration"], ["der Verleih", "rental"], ["leihen (lieh, geliehen)", "to borrow, lend"], ["der Tierschutzverein, -e", "animal protection society"], ["das Angebot, -e", "offer"], ["nachholen", "to make up for"], ["die Messe, -n", "trade fair"], ["die Nachhilfe", "private tutoring"], ["sich Sorgen machen um + Akk", "to worry about"], ["faul", "lazy"], ["erreichen", "to reach"], ["die Klassenfahrt, -en", "school trip"], ["das Taschengeld", "pocket money"], ["die Jugendherberge, -n", "youth hostel"], ["die Erlaubnis", "permission"], ["die Ausstellung, -en", "exhibition"], ["das Parkhaus, -häuser", "multi-storey car park"], ["streiten (stritt, gestritten)", "to argue"], ["der Ratschlag, -schläge", "piece of advice"]], "grammar": ["Polite form: Sie sind / Sie finden – verb in 3rd person plural.", "jemandem (Dat) ein Angebot machen → Ihnen.", "Perfekt with haben + Partizip II: wir haben uns kennen gelernt.", "möchten + Infinitiv (Wir möchten das nachholen).", "Subject-verb agreement: der Katalog zeigt (singular).", "Reflexive verbs: sich freuen auf + Akk (wir freuen uns); sich Sorgen machen (ich mache mir Sorgen – dative reflexive).", "Adjective ending without article: freundliche Grüße.", "Modal verbs in position 2: Leider kann ich ...", "deshalb + verb directly after (inversion); aber without inversion.", "Indirect questions: fragen, ob ... / Wann finden die Stunden statt?", "Konjunktiv II for politeness: dass Sie ihm helfen könnten.", "Time prepositions: in zwei Jahren (future).", "unter der Nummer erreichbar sein."]}, {"n": 6, "title": "Linkshänder · Jelena · Frau Reiter", "lesen1": {"headlines": {"a": "Märchen-Festspiele in Bremen", "b": "Griechische Botschaft bietet Sprachkurse für Schüler", "c": "Universitätsstadt wird 300 Jahre", "d": "Wissenschaft: Von der Körpergröße hängt das Gehalt ab", "e": "Durch Handel reich geworden", "f": "Interessante Universitätsstadt mit hoher Lebensqualität", "g": "Latein in deutschen Schulen wieder beliebter", "h": "Wer wenig lacht, verdient auch weniger", "i": "Fremdsprachen: Schüler lernen nur Englisch und Französisch", "j": "Griechisch wird in deutschen Schulen kaum unterrichtet"}, "texts": ["In Deutschland lernen nur ganz wenige Schüler Griechisch. Es sind insgesamt nur 0,14 Prozent aller Schüler. Vor 30 Jahren waren es noch 0,48 Prozent. So berichtet die griechische Botschaft in Berlin in ihrem Europabericht. Griechisch wird meistens von Zwölftklässlern als dritte Fremdsprache neben Französisch und Englisch gewählt. Die wenigen Schüler, die Griechisch wählen, haben oft Verwandte in Griechenland.", "Dem Meer verdankt die Hansestadt Bremen ihre Bedeutung. Bremer Kaufleute und Seefahrer nutzten die günstige geografische Lage, um in aller Welt heimisch zu werden. Seit Generationen haben sie Handel getrieben, sodass viel Geld in die Stadt kam. Das sieht man der Stadt heute noch an: das Alte Rathaus, die Kaufmannshäuser, die historische Innenstadt. Außerdem war Bremen immer auch eine Heimat für Märchen – natürlich für das Märchen der Bremer Stadtmusikanten.", "Freiburg, die Hauptstadt des Schwarzwaldes, liegt in einer der sonnigsten Gegenden Deutschlands. Wo es so viel Sonne gibt, da ist auch viel Lebensfreude, und nicht zuletzt gehören auch badische Küche und badischer Wein zum Besten, was in Deutschland geboten wird. Zum einmaligen Flair der gemütlichen Universitätsstadt trägt auch ihre Lage bei: Frankreich und die Schweiz sind nicht weit entfernt. Die Stadt selbst lockt mit vielen alten Straßen, zahlreichen Museen und Baudenkmälern. Über alles hinaus ragt das Münster, das nach 300-jähriger Bauzeit 1513 vollendet wurde.", "In einer wissenschaftlichen Untersuchung hat man erforscht, warum bestimmte Menschen mehr Geld verdienen als andere. Britische Wissenschaftler behaupten: Größeren Menschen zahlt der Chef mehr. Im Laufe des vergangenen Jahres haben zwei weitere Untersuchungen festgestellt: Wer wenig lacht oder häufig mit Kollegen trinken geht, verdient mehr. Nur: Nicht lachen und mit Kollegen trinken gehen, das kann man lernen. Aber wachsen?", "Das Statistische Bundesamt berichtet, dass in deutschen Schulen allgemein wieder mehr Latein gelernt wird. Allein in Thüringen hat sich die Zahl in den letzten beiden Jahren verdoppelt. Während der Tiefpunkt bei Latein im vorletzten Jahr erreicht war, wählen zurzeit wieder mehr Schüler Latein als erste Fremdsprache. Als vorteilhaft hat sich offenbar vor allem das württembergische Modell erwiesen, das Latein in der fünften Klasse mit einer modernen Fremdsprache (Französisch, Englisch usw.) kombiniert. Allerdings sind hier meist nur drei Stunden für beide Sprachen pro Woche vorgesehen. Das sei bei Weitem zu wenig, kritisieren Lateinlehrer."], "key": ["j", "e", "f", "d", "g"], "why": ["Only 0.14% of pupils learn Greek = hardly taught (j); trap b: the embassy only reports, it offers no courses.", "Merchants traded for generations and money came into the city = rich through trade (e); trap a: fairy tales are only mentioned at the end.", "Sunny, joyful university town with good food and wine = high quality of life (f); trap c: '300' is the building time of the church.", "The main claim: taller people are paid more (d); trap h: the text says people who laugh LITTLE earn MORE.", "More pupils choose Latin again (g)."]}, "lesen2": {"title": "Das machen wir mit links", "text": "Über eine Million Österreicher sind Linkshänder – und langsam setzen sie sich in der Rechtshänder-Welt durch.\n\n„Schau, der macht das mit der linken Hand!“ Solche und ähnliche Kommentare hörte der gelernte Porzellanformer Gerhard Spur (51) von Besuchern, die die Porzellanmanufaktur im Wiener Augarten besichtigten und dem Künstler beim Herstellen eines Kunstwerkes zusahen – allerdings nur früher, als nur die rechte Hand die so genannte „schöne Hand“ war, die man zum Arbeiten, Schreiben usw. verwenden durfte. Heute ist es offensichtlich normal, dass jemand mit der linken Hand Vasen aus Porzellan bearbeitet. Gerhard Spur wird jedenfalls nicht mehr bestaunt.\n\nLinks arbeiten\n\nGut 15 Prozent der Menschheit sind Linkshänder. Über die Gründe für Linkshändigkeit ist sich die Wissenschaft nicht einig. Fest steht nur: Wenn Kinder gezwungen werden, statt mit der linken mit der rechten Hand zu schreiben, hat dies schwerwiegende Folgen. „Das führt zu Knoten im Kopf“, so die Linkshänder-Expertin Johanna Barbara Sattler.\n\nSpätestens wenn umgeschulte Kinder mit dem Lesen und Schreiben beginnen, macht sich das Chaos im Kopf bemerkbar. In der Schule ist es mittlerweile verboten, Linkshänder auf rechts umzuschulen. Probleme machen allerdings noch Arbeitsplätze, die nicht für Linkshänder geeignet sind, erklärt Erich Pospischill, Leiter des arbeitsmedizinischen Zentrums Mödling: „Schon die Computermaus auf der falschen Seite führt zu rascherer Ermüdung, weil das Gehirn durch das ständige Umdenken zusätzlich belastet wird.“\n\nLösungen im Betrieb\n\nDie Maschine, an der Slata Tanasic tagtäglich arbeitete, funktionierte von links unten nach rechts oben. Genau verkehrt für die 41-Jährige, die seit 21 Jahren im Seibert-Elektronikwerk arbeitet. „Ich habe gesagt, dass ich mit der Maschine so nicht arbeiten kann. Und das wurde akzeptiert.“ Slata wurde in einen anderen Arbeitsbereich versetzt und macht jetzt Arbeiten, die auch mit der linken Hand möglich sind: Montieren und Vorbereiten der Bauteile.\n\nEltern können helfen\n\nBei Kleinkindern lässt sich nicht sofort erkennen, ob sie links- oder rechtshändig sind, sagt die Expertin Sattler: „Viele Kinder ahmen zuerst die Tätigkeiten in unserer rechtshändigen Welt nach.“ Deshalb rät Sattler den Eltern, ihren Kindern beim Herausfinden ihrer Händigkeit zu helfen: Blumen gießen mit einer kleinen Kanne, einen Ball werfen – bei diesen Handlungen greifen Kinder automatisch mit der starken Hand zu. Und dann sollten Eltern bereits erste Konsequenzen ziehen.", "note": "reconstructed (question 6 stem and most options; stems 7-10 from the book)", "q": [{"n": 6, "stem": "Gerhard Spur", "opts": {"a": "wird von Besuchern heute noch oft bestaunt.", "b": "durfte früher nicht in der Porzellanmanufaktur arbeiten.", "c": "fällt heute als Linkshänder nicht mehr auf."}, "key": "c", "why": "'Heute ist es offensichtlich normal ... Gerhard Spur wird jedenfalls nicht mehr bestaunt.'"}, {"n": 7, "stem": "Heute ist wissenschaftlich bewiesen, dass", "opts": {"a": "Linkshänder besser im Lesen und Schreiben sind.", "b": "15 Prozent der Linkshänder Probleme in der Schule haben.", "c": "das Umschulen von Linkshändern schwere Folgen hat."}, "key": "c", "why": "'Fest steht nur: Wenn Kinder gezwungen werden ... mit der rechten Hand zu schreiben, hat dies schwerwiegende Folgen.' The reasons for left-handedness are NOT clear."}, {"n": 8, "stem": "Erich Pospischill meint, dass", "opts": {"a": "falsch eingerichtete Arbeitsplätze Linkshänder schneller müde machen.", "b": "Linkshänder nicht am Computer arbeiten sollten.", "c": "man Linkshänder in der Schule umschulen sollte."}, "key": "a", "why": "'Schon die Computermaus auf der falschen Seite führt zu rascherer Ermüdung.'"}, {"n": 9, "stem": "Frau Slata Tanasic", "opts": {"a": "ist seit 21 Jahren an der gleichen Maschine beschäftigt.", "b": "hat wegen ihrer Linkshändigkeit die Firma gewechselt.", "c": "arbeitet jetzt in einem anderen Bereich ihrer Firma."}, "key": "c", "why": "'Slata wurde in einen anderen Arbeitsbereich versetzt.' She has worked 21 years in the factory, not at the same machine."}, {"n": 10, "stem": "Laut der Linkshänder-Expertin Johanna Sattler", "opts": {"a": "erkennt man schon bei Babys, welche Hand die starke ist.", "b": "sollten Eltern beobachten, mit welcher Hand ihr Kind zugreift.", "c": "sollten Kinder alles mit beiden Händen üben."}, "key": "b", "why": "She advises parents to help find the child's dominant hand: 'bei diesen Handlungen greifen Kinder automatisch mit der starken Hand zu.'"}]}, "lesen3": {"note": "reconstructed (all ads missing in the book; built to match the key)", "situations": ["Sie lieben Krimis und möchten daher einer Krimiautorin beim Vorlesen zuhören.", "Ihr Bekannter würde gerne am Wochenende ein Boot mieten.", "Sie möchten sich in einem Hotel in den Bergen erholen und mit dem Zug anreisen.", "Sie möchten sich eine Märchenvorstellung im Theater ansehen.", "Ihre Freundin sucht ein angenehmes Hotel, in dem man auch Sport treiben kann.", "Am Sonntag wollen Sie einen kleinen Ausflug mit Kindern machen. Die Kinder mögen Tiere.", "Ihre Bekannten möchten gerne im Mai eine Schiffsfahrt machen.", "Sie möchten gerne am Wochenende tanzen gehen und suchen eine tolle Disco.", "Der kleine Sohn von Freunden ist begeistert von der Eisenbahn. Sie möchten am Wochenende mit ihm etwas Interessantes machen.", "Sie möchten im August eine Woche in den Bergen wandern und brauchen eine erfahrene Person, die mit Ihnen geht."], "ads": {"a": "Bergwanderführer Toni Gruber: Geführte Wanderwochen in den Alpen von Juni bis September. Erfahrener, staatlich geprüfter Bergführer. Kleine Gruppen. Tel. 08821/4471.", "b": "Krimi-Abend in der Buchhandlung Lesezeichen: Der bekannte Krimiautor Jan Brandt stellt seinen neuen Roman vor und liest daraus. Donnerstag, 20 Uhr.", "c": "Bootsverleih am Kleinsee: Ruderboote und Tretboote zu vermieten – nur montags bis freitags, 10 bis 18 Uhr. Am Wochenende geschlossen.", "d": "Hotel Seeblick****: Komfortable Zimmer, Hallenbad, Sauna, Tennisplätze und Fitnessraum. Genießen Sie Ihren Urlaub aktiv und entspannt!", "e": "Stadttheater: „Hänsel und Gretel“ – das beliebte Märchen als Theaterstück für Groß und Klein. Vorstellungen samstags und sonntags um 15 Uhr.", "f": "Berghotel Alpenrose: Ruhe und Erholung in 1200 m Höhe. Nur 5 Minuten vom Bahnhof – Abholservice vom Zug kostenlos!", "g": "Wildpark Schwarzach: Rehe, Hirsche, Wildschweine und ein Streichelzoo für Kinder. Täglich geöffnet, auch an Sonn- und Feiertagen, 9–18 Uhr.", "h": "Eisenbahnmuseum: Historische Lokomotiven zum Anschauen und Anfassen! Am Wochenende Fahrten mit der Dampflok für Kinder. Samstag und Sonntag 10–17 Uhr.", "i": "Tanzschule Weber: Neue Kurse für Anfänger – Walzer, Tango, Salsa. Kursbeginn jeweils dienstags, 19 Uhr.", "j": "Schifffahrt auf dem Bodensee: Rundfahrten ab Konstanz von Juli bis Oktober täglich. Gruppenrabatt möglich.", "k": "Krimifestival: Die Krimiautorin Petra Hammesfahr liest aus ihrem neuen Buch „Die Mutter“. Freitag, 19.30 Uhr, Stadtbibliothek. Eintritt frei.", "l": "Neckar-Schifffahrt: Saisonbeginn am 1. Mai! Täglich Ausflugsfahrten von Heidelberg nach Neckarsteinach. Info: Tel. 06221/20181."}, "key": ["k", "x", "f", "e", "d", "g", "l", "x", "h", "a"], "why": ["Ad k: a female crime author (Krimiautorin) reads from her book; ad b is a male author.", "x – the boat rental (c) is closed at the weekend.", "Ad f: mountain hotel 5 minutes from the station with pick-up from the train.", "Ad e: the fairy tale 'Hänsel und Gretel' at the theatre.", "Ad d: hotel with swimming pool, tennis and fitness room.", "Ad g: wildlife park with petting zoo, open on Sundays.", "Ad l: Neckar boat trips start on 1 May; ad j only from July.", "x – ad i is a dance school with courses on Tuesdays, not a disco.", "Ad h: railway museum with steam-train rides at the weekend.", "Ad a: experienced mountain guide, hiking weeks June–September."]}, "sprach1": {"note": "options partly reconstructed (OCR lost several options; correct words from the key)", "text": "Liebe Jelena,\n\nich hab dir doch schon vom Deutschkurs erzählt, [21] ich hier besuche. Der ist wirklich ganz gut. Wir haben jetzt eine neue Aufgabe bekommen. Wir müssen Informationen [22] Thema Gesundheit und Ernährung suchen und schauen, was es dazu Interessantes [23] Internet gibt. Die interessanteste Internetseite, die ich finden [24], ist www.gesund.ch. Diese Seite ist für [25] Leute gemacht, die gern mehr über gesunde Ernährung erfahren möchten. Fachleute beschreiben hier genau, [26] Lebensmittel für unseren Körper wichtig und gesund sind und wie oft und wie viel man pro Tag essen sollte. Außerdem kann man [27] seinen persönlichen Speiseplan selbst erstellen und dafür passende Rezepte [28]. Für Menschen, [29] ein paar Kilos zu viel haben, gibt es auch Tipps zum Abnehmen und Links zu verschiedenen Fitnesszentren in der Schweiz.\n\nUnd was gibt es bei dir Neues? [30] mir doch möglichst bald zurück!\n\nBis dann und viele Grüße\nPaola", "q": [{"n": 21, "opts": {"a": "das", "b": "den", "c": "die"}, "key": "b", "why": "Relative pronoun for 'der Deutschkurs' (masculine), accusative object of 'besuche' → den."}, {"n": 22, "opts": {"a": "zur", "b": "zum", "c": "vom"}, "key": "b", "why": "'Informationen zu + Dat'; das Thema is neuter → zu dem = zum."}, {"n": 23, "opts": {"a": "am", "b": "im", "c": "mit"}, "key": "b", "why": "Fixed expression: im Internet."}, {"n": 24, "opts": {"a": "können", "b": "könnten", "c": "konnte"}, "key": "c", "why": "Past (Präteritum) of können, 1st person singular: ich konnte."}, {"n": 25, "opts": {"a": "junge", "b": "jungen", "c": "junger"}, "key": "a", "why": "für + Akk, plural, no article → ending -e: für junge Leute."}, {"n": 26, "opts": {"a": "welche", "b": "welchen", "c": "welcher"}, "key": "a", "why": "Indirect question; 'Lebensmittel' plural nominative → welche."}, {"n": 27, "opts": {"a": "mir", "b": "dir", "c": "sich"}, "key": "c", "why": "Subject 'man' → reflexive pronoun 'sich' (sich einen Plan erstellen)."}, {"n": 28, "opts": {"a": "findet", "b": "finden", "c": "fand"}, "key": "b", "why": "After the modal verb 'kann' the second verb is an infinitive: finden."}, {"n": 29, "opts": {"a": "denen", "b": "deren", "c": "die"}, "key": "c", "why": "Relative pronoun, plural nominative (subject of 'haben') → die."}, {"n": 30, "opts": {"a": "Schreibe", "b": "Schreiben", "c": "Schreibt"}, "key": "a", "why": "Imperative for 'du': Schreib(e) mir zurück!"}]}, "sprach2": {"text": "Sehr geehrter Herr Gauberger,\n\nIhre Anzeige habe ich mit Interesse gelesen. Ich bin [31] lange Rentner und bekomme monatlich nur wenig Geld. Wenn ich die Möglichkeit [32], noch ein wenig zu verdienen, würde mir das sehr helfen. Ich bin [33] schon 72 Jahre alt, aber noch bei sehr guter Gesundheit. Daher denke ich, dass ich die Arbeit [34] Probleme machen kann. Seit über dreißig Jahren treibe ich [35] Tag Sport. Auch das frühe Aufstehen macht mir gar [36] aus.\n\nEinige Fragen hätte ich trotzdem noch: Müssen die Zeitungen [37] ausgetragen werden und wie lange ist man unterwegs? Außerdem möchte ich natürlich wissen, [38] man verdient. Ich bin gerne bereit, mich bei [39] vorzustellen, damit Sie sehen können, dass ich für die Tätigkeit [40] bin.\n\nMit freundlichen Grüßen\nEberhard Spitzweg", "words": {"a": "BEQUEM", "b": "GEEIGNET", "c": "HÄTTE", "d": "IHNEN", "e": "JEDEN", "f": "KÖNNTE", "g": "MEHR", "h": "NICHTS", "i": "OHNE", "j": "SCHON", "k": "SIE", "l": "TÄGLICH", "m": "WIE HOCH", "n": "WIE VIEL", "o": "ZWAR"}, "key": ["j", "c", "o", "i", "e", "h", "l", "n", "d", "b"], "why": ["'schon lange' = for a long time already.", "Konjunktiv II in a wenn-clause (unreal condition): Wenn ich die Möglichkeit hätte, ...", "'zwar ... aber' = admittedly ... but.", "'ohne + Akk': ohne Probleme.", "'jeden Tag' – accusative of time (der Tag → jeden).", "Fixed expression: 'etwas macht mir nichts aus' = I don't mind.", "'täglich' = daily (adverb).", "Indirect question about an amount: wissen, wie viel man verdient ('wie hoch' needs a noun like 'der Lohn').", "'bei + Dat': bei Ihnen.", "'für etwas geeignet sein' = to be suitable for."]}, "hoeren1": [{"n": 41, "s": "Die Sprecherin könnte sich vorstellen, mit dem Bus zur Arbeit zu fahren.", "a": "f", "t": "Ich fahre jeden Tag mit dem Auto zur Arbeit. Morgens ist das für mich am bequemsten, auch wenn es manchmal Stau gibt. Der Bus wäre vielleicht günstiger, aber ich habe noch nie ernsthaft darüber nachgedacht, ihn zu nehmen. Ich möchte flexibel sein und nicht an Fahrpläne gebunden.", "e": "She has never seriously thought about taking the bus and wants to be flexible – false."}, {"n": 42, "s": "Die Sprecherin findet es gut, dass sie zur Arbeit ein Stück zu Fuß gehen kann.", "a": "r", "t": "Ich arbeite in der Innenstadt und laufe morgens ein kleines Stück zu Fuß. Das tut mir gut, weil ich frische Luft bekomme und dabei den Kopf frei machen kann. Danach nehme ich die Straßenbahn. Ich finde diese Kombination aus Bewegung und öffentlichem Verkehrsmittel sehr angenehm und auch praktisch.", "e": "'Das tut mir gut' – true."}, {"n": 43, "s": "Der Sprecher fährt nie mit dem Auto zur Arbeit.", "a": "r", "t": "Früher bin ich oft mit dem Auto zur Arbeit gefahren, aber seit einem Jahr mache ich das nicht mehr. Jetzt nehme ich mein Fahrrad oder gehe zu Fuß. Das ist besser für die Umwelt und für meine Gesundheit. Ich habe festgestellt, dass ich das Auto eigentlich gar nicht mehr brauche.", "e": "Trap 'früher': now he never drives – true."}, {"n": 44, "s": "Der Sprecher benutzt für den Weg zur Arbeit zurzeit verschiedene Verkehrsmittel.", "a": "f", "t": "Ich fahre immer auf dieselbe Weise zur Arbeit: mit dem Bus. Ich steige morgens ein und fahre direkt bis zur Haltestelle in der Nähe meines Büros. Ich benutze nie andere Verkehrsmittel. Der Bus ist für mich zuverlässig und bequem. Deshalb bleibe ich dabei, auch wenn es Alternativen gäbe.", "e": "He only uses the bus – false."}, {"n": 45, "s": "Für die Sprecherin ist der Firmenbus die einzige Möglichkeit, zur Arbeit zu kommen.", "a": "f", "t": "Zur Arbeit fahre ich manchmal mit dem Fahrrad, manchmal mit dem Bus. Wenn das Wetter schlecht ist, nehme ich auch das Auto oder fahre mit Kollegen. Der Firmenbus ist nur eine von vielen Möglichkeiten. Ich finde es gut, verschiedene Optionen zu haben.", "e": "'nur eine von vielen Möglichkeiten' – false."}], "hoeren2": {"intro": "Im Radio spricht ein Moderator mit Frau Reiter, die als Lokführerin arbeitet.", "speakers": ["Moderator", "Frau Reiter"], "lines": [["A", "Frau Reiter, schön, dass Sie heute bei uns sind. Sie arbeiten als Lokführerin – eine noch immer recht seltene Tätigkeit für Frauen in Deutschland. Sind Sie wirklich die einzige Lokführerin im ganzen Land?"], ["B", "Vielen Dank für die Einladung. Tatsächlich gibt es mittlerweile einige Frauen, die als Lokführerin arbeiten. Ich bin also nicht die einzige, aber wir sind noch immer in der Minderheit. Die meisten meiner Kollegen sind Männer, aber das ändert sich langsam."], ["A", "Wissen Sie noch, wann bei Ihnen der Wunsch entstand, Lokführerin zu werden? War das schon als Kind ein Traum?"], ["B", "Ehrlich gesagt fand ich als Kind eher andere Berufe spannend. Erst als ich älter wurde und die Möglichkeiten sah, kam der Gedanke auf. Mit zehn Jahren habe ich also noch nicht daran gedacht, einmal Züge zu fahren."], ["A", "Wie ging Ihr beruflicher Weg nach der Schule weiter? Hatten Sie sofort einen Platz als Lokführerin?"], ["B", "Nach der Schule habe ich mich erst einmal nach Ausbildungsplätzen umgesehen. Schließlich habe ich eine Lehrstelle als Elektronikerin bekommen. Das technische Verständnis, das ich dort gelernt habe, hilft mir bis heute sehr."], ["A", "Haben Sie danach als Automechanikerin gearbeitet oder sind Sie direkt zur Bahn gewechselt?"], ["B", "Ich habe nie als Automechanikerin gearbeitet. Nach meiner Ausbildung war mir klar, dass ich etwas anderes machen möchte. Dann habe ich mich bei der Bahn beworben und die Ausbildung zur Lokführerin gemacht."], ["A", "Und wie stand Ihre Familie zu Ihrer Berufswahl? Gab es Diskussionen?"], ["B", "Meine Eltern waren zum Glück immer sehr offen. Sie fanden es zwar ungewöhnlich, dass ich Lokführerin werden wollte, aber sie haben mich unterstützt und gesagt, ich soll das machen, was mir Freude macht."], ["A", "Müssen Sie im Alltag auch mal selbst Reparaturen machen, oder gibt es dafür Techniker?"], ["B", "Unterwegs treten immer wieder kleinere Störungen auf, etwa an der Elektronik. Natürlich gibt es Techniker, aber manchmal muss ich selbst kleinere Reparaturen machen, damit wir weiterfahren können."], ["A", "Wie sieht es mit den Arbeitszeiten aus? Arbeiten Sie gern in der Nacht?"], ["B", "Die Nachtdienste gehören zu meinem Job, aber ehrlich gesagt sind sie nicht mein Favorit. Ich habe mich daran gewöhnt, aber ich mache Nachtdienst nicht besonders gern."], ["A", "Das klingt anstrengend. Sind Sie nach der Arbeit oft müde?"], ["B", "Es kommt auf den Tag an, aber nach langen Schichten bin ich tatsächlich oft ziemlich erschöpft. Der Beruf verlangt einem körperlich und geistig einiges ab."], ["A", "Arbeitet Ihr Mann auch im Schichtdienst oder hat er regelmäßige Arbeitszeiten?"], ["B", "Mein Mann ist Krankenpfleger, und sein Dienstplan wechselt ständig: Früh-, Spät- und Nachtdienste. Feste Arbeitszeiten hat er also nicht. Das ist für unsere Familienorganisation oft eine Herausforderung."], ["A", "Haben Sie Pläne für die Zukunft? Könnten Sie sich vorstellen, andere Lokführer auszubilden?"], ["B", "Ja, ich würde sehr gern irgendwann mein Wissen weitergeben und andere in diesem Beruf ausbilden – und vielleicht noch mehr Frauen für den Beruf begeistern. Das ist auf jeden Fall ein Ziel."], ["A", "Frau Reiter, vielen Dank für das offene Gespräch und weiterhin gute Fahrt!"], ["B", "Ich danke Ihnen. Auf Wiedersehen."]], "items": [{"n": 46, "s": "Frau Reiter ist die einzige Lokführerin in Deutschland.", "a": "f", "e": "'Ich bin also nicht die einzige.'"}, {"n": 47, "s": "Sie wollte schon mit 10 Jahren Lokführerin werden.", "a": "f", "e": "'Mit zehn Jahren habe ich also noch nicht daran gedacht.'"}, {"n": 48, "s": "Frau Reiter hat nach der Schule eine Lehrstelle als Elektronikerin gefunden.", "a": "r", "e": "'Schließlich habe ich eine Lehrstelle als Elektronikerin bekommen.'"}, {"n": 49, "s": "Nach der Lehre hat Frau Reiter als Automechanikerin gearbeitet.", "a": "f", "e": "'Ich habe nie als Automechanikerin gearbeitet.'"}, {"n": 50, "s": "Frau Reiters Eltern waren mit der Berufswahl ihrer Tochter einverstanden.", "a": "r", "e": "'... aber sie haben mich unterstützt.'"}, {"n": 51, "s": "Frau Reiter muss manchmal Reparaturen machen.", "a": "r", "e": "'manchmal muss ich selbst kleinere Reparaturen machen.'"}, {"n": 52, "s": "Frau Reiter macht gerne Nachtdienst.", "a": "f", "e": "'ich mache Nachtdienst nicht besonders gern.'"}, {"n": 53, "s": "Von der Arbeit ist Frau Reiter oft müde.", "a": "r", "e": "'nach langen Schichten bin ich tatsächlich oft ziemlich erschöpft.'"}, {"n": 54, "s": "Der Mann von Frau Reiter hat regelmäßige Arbeitszeiten.", "a": "f", "e": "'Feste Arbeitszeiten hat er also nicht.'"}, {"n": 55, "s": "Frau Reiter möchte später Lokführer und Lokführerinnen ausbilden.", "a": "r", "e": "'ich würde sehr gern ... andere in diesem Beruf ausbilden.'"}]}, "hoeren3": [{"n": 56, "s": "Der Fahrer des Wagens mit dem Kennzeichen HB-D 256 soll ins Erdgeschoss kommen.", "a": "r", "t": "Achtung, eine Durchsage: Der Fahrer des Fahrzeugs mit dem Kennzeichen HB-D 256 wird dringend gebeten, sofort ins Erdgeschoss zu kommen. Das Fahrzeug steht im Haltever
