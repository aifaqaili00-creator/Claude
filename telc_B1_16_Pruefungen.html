ale Bearbeitung von Bildern, im Mittelpunkt. Dabei kommen verschiedene Softwareprodukte zum Einsatz. Der Kurs befasst sich aber nicht nur mit dem Vermitteln von Technik, sondern auch mit Themen- und Problembereichen rund um die digitale Foto- und Bildbearbeitung. Kurskosten: 800 Franken. Nähere Informationen und Anmeldung: www.f-f.ch.", "Neuperlach-Süd – Nach dem Einkaufen einen Kaffee genießen, mit anderen ins Gespräch kommen, sich mit Bekannten treffen oder einfach entspannen – all das geht ab 11. Juli immer dienstags zwischen 14 und 18 Uhr im neuen Eiscafé der Dietrich-Bonhoeffer-Kirche. „Wir wollen damit einen Ort der Begegnung für Jung und Alt anbieten und zur Belebung des Stadtteils beitragen“, erklärt Pfarrer Sebastian Kühnen. Neben kalten und heißen Getränken sowie Kuchen steht während der Öffnungszeiten auch eine Mitarbeiterin für Gespräche zur Verfügung.", "„Geheimnisse der modernen Konditorkunst“ verrät der Meister des Süßen, Herwig Gasser. Über viele Jahre hinweg sammelte der Konditor des berühmten Wiener Café Landtmann Mehlspeisenrezepte – von der Birnentorte über den Apfelstrudel bis hin zum Heidelbeerkuchen. Mit genauen Anleitungen, auch für Anfänger. Verlag Kettel, 110 Fotos, 300 Seiten.", "Am Montag wird in Stuttgart die Bildungsmesse Didacta eröffnet. Dort werden vor allem neue Lehrmaterialien vorgestellt. Bei vielen handelt es sich um Bildungssoftware, die die Besucher an zahlreichen Computern selbst ausprobieren und testen können. Fachleute prüfen dabei, welche Programme sich für den Unterricht wirklich eignen. Für ein besonders gelungenes Softwareprojekt wird am Ende der Messe außerdem ein Preis vergeben.", "Eine Studie des Gallup-Instituts hat sich mit dem Kaffeehausverhalten der Wiener beschäftigt. Ein Vorurteil hat sich dabei bestätigt: Der Wiener liebt sein Kaffeehaus und seine Melange. 27 Prozent der Befragten gaben an, zumindest einmal im Monat in ein Café in der Nähe ihrer Wohnung zu gehen. Durchschnittlich 54 Minuten verbringen die Befragten in ihrem Stammcafé. Gegessen wird dort eher wenig – der wichtigste Grund für den Besuch im Kaffeehaus ist das Plaudern mit Freunden: 77 Prozent der Befragten nannten diesen Grund."], "key": ["a", "c", "g", "e", "i"], "why": ["A course in 'digitale Bildbearbeitung' – editing pictures by computer. No exhibition (trap j).", "A new café in a church as a 'Ort der Begegnung' = meeting place. No baking course (trap b).", "Cake recipes (Torte, Strudel) from a Viennese café – not meat dishes (trap d).", "Visitors test new educational software. A prize is mentioned only at the end (trap f).", "Main reason for going to the café: chatting with friends. The study does not say coffee drinkers are happier (trap h)."]}, "lesen2": {"note": "reconstructed (missing in the book, incl. key)", "title": "Sonntags im Repair-Café", "text": "Sonntags im Repair-Café\nIn Freiburg reparieren Freiwillige kostenlos kaputte Geräte – und retten so manches Lieblingsstück\n\nVon Martina Kehl\n\nEs riecht nach Kaffee und ein bisschen nach Lötzinn. An langen Tischen im Gemeindehaus St. Georg sitzen an diesem Sonntagnachmittag rund zwanzig Menschen. Vor ihnen liegen Toaster, Radios, Fahrradlampen und sogar eine alte Nähmaschine. „Wegwerfen? Kommt nicht in Frage!“, sagt Gerhard Lenz, 68, pensionierter Elektriker. Er ist einer von zwölf Freiwilligen, die einmal im Monat im Repair-Café helfen, kaputte Dinge wieder zum Laufen zu bringen.\n\nDie Idee stammt aus den Niederlanden. Dort wurde vor einigen Jahren das erste Repair-Café eröffnet, inzwischen gibt es allein in Deutschland mehrere Hundert. In Freiburg hat eine Gruppe von Studenten das Projekt vor drei Jahren gestartet. „Wir wollten etwas gegen die Wegwerfgesellschaft tun“, erzählt Mitgründerin Lisa Brandt. „Viele Geräte gehen heute schon nach kurzer Zeit kaputt, und eine Reparatur im Geschäft ist oft teurer als ein neues Gerät.“\n\nDie Reparatur im Repair-Café ist kostenlos. Wer möchte, kann etwas in die Spendenkasse werfen; davon werden Werkzeuge und Ersatzteile gekauft. Wichtig ist den Helfern aber vor allem eines: Die Besucher sollen nicht einfach ihr Gerät abgeben und später wieder abholen. „Wir reparieren gemeinsam“, erklärt Lenz. „Die Leute schauen zu, halten die Lampe, schrauben selbst. So lernen sie etwas und haben beim nächsten Mal vielleicht weniger Angst vor einem Schraubenzieher.“\n\nNicht immer klappt es. Etwa jedes dritte Gerät kann nicht mehr gerettet werden, meistens weil es keine Ersatzteile mehr gibt. Trotzdem gehen die wenigsten Besucher enttäuscht nach Hause. Bei Kaffee und selbst gebackenem Kuchen kommen Menschen ins Gespräch, die sich sonst nie getroffen hätten: die Studentin mit dem kaputten Laptop und der Rentner mit seinem alten Plattenspieler.\n\nFür viele ist genau das der Grund, immer wieder zu kommen. „Am Anfang wollte ich nur meinen Wasserkocher reparieren lassen“, sagt Ilse Wagner, 74. „Heute komme ich jeden Monat, auch wenn nichts kaputt ist. Ich backe den Kuchen und höre mir die Geschichten an.“", "q": [{"n": 6, "stem": "Im Repair-Café", "opts": {"a": "arbeiten nur ausgebildete Elektriker.", "b": "helfen Freiwillige, kaputte Dinge zu reparieren.", "c": "kann man gebrauchte Geräte kaufen."}, "key": "b", "why": "'zwölf Freiwillige, die … helfen, kaputte Dinge wieder zum Laufen zu bringen'. Only Herr Lenz is an electrician (trap a)."}, {"n": 7, "stem": "Das Repair-Café in Freiburg", "opts": {"a": "war das erste Repair-Café der Welt.", "b": "wurde von einem Elektriker gegründet.", "c": "wurde von Studenten gegründet."}, "key": "c", "why": "'In Freiburg hat eine Gruppe von Studenten das Projekt … gestartet'. The first one was in the Netherlands (trap a)."}, {"n": 8, "stem": "Für eine Reparatur", "opts": {"a": "muss man nichts bezahlen.", "b": "muss man Ersatzteile selbst mitbringen.", "c": "bezahlt man weniger als im Geschäft."}, "key": "a", "why": "'Die Reparatur im Repair-Café ist kostenlos' – a donation is voluntary."}, {"n": 9, "stem": "Die Helfer möchten, dass die Besucher", "opts": {"a": "ihre Geräte abgeben und später abholen.", "b": "Kuchen für alle mitbringen.", "c": "bei der Reparatur mitmachen und etwas lernen."}, "key": "c", "why": "'Wir reparieren gemeinsam … So lernen sie etwas'. Trap a is exactly what they do NOT want."}, {"n": 10, "stem": "Viele Besucher kommen regelmäßig, weil", "opts": {"a": "jedes Gerät repariert werden kann.", "b": "sie dort gern andere Menschen treffen.", "c": "es dort billige Ersatzteile gibt."}, "key": "b", "why": "'kommen Menschen ins Gespräch … genau das der Grund, immer wieder zu kommen'. Every third device cannot be repaired (not a)."}]}, "lesen3": {"note": "reconstructed (ads missing in the book; situations and key from the book)", "situations": ["Sie mögen thailändisches Essen und möchten lernen, einige Speisen selbst zu kochen.", "Sie müssen umziehen und brauchen jemanden, der Ihnen hilft.", "Ihr Kind hat in Mathematik schlechte Noten bekommen und braucht Nachhilfe.", "Ihre Freundin hat Geburtstag. Sie möchten ihr einen Blumenstrauß schicken lassen.", "Am Samstag wollen Sie mit Ihrer Tante eine Blumenausstellung besuchen.", "Ihr Kollege heiratet. Sie möchten ihm etwas für die Küche schenken.", "Sie wollen für eine Hochzeit einen Luxuswagen mieten.", "Am nächsten Montag möchten Sie mit Ihren Freunden thailändisch essen gehen.", "Für Ihre Geburtstagsfeier suchen Sie jemanden, der bei Ihnen zu Hause kocht.", "Sie wollen sich über Wohnwagen informieren."], "ads": {"a": "Restaurant Bangkok Garden – original thailändische Küche, scharfe Currys und Nudelgerichte. Dienstag bis Sonntag 12–23 Uhr, Montag Ruhetag.", "b": "Mathe-Hilfe! Erfahrene Lehrerin gibt Nachhilfe in Mathematik für alle Klassen, auch Prüfungsvorbereitung. Einzelunterricht bei Ihnen zu Hause. Tel. 0761/55 32 10.", "c": "Umzugskartons günstig abzugeben! 40 stabile Kartons, kaum benutzt, nur 1 Euro pro Stück. Selbstabholung. Tel. 0761/44 87 12.", "d": "Mietkoch Thomas: Ich koche für Ihre Party bei Ihnen zu Hause – vom Geburtstag bis zur Firmenfeier, für 6 bis 40 Personen. Menü nach Ihren Wünschen.", "e": "Gartenschau „Blütenzauber“ im Stadtpark: Rosen, Tulpen und Orchideen aus aller Welt. Geöffnet Samstag und Sonntag 9–19 Uhr. Eintritt 6 Euro.", "f": "Thai-Kochkurs an der Volkshochschule: An vier Abenden lernen Sie mit der Köchin Pim, wie man Curry, Frühlingsrollen und Thai-Suppe selbst zubereitet. Anmeldung bis 15. März.", "g": "Autovermietung Schnell: Transporter und Kleinbusse ab 49 Euro pro Tag – ideal für Umzüge und Gruppenreisen. Kein Luxus, aber günstig!", "h": "Blumen Rosa: Frische Sträuße und Gestecke für jeden Anlass. Mo–Fr 8–18 Uhr, Sa 8–13 Uhr. Leider kein Lieferservice.", "i": "Fleurop-Blumenservice: Wir liefern Ihren Blumenstrauß noch am selben Tag – in ganz Deutschland. Bestellen Sie bequem online oder telefonisch.", "j": "Caravan-Messe in Freiburg: Alles über Wohnwagen und Wohnmobile – neue Modelle, Zubehör und Beratung. 12.–15. Oktober, Messe Freiburg.", "k": "Umzugsservice Möbel-Max: Wir packen, tragen und transportieren – Ihr Umzug ohne Stress. Kostenloser Besichtigungstermin. Tel. 0800/123 45 67.", "l": "Küchenstudio Koch & Co.: Töpfe, Pfannen, Messer und schöne Geschenkideen für Hobbyköche. Wir verpacken Ihr Geschenk gratis!"}, "key": ["f", "k", "b", "i", "e", "l", "x", "x", "d", "j"], "why": ["Ad f: Thai cooking course.", "Ad k: removal service that helps with everything. Ad c only sells boxes.", "Ad b: maths tutoring.", "Ad i: flowers delivered. Ad h has no delivery ('kein Lieferservice').", "Ad e: flower show open on Saturday.", "Ad l: kitchen shop with gift ideas.", "Ad g only has vans and minibuses – 'kein Luxus' – so x.", "Ad a is a Thai restaurant, but 'Montag Ruhetag' – so x.", "Ad d: hired chef who cooks at your home.", "Ad j: caravan fair with information and advice."]}, "sprach1": {"note": "reconstructed (missing in the book, incl. key)", "text": "Liebe Martina,\n\nvielen Dank für deine Karte aus Italien! Ich habe mich sehr [21] gefreut. Entschuldige, dass ich erst jetzt antworte, aber in den letzten Wochen hatte ich wirklich viel zu tun.\n\nStell dir vor: Seit dem ersten Mai arbeite ich [22] Verkäuferin in einer Buchhandlung. Die Arbeit gefällt mir sehr gut, [23] ich jeden Tag mit vielen netten Menschen spreche. Meine Kollegin Anna hat mir am Anfang viel geholfen. Ohne [24] hätte ich die ersten Tage nicht geschafft.\n\nLeider muss ich jetzt jeden Morgen um sechs Uhr aufstehen, [25] die Buchhandlung liegt am anderen Ende der Stadt. Ich fahre eine Stunde mit dem Bus. Deshalb überlege ich, [26] ich vielleicht in die Nähe ziehen soll.\n\nAm Wochenende habe ich zum Glück frei. Letzten Samstag war ich mit meinem Bruder im Kino. Der Film war [27] spannend, dass wir die ganze Zeit nicht gesprochen haben.\n\nWann kommst du eigentlich [28] Italien zurück? Ich würde mich freuen, [29] wir uns bald treffen könnten. Vielleicht hast du ja Lust, mit mir in das neue Café am Markt zu gehen, [30] im Juni eröffnet hat.\n\nViele Grüße\ndeine Sabine", "q": [{"n": 21, "opts": {"a": "darauf", "b": "darüber", "c": "daran"}, "key": "b", "why": "sich freuen über + Akk (something you received) → darüber."}, {"n": 22, "opts": {"a": "als", "b": "wie", "c": "für"}, "key": "a", "why": "Job/role: arbeiten als Verkäuferin."}, {"n": 23, "opts": {"a": "denn", "b": "weil", "c": "deshalb"}, "key": "b", "why": "Verb at the end (spreche) → subordinate clause with weil. 'denn' needs normal word order."}, {"n": 24, "opts": {"a": "sie", "b": "ihr", "c": "ihre"}, "key": "a", "why": "ohne + Akkusativ: ohne sie."}, {"n": 25, "opts": {"a": "weil", "b": "denn", "c": "obwohl"}, "key": "b", "why": "Normal word order after the gap (die Buchhandlung liegt …) → denn."}, {"n": 26, "opts": {"a": "wenn", "b": "dass", "c": "ob"}, "key": "c", "why": "Indirect yes/no question after 'überlegen': ob."}, {"n": 27, "opts": {"a": "so", "b": "sehr", "c": "zu"}, "key": "a", "why": "so … dass = so … that."}, {"n": 28, "opts": {"a": "von", "b": "aus", "c": "nach"}, "key": "b", "why": "Coming back from a country: aus Italien zurückkommen."}, {"n": 29, "opts": {"a": "dass", "b": "wenn", "c": "ob"}, "key": "b", "why": "'Ich würde mich freuen, wenn …' – condition with Konjunktiv II."}, {"n": 30, "opts": {"a": "der", "b": "die", "c": "das"}, "key": "c", "why": "Relative pronoun for 'das Café' (neuter, subject): das."}]}, "sprach2": {"text": "Sehr geehrte Frau Bauer,\n\nich habe Ihre Anzeige in der Neuen Presse gelesen und bin an dem Filmprojekt sehr [31].\n\nIch war schon [32] für einige Wochen im Ausland. Vor allem im Sommer habe ich während meines Studiums viele Sprachkurse besucht. Länger als ein halbes Jahr habe ich [33] einmal im Ausland gelebt, und zwar [34] zwei Jahren. Mein Chef machte mir damals das Angebot, acht Monate im Tochterunternehmen der Firma in Portugal zu [35], was ich dann auch getan habe.\n\nAm Anfang war es sehr schwer, weil ich niemanden kannte und alles sehr neu und [36] für mich war. Eigentlich wollte ich so schnell wie [37] wieder zurück. Aber dann habe ich nette Kollegen kennengelernt, die mir auch viel über die Kultur und das Leben in Portugal [38] haben.\n\nIch glaube, dass meine Erfahrungen für viele andere Menschen, die auch im Ausland leben wollen, sehr interessant sein könnten, und ich [39] gerne auch vor der Kamera darüber erzählen. [40] Sie noch weitere Fragen an mich haben, können Sie mich gerne anrufen, meine Telefonnummer ist 07612/64788980.\n\nIch würde mich freuen, bald von Ihnen zu hören.\n\nMit freundlichen Grüßen\nKaroline Pointner", "words": {"a": "als", "b": "anfangen", "c": "arbeiten", "d": "erzählt", "e": "falls", "f": "informiert", "g": "interessiert", "h": "möchten", "i": "möglich", "j": "nur", "k": "öfter", "l": "unbekannt", "m": "vor", "n": "würde", "o": "zwischen"}, "key": ["g", "k", "j", "m", "c", "l", "i", "d", "n", "e"], "why": ["interessiert sein an + Dativ.", "'schon öfter' = several times already.", "'nur einmal' = only once.", "Time ago: vor zwei Jahren.", "'das Angebot, … zu arbeiten' – infinitive with zu.", "'neu und unbekannt' – adjective, parallel to 'neu'.", "'so schnell wie möglich' = as soon as possible.", "Perfekt 'haben … erzählt'; jemandem über etwas erzählen.", "Konjunktiv II: ich würde gerne erzählen.", "'Falls Sie Fragen haben' = in case; verb at the end."]}, "hoeren1": [{"n": 41, "note": "reconstructed", "s": "Der Sprecher wohnt gern in der Stadt.", "a": "r", "t": "Ich wohne mitten in der Innenstadt, im vierten Stock ohne Aufzug. Klar, abends ist es manchmal ein bisschen laut. Aber ich kann alles zu Fuß erreichen: den Supermarkt, das Kino, meine Freunde. Ein Auto brauche ich nicht. Ich möchte nirgendwo anders wohnen.", "e": "Some noise, 'aber … Ich möchte nirgendwo anders wohnen'."}, {"n": 42, "note": "reconstructed", "s": "Die Sprecherin hat ihre Möbel alle neu gekauft.", "a": "f", "t": "Als ich in meine erste eigene Wohnung gezogen bin, hatte ich kaum Geld. Das Sofa habe ich von meiner Oma bekommen, den Tisch und die Stühle von Freunden. Nur das Bett habe ich neu gekauft. Heute finde ich es toll, dass jedes Möbelstück eine Geschichte hat.", "e": "Only the bed is new – the rest came from her grandmother and friends."}, {"n": 43, "note": "reconstructed", "s": "Der Sprecher arbeitet oft zu Hause am Computer.", "a": "r", "t": "Seit letztem Jahr arbeite ich drei Tage pro Woche im Homeoffice. Deshalb habe ich mir in meiner Wohnung eine kleine Arbeitsecke mit Schreibtisch und Computer eingerichtet. Ins Büro fahre ich nur noch montags und freitags. Das spart mir viel Zeit.", "e": "'drei Tage pro Woche im Homeoffice … Schreibtisch und Computer'."}, {"n": 44, "note": "reconstructed", "s": "Die Sprecherin möchte bald in eine größere Wohnung ziehen.", "a": "f", "t": "Meine Wohnung ist nur 35 Quadratmeter groß. Viele Freunde fragen mich, warum ich nicht etwas Größeres suche. Aber ehrlich gesagt: Ich fühle mich hier wohl, die Miete ist günstig, und ich muss nicht so viel putzen. Umziehen? Nein, das kommt für mich im Moment nicht in Frage.", "e": "Trap: friends ask about a bigger flat, but 'Umziehen? … kommt für mich nicht in Frage'."}, {"n": 45, "note": "reconstructed", "s": "Der Sprecher hat seine Nachbarn erst nach einiger Zeit kennengelernt.", "a": "r", "t": "Als ich vor einem Jahr hier eingezogen bin, kannte ich niemanden im Haus. Die ersten Monate habe ich nur kurz „Hallo“ gesagt. Erst beim Sommerfest im Hof habe ich die Nachbarn richtig kennengelernt. Jetzt helfen wir uns gegenseitig, und manchmal kochen wir zusammen.", "e": "'Erst beim Sommerfest … richtig kennengelernt' – after some months."}], "hoeren2": {"note": "script reconstructed (no transcript available); statements and key from the book", "intro": "Im Radio erzählt Herr Schütz, Taxifahrer in Hamburg, von seinem Beruf und seiner Freizeit.", "speakers": ["Moderatorin", "Herr Schütz"], "lines": [["A", "Guten Abend, liebe Hörerinnen und Hörer. In unserer Reihe „Berufe in der Stadt“ ist heute Herr Schütz bei uns im Studio. Er fährt Taxi in Hamburg. Herr Schütz, wie lange machen Sie das schon?"], ["B", "Oh, schon ziemlich lange – inzwischen sind es fast zwanzig Jahre. Angefangen habe ich in einer Kleinstadt in Niedersachsen, und vor acht Jahren bin ich nach Hamburg gekommen."], ["A", "Ist Taxifahren in einer Kleinstadt anders als in einer Großstadt?"], ["B", "Ganz anders. In der Kleinstadt kannte ich fast alle Fahrgäste. Ich habe ältere Leute zum Arzt gefahren und Jugendliche nachts aus der Disco geholt. Geschäftsleute gab es dort eigentlich gar nicht – die fahre ich erst hier in Hamburg, jeden Tag zum Flughafen oder zur Messe. In Hamburg ist alles anonymer, man sieht die meisten Leute nur einmal."], ["A", "Man sagt ja, dass Taxifahrer viele Geschichten erleben. Haben Sie sich zum Beispiel schon einmal in einen Fahrgast verliebt?"], ["B", "(lacht) Das fragen mich alle! Nein, das ist mir noch nie passiert. Ich bin seit fünfzehn Jahren glücklich verheiratet. Aber ich habe schon zwei Paare gefahren, die sich in meinem Taxi kennengelernt haben."], ["A", "Erzählen die Fahrgäste viel von sich?"], ["B", "Ja, sehr viel. Und ich glaube, das liegt genau daran, dass sie mich nicht kennen. Sie wissen: Nach zwanzig Minuten steigen sie aus und sehen mich nie wieder. Da erzählen manche Dinge, die sie nicht einmal ihren Freunden sagen."], ["A", "Gibt es da Unterschiede zwischen Männern und Frauen?"], ["B", "Ein bisschen schon. Frauen erzählen oft von ihrer Familie oder von Problemen bei der Arbeit. Männer sprechen dagegen nicht so oft über sich selbst – aber das heißt nicht, dass sie über unpersönliche Dinge reden. Viele Männer erzählen mir sehr offen von ihren Sorgen, von ihrer Ehe oder ihrer Gesundheit. Da war ich am Anfang selbst überrascht."], ["A", "Bekommen Sie von Ihren Fahrgästen auch mal einen guten Tipp?"], ["B", "Trinkgeld bekomme ich oft, darüber freue ich mich natürlich. Aber gute Tipps oder Ratschläge? Nein, eigentlich nie. Die Leute erzählen lieber von sich, als mir etwas zu empfehlen."], ["A", "Was machen Sie in Ihrer Freizeit?"], ["B", "An erster Stelle steht bei mir eindeutig der Sport. Natürlich ist mir meine Familie auch wichtig, aber ohne Sport geht es bei mir nicht – nach so vielen Stunden im Auto muss ich mich einfach bewegen."], ["A", "Welchen Sport machen Sie?"], ["B", "Ich spiele Fußball im Verein und gehe ins Fitnessstudio. Schwimmen gehen eher meine Frau und die Kinder. Ich komme manchmal mit, aber im vollen Hallenbad kann ich mich nicht erholen – nach einem anstrengenden Tag ist mir das zu laut und zu hektisch."], ["A", "Fahren Sie lieber am Tag oder in der Nacht?"], ["B", "Früher bin ich viel nachts gefahren, weil man da besser verdient. Aber vor zwei Jahren habe ich entschieden: Jetzt fahre ich nur noch tagsüber. Die Nächte gehören der Familie."], ["A", "Haben Sie nachts manchmal Angst gehabt?"], ["B", "Ehrlich gesagt ja, ab und zu. Und ich glaube nicht, dass das eine Frage des Alters ist. Junge Kollegen haben genauso Angst wie ältere – sie sagen es vielleicht nur nicht so offen."], ["A", "Herr Schütz, vielen Dank für das interessante Gespräch und allzeit gute Fahrt!"], ["B", "Danke schön, es hat mir Spaß gemacht."]], "items": [{"n": 46, "s": "Herr Schütz arbeitet erst seit kurzer Zeit als Taxifahrer.", "a": "f", "e": "'inzwischen sind es fast zwanzig Jahre'."}, {"n": 47, "s": "In der Kleinstadt hatte Herr Schütz keine Geschäftsleute als Kunden.", "a": "r", "e": "'Geschäftsleute gab es dort eigentlich gar nicht'."}, {"n": 48, "s": "Herr Schütz hat sich schon einmal in einen Fahrgast verliebt.", "a": "f", "e": "'Nein, das ist mir noch nie passiert.'"}, {"n": 49, "s": "Die Fahrgäste erzählen viel, weil sie den Taxifahrer nicht kennen.", "a": "r", "e": "'das liegt genau daran, dass sie mich nicht kennen'."}, {"n": 50, "s": "Männer sprechen oft über unpersönliche Dinge.", "a": "f", "e": "'das heißt nicht, dass sie über unpersönliche Dinge reden. Viele Männer erzählen … sehr offen'."}, {"n": 51, "s": "Herr Schütz bekommt von den Fahrgästen manchmal auch einen Tipp.", "a": "f", "e": "Trap: 'Trinkgeld' yes, but 'gute Tipps oder Ratschläge? Nein, eigentlich nie'."}, {"n": 52, "s": "In der Freizeit steht Sport für Herrn Schütz an erster Stelle.", "a": "r", "e": "'An erster Stelle steht bei mir eindeutig der Sport.'"}, {"n": 53, "s": "Beim Schwimmen kann sich Herr Schütz von einem anstrengenden Tag erholen.", "a": "f", "e": "'im vollen Hallenbad kann ich mich nicht erholen'."}, {"n": 54, "s": "Herr Schütz hat sich entschieden, nur am Tag Taxi zu fahren.", "a": "r", "e": "'Jetzt fahre ich nur noch tagsüber.'"}, {"n": 55, "s": "Nach Meinung von Herrn Schütz haben jüngere Taxifahrer weniger Angst, nachts zu fahren.", "a": "f", "e": "'Junge Kollegen haben genauso Angst wie ältere'."}]}, "hoeren3": [{"n": 56, "s": "In Norddeutschland steigen die Temperaturen morgen auf 5 bis 7 Grad.", "a": "f", "t": "Morgen bleibt es in Norddeutschland kühl. Die Temperaturen erreichen höchstens 3 Grad. Es kann sogar leichten Schneefall geben. Autofahrer sollen vorsichtig fahren, besonders am frühen Morgen.", "e": "Maximum is only 3 degrees ('höchstens 3 Grad'), not 5 to 7."}, {"n": 57, "s": "Hamburg hat öfter gewonnen als Stuttgart.", "a": "r", "t": "Im letzten Jahr war Hamburg im Fußball erfolgreicher als Stuttgart. Die Mannschaft hat mehr Spiele gewonnen und auch bessere Platzierungen erreicht. Viele Fans hoffen nun auf den Aufstieg in die erste Liga.", "e": "'Die Mannschaft hat mehr Spiele gewonnen' – Hamburg won more often."}, {"n": 58, "s": "Nach zwei Monaten müssen Sie für die Zeitschrift bezahlen.", "a": "r", "t": "Sie können die Zeitschrift zwei Monate kostenlos testen. Danach kostet das Abo 5,90 Euro pro Monat. Wenn Sie nicht kündigen, verlängert sich das Abo automatisch.", "e": "Two months free, 'danach kostet das Abo 5,90 Euro pro Monat'."}, {"n": 59, "s": "Auf dem Mittleren Ring in München wird die Geschwindigkeit kontrolliert.", "a": "f", "t": "Die Stadt München plant neue Kontrollen in Wohngebieten. Auf dem Mittleren Ring gibt es aktuell jedoch keine Radarüberwachung. Es wird aber über neue Blitzer diskutiert.", "e": "'Auf dem Mittleren Ring gibt es aktuell jedoch keine Radarüberwachung' – only discussed, not done."}, {"n": 60, "s": "Janas Geburtstagsfest findet nicht im LEO statt.", "a": "f", "t": "Hey, hast du schon gehört? Jana feiert ihren Geburtstag doch im LEO, nicht bei sich zu Hause. Sie hat es gestern noch mal gesagt: Ab 15 Uhr geht's los. Ich bringe Kuchen mit. Kommst du auch?", "e": "'Jana feiert ihren Geburtstag doch im LEO' – the party IS in the LEO."}], "schreiben": {"letter": "Liebe(r) …,\n\nes tut mir wirklich leid, dass ich dir schon so lange nicht geschrieben habe. Bei mir ist im letzten Monat ziemlich viel los gewesen.\n\nVor drei Wochen bin ich nämlich in eine neue Wohnung gezogen, weil die alte für mich zu klein war. Mittlerweile habe ich mich schon sehr schön eingerichtet, mit ein paar neuen Möbeln usw. Ich fühle mich wirklich wohl! Hast du nicht Lust, im Sommer zu mir zu Besuch zu kommen?\n\nIn meiner neuen Wohnung habe ich jetzt auch ein kleines Arbeitszimmer für meine ganzen Bücher und den Schreibtisch mit dem Computer. Wie ist das bei dir? Machst du eigentlich viel am Computer?\n\nLass doch mal wieder was von dir hören!\n\nLiebe Grüße und bis bald\nAndreas", "task": "Antworten Sie auf den Brief. Schreiben Sie etwas zu den folgenden vier Punkten.", "points": ["Ihre Erfahrungen mit dem Computer", "Etwas über Ihre Wohnung", "Ob Sie Andreas besuchen möchten", "Was es bei Ihnen Neues gibt"], "model": "Berlin, 3. April 2025\n\nLieber Andreas,\n\nvielen Dank für deinen Brief! Herzlichen Glückwunsch zur neuen Wohnung! Schön, dass du dich dort so wohlfühlst.\n\nBei mir gibt es auch Neuigkeiten: Ich habe im Februar einen neuen Job in einem Reisebüro angefangen. Die Arbeit macht mir viel Spaß, aber ich arbeite den ganzen Tag am Computer. Deshalb benutze ich ihn zu Hause nicht so oft – nur für E-Mails und manchmal, um Filme zu sehen.\n\nMeine Wohnung ist nicht so groß wie deine. Ich habe zwei Zimmer, eine kleine Küche und einen Balkon. Ein Arbeitszimmer habe ich leider nicht, mein Schreibtisch steht im Wohnzimmer. Aber die Wohnung ist hell und liegt sehr zentral.\n\nIch komme dich sehr gern im Sommer besuchen! Am besten passt es mir im Juli, denn da habe ich zwei Wochen Urlaub. Geht das bei dir?\n\nSchreib mir bald!\n\nLiebe Grüße\ndein(e) …", "phrases": ["Herzlichen Glückwunsch zur neuen Wohnung!", "Bei mir gibt es auch Neuigkeiten: …", "Ich arbeite viel / nicht so oft am Computer, weil …", "Meine Wohnung hat … Zimmer und liegt …", "Ich komme dich sehr gern besuchen!", "Am besten passt es mir im …"]}, "vocab": [["bearbeiten", "to edit"], ["die Anmeldung, -en", "registration"], ["der Treffpunkt, -e", "meeting point"], ["die Begegnung, -en", "encounter"], ["zur Verfügung stehen", "to be available"], ["das Rezept, -e", "recipe"], ["die Torte, -n", "gateau, cake"], ["die Messe, -n", "trade fair"], ["vorstellen", "to present"], ["ausprobieren", "to try out"], ["einen Preis vergeben", "to award a prize"], ["die Studie, -n", "study"], ["das Vorurteil, -e", "prejudice"], ["plaudern", "to chat"], ["reparieren", "to repair"], ["kaputt", "broken"], ["wegwerfen (wirft weg, warf weg, hat weggeworfen)", "to throw away"], ["der/die Freiwillige, -n", "volunteer"], ["die Spende, -n", "donation"], ["das Ersatzteil, -e", "spare part"], ["enttäuscht", "disappointed"], ["umziehen (zog um, ist umgezogen)", "to move house"], ["die Nachhilfe", "private tutoring"], ["liefern", "to deliver"], ["die Ausstellung, -en", "exhibition"], ["mieten", "to rent"], ["der Wohnwagen, -", "caravan"], ["der Ruhetag, -e", "closing day"], ["sich freuen über + Akk", "to be pleased about"], ["überlegen", "to consider"], ["eröffnen", "to open"], ["interessiert sein an + Dat", "to be interested in"], ["das Angebot, -e", "offer"], ["unbekannt", "unknown"], ["so schnell wie möglich", "as soon as possible"], ["falls", "in case"], ["die Erfahrung, -en", "experience"], ["der Fahrgast, -gäste", "passenger"], ["sich verlieben in + Akk", "to fall in love with"], ["unpersönlich", "impersonal"], ["sich erholen", "to recover, relax"], ["anstrengend", "exhausting"], ["sich entscheiden (entschied, hat entschieden)", "to decide"], ["Angst haben vor + Dat", "to be afraid of"], ["die Geschwindigkeit, -en", "speed"], ["kontrollieren", "to check"], ["das Abo(nnement), -s", "subscription"], ["sich einrichten", "to furnish one's home"], ["das Arbeitszimmer, -", "study (room)"], ["sich wohlfühlen", "to feel at home"], ["zu Besuch kommen", "to come for a visit"]], "grammar": ["sich freuen über + Akk (darüber) vs. sich freuen auf + Akk (future)", "arbeiten als + Beruf", "weil (verb at the end) vs. denn (normal word order)", "ohne + Akkusativ: ohne sie", "Indirekte Frage mit ob", "so … dass", "aus + Land zurückkommen", "Ich würde mich freuen, wenn …", "Relativpronomen: das Café, das …", "interessiert sein an + Dativ", "vor + Zeitangabe (vor zwei Jahren)", "Infinitiv mit zu: das Angebot, … zu arbeiten", "falls = wenn (Bedingung), Verb am Ende"]}, {"n": 13, "title": "Eine Karte · Du oder Sie · Herr Samir", "lesen1": {"headlines": {"a": "Eine Karte – viele Vorteile", "b": "Endlich Ferien ohne Kinder", "c": "Günstiger Urlaub für Vereinsmitglieder", "d": "Meer statt Berge", "e": "Neues Wohnprojekt für Alleinerziehende", "f": "Reisebüros weltweit vernetzt", "g": "Schweizer Seen weiterhin sehr beliebt", "h": "Söhne schenken mehr als Töchter", "i": "Söhne werden großzügiger beschenkt", "j": "Tipps: Wo auch Kinder ihren Spaß haben"}, "texts": ["Das fängt ja gut an: Schon im Kinderzimmer werden Jungs bevorzugt – sie bekommen mehr geschenkt als Mädchen. Das ist das Ergebnis einer Untersuchung vom Bundesverband des Spielwaren-Einzelhandels. Bundesweit wurden 6500 Familien nach ihren Schenkgewohnheiten befragt. Fast immer wurde für die Söhne – auch schon im Babyalter – mehr gekauft. Zuständig für die Geschenke sind übrigens meist die Mütter.", "In diesem Sommer werden weitere 200 Großstadt-Jugendherbergen auf der ganzen Welt miteinander vernetzt. ICYN heißt das Zauberwort – International Communication Youth Network. Das System wurde speziell für Jugendherbergen entwickelt. Für nur 15 Euro Jahresgebühr kann man mit der ICYN-Karte weltweit nicht nur Übernachtungen in anderen Herbergen reservieren, sondern auch unbegrenzt im Internet surfen, sogar gratis übers Internet telefonieren, Bahn- und Flugtickets bargeldlos buchen sowie günstige Konzerttickets bekommen.", "Ob zu Hause, irgendwo in der Schweiz oder im Ausland: Ferien mit Kindern wollen gut geplant sein. Wo gibt es denn Orte, wo Kinder noch Abenteuer erleben, Hotels oder Wohnungen, in denen sie sich wohl fühlen, wo aber gleichzeitig auch die Eltern auf ihre Rechnung kommen? Ruth Michaela Richter gibt Tipps, verrät Adressen und zeigt Beispiele. Damit werden sogar Städtereisen oder Schlossferien in England interessant.", "Die Sehnsucht nach dem Meer ist in der Schweiz groß, vor allem bei der jüngeren Generation. Ein Drittel der Schweizerinnen und Schweizer würde nach einer Umfrage im Tausch für eine Meeresküste die Hälfte der Berge hergeben. Die Zeitschrift mare ließ über 1000 Personen in der Schweiz nach ihrem Verhältnis zum Meer befragen. Rund 42 Prozent der 15- bis 34-Jährigen würden – treu dem Motto der Jugendbewegung der 80er Jahre: „Nieder mit den Alpen, freie Sicht aufs Mittelmeer“ – den Tausch eingehen. In der Deutschschweiz könnten sich nur 29 Prozent von den Bergen trennen, in der Romandie sind es 37 und im Tessin 43 Prozent.", "Ob für die traditionelle Familie oder für Alleinerziehende: Der Verein für Familienherbergen in Gelsenkirchen bietet schon seit Jahren preisgünstige Ferien. Über 1100 Zimmer und Wohnungen – auch für das kleine Portemonnaie – stehen zwischen Nordsee und Sizilien den Mitgliedern im neuen Katalog zur Auswahl. Nichtmitglieder erhalten diesen Katalog gegen eine Gebühr von 5 Euro. Infos: Telefon 061/981 25 25 oder www.ferienwohnung.ch"], "key": ["i", "a", "j", "d", "c"], "why": ["Boys (sons) RECEIVE more presents – trap h says sons GIVE more.", "One ICYN card gives many advantages (booking, internet, phone, tickets); it links youth hostels, not travel agencies (trap f).", "Tips and addresses for holidays where children have adventures – not holidays without children (trap b).", "Many Swiss would give up half the mountains for a sea coast: 'Meer statt Berge'.", "Cheap holidays for members of the Verein für Familienherbergen; 'Alleinerziehende' is mentioned but it is not a housing project (trap e)."]}, "lesen2": {"title": "Du oder Sie – das ist hier die Frage. Sprachliche Regeln am Arbeitsplatz", "text": "Häufig erscheint Ingvar Kamprad, Ikea-Gründer und -Besitzer, am Morgen unangemeldet am Hintereingang einer seiner Filialen: „Guten Morgen, ich bin der Ingvar.“ Das schwedische Möbelhaus ist das beste Beispiel für die Du-Kultur am Arbeitsplatz, denn alle Beschäftigten sprechen sich mit Du an. Die Gesellschaft für deutsche Sprache in Wiesbaden hat nun in einer Untersuchung festgestellt, dass mehr als 53 Prozent der befragten Personen alle Arbeitskollegen duzen. Wie zu erwarten, sind es vor allem die 16- bis 29-Jährigen (59 Prozent), die sich lieber schnell duzen. Bei den über 60-Jährigen sank die Zahl auf 14 Prozent. Warum eigentlich sagt man am Arbeitsplatz immer öfter Du? Zum Beispiel pflegen Ikea, Greenpeace und McDonald's alle das obligatorische Du. Damit wollen sie Vertrauen aufbauen und ein familiäres Umfeld schaffen.\n\nGegenüber den Kunden ist man jedoch vorsichtiger geworden. So hat Ikea im Verkaufskatalog statt dem Du wieder das Sie eingeführt. Man hofft, mit Sie mehr Leute, nicht nur jüngere, anzusprechen. Bis heute üblich ist das Du zum Beispiel in Schweizer Gewerkschaften. Viele Mitglieder sind sogar beleidigt, wenn sie mit Sie angesprochen werden. Es gibt aber auch den umgekehrten Fall, und zwar bei der Polizei. Wer in Deutschland einen Polizisten duzt, riskiert eine Strafe. In der Schweiz hingegen findet man eine Anzeige wegen Duzens eines Beamten übertrieben. „Polizisten werden sowieso kaum mit Du angesprochen“, meint Hanspeter Fäh von der Zürcher Stadtpolizei. Der Trend zum Du kann jedoch auch als sozialer Druck oder Zwang empfunden werden. Ein Du abzulehnen gilt nämlich als unfreundlich. Das hat Dieter S., Angestellter bei einem Textilgeschäft in Deutschland, erfahren: Ein Gericht entschied, dass er seine Kollegen weiterhin mit Du ansprechen musste.\n\nSo sehr das Du in der Gesellschaft auch an Bedeutung gewinnt, das Sie hat immer noch eine feste soziale Basis und kann diese sogar ausbauen. Benimmkurse, wo man Höflichkeit und die richtigen Umgangsformen lernt, sind heute im Trend. Immer mehr Firmen schulen ihre Mitarbeiter in stilvollem Verhalten. Dazu gehören folgende Grundregeln: Die ältere Person bietet der jüngeren das Du an. Oft ist jedoch auch die Stellung entscheidend: Der ältere Mitarbeiter bietet seinem jüngeren Chef nie das Du an.", "note": "reconstructed (answer options a–c missing in the book; written to match the key)", "q": [{"n": 6, "stem": "Die Firma Ikea benutzt heute das Du …", "opts": {"a": "nur noch unter den Mitarbeitern.", "b": "auch im Katalog für die Kunden.", "c": "nur gegenüber jungen Kunden."}, "key": "a", "why": "All employees say Du, but 'So hat Ikea im Verkaufskatalog statt dem Du wieder das Sie eingeführt.'"}, {"n": 7, "stem": "In der Schweiz …", "opts": {"a": "bekommt man eine Strafe, wenn man einen Polizisten duzt.", "b": "duzen sich die Mitglieder von Gewerkschaften.", "c": "duzen die meisten Leute Polizisten."}, "key": "b", "why": "'Bis heute üblich ist das Du zum Beispiel in Schweizer Gewerkschaften.' The fine for Du to police is in Germany."}, {"n": 8, "stem": "Eine Untersuchung hat gezeigt, …", "opts": {"a": "dass ältere Menschen ihre Kollegen öfter duzen als jüngere.", "b": "dass mehr als die Hälfte der Befragten alle Kollegen duzt.", "c": "dass nur 14 Prozent der Angestellten das Du gut finden."}, "key": "b", "why": "'…dass mehr als 53 Prozent der befragten Personen alle Arbeitskollegen duzen.' 14% refers to people over 60."}, {"n": 9, "stem": "Durch Kurse können Angestellte …", "opts": {"a": "gutes Benehmen und Höflichkeit lernen.", "b": "neue Trends beim Einrichten des Arbeitsplatzes kennen lernen.", "c": "lernen, wie man dem Chef das Du anbietet."}, "key": "a", "why": "'Benimmkurse, wo man Höflichkeit und die richtigen Umgangsformen lernt, sind heute im Trend.'"}, {"n": 10, "stem": "Probleme am Arbeitsplatz kann es geben, …", "opts": {"a": "wenn ein jüngerer Chef seinen Mitarbeitern das Du anbietet.", "b": "wenn man Kunden mit Du anspricht.", "c": "wenn man das Du von Kollegen nicht annimmt."}, "key": "c", "why": "'Ein Du abzulehnen gilt nämlich als unfreundlich' – Dieter S. even had to go to court."}]}, "lesen3": {"note": "reconstructed (ads a–l missing in the book; written to match the key)", "situations": ["Sie haben von einer Schweizer Schauspielerin gehört und möchten gern einen Film mit ihr sehen.", "Sie haben gerade Ihre Ausbildung beendet und suchen eine Stelle an der Rezeption.", "Sie interessieren sich für Umweltschutz und suchen eine passende Sendung.", "Ihr Freund, der am Institut für Film und Bild studiert, sucht einen geeigneten Praktikumsplatz.", "In einer Sendereihe wird im Fernsehen über die neue politische Entwicklung in Deutschland berichtet. Sie wollen sich informieren.", "Sie interessieren sich für Großstädte und ihre Entwicklung und suchen dazu eine Sendung im Rundfunk.", "Sie sind mit der Schule fertig und wollen bei der Deutschen Bahn eine Ausbildung machen.", "Sie interessieren sich für politisches Theater und möchten dazu am Wochenende etwas hören oder sehen.", "Sie arbeiten gern mit anderen zusammen und suchen eine Tätigkeit bei einer Werbefirma.", "Sie wollen mehr über das Thema Arbeiten in Europa erfahren."], "ads": {"a": "Filmproduktion Alpenblick, Zürich: Für unsere Dokumentarfilme suchen wir ab Herbst Praktikantinnen und Praktikanten mit Grundkenntnissen in Kamera und Schnitt. Ideal für Studierende einer Film- oder Medienhochschule. Dauer: 6 Monate. Bewerbung an praktikum@alpenblick-film.ch", "b": "Kreativ im Team! Die Werbeagentur Ideenreich sucht eine/n Assistent/in für unsere Projektgruppen. Sie lieben Teamarbeit, haben gute Ideen und sind kommunikativ? Dann rufen Sie uns an: 0711/45 67 80.", "c": "Kunstmuseum Basel: Sonderausstellung „Schweizer Malerei im 20. Jahrhundert“. Täglich außer Montag von 10 bis 18 Uhr. Führungen jeden Sonntag um 11 Uhr.", "d": "Kino Odeon präsentiert: „Heidis Rückkehr“ – der neue Film mit der Schweizer Schauspielerin Anna Brunner, die in Locarno als beste Darstellerin ausgezeichnet wurde. Täglich 18.00 und 20.30 Uhr.", "e": "Fotokurs für Anfänger: Lernen Sie an vier Abenden, wie man mit der Digitalkamera bessere Bilder macht. Volkshochschule Mitte, Kursbeginn 3. März.", "f": "„Grüne Erde“ – das Umweltmagazin im Bayerischen Fernsehen. Diese Woche: Wie schützen wir unsere Flüsse? Was kann jeder Einzelne gegen den Klimawandel tun? Mittwoch, 21.15 Uhr.", "g": "Hotel Bellevue**** in Luzern sucht ab sofort eine/n Rezeptionist/in. Wir bieten auch Berufseinsteigern nach abgeschlossener Ausbildung im Hotelfach eine Chance. Gute Englischkenntnisse erwünscht.", "h": "Die Deutsche Bahn sucht erfahrene Lokführerinnen und Lokführer mit mindestens drei Jahren Berufspraxis für den Regionalverkehr. Attraktive Bezahlung, sicherer Arbeitsplatz.", "i": "ZDF-Reihe „Deutschland im Wandel“: In sechs Folgen berichten unsere Reporter über die aktuelle politische Entwicklung in Berlin und in den Bundesländern. Jeden Donnerstag um 22.15 Uhr.", "j": "Hörspiel am Samstag: „Die Macht der Worte“ – ein politisches Theaterstück von Rolf Hochhuth, live aus dem Berliner Ensemble übertragen. Samstag, 20.05 Uhr, Deutschlandradio Kultur.", "k": "Radio DRS 2, Reihe „Metropolen“: Wie verändern sich die großen Städte der Welt? Diese Woche: New York, Tokio und São Paulo – Wohnen, Verkehr und Leben in der Megastadt. Dienstag, 19.30 Uhr.", "l": "Infoabend „Jobs ohne Grenzen“: Wie finde ich eine Arbeit in einem anderen EU-Land? Welche Papiere brauche ich? Experten der EURES-Beratung informieren. Donnerstag, 18 Uhr, Arbeitsamt Freiburg."}, "key": ["d", "g", "f", "a", "i", "k", "x", "j", "l", "b"], "why": ["Ad d: a film with a Swiss actress.", "Ad g: hotel reception job, beginners after training welcome.", "Ad f: environmental magazine on TV.", "Ad a: internship in film production for film students.", "Ad i: TV series about political development in Germany.", "Ad k: radio series about big cities.", "No ad: h is from the Deutsche Bahn but needs experienced train drivers, not school leavers wanting an apprenticeship.", "Ad j: political theatre on the radio on Saturday (weekend).", "Ad l: information evening about working in other EU countries.", "Ad b: advertising agency that wants team players."]}, "sprach1": {"note": "reconstructed (most answer options are unreadable in the book; built around the key words)", "text": "Sehr geehrter Herr Samir,\n\nim Mai habe ich bei [21] für mich und meine Familie Flugtickets nach Indien bestellt und diese zwei Tage vor Abflug am 27. Juni auch erhalten. Leider entsprachen die Tickets überhaupt nicht dem, was zuvor bei der Buchung am Telefon ausgemacht worden [22].\n\n[23] ich ausdrücklich einen Direktflug nach Mumbai bestellt hatte, haben Sie mir Tickets [24] Zwischenstopp in Delhi ausgestellt. Wir mussten eine Nacht in Delhi verbringen und kamen so [25] einen Tag später als geplant in Mumbai an. Doch damit nicht genug. Die Tickets waren nämlich nicht nur anders als vereinbart, [26] auch noch viel teurer. Statt der erwarteten 640 Euro kosteten [27] Tickets 720 Euro.\n\nIch darf Sie daher [28] Rückzahlung der zu viel verrechneten Kosten auf mein Konto [29] der Bank of India in Mumbai bitten. Meine Bankdaten finden Sie unten.\n\nIch bitte Sie, die Angelegenheit bald zu klären und [30] dann zu antworten.\n\nMit freundlichen Grüßen", "q": [{"n": 21, "opts": {"a": "dir", "b": "Ihnen", "c": "euch"}, "key": "b", "why": "bei + Dativ; formal letter to Herr Samir → Ihnen (capital I)."}, {"n": 22, "opts": {"a": "ist", "b": "war", "c": "hat"}, "key": "b", "why": "Passive past perfect: ausgemacht worden war (Plusquamperfekt Passiv)."}, {"n": 23, "opts": {"a": "Danach", "b": "Obwohl", "c": "Nämlich"}, "key": "b", "why": "Contrast with verb at the end: Obwohl ich … bestellt hatte, …"}, {"n": 24, "opts": {"a": "ohne", "b": "mit", "c": "von"}, "key": "b", "why": "Tickets mit Zwischenstopp = with a stopover (he got a stopover he did not want)."}, {"n": 25, "opts": {"a": "erst", "b": "schon", "c": "noch"}, "key": "a", "why": "erst = later than expected (arrived only one day later)."}, {"n": 26, "opts": {"a": "aber", "b": "sondern", "c": "sonst"}, "key": "b", "why": "nicht nur …, sondern auch …"}, {"n": 27, "opts": {"a": "der", "b": "den", "c": "die"}, "key": "c", "why": "Subject, plural: die Tickets (Nominativ Plural)."}, {"n": 28, "opts": {"a": "für", "b": "um", "c": "zu"}, "key": "b", "why": "jemanden um etwas bitten (+ Akk)."}, {"n": 29, "opts": {"a": "an", "b": "bei", "c": "von"}, "key": "b", "why": "ein Konto bei einer Bank haben."}, {"n": 30, "opts": {"a": "mich", "b": "mir", "c": "Ihnen"}, "key": "b", "why": "antworten + Dativ: mir antworten."}]}, "sprach2": {"text": "Sehr geehrte Damen und Herren,\n\nunsere Organisation hat den [31], eine deutsch-französische Konferenz zu europäischen Entwicklungsprogrammen vorzubereiten. Diese Veranstaltung könnte in Breisach [32], und daher brauchen wir von Ihnen nähere [33]. In Ihrer Anzeige [34] Sie die Sehenswürdigkeiten von Breisach und die verschiedenen touristischen Möglichkeiten. Deshalb erscheint uns Ihre Stadt als sehr [35], auch [36] sie als Brücke zu Europa gilt.\n\nNun haben wir folgende Bitte: Für diese Veranstaltung [37] wir ein gutes Hotel, möglichst am Ufer des Rheins, mit Konferenz- und Arbeitsräumen, ausgestattet mit den notwendigen technischen Anlagen, Internetanschluss usw. Es sollte [38] ruhig gelegen sein. Können Sie uns dazu Vorschläge schicken? Der [39] wäre der 15.–21. November.\n\nBitte geben Sie uns möglichst bald Bescheid. Für Prospekte und Informationen zu Preisen und Buchungsbedingungen [40] wir Ihnen dankbar.\n\nMit freundlichen Grüßen\nAdrian Schöller\nEVD Trans GmbH", "words": {"a": "auch", "b": "Auftrag", "c": "beschreiben", "d": "fragen", "e": "geeignet", "f": "gegenüber", "g": "Informationen", "h": "könnten", "i": "stattfinden", "j": "suchen", "k": "Termin", "l": "Tour", "m": "vor", "n": "wären", "o": "weil"}, "key": ["b", "i", "g", "c", "e", "o", "j", "a", "k", "n"], "why": ["den Auftrag haben, etwas zu tun = to have the task.", "Modal verb könnte + infinitive at the end: stattfinden.", "nähere Informationen = more detailed information (plural noun).", "Sie beschreiben … (verb, 2nd position, plural Sie).", "sehr geeignet = very suitable (adjective after 'als sehr').", "Reason clause, verb at the end: weil sie … gilt.", "wir suchen ein Hotel (verb for wir).", "auch = also (should also be quiet).", "der Termin = the date (masculine, matches 'Der').", "Polite Konjunktiv: wir wären Ihnen dankbar."]}, "hoeren1": [{"n": 41, "s": "Für den Sprecher ist es unwichtig, ob seine Kinder in der Schule gut sind.", "a": "f", "t": "Also, ich finde es sehr wichtig, dass meine Kinder gute Noten bekommen. Die Schule ist der Schlüssel für ihre Zukunft. Wenn sie in der Schule gut sind, haben sie später bessere Chancen. Ich achte darauf, dass sie lernen und ihre Hausaufgaben machen.", "e": "He says good grades are very important – the opposite of 'unwichtig'."}, {"n": 42, "s": "Der Sprecher findet es wichtig, dass Eltern immer für ihre Kinder da sind.", "a": "r", "t": "Für mich ist es selbstverständlich, dass Eltern immer für ihre Kinder da sind. Egal, ob sie Hilfe bei den Hausaufgaben brauchen oder Probleme mit Freunden haben – ich höre zu und unterstütze sie, wann immer sie mich brauchen. Das ist einfach meine Aufgabe als Vater.", "e": "'Für mich ist es selbstverständlich, dass Eltern immer für ihre Kinder da sind.'"}, {"n": 43, "s": "Die Sprecherin glaubt, dass sie mehr mit ihrer Tochter sprechen müsste.", "a": "f", "t": "Ich denke, ich spreche schon sehr oft mit meiner Tochter. Wir erzählen uns alles über die Schule, Freunde oder wie es uns geht. Ich sehe keinen Grund, warum ich noch mehr sprechen sollte. Unsere Beziehung ist gut, so wie sie ist.", "e": "She already talks a lot and sees no reason to talk more."}, {"n": 44, "s": "Es ist dem Sprecher wichtig, dass seine Kinder gesund leben.", "a": "r", "t": "Mir ist es sehr wichtig, dass meine Kinder gesund leben. Sie sollen Obst und Gemüse essen, viel Wasser trinken und sich jeden Tag bewegen. Fernsehen oder Handy gibt es nur begrenzt. Gesundheit steht für mich an erster Stelle, besonders in jungen Jahren.", "e": "'Mir ist es sehr wichtig, dass meine Kinder gesund leben.'"}, {"n": 45, "s": "Der Sprecher möchte, dass sein Kind die eigenen Ideen realisieren kann.", "a": "r", "t": "Ich möchte, dass mein Kind seine eigenen Ideen verwirklichen kann. Wenn es später Künstler, Ingenieur oder Bäcker werden will, unterstütze ich das. Wichtig ist, dass es glücklich ist und das macht, was ihm wirklich Spaß macht – nicht, was ich will.", "e": "'…seine eigenen Ideen verwirklichen kann' = realisieren."}], "hoeren2": {"intro": "Im Radio erzählt Frau Nicole Zimmermann, Mutter und Lehrerin, vom Spielpark Hartenfels in Torgau.", "speakers": ["Moderator", "Frau Zimmermann"], "lines": [["A", "Willkommen bei unserem heutigen Interview. Bei uns zu Gast ist Frau Nicole Zimmermann, eine engagierte Mutter und Lehrerin, die uns von einem besonderen Ort in Torgau erzählen wird. Frau Zimmermann, was macht diesen Ort für Familien so interessant?"], ["B", "Vielen Dank. Also, Torgau ist ja allgemein bekannt für seine historischen Sehenswürdigkeiten. Viele Touristen kommen gerade deshalb in die Stadt. Aber für Familien mit Kindern ist der neue Spielpark Hartenfels ein echtes Highlight geworden."], ["A", "Spielpark Hartenfels – das klingt spannend. Seit wann gibt es diesen Park denn?"], ["B", "Der Park wurde erst vor zwei Jahren eröffnet, ist also noch ziemlich neu. Ich finde, das merkt man auch: Alles ist modern gestaltet, sicher und gut gepflegt."], ["A", "Und was genau bietet dieser Spielpark für Kinder?"], ["B", "Oh, sehr viel. Es gibt dort Spielgeräte, die man zu Hause in der Wohnung natürlich nicht hat: große Kletterburgen, Wasserspiele und sogar eine kleine Baustelle, auf der Kinder selbst mit Sand, Holz und Steinen etwas bauen dürfen. Das ist besonders beliebt."], ["A", "Das klingt kreativ. Gibt es auch andere Freizeitangebote in der Umgebung?"], ["B", "Also, ehrlich gesagt nicht wirklich viele. Die Region ist eher ruhig. Abgesehen vom Spielpark gibt es ein paar kleinere Grünflächen, aber keine speziellen Angebote für Kinder, wie zum Beispiel Schwimmbäder oder Kinderbauernhöfe."], ["A", "Manche Eltern haben ja Sorge, dass solche freien Spielangebote auch gefährlich sein könnten. Gibt es da Risiken?"], ["B", "Natürlich sollen die Kinder frei spielen dürfen, aber Sicherheit ist uns auch wichtig. Das Spielen am Bach war früher ein Problem, aber dieser Bereich wurde inzwischen gesichert und ist derzeit sogar gesperrt. Also kein Grund zur Sorge."], ["A", "Und wie ist es mit der Aufsicht? Müssen beide Elternteile dabei sein?"], ["B", "Nein, das ist gar nicht nötig. Die meisten Eltern sitzen auf den Bänken rund um den Spielbereich, und oft ist nur ein Elternteil mit den Kindern dort. Es ist so konzipiert, dass man als Erwachsener von fast überall einen guten Überblick hat."], ["A", "Gibt es auch professionelle Betreuung für kleinere Kinder?"], ["B", "Im Moment leider nicht. Es war geplant, dass Kinder bis sieben Jahre betreut werden, aber das Angebot wurde bisher nicht umgesetzt. Es gibt freiwillige Helfer, aber keine feste Betreuung durch Fachkräfte."], ["A", "Wie sieht es mit dem Eintritt aus?"], ["B", "Der Eintritt in den Spielpark ist aktuell kostenlos. Ich denke, das ist auch ein Grund, warum so viele Familien regelmäßig kommen. Für eine Stadt wie Torgau ist das ein tolles Angebot."], ["A", "Klingt großartig. Gibt es auch andere Angebote, wie Führungen durch das Schloss?"], ["B", "Ja, Schlossführungen werden angeboten, aber sie sind eher historisch ausgerichtet. Für Kinder ist das oft zu trocken. Mein Sohn fand es langweilig, er wollte lieber wieder auf die Rutsche. Für Erwachsene kann es interessant sein, aber die Kinder haben meist nicht so viel Spaß daran."], ["A", "Frau Zimmermann, vielen Dank für das Gespräch und die spannenden Einblicke."], ["B", "Sehr gerne. Es hat mich gefreut."]], "items": [{"n": 46, "s": "Viele Touristen besuchen Torgau wegen seiner historischen Sehenswürdigkeiten.", "a": "r", "e": "'Torgau ist ja allgemein bekannt für seine historischen Sehenswürdigkeiten. Viele Touristen kommen gerade deshalb.'"}, {"n": 47, "s": "Den Spielpark Hartenfels gibt es schon seit vielen Jahren.", "a": "f", "e": "'Der Park wurde erst vor zwei Jahren eröffnet.'"}, {"n": 48, "s": "Außer dem Spielpark gibt es in der Umgebung viele andere Freizeitmöglichkeiten für die Kinder.", "a": "f", "e": "'ehrlich gesagt nicht wirklich viele … keine speziellen Angebote für Kinder.'"}, {"n": 49, "s": "Der Spielpark bietet den Kindern Spielmöglichkeiten, die sie zu Hause nicht haben.", "a": "r", "e": "'Spielgeräte, die man zu Hause in der Wohnung natürlich nicht hat.'"}, {"n": 50, "s": "Die Kinder können im Spielpark auch selbst etwas bauen.", "a": "r", "e": "'eine kleine Baustelle, auf der Kinder selbst … etwas bauen dürfen.'"}, {"n": 51, "s": "Das Spielen am Bach kann für die Kinder gefährlich werden.", "a": "f", "e": "'…dieser Bereich wurde inzwischen gesichert und ist derzeit sogar gesperrt.'"}, {"n": 52, "s": "Beide Elternteile müssen auf die Kinder aufpassen.", "a": "f", "e": "'Nein, das ist gar nicht nötig … oft ist nur ein Elternteil dort.'"}, {"n": 53, "s": "Im Spielpark können Kinder bis zum Alter von sieben Jahren von Aufsichtspersonen betreut werden.", "a": "f", "e": "'Es war geplant … aber das Angebot wurde bisher nicht umgesetzt.'"}, {"n": 54, "s": "Der Eintritt in den Spielpark ist zurzeit frei.", "a": "r", "e": "'Der Eintritt in den Spielpark ist aktuell kostenlos.'"}, {"n": 55, "s": "Die Schlossführung bereitet Kindern und Erwachsenen viel Spaß.", "a": "f", "e": "'Für Kinder ist das oft zu trocken. Mein Sohn fand es langweilig.'"}]}, "hoeren3": [{"n": 56, "s": "Der nächste Zug nach Füssen fährt um 11:56 Uhr.", "a": "r", "t": "Achtung, Achtung! Der nächste Zug nach Füssen fährt planmäßig um 11:56 Uhr von Gleis 4. Bitte beachten Sie die Lautsprecherdurchsagen und informieren Sie sich über mögliche Änderungen. Wir wünschen allen Fahrgästen eine angenehme Reise. Ihre Deutsche Bahn.", "e": "The time 11:56 is said exactly ('planmäßig')."}, {"n": 57, "s": "Die Firma befindet sich in der Bellmondstraße.", "a": "f", "t": "Willkommen bei der Firma Trendline GmbH. Unsere neue Adresse lautet Industriestraße 12, direkt gegenüber dem Hauptbahnhof. Für weitere Informationen besuchen Sie bitte unsere Website oder schreiben Sie uns eine E-Mail. Vielen Dank für Ihren Anruf.", "e": "The new address is Industriestraße 12, not Bellmondstraße."}, {"n": 58, "s": "Im City-Kino werden im Untergeschoss alte Filme gezeigt.", "a": "f", "t": "Und hier ein Tipp fürs Wochenende: Im City-Kino läuft ab Samstag die Filmreihe „Klassiker neu erleben“. Gezeigt werden bekannte Filme aus den 70er- und 80er-Jahren – aber nicht im Untergeschoss, sondern im großen Saal oben. Beginn ist jeweils um 18 Uhr.", "e": "Old films, yes – but 'nicht im Untergeschoss, sondern im großen Saal oben'."}, {"n": 59, "s": "Das Zugteam bringt Ihnen Südtiroler Käsespezialitäten an Ihren Platz.", "a": "f", "t": "Sehr geehrte Fahrgäste, willkommen an Bord des ICE 271 in Richtung München. In unserem Bordbistro finden Sie eine Auswahl an warmen und kalten Getränken sowie kleine Snacks. Bitte beachten Sie, dass kein Service am Platz stattfindet. Wir wünschen Ihnen eine angenehme Reise.", "e": "'…dass kein Service am Platz stattfindet' – nothing is brought to your seat."}, {"n": 60, "s": "Die Großmutter kann heute nicht kommen.", "a": "f", "t": "Hallo Lisa, ich wollte dir nur kurz Bescheid geben: Oma kommt heute doch vorbei. Sie hat angerufen und gesagt, dass es ihr besser geht und sie sich auf den Besuch freut. Sie bringt sogar ihren berühmten Kartoffelsalat mit. Wir sollen gegen 15 Uhr bereit sein. Bis später!", "e": "'Oma kommt heute doch vorbei' – she IS coming."}], "schreiben": {"letter": "Liebe(r) …,\n\nnach unserem schönen, gemeinsamen Erlebnis letztes Jahr möchte ich auch dieses Jahr wieder einen Ausflug für uns alle organisieren. Ich hoffe sehr, dass ihr Zeit habt und mitkommen könnt – ich freue mich schon jetzt, euch alle bald wiederzusehen! Das Dumme ist nur, dass ich mir vor drei Wochen beim Basketball das Bein gebrochen habe und noch nicht so gut zu Fuß bin. Deshalb habe ich einen gemütlichen Ausflug mit Bus und Schiff geplant – hoffentlich ist dann auch das Wetter gut für die Schifffahrt! Wohin es geht, möchte ich euch aber noch nicht verraten – das soll eine Überraschung werden.\n\nTermin: übernächster Samstag\nZeit und Treffpunkt: 9:30 Uhr bei mir\n\nBitte schreibt mir doch, ob ihr beim Ausflug dabei sein könnt!\n\nHoffentlich bis bald\nThomas", "task": "Antworten Sie Thomas. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Alternativvorschlag für schlechtes Wetter", "Einladung annehmen", "Was Sie noch über den Ausflug wissen wollen", "Auf Sportunfall reagieren"], "model": "Köln, den 12. Mai 2025\n\nLieber Thomas,\n\nvielen Dank für Deine E-Mail, über die ich mich sehr gefreut habe. Es tut mir wirklich leid, dass Du Dir beim Basketball das Bein gebrochen hast. Ich hoffe, es geht Dir schon etwas besser, und wünsche Dir gute Besserung!\n\nDeine Einladung nehme ich sehr gerne an. Übernächsten Samstag habe ich Zeit und ich komme pünktlich um 9:30 Uhr zu Dir. Ich habe aber noch ein paar Fragen: Wann kommen wir ungefähr zurück? Sollen wir etwas zu essen und zu trinken mitnehmen? Und wie viel kostet die Fahrt mit dem Schiff?\n\nFalls das Wetter schlecht ist, habe ich einen Vorschlag: Wir könnten ins Museum gehen oder bei Dir zu Hause einen gemütlichen Spieleabend machen. Ich bringe dann einen Kuchen mit.\n\nIch freue mich schon sehr auf den Ausflug und auf die Überraschung!\n\nViele Grüße\nDein Ali", "phrases": ["Vielen Dank für Deine E-Mail, über die ich mich sehr gefreut habe.", "Es tut mir leid, dass Du Dir das Bein gebrochen hast.", "Ich wünsche Dir gute Besserung!", "Deine Einladung nehme ich gerne an.", "Ich habe noch ein paar Fragen zum Ausflug:", "Falls das Wetter schlecht ist, könnten wir …"]}, "vocab": [["das Geschenk, -e", "present, gift"], ["bevorzugen", "to prefer, favour"], ["die Untersuchung, -en", "study, investigation"], ["befragen", "to survey, question"], ["zuständig sein für + Akk", "to be responsible for"], ["die Jugendherberge, -n", "youth hostel"], ["vernetzen", "to network, link"], ["die Jahresgebühr, -en", "annual fee"], ["bargeldlos", "cashless"], ["das Abenteuer, -", "adventure"], ["die Sehnsucht, -¨e (nach)", "longing (for)"], ["die Umfrage, -n", "survey, poll"], ["der Tausch", "exchange, swap"], ["die/der Alleinerziehende, -n", "single parent"], ["preisgünstig", "inexpensive"], ["das Mitglied, -er", "member"], ["die Gebühr, -en", "fee"], ["duzen / siezen", "to address with du / Sie"], ["der/die Beschäftigte, -n", "employee"], ["das Vertrauen", "trust"], ["vorsichtig", "careful"], ["die Gewerkschaft, -en", "trade union"], ["beleidigt sein", "to be offended"], ["die Strafe, -n", "punishment, fine"], ["ablehnen", "to refuse, decline"], ["das Gericht, -e", "court (also: dish)"], ["die Höflichkeit", "politeness"], ["anbieten, bot an, hat angeboten", "to offer"], ["die Stellung, -en", "position"], ["die Rezeption, -en", "reception desk"], ["der Umweltschutz", "environmental protection"], ["das Praktikum, Praktika", "internship"], ["die Sendung, -en", "broadcast, programme"], ["die Ausbildung, -en", "vocational training"], ["die Werbefirma, -firmen", "advertising company"], ["der Abflug, -¨e", "departure (flight)"], ["entsprechen + Dat", "to correspond to"], ["ausmachen", "to agree on"], ["ausdrücklich", "explicitly"], ["der Zwischenstopp, -s", "stopover"], ["vereinbaren", "to agree"], ["die Rückzahlung, -en", "refund"], ["die Angelegenheit, -en", "matter"], ["der Auftrag, -¨e", "task, order"], ["stattfinden, fand statt, hat stattgefunden", "to take place"], ["geeignet", "suitable"], ["der Termin, -e", "appointment, date"], ["dankbar", "grateful"], ["die Note, -n", "grade, mark"], ["unterstützen", "to support"], ["verwirklichen", "to realise"], ["der Eintritt", "admission"], ["die Aufsicht", "supervision"], ["betreuen", "to look after"], ["gesperrt", "closed off"], ["der Treffpunkt, -e", "meeting point"], ["verraten, verriet, hat verraten", "to reveal"]], "grammar": ["bei + Dativ: bei Ihnen bestellen; ein Konto bei der Bank", "Plusquamperfekt Passiv: was ausgemacht worden war", "obwohl + verb at the end (concession)", "nicht nur …, sondern auch …", "erst = not before / later than expected (vs. schon)", "jemanden um etwas bitten (+ Akk)", "antworten + Dativ: mir, Ihnen", "den Auftrag haben, etwas zu tun (zu + Infinitiv)", "Modal verb + infinitive at the end: könnte stattfinden", "weil + verb at the end", "Konjunktiv II for politeness: wir wären Ihnen dankbar"]}, {"n": 14, "title": "Schweiz · Popper-Schule · Herr Schmidt", "lesen1": {"headlines": {"a": "Neue Untersuchung über Familien in der Schweiz", "b": "Ein Jahr preiswert reisen", "c": "Buchtipp: Ausflüge für Familien", "d": "Bahnfahren im nächsten Jahr um 25% teurer!", "e": "Ein Unternehmen mit vielen beruflichen Möglichkeiten", "f": "Neue Kindersendung im Fernsehen", "g": "Der Film soll echt sein: Schweizer Filmteam in Indien", "h": "Wie man im Zug Leute kennen lernt", "i": "Jeden Tag ein Stück Wirklichkeit im Fernsehen", "j": "Filmaufnahmen im Berner Oberland"}, "texts": ["Immer wieder drehen indische Regisseure Szenen ihrer Kinofilme in den Schweizer Bergen. Warum nehmen sie die Strapazen und hohen Kosten einer solch langen Reise auf sich? Das Hamburger Abendblatt besuchte eines dieser Filmteams auf dem Drehplatz im idyllischen Berner Oberland und erhielt spannende und heitere Antworten.", "KIDTOURS – Ferien mit Kindern ist ein praktischer Ausflugsführer für Familien: mit 1000 Tipps, Tricks und Ideen für jeden Geschmack, jedes Alter und jedes Budget. Das übersichtliche, hübsch illustrierte Nachschlagewerk erhalten Sie für € 19,50 im Buchhandel oder direkt beim Werd Verlag, www.werd.net.", "Das Halbtax-Abo ist Ihr Schlüssel zu günstigen Reisen mit Bahn, Bus und Schiff und präsentiert sich im praktischen Kreditkartenformat. Schon beim Abo selbst können Sie zünftig sparen: Für ein Jahr „halbtaxeln“ bezahlen Sie 150 Schweizer Franken. Und das ist noch nicht alles: Mit dem Halbtax-Abo sind Sie gut informiert. Zweimal jährlich erhalten Sie das Kundenmagazin mit vielen Reiseideen und exklusiven Reiseangeboten. Mit Ihrem Halbtax-Abo erhalten Sie 25% Preisnachlass auf Zugfahrten von der Schweiz nach Deutschland und Österreich, wenn Sie Ihre Fahrkarte in der Schweiz kaufen. (SBB – Schweizerische Bundesbahnen)", "Dokumentarfilm und Seifenoper zusammen heißt Doku-Soap, stammt aus England und macht sich seit Jahren auch auf deutschen TV-Kanälen breit. Vor allem Privatsender haben sich als erfolgreiche Doku-Soap-Sender etabliert. In vielen TV-Serien kann man das wirkliche Leben von Menschen verfolgen und mit ihnen mitleben. Zurzeit besonders erfolgreich: die Sendung „Tausche Familie“, die täglich um 18 Uhr viele Zuschauer vor den Fernseher lockt.", "Wir wollen dir bei der Berufswahl helfen: Die Deutsche Bahn – ein Unternehmen mit Zukunft. Viele Berufe ändern sich im Laufe der Zeit, genauso wie die Interessen im Leben. Und trotzdem gibt es Neigungen und Fähigkeiten, die du lange Zeit in deinem Leben behalten wirst. So zum Beispiel die Freude am Kontakt mit Menschen. Oder die Begeisterung für fremde Sprachen. Oder das Arbeiten in der freien Natur und im Team. Oder das Interesse an Technik und die Freude am Handwerk. Je nachdem, wofür du dich interessierst, kannst du bei der Deutschen Bahn aus insgesamt 15 Lehrberufen wählen. Um die richtige Entscheidung zu treffen, lohnt es sich, sich gründlich zu informieren, zum Beispiel auf unserer Website www.bahn.de."], "key": ["j", "c", "b", "i", "e"], "why": ["Indian film teams shoot in the Berner Oberland – trap g says a SWISS team goes to India.", "A guidebook (Nachschlagewerk) with trips for families = Buchtipp.", "The Halbtax-Abo costs 150 francs for one year and makes travel cheap; the 25% is a discount, not a price rise (trap d).", "Doku-soaps show real life every day at 18 Uhr – trap a mentions families but there is no study.", "Deutsche Bahn offers 15 different apprenticeships = many job possibilities."]}, "lesen2": {"title": "Die neue Sir-Karl-Popper-Schule. Ein Schulversuch für besonders kluge Schüler", "note": "reconstructed (answer options a–c missing in the book; written to match the key)", "text": "WIEN. Es ist eine ganz normale Schulstunde – Geschichte – in einer ganz normalen Klasse. Während der Lehrer einen Vortrag über das alte Rom hält, unterhalten sich die Schüler über den Schulball, kritisieren die Kleidung des Lehrers und reichen Zettel unter der Schulbank weiter.\n\nGanz normale Kinder\n„Auch überdurchschnittlich intelligente Kinder sind ganz normale Kinder“, betont Elfriede Wegricht, Psychologin an der Sir-Karl-Popper-Schule, die im vergangenen September ihren Betrieb aufgenommen hat. „Nur weil sie in der Schule gut sind, heißt das nicht, dass sie nicht genauso wie alle anderen Schüler Liebeskummer, Ärger mit den Eltern und andere Pubertätsprobleme haben.“ Der Unterschied zwischen normalen und hochbegabten Schülern sei, dass sich die Hochbegabten in ihrer bisherigen Schulkarriere nicht besonders anstrengen mussten und es nicht gewohnt sind, mit ihrer Zeit gut hauszuhalten.\n\nFörderung durch Forderung\nUm überdurchschnittlich intelligente Kinder nun entsprechend zu fördern, sieht das Konzept der Sir-Karl-Popper-Schule mehr Fremdsprachen, projektorientiertes Arbeiten in kleinen Klassen und vor allem mehr Eigenverantwortung für den Lernenden vor. Dazu kommt die Förderung der individuellen Fähigkeiten: Wer in einem Fach gut ist und sich besonders für ein Thema interessiert, bekommt Sonderaufgaben und tiefer gehende Unterlagen. Anfangs war der plötzliche Mehraufwand ein Schock für die Schüler, die eine 40-Stunden-Woche zu bewältigen haben. „Aber es ist besser, sie erleben den Schock jetzt als zu Beginn des Studiums“, meint Herr Peters, Lehrer und Schülerbetreuer an der Popper-Schule, „denn oft scheitern besonders kluge Menschen später, weil sie mit ihrer Intelligenz nichts anzufangen wissen.“ Denn zumeist erreichten sie mit wenig Aufwand und Mitarbeit relativ gute Ergebnisse.\n\nWer ist hochbegabt?\nZielgruppe der Sir-Karl-Popper-Schule sind Kinder, die in mindestens einem Fach hochbegabt sind und überdurchschnittlich gute Ergebnisse haben – das sind 20 bis 30 Prozent der Schüler. Nach einer Aufnahmeprüfung wurden von 64 Bewerbern 28 aufgenommen, die in zwei Klassen geteilt sind und von insgesamt 28 Lehrern betreut werden. „In diesen Klassen können die überdurchschnittlich intelligenten Schüler dann endlich so sein, wie sie sind, ohne bei jeder Wortmeldung von ihren Klassenkameraden beschimpft zu werden“, meint die Schulpsychologin. Ziel des Schulversuchs sei es jedoch laut Peters nicht, besonders kluge Schüler von normalen Kindern zu trennen, sondern Erfahrungen im Umgang mit überdurchschnittlich begabten Kindern zu sammeln und die Begabtenförderung in die Normalschule zu übernehmen.", "q": [{"n": 6, "stem": "Die Psychologin der Popper-Schule meint, dass …", "opts": {"a": "hochbegabte Kinder weniger Probleme in der Pubertät haben.", "b": "hochbegabte Kinder dieselben Probleme haben wie andere Kinder.", "c": "hochbegabte Kinder oft Ärger mit den Lehrern haben."}, "key": "b", "why": "'…dass sie nicht genauso wie alle anderen Schüler Liebeskummer, Ärger mit den Eltern … haben' – they are 'ganz normale Kinder'."}, {"n": 7, "stem": "Für überdurchschnittlich intelligente Schüler ist typisch, dass sie …", "opts": {"a": "sich bisher in der Schule nicht anstrengen mussten.", "b": "nach der Schule immer großen Erfolg im Beruf haben.", "c": "ihre Zeit besonders gut planen können."}, "key": "a", "why": "'…dass sich die Hochbegabten … nicht besonders anstrengen mussten'; they are NOT used to managing time (c) and often fail later (b)."}, {"n": 8, "stem": "Im Unterricht der Popper-Schule sollen die Schüler …", "opts": {"a": "vor allem viele Prüfungen schreiben.", "b": "mehr Verantwortung für das eigene Lernen übernehmen.", "c": "in großen Gruppen Projekte machen."}, "key": "b", "why": "'…vor allem mehr Eigenverantwortung für den Lernenden'; classes are small, not big (c)."}, {"n": 9, "stem": "Die erste Zeit in der Popper-Schule war für die Schüler schwer, weil …", "opts": {"a": "sie keine Freunde in der Klasse hatten.", "b": "sie plötzlich viel mehr arbeiten mussten.", "c": "die Lehrer sehr streng waren."}, "key": "b", "why": "'Anfangs war der plötzliche Mehraufwand ein Schock für die Schüler, die eine 40-Stunden-Woche … haben.'"}, {"n": 10, "stem": "In der Popper-Schule werden nur Schüler aufgenommen, …", "opts": {"a": "die in mindestens einem Fach hochbegabt sind.", "b": "die in allen Fächern sehr gute Noten haben.", "c": "die schon an einer anderen Schule Probleme hatten."}, "key": "a", "why": "'Zielgruppe … sind Kinder, die in mindestens einem Fach hochbegabt sind' – not in all subjects (b)."}]}, "lesen3": {"note": "reconstructed (ads a–l missing in the book; written to match the key)", "situations": ["Sie suchen für Ihre beiden Kinder neue Betten und möchten höchstens 200 Euro ausgeben.", "Sie haben Probleme mit dem Rücken und suchen ein Gesundheitsbett.", "Sie suchen ein schönes Sofa, das man auch als Gästebett benutzen kann.", "Vor Ihrer Urlaubsreise möchten Sie Ihr Fahrrad überprüfen lassen.", "Ihre Freunde möchten eine organisierte Radtour machen und suchen ein geeignetes Angebot.", "Ihre Verwandten haben eine Woche Urlaub und suchen einen Ferienort am Meer.", "Sie suchen für drei Vormittage pro Woche eine Stelle als Küchenhilfe.", "Sie suchen eine leichte Arbeit für abends, um sich noch etwas Geld dazuzuverdienen.", "Ihre Bekannte möchte als Bedienung in einer Gaststätte arbeiten.", "Ihre Freunde wollen Familienurlaub machen und suchen ein Angebot, das auch ein Kinderprogramm enthält."], "ads": {"a": "Möbelhaus Wohnwelt – Sofa „Komfort“: elegantes Schlafsofa in fünf Farben. Mit einem Handgriff wird aus dem Sofa ein bequemes Gästebett für zwei Personen. Jetzt nur 599 €!", "b": "Wasserbetten-Studio Aqua: Erleben Sie ein ganz neues Schlafgefühl. Probeliegen jeden Samstag von 10 bis 16 Uhr. Wasserbetten ab 1.290 €.", "c": "Kinderzimmer-Aktion bei Möbel Krämer: Stabiles Kinderbett aus Kiefernholz, 90 x 200 cm, nur 89 € pro Stück! Passende Matratze für 29 €. Nur solange der Vorrat reicht.", "d": "Zeitungsverlag sucht Zusteller/innen für die Abendzeitung: Verteilen Sie montags bis freitags zwischen 18 und 20 Uhr Zeitungen in Ihrem Wohnviertel. Leichte Tätigkeit, gute Bezahlung – ideal als Nebenjob.", "e": "Fahrradgeschäft Speiche verkauft Mountainbikes und Citybikes aller Marken. Große Auswahl an Helmen und Fahrradbekleidung. Mo–Fr 9–18.30 Uhr.", "f": "Familienhotel Sonnenhof im Allgäu: Während Sie wandern oder sich im Wellnessbereich erholen, kümmern sich unsere Betreuer um Ihre Kinder – mit Basteln, Ponyreiten und Spielen. Kinderprogramm täglich von 9 bis 17 Uhr.", "g": "Ferienwohnungen direkt an der Ostsee in Kühlungsborn: 50 m zum Strand, Mindestaufenthalt 7 Tage. Noch freie Termine im Juli und September. Tel. 038293/41 22.", "h": "Restaurant Zur Post sucht für sofort einen Koch / eine Köchin in Vollzeit, auch Wochenend- und Abenddienst. Erfahrung erforderlich.", "i": "Ferienwohnung im Schwarzwald zu vermieten: ruhige Lage, herrliche Wanderwege, 2 Schlafzimmer. Ab 45 € pro Nacht.", "j": "Rad & Reisen: Geführte Fahrradtouren entlang der Donau – 8 Tage von Passau nach Wien. Übernachtung in Hotels, Gepäcktransport und Reiseleitung inklusive. Ab 690 € pro Person.", "k": "Gasthaus Lindenhof sucht freundliche Servicekraft (m/w) für unsere Gäste im Restaurant und im Biergarten. Auch Quereinsteiger willkommen. Tel. 0821/55 43 21.", "l": "Fahrrad-Check vor dem Urlaub! Unsere Werkstatt überprüft Bremsen, Licht, Reifen und Schaltung. Fahrrad-Inspektion zum Festpreis von 29 €. Zweirad-Center Huber, Bahnhofstraße 7."}, "key": ["c", "x", "a", "l", "j", "g", "x", "d", "k", "f"], "why": ["Ad c: children's bed 89 € each – two beds stay under 200 €.", "No ad: b offers water beds but nothing about back problems or health beds.", "Ad a: sofa that turns into a guest bed.", "Ad l: bike check before the holiday.", "Ad j: organised (guided) cycle tours.", "Ad g: holiday flats at the sea, minimum 7 days = one week.", "No ad: h (restaurant) wants a full-time cook, not a kitchen helper for three mornings.", "Ad d: easy evening side job delivering newspapers.", "Ad k: restaurant looking for service staff (Bedienung).", "Ad f: family hotel with a children's programme."]}, "sprach1": {"note": "reconstructed (gaps 23/24 missing in the text and most options unreadable; rebuilt around the key words)", "text": "Sehr geehrter Herr Schmidt,\n\nim Januar hatte ich bei [21] für mich und meine Familie einen Flug nach Indien gebucht. Leider entsprach unser Flug überhaupt nicht dem, [22] bei der Buchung am Telefon ausgemacht worden war.\n\n[23] ich ausdrücklich einen Direktflug nach Mumbai bestellt hatte, haben Sie mir einen Flug [24] Zwischenstopp in Delhi ausgestellt. Wir mussten eine Nacht in Delhi verbringen und kamen so [25] einen Tag später als geplant in Mumbai an. Doch damit nicht genug. Der Flug war nicht nur anders als vereinbart, [26] auch noch viel teurer. Statt [27] erwarteten 640 Euro kostete der Flug 720 Euro.\n\nIch darf Sie daher [28] Rückzahlung der zu viel verrechneten Kosten auf mein Konto [29] der Deutschen Bank in Mumbai bitten. Meine Bankdaten haben Sie bereits.\n\nIch bitte Sie, die Angelegenheit bald zu klären und [30] dann zu antworten.\n\nMit freundlichen Grüßen\nHarish Khurana", "q": [{"n": 21, "opts": {"a": "ihnen", "b": "Ihnen", "c": "dir"}, "key": "b", "why": "bei + Dativ; polite form is written with a capital letter: Ihnen."}, {"n": 22, "opts": {"a": "das", "b": "was", "c": "dass"}, "key": "b", "why": "After 'dem' (= that which) the relative pronoun is 'was'."}, {"n": 23, "opts": {"a": "Weil", "b": "Obwohl", "c": "Wenn"}, "key": "b", "why": "Contrast: although he booked a direct flight, he got a stopover."}, {"n": 24, "opts": {"a": "für", "b": "mit", "c": "ohne"}, "key": "b", "why": "einen Flug mit Zwischenstopp."}, {"n": 25, "opts": {"a": "erst", "b": "schon", "c": "noch"}, "key": "a", "why": "erst = later than planned."}, {"n": 26, "opts": {"a": "aber", "b": "sondern", "c": "sonst"}, "key": "b", "why": "nicht nur …, sondern auch …"}, {"n": 27, "opts": {"a": "der", "b": "die", "c": "deren"}, "key": "a", "why": "statt + Genitiv, plural: statt der erwarteten 640 Euro."}, {"n": 28, "opts": {"a": "für", "b": "um", "c": "zu"}, "key": "b", "why": "jemanden um etwas bitten."}, {"n": 29, "opts": {"a": "an", "b": "bei", "c": "von"}, "key": "b", "why": "ein Konto bei der Bank."}, {"n": 30, "opts": {"a": "mich", "b": "mir", "c": "Ihnen"}, "key": "b", "why": "antworten + Dativ: mir."}]}, "sprach2": {"text": "Sehr geehrte Frau Borner,\n\nes gibt ganz viele Ratschläge, wie man sich ernähren soll, was man essen soll und was nicht. Die meisten Empfehlungen sind aber nicht für etwas, [31] gegen etwas, und zwar immer wieder gegen etwas anderes: gegen Fleisch zum Beispiel oder gegen Zucker, aber auch gegen Milch. So [32] man etwa, wer kein Fleisch isst, lebt nicht nur gesünder, sondern fühlt sich auch besser.\n\n[33] Durchsehen einer Zeitschrift ist mir Ihre Anzeige aufgefallen, und nun habe ich folgende Fragen an Sie: Von [34] Nahrungsmitteln darf man eigentlich so viel essen, wie man will? Was [35] jeden Tag gegessen werden? Und wie ist das mit der Milch? Die einen sagen, Milch ist sehr gesund [36] der vielen wichtigen Nährstoffe. Andere meinen, wer viel Milch trinkt, kann Probleme mit dem Magen bekommen. Außerdem kann man anstelle [37] Milch auch Mineralwasser trinken. Was soll ich jetzt glauben?\n\nFür eine Antwort [38] meine Fragen danke ich Ihnen im Voraus. Könnten Sie mir auch noch eine Broschüre schicken? Das Thema Essen und Sport [39] mich besonders interessieren, [40] ich selber viel Sport treibe.\n\nMit freundlichen Grüßen\nSilvia Schönenberger", "words": {"a": "auf", "b": "beim", "c": "deswegen", "d": "möchte", "e": "nennt", "f": "sagt", "g": "sollte", "h": "sondern", "i": "von", "j": "was", "k": "wegen", "l": "weil", "m": "welchen", "n": "würde", "o": "zum"}, "key": ["h", "f", "b", "m", "g", "k", "i", "a", "n", "l"], "why": ["nicht für etwas, sondern gegen etwas.", "So sagt man … (verb in 2nd position; 'nennt' needs an object).", "beim + nominalised infinitive: beim Durchsehen = while looking through.", "von + Dativ plural: von welchen Nahrungsmitteln.", "Modal + passive: Was sollte gegessen werden?", "wegen + Genitiv: wegen der vielen Nährstoffe.", "anstelle von + Dativ: anstelle von Milch.", "eine Antwort auf + Akk.", "Konjunktiv II: würde mich interessieren.", "weil + verb at the end: weil ich … treibe."]}, "hoeren1": [{"n": 41, "s": "Der Sprecher hätte gern Urlaub wie die anderen Kinder gemacht.", "a": "r", "t": "Als Kind wollte ich unbedingt Urlaub wie meine Freunde machen: Sonne, Strand und Meer. Doch meine Eltern fuhren lieber in die Berge. Während andere im Wasser spielten, mussten wir wandern gehen. Ich fand das oft langweilig und hätte lieber Sandburgen gebaut oder im Meer geschwommen. So ein richtiger Badeurlaub war immer mein Traum.", "e": "He wanted a beach holiday 'wie meine Freunde'."}, {"n": 42, "s": "Dem Sprecher hat der Wanderurlaub nicht so gut gefallen.", "a": "r", "t": "Einmal waren wir im Schwarzwald zum Wandern. Ich war damals noch klein und fand das wirklich anstrengend. Es hat oft geregnet und die Wege waren rutschig. Ich wollte einfach nur zu Hause bleiben. Die Natur war zwar schön, aber dieser Urlaub hat mir keinen Spaß gemacht.", "e": "'…dieser Urlaub hat mir keinen Spaß gemacht.'"}, {"n": 43, "s": "Die Sprecherin hat die Ferien bei Verwandten verbracht.", "a": "f", "t": "Wir sind früher oft in den Ferien an einen See gefahren. Dort haben wir gezeltet oder in kleinen Pensionen übernachtet. Ich habe viele Kinder kennengelernt, es war immer spannend. Bei unseren Verwandten waren wir nie – meine Eltern wollten lieber neue Orte sehen.", "e": "'Bei unseren Verwandten waren wir nie.'"}, {"n": 44, "s": "Die Sprecherin hat mit ihren Eltern regelmäßig Fahrradausflüge gemacht.", "a": "f", "t": "Mit meiner Familie haben wir meistens Städtereisen gemacht. Wir sind mit dem Auto gefahren und haben Museen besucht. Fahrradtouren waren nicht unser Ding. Ich kann mich nur an einen Ausflug mit dem Rad erinnern, aber das war nicht regelmäßig.", "e": "Only one bike trip – 'das war nicht regelmäßig'."}, {"n": 45, "s": "Der Sprecher hat den Urlaub mit den Eltern gemeinsam geplant.", "a": "r", "t": "Ich durfte bei der Urlaubsplanung immer mitreden. Meine Eltern fragten mich, was ich machen möchte, und wir haben gemeinsam entschieden. Manchmal haben wir Vorschläge gesammelt und uns dann geeinigt. Das war schön, denn ich fühlte mich ernst genommen.", "e": "'…wir haben gemeinsam entschieden.'"}], "hoeren2": {"note": "reconstructed (no transcript available; script written to match the key)", "intro": "Im Radio spricht ein Moderator mit Herrn Schütz, einem Taxifahrer aus Frankfurt.", "speakers": ["Moderator", "Herr Schütz"], "lines": [["A", "Herzlich willkommen zu unserer Sendung „Menschen bei der Arbeit“. Heute ist Herr Schütz bei uns, Taxifahrer in Frankfurt. Herr Schütz, wie lange fahren Sie schon Taxi?"], ["B", "Oh, schon sehr lange – seit fast zwanzig Jahren. Angefangen habe ich in einer Kleinstadt im Odenwald, und vor acht Jahren bin ich dann nach Frankfurt gekommen."], ["A", "Gibt es einen großen Unterschied zwischen Kleinstadt und Großstadt?"], ["B", "Ja, einen sehr großen. In der Kleinstadt habe ich vor allem ältere Leute zum Arzt oder zum Einkaufen gefahren, manchmal Jugendliche nach der Disco. Geschäftsleute hatte ich dort eigentlich nie. Hier in Frankfurt fahre ich jeden Tag Banker und Geschäftsleute zum Flughafen oder zur Messe."], ["A", "Man hört ja oft, dass Taxifahrer viele Geschichten erleben. Haben Sie sich vielleicht schon einmal in einen Fahrgast verliebt?"], ["B", "(lacht) Nein, das nicht. Ich bin seit fünfzehn Jahren glücklich verheiratet. Aber Kollegen von mir haben ihre Frau tatsächlich im Taxi kennengelernt."], ["A", "Erzählen Ihnen die Fahrgäste viel?"], ["B", "Ja, erstaunlich viel. Ich glaube, das ist so, weil sie mich nicht kennen. Sie sehen mich wahrscheinlich nie wieder, deshalb erzählen sie Dinge, die sie vielleicht nicht einmal ihren Freunden sagen würden."], ["A", "Gibt es da Unterschiede zwischen Männern und Frauen?"], ["B", "Viele denken, Männer reden nur über Fußball, das Wetter oder die Politik. Das stimmt aber nicht. Gerade die Männer erzählen mir oft sehr persönliche Dinge – über Probleme mit der Frau, mit den Kindern oder im Beruf."], ["A", "Und bekommen Sie manchmal auch einen guten Tipp von Ihren Fahrgästen, zum Beispiel für die Börse?"], ["B", "Nein, eigentlich nie. Eher ist es umgekehrt: Die Leute wollen von mir Tipps – wo man gut essen kann oder welches Hotel günstig ist. Ein Trinkgeld bekomme ich natürlich schon, aber Tipps nicht."], ["A", "Taxifahren ist ja ziemlich anstrengend. Was machen Sie in Ihrer Freizeit?"], ["B", "Sport, Sport und noch mal Sport. Das ist für mich das Wichtigste, weil ich den ganzen Tag sitze. Ich gehe dreimal in der Woche joggen und spiele am Wochenende Fußball."], ["A", "Gehen Sie auch schwimmen, um sich zu entspannen?"], ["B", "Schwimmen? Nein, das ist nichts für mich. Im Hallenbad ist es mir zu laut und zu voll, da bin ich nachher noch nervöser. Wenn ich einen anstrengenden Tag hatte, setze ich mich lieber mit einem guten Buch auf den Balkon."], ["A", "Fahren Sie eigentlich auch nachts?"], ["B", "Früher ja, aber vor zwei Jahren habe ich mich entschieden, nur noch tagsüber zu fahren. Nachts gibt es mehr Probleme mit betrunkenen Fahrgästen, und einmal wurde ein Kollege überfallen. Seitdem fahre ich nur noch am Tag."], ["A", "Haben die jüngeren Kollegen nachts weniger Angst?"], ["B", "Nein, im Gegenteil. Ich habe den Eindruck, gerade die jungen Taxifahrer haben nachts mehr Angst als wir Älteren. Ihnen fehlt einfach die Erfahrung, wie man mit schwierigen Fahrgästen umgeht."], ["A", "Herr Schütz, vielen Dank für das Gespräch und allzeit gute F
