ahrt!"], ["B", "Danke schön, gern geschehen."]], "items": [{"n": 46, "s": "Herr Schütz arbeitet erst seit kurzer Zeit als Taxifahrer.", "a": "f", "e": "'…schon sehr lange – seit fast zwanzig Jahren.'"}, {"n": 47, "s": "In der Kleinstadt hatte Herr Schütz keine Geschäftsleute als Kunden.", "a": "r", "e": "'Geschäftsleute hatte ich dort eigentlich nie.'"}, {"n": 48, "s": "Herr Schütz hat sich schon einmal in einen Fahrgast verliebt.", "a": "f", "e": "'Nein, das nicht.' Only colleagues met their wives in the taxi."}, {"n": 49, "s": "Die Fahrgäste erzählen viel, weil sie den Taxifahrer nicht kennen.", "a": "r", "e": "'…das ist so, weil sie mich nicht kennen.'"}, {"n": 50, "s": "Männer sprechen oft über unpersönliche Dinge.", "a": "f", "e": "'Das stimmt aber nicht. Gerade die Männer erzählen mir oft sehr persönliche Dinge.'"}, {"n": 51, "s": "Herr Schütz bekommt von den Fahrgästen manchmal auch einen Tipp.", "a": "f", "e": "'Nein, eigentlich nie … die Leute wollen von mir Tipps.'"}, {"n": 52, "s": "In der Freizeit steht Sport für Herrn Schütz an erster Stelle.", "a": "r", "e": "'Sport, Sport und noch mal Sport. Das ist für mich das Wichtigste.'"}, {"n": 53, "s": "Beim Schwimmen kann sich Herr Schütz von einem anstrengenden Tag erholen.", "a": "f", "e": "'Schwimmen? Nein … da bin ich nachher noch nervöser.' He reads on the balcony."}, {"n": 54, "s": "Herr Schütz hat sich entschieden, nur am Tag Taxi zu fahren.", "a": "r", "e": "'…habe ich mich entschieden, nur noch tagsüber zu fahren.'"}, {"n": 55, "s": "Nach Meinung von Herrn Schütz haben jüngere Taxifahrer weniger Angst, nachts zu fahren.", "a": "f", "e": "'…gerade die jungen Taxifahrer haben nachts mehr Angst als wir Älteren.'"}]}, "hoeren3": [{"n": 56, "s": "Der Zug nach Mannheim fährt um 13:14 Uhr ab.", "a": "r", "t": "Meine Damen und Herren, auf Gleis 7 fährt ein: der Intercity 2014 von Stuttgart. Planmäßige Weiterfahrt nach Mannheim um 13:14 Uhr. Bitte Vorsicht bei der Einfahrt des Zuges.", "e": "Departure to Mannheim 'um 13:14 Uhr'; the train number 2014 is a distractor.", "note": "reconstructed"}, {"n": 57, "s": "Dr. Hoffmann ist im Urlaub unter der Nummer 957 30 75 zu erreichen.", "a": "f", "t": "Guten Tag, Sie sind verbunden mit der Praxis Dr. Hoffmann. Unsere Praxis ist vom 2. bis 16. August wegen Urlaub geschlossen. In dringenden Fällen wenden Sie sich bitte an die Vertretung, Frau Dr. Weber, Telefon 957 30 75.", "e": "The number belongs to the substitute doctor, Dr. Weber – not to Dr. Hoffmann.", "note": "reconstructed"}, {"n": 58, "s": "Sie können den Film „Das Leben ist schön“ um 18:15 Uhr im Central sehen.", "a": "f", "t": "Und hier das Kinoprogramm für heute: Im Central läuft um 18:15 Uhr die Komödie „Ein Sommer in Paris“. Den italienischen Film „Das Leben ist schön“ sehen Sie um 20:30 Uhr im Kino Rex.", "e": "At 18:15 in the Central there is a different film; 'Das Leben ist schön' is at 20:30 in the Rex.", "note": "reconstructed"}, {"n": 59, "s": "Heute Abend beginnt es zu schneien.", "a": "f", "t": "Das Wetter: Heute bleibt es kalt und bewölkt, am Abend gibt es im Süden etwas Regen. Erst morgen im Laufe des Vormittags geht der Regen in Schnee über. Die Temperaturen liegen zwischen null und drei Grad.", "e": "Rain this evening; snow only tomorrow ('Erst morgen').", "note": "reconstructed"}, {"n": 60, "s": "Katrin hätte am Dreiundzwanzigsten Zeit.", "a": "r", "t": "Hallo, hier ist Katrin. Du hast nach einem Termin für unser Treffen gefragt. Am Zwanzigsten kann ich leider nicht, da bin ich auf Geschäftsreise. Aber am Dreiundzwanzigsten hätte ich Zeit, abends ab sieben. Ruf mich doch zurück!", "e": "'…am Dreiundzwanzigsten hätte ich Zeit.'", "note": "reconstructed"}], "schreiben": {"letter": "Liebe(r) …,\n\nwie geht es Dir? Du hast mir schon so lange nicht mehr geschrieben, dass ich mir Sorgen mache. Hoffentlich ist bei Euch alles in Ordnung. Es wird wirklich Zeit, dass wir uns wiedersehen.\n\nAnfang des Jahres habe ich meinen Arbeitsplatz gewechselt. Meine neue Stelle ist sehr interessant, aber auch anstrengend. Ich bin nun beruflich sehr viel unterwegs. Demnächst muss ich auch in Eure Gegend reisen. Dann könnten wir uns doch einmal am Abend treffen und gemeinsam etwas unternehmen. Wie findest Du meine Idee? Ich würde auch sehr gerne Deine Familie kennenlernen.\n\nBitte antworte mir bald!\n\nHerzliche Grüße\nDeine Tamara", "task": "Antworten Sie Tamara. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Vorschlag zum Treffen", "Jemanden mitbringen", "Frage zur neuen Arbeitsstelle", "Warum Sie nicht geschrieben haben"], "model": "Köln, den 12. Mai 2025\n\nLiebe Tamara,\n\nvielen Dank für Deinen Brief, über den ich mich sehr gefreut habe. Es tut mir leid, dass ich Dir so lange nicht geschrieben habe. Ich hatte in den letzten Monaten sehr viel Stress, weil ich umgezogen bin und gleichzeitig einen Deutschkurs gemacht habe.\n\nSchön, dass Du eine neue Stelle hast! Was machst Du dort genau? Und warum ist die Arbeit so anstrengend – musst Du viele Überstunden machen?\n\nIch finde Deine Idee super. Wenn Du in unsere Gegend kommst, könnten wir uns am Abend in der Altstadt treffen und zusammen in ein gemütliches Restaurant gehen. Danach können wir noch am Rhein spazieren gehen. Ich bringe gern meinen Mann und meine Tochter mit, dann lernst Du endlich meine Familie kennen.\n\nSchreib mir bitte, wann genau Du kommst.\n\nHerzliche Grüße\nDeine Sara", "phrases": ["Es tut mir leid, dass ich Dir so lange nicht geschrieben habe.", "Ich hatte in letzter Zeit sehr viel zu tun, weil …", "Wie gefällt Dir Deine neue Stelle?", "Ich schlage vor, dass wir uns … treffen.", "Ich bringe gern meinen Mann / meine Freundin mit.", "Schreib mir bitte, wann Du kommst."]}, "vocab": [["drehen (einen Film)", "to shoot (a film)"], ["der Regisseur, -e", "film director"], ["die Strapaze, -n", "hardship, strain"], ["der Ausflugsführer, -", "guidebook for trips"], ["das Nachschlagewerk, -e", "reference book"], ["das Abonnement (Abo), -s", "subscription, season ticket"], ["sparen", "to save"], ["der Preisnachlass, -¨e", "discount"], ["die Fahrkarte, -n", "ticket"], ["die Seifenoper, -n", "soap opera"], ["der Privatsender, -", "private TV channel"], ["der Zuschauer, -", "viewer"], ["die Berufswahl", "choice of career"], ["die Neigung, -en", "inclination"], ["die Fähigkeit, -en", "ability"], ["der Lehrberuf, -e", "trade requiring apprenticeship"], ["sich lohnen", "to be worth it"], ["überdurchschnittlich", "above average"], ["hochbegabt", "highly gifted"], ["der Liebeskummer", "lovesickness"], ["sich anstrengen", "to make an effort"], ["fördern", "to support, promote"], ["die Eigenverantwortung", "personal responsibility"], ["der Mehraufwand", "extra effort"], ["bewältigen", "to cope with"], ["scheitern", "to fail"], ["die Aufnahmeprüfung, -en", "entrance exam"], ["der Bewerber, -", "applicant"], ["trennen", "to separate"], ["der Rücken, -", "back"], ["überprüfen lassen", "to have something checked"], ["die Küchenhilfe, -n", "kitchen assistant"], ["dazuverdienen", "to earn extra"], ["die Bedienung, -en", "waiter/waitress, service"], ["die Gaststätte, -n", "restaurant, inn"], ["der Ratschlag, -¨e", "piece of advice"], ["sich ernähren", "to eat, feed oneself"], ["die Empfehlung, -en", "recommendation"], ["auffallen + Dat", "to strike, catch one's eye"], ["das Nahrungsmittel, -", "food(stuff)"], ["der Nährstoff, -e", "nutrient"], ["der Magen, -¨", "stomach"], ["im Voraus", "in advance"], ["der Fahrgast, -¨e", "passenger"], ["das Trinkgeld, -er", "tip (money)"], ["sich erholen", "to recover, relax"], ["überfallen", "to attack, rob"], ["die Vertretung, -en", "substitute"], ["sich Sorgen machen", "to worry"], ["wechseln", "to change"], ["beruflich unterwegs sein", "to travel for work"], ["unternehmen", "to do (an activity)"]], "grammar": ["bei + Dativ; polite pronoun Ihnen with capital I", "Relative pronoun 'was' after dem / alles / etwas / nichts", "obwohl + verb at the end", "nicht nur …, sondern auch …; nicht …, sondern …", "statt / wegen + Genitiv", "jemanden um etwas bitten; eine Antwort auf + Akk", "beim + nominalised infinitive (beim Durchsehen)", "anstelle von + Dativ", "Modal verb + Passiv: sollte gegessen werden", "Konjunktiv II: würde mich interessieren", "von welchen + Dativ plural (question word declined)"]}, {"n": 15, "title": "Zeitung · Kinderbetreuerin · Herr Schröder", "lesen1": {"headlines": {"a": "Hinweis für Besucher der Bregenzer Festspiele", "b": "Abendwanderungen ab 89 Euro", "c": "Musikveranstaltungen am Nachmittag", "d": "Ihre Zeitung folgt Ihnen in den Urlaub", "e": "Schlechtes Wetter: Festspiele abgesagt", "f": "Rekord: 70.000 Besucher im Bücherdorf", "g": "Wandern ohne Gepäck", "h": "Neues für Literaturinteressierte", "i": "Neue Zeitung für Ihre Urlaubsplanung", "j": "Laute Musik stört den Nachbarn"}, "texts": ["Abonnenten-Service: Wenn Sie verreisen, wünschen wir Ihnen erholsame und angenehme Ferientage. Bitte denken Sie daran, sich Ihre Zeitung an den Urlaubsort nachsenden zu lassen. Denn mit den Neuigkeiten von zu Hause und aus aller Welt lässt sich die schönste Zeit des Jahres erst richtig genießen. Die Nachsendung ist in ganz Europa kostenlos, die Höhe des Bezugsgeldes bleibt unverändert. Ausführliche Informationen und entsprechende Coupons finden Sie in unserem großen Reise-Service-Anzeigenteil, oder rufen Sie uns einfach an: Telefon 0130-18 58 50 zum Nulltarif. (Hannoversche Allgemeine / Neue Presse)", "Im Luftkurort Stadtkyll in der Mittelgebirgslandschaft des Oberen Kylltals werden dreitägige Wanderungen ohne Gepäck veranstaltet. Die Rundwanderung im deutsch-belgischen Naturpark führt abends zu reservierten Zimmern. Die Betriebe übernehmen den Gepäcktransport zum nächsten Tagesziel. Die Wanderungen werden ganzjährig angeboten. Im Wanderprogramm sind drei Übernachtungen mit Frühstück, dreimal Gepäcktransport, eine Wanderkarte, eine Wegbeschreibung und ein Wanderpass enthalten. Der Pauschalbetrag beträgt pro Person 89 Euro. Auskünfte: Verkehrsverein Erholungsgebiet Oberes Kylltal, Kurallee, 54589 Stadtkyll, Telefon (06597) 28 78.", "Für den einen ist es musikalischer Hochgenuss, für den anderen schlicht Lärm. Gemeint ist Musik, die aus Lautsprechern, Radios oder von Musikinstrumenten durch geöffnete Türen und Fenster bei sommerlichen Temperaturen ins Freie dringt. Die Gemeinde weist darauf hin, dass während der Mittagsruhe von 13 bis 15 Uhr und nachts von 22 bis 7 Uhr keine musikalische Ruhestörung erfolgen darf. Gartengeräte mit Motoren dürfen montags bis freitags nur von 8 bis 13 und von 15 bis 19 Uhr benutzt werden, an Sonnabenden von 9 bis 13 Uhr. An Sonn- und Feiertagen dürfen die Geräte nicht zum Einsatz kommen.", "Das erste deutsche Bücherdorf hat in Mühlbeck/Friedersdorf (Sachsen-Anhalt) seit Ende September seine Tore geöffnet. In acht Antiquariaten warten über 70.000 Bücher aus allen Bereichen der Literatur auf Interessenten. Das in reizvoller landschaftlicher Umgebung liegende Bücherdorf nahe Bitterfeld – unweit der A9 und des Flughafens Leipzig – ist aus allen Teilen Deutschlands leicht zu erreichen. Geöffnet sind die Antiquariate auch am Samstag und Sonntag. In Europa gibt es bereits acht solcher Bücherdörfer in Belgien, Frankreich, Großbritannien, den Niederlanden, Norwegen und der Schweiz. Initiatorin des deutschen Bücherdorfes ist Heidi Dehne (Tel. 03493/4 30 43).", "Die Bregenzer Festspiele sind bemüht, die Vorstellungen auch bei zweifelhafter Witterung bzw. leichtem Regen auf der Seebühne abzuhalten, weshalb es zu Verzögerungen des Beginns oder zu Unterbrechungen kommen kann. Sollte die Seeaufführung nicht stattfinden können, wird eine halbszenische Version von „Porgy and Bess“ im Festspielhaus gegeben. Wir empfehlen unseren Gästen, bei unsicherer Wetterlage regenfester Kleidung den Vorzug zu geben und auf Schirme zu verzichten, da diese die Sicht beeinträchtigen. Das Spiel auf dem See wird ohne Pause gespielt. Die Spieldauer beträgt ca. 2 Std. 45 Min."], "key": ["d", "g", "j", "h", "a"], "why": ["The newspaper is sent to your holiday address – it is not a new newspaper (trap i).", "Hotels transport the luggage: 'Wanderungen ohne Gepäck'; 89 Euro is for three days, not evening walks (trap b).", "Music through open windows is noise for others – rules for quiet times.", "70,000 BOOKS (not visitors, trap f) in the first German book village = news for literature fans.", "Advice for guests (rain clothes, no umbrellas); the festival is NOT cancelled (trap e)."]}, "lesen2": {"title": "Beruf am Flughafen: Kinderbetreuerin – Dem Kind zuliebe in Kloten warten", "note": "reconstructed (answer options a–c missing in the book except one; written to match the key)", "text": "Auf keinem anderen Flughafen sei der Aufenthalt familienfreundlicher als in Kloten, sagen viele Eltern. Weil die Wartezeit im Flug vergeht – dank der 18 Kinderbetreuerinnen. (Von Gabriella Hofer)\n\n24.000 Kinder aus der ganzen Welt wurden letztes Jahr auf dem Flughafen Zürich-Kloten betreut. Die 18 Mitarbeiterinnen, die sich im Schichtbetrieb ablösen, stehen den Eltern und ihren Kindern täglich von 6.30 bis 22 Uhr mit Rat und Tat zur Seite. Die vielsprachigen Betreuerinnen – viele von ihnen sind ausgebildete Krankenschwestern, Kleinkinderzieherinnen oder Flugbegleiterinnen – verfügen auch über Erste-Hilfe-Kenntnisse. Der Flughafen Zürich-Kloten ist der einzige in Europa, der seinen kleinsten Gästen in beiden Terminals einen eigenen Aufenthaltsraum bietet.\n\nAufenthalt und Betreuung sind kostenlos. In beiden Räumen stehen vier Wickeltische mit Papierwindeln, eine Küche zum Aufwärmen der Kindermahlzeiten, sechs Bettchen, ein Laufgitter, Nachttöpfe und Toiletten für Kleinkinder zur Verfügung. Außerdem gibt es zahlreiche Stofftierchen, Schaukelpferdchen, Bauklötze, Puppenstuben, einen großen Stall, Bilderbücher, Spiele und vieles mehr.\n\n„Es ist ein Erlebnis für die Kinder, mit Kindern zu spielen, die eine andere Muttersprache sprechen oder aus einem anderen Kulturkreis kommen“, weiß Alice Martin (40). Die ehemalige Kinderkrankenschwester, selber Mutter eines sechsjährigen Sohnes, gehört seit 14 Jahren zum Team der Betreuerinnen. Zusammen mit 17 Kolleginnen ist sie abwechselnd in den beiden Kinderspielzimmern der Terminals A und B beschäftigt.\n\nBevor Alice Martin 1994 von der Flughafendirektion angestellt wurde, war sie viele Jahre auf einer Geburtenabteilung und später noch in einem Behindertenheim beschäftigt. Die Kontakte zu den jetzt von ihr betreuten Kindern seien nicht mehr so intensiv wie früher im Spital oder im Heim, dafür biete ihr die heutige Tätigkeit mehr Abwechslung.\n\nDie kinderliebende Frau reist selber gern und viel. Auch ihre Fremdsprachenkenntnisse kommen ihr hier zugute. Alice Martin spricht neben ihrer Muttersprache Englisch, Französisch und Spanisch. Sehr bereichernd sei, dass sie in ihrer täglichen Arbeit andere Kulturen kennenlerne.", "q": [{"n": 6, "stem": "Die Kinderbetreuerinnen kümmern sich um …", "opts": {"a": "Kinder aus der ganzen Welt.", "b": "Kinder, die allein reisen.", "c": "kranke Kinder am Flughafen."}, "key": "a", "why": "'24.000 Kinder aus der ganzen Welt wurden letztes Jahr … betreut.'"}, {"n": 7, "stem": "Der Flughafen Zürich-Kloten ist besonders familienfreundlich, …", "opts": {"a": "weil man dort für Kinder billiger fliegt.", "b": "weil die Betreuerinnen rund um die Uhr arbeiten.", "c": "weil es in beiden Terminals Räume für Kinder gibt."}, "key": "c", "why": "'…der einzige in Europa, der … in beiden Terminals einen eigenen Aufenthaltsraum bietet.' Hours are 6.30–22 Uhr, not 24h."}, {"n": 8, "stem": "Frau Alice Martin hat eine Ausbildung als …", "opts": {"a": "Flugbegleiterin.", "b": "Kinderkrankenschwester.", "c": "Lehrerin."}, "key": "b", "why": "'Die ehemalige Kinderkrankenschwester …' – Flugbegleiterin is mentioned only for other colleagues."}, {"n": 9, "stem": "In den Aufenthaltsräumen spielen die Kinder …", "opts": {"a": "nur mit Kindern aus der Schweiz.", "b": "vor allem mit den Betreuerinnen.", "c": "auch mit Kindern anderer Kulturen und Sprachen."}, "key": "c", "why": "'…mit Kindern zu spielen, die eine andere Muttersprache sprechen oder aus einem anderen Kulturkreis kommen.'"}, {"n": 10, "stem": "Frau Alice Martin findet …", "opts": {"a": "ihre heutige Arbeit abwechslungsreicher als früher.", "b": "den Kontakt zu den Kindern intensiver als früher.", "c": "ihre Sprachkenntnisse bei der Arbeit nicht wichtig."}, "key": "a", "why": "'…dafür biete ihr die heutige Tätigkeit mehr Abwechslung'; contacts are LESS intensive (b)."}]}, "lesen3": {"note": "reconstructed (ads a–l missing in the book; written to match the key)", "situations": ["Sie sind in der Schweiz und möchten sich ein paar Tage beim Baden erholen.", "Sie hören gerne klassische Musik, am liebsten Barockmusik. Sie möchten in ein Konzert gehen.", "Ihr Sohn möchte gerne in den Schulferien seine Fremdsprachenkenntnisse verbessern. Er möchte auch Sport treiben.", "Sie reisen nicht gerne allein und suchen deshalb Reisepartner.", "Sie möchten am Donnerstagabend mit Ihrer Bekannten eine Musikveranstaltung besuchen.", "Ihre Familie möchte den nächsten Urlaub am Meer verbringen.", "Sie leben in Zürich und möchten dort möglichst schnell Englisch lernen.", "Sie bekommen Besuch von Ihrer Freundin. Sie möchte gerne tanzen gehen.", "Sie möchten Freunde im Ausland besuchen und suchen ein Reisebüro.", "Sie sind sportlich und möchten im Sommer in den Bergen wandern gehen."], "ads": {"a": "Jazz im Kaufleuten, Zürich: Jeden Donnerstag ab 20.30 Uhr Live-Musik mit wechselnden Bands aus aller Welt. Eintritt 15 Franken, Studierende 10 Franken.", "b": "Kunsthaus Zürich: Große Picasso-Ausstellung bis Ende Juni. Di–So 10–18 Uhr, Mittwoch bis 21 Uhr.", "c": "Kochkurs „Italienische Küche“ – fünf Abende mit Profikoch Marco. Migros-Klubschule Bern, Anmeldung unter 031/388 50 00.", "d": "Thermalbad & Spa Bad Ragaz: Entspannen Sie in 36 Grad warmem Quellwasser. Wellness-Pauschale 3 Nächte inkl. Halbpension und freiem Eintritt ins Thermalbad ab 540 Franken.", "e": "Gemeinsam statt einsam! Die Reisepartner-Börse „Travelfriends“ vermittelt Reisebegleiterinnen und Reisebegleiter für Ihren nächsten Urlaub. Kostenlose Anmeldung unter www.travelfriends.ch.", "f": "Reisebüro Globetrotter: Flüge in alle Welt zu Tiefpreisen – ob Besuch bei Freunden in Kanada oder Geschäftsreise nach Asien. Persönliche Beratung in 30 Filialen.", "g": "Bergschule Pontresina: Geführte Sommer-Wanderwochen im Engadin für trainierte Wanderer. Gipfeltouren bis 3000 m, Übernachtung in Berghütten. Juni bis September.", "h": "Barockkonzert in der Fraumünsterkirche: Werke von Bach, Händel und Vivaldi, gespielt vom Zürcher Kammerorchester. Sonntag, 17 Uhr. Karten an der Abendkasse.", "i": "Sprach- und Sportcamp für Jugendliche (12–17 Jahre) in den Sommerferien: vormittags Englisch- oder Französischunterricht, nachmittags Tennis, Schwimmen und Segeln. Internat Montana, Zugerberg.", "j": "Ferienhaus in der Toskana zu vermieten: 20 km vom Meer, mit eigenem Pool, für bis zu 6 Personen. Tel. 044/251 33 10.", "k": "Disco-Night im Club Oxa: Jeden Samstag nur für Gäste über 30 – Hits der 70er und 80er. Heute geschlossene Gesellschaft.", "l": "Englisch-Intensivkurse in Zürich: 25 Lektionen pro Woche in kleinen Gruppen, Einstieg jeden Montag möglich. Schnelle Fortschritte garantiert! Inlingua Zürich, Bahnhofstrasse 21."}, "key": ["d", "h", "i", "e", "a", "x", "l", "x", "f", "g"], "why": ["Ad d: thermal bath package for a few days in Switzerland.", "Ad h: baroque concert (Bach, Händel, Vivaldi).", "Ad i: language and sports camp for teenagers in the summer holidays.", "Ad e: agency that finds travel partners.", "Ad a: live music every Thursday evening.", "No ad: j is 20 km from the sea – not at the sea.", "Ad l: intensive English courses in Zurich, start every Monday.", "No ad: k is a disco but closed today / only Saturdays for over 30s.", "Ad f: travel agency for flights to friends abroad.", "Ad g: guided summer hiking weeks in the mountains for fit people."]}, "sprach1": {"note": "reconstructed (most answer options unreadable in the book; built around the key words)", "text": "An alle Kunden – Gewinnen!\n\nSehr geehrter Herr Schröder,\n\nzum Start [21] das neue Geschäftsjahr haben wir uns für Sie etwas ganz Besonderes ausgedacht: einen attraktiven Gewinn! [22] dem Beginn des neuen Geschäftsjahres feiern wir unsere erfolgreiche Buchidee. Machen Sie mit! Es warten auf Sie sehr [23] Gewinne im Wert von vielen tausend Euro. Mit Ihrer Kundennummer können Sie an einem Preisausschreiben teilnehmen. Senden Sie uns [24] das beigefügte Antwortschreiben zurück und bestellen Sie damit – ohne Risiko – das Buch des Monats. Sie erhalten dieses Buch mit [25] Versprechen, es nach 10 Tagen zurückgeben zu können, sollte Ihnen das Buch nicht gefallen. Ohne irgendetwas zu zahlen! Behalten Sie das Buch, was wir [26] hoffen, zahlen Sie nur 50 Prozent des sonst üblichen Preises in einer Buchhandlung. Gleichzeitig nehmen Sie an einem Preisausschreiben [27].\n\nBitte bedenken Sie: Sollte Ihre Kundennummer [28] den richtigen Zahlen sein, haben Sie die Chance, ein Auto, eine Reise und viele weitere Preise zu erhalten. Antworten Sie [29] noch diese Woche! Dann haben Sie in jedem Fall die Chance auf den Hauptgewinn – einen Mercedes der S-Klasse. Wenn Sie innerhalb der kommenden vier Wochen antworten, nehmen Sie immer [30] an unserer Gewinnverteilung teil – vorausgesetzt, Sie haben die richtige Kundennummer.\n\nMit freundlichen Grüßen\nPetra Obermoser\nLeiterin der Abteilung Marketing", "q": [{"n": 21, "opts": {"a": "auf", "b": "in", "c": "mit"}, "key": "b", "why": "zum Start in etwas (+ Akk) = the start into the new year."}, {"n": 22, "opts": {"a": "Mit", "b": "Von", "c": "Bei"}, "key": "a", "why": "Mit dem Beginn = at the same time as the beginning."}, {"n": 23, "opts": {"a": "schöne", "b": "schönen", "c": "schöner"}, "key": "a", "why": "No article, Nominativ plural: (sehr) schöne Gewinne."}, {"n": 24, "opts": {"a": "einfach", "b": "immer", "c": "noch"}, "key": "a", "why": "einfach = simply (just send it back)."}, {"n": 25, "opts": {"a": "unser", "b": "unserem", "c": "unseren"}, "key": "b", "why": "mit + Dativ, neuter das Versprechen → mit unserem Versprechen."}, {"n": 26, "opts": {"a": "natürlich", "b": "nämlich", "c": "leider"}, "key": "a", "why": "We of course hope you keep it ('leider' makes no sense)."}, {"n": 27, "opts": {"a": "mit", "b": "teil", "c": "an"}, "key": "b", "why": "Separable verb teilnehmen: Sie nehmen … teil."}, {"n": 28, "opts": {"a": "unter", "b": "neben", "c": "vor"}, "key": "b", "why": "Key 'neben' (= next to / among the right numbers), + Dativ."}, {"n": 29, "opts": {"a": "schon", "b": "immer", "c": "unbedingt"}, "key": "c", "why": "unbedingt = definitely, strong advice."}, {"n": 30, "opts": {"a": "noch", "b": "schon", "c": "nur"}, "key": "a", "why": "immer noch = still (you still take part)."}]}, "sprach2": {"text": "Sehr geehrte Frau Bauer,\n\nich habe Ihre Anzeige in der Neuen Presse gelesen und bin an dem Filmprojekt sehr [31].\n\nIch war schon [32] für einige Wochen im Ausland. Vor allem im Sommer habe ich während meines Studiums viele Sprachkurse besucht. Länger als ein halbes Jahr habe ich [33] einmal im Ausland gelebt, und zwar [34] zwei Jahren. Mein Chef machte mir damals das Angebot, acht Monate im Tochterunternehmen der Firma in Portugal zu [35], was ich dann auch getan habe.\n\nAm Anfang war es sehr schwer, weil ich niemanden kannte und alles sehr neu und [36] für mich war. Eigentlich wollte ich so schnell wie [37] wieder zurück. Aber dann habe ich nette Kollegen kennen gelernt, die mir auch über die Kultur und das Leben in Portugal [38] haben.\n\nIch glaube, dass meine Erfahrungen für viele andere Menschen, die auch im Ausland leben wollen, sehr interessant sein könnten, und ich [39] gerne auch vor der Kamera darüber erzählen. [40] Sie noch weitere Fragen an mich haben, können Sie mich gerne anrufen, meine Telefonnummer ist 07612/64788980.\n\nIch würde mich freuen, bald von Ihnen zu hören.\n\nMit freundlichen Grüßen\nKaroline Pointner", "words": {"a": "als", "b": "anfangen", "c": "arbeiten", "d": "erzählt", "e": "falls", "f": "informiert", "g": "interessiert", "h": "möchten", "i": "möglich", "j": "nur", "k": "öfter", "l": "unbekannt", "m": "vor", "n": "würde", "o": "zwischen"}, "key": ["g", "k", "j", "m", "c", "l", "i", "d", "n", "e"], "why": ["an etwas interessiert sein (+ Dat).", "öfter = several times (I have been abroad several times).", "nur einmal = only once.", "vor zwei Jahren = two years ago (vor + Dativ).", "zu + infinitive: zu arbeiten.", "neu und unbekannt – two adjectives with the same meaning direction.", "so schnell wie möglich = as fast as possible.", "Perfekt: haben … erzählt (über etwas erzählen).", "Konjunktiv II: ich würde gerne erzählen.", "falls = in case, verb at the end."]}, "hoeren1": [{"n": 41, "s": "Die Sprecherin ist dagegen, dass Kinder so früh eine Fremdsprache lernen.", "a": "f", "t": "Kinder sollten, denke ich, früh eine Fremdsprache lernen. Wenn sie jung sind, merken sie sich neue Wörter leichter. Ich finde, sie haben dann auch weniger Angst, Fehler zu machen. Später wird es schwieriger. Deshalb bin ich dafür, dass Kinder früh mit dem Sprachenlernen anfangen.", "e": "She is FOR it: 'Deshalb bin ich dafür …'"}, {"n": 42, "s": "Die Sprecherin meint, dass das frühe Lernen einer Fremdsprache für viele Kinder Nachteile hat.", "a": "r", "t": "Es ist, denke ich, nicht immer gut, wenn Kinder sehr früh eine Fremdsprache lernen. Manche Kinder sind noch nicht bereit dafür und haben dann Probleme mit beiden Sprachen. Ich finde, sie sollten erst ihre Muttersprache gut können und dann eine neue Sprache lernen.", "e": "'…haben Probleme mit beiden Sprachen' = disadvantages."}, {"n": 43, "s": "Der Sprecher findet es schade, dass er im Kindergarten keine Fremdsprache lernen konnte.", "a": "f", "t": "Ich finde, es ist nicht schlimm, wenn Kinder im Kindergarten keine Fremdsprache lernen. In diesem Alter ist Spielen wichtiger. Freundschaften schließen und Spaß haben sollten im Vordergrund stehen. Eine neue Sprache kann man auch später in der Schule lernen.", "e": "'…es ist nicht schlimm' – he does not regret anything."}, {"n": 44, "s": "Die Sprecherin meint, dass das Fremdsprachenlernen erst in der Schule beginnen sollte.", "a": "r", "t": "Kinder sollten, denke ich, erst in der Schule mit einer Fremdsprache beginnen. Dort gibt es Lehrer, Bücher und klare Regeln, die das Lernen leichter machen. Im Kindergarten sollen Kinder frei spielen. Ich glaube, die Schule ist der bessere Ort für das Sprachenlernen.", "e": "'…erst in der Schule mit einer Fremdsprache beginnen.'"}, {"n": 45, "s": "Der Sprecher ist dagegen, dass Kinder schon früh eine Fremdsprache lernen.", "a": "r", "t": "Ich sehe es kritisch, wenn Kinder schon im frühen Alter eine Fremdsprache lernen müssen. In diesem Alter sollten sie spielen und ihre Muttersprache festigen. Ich finde, das setzt sie unnötig unter Druck. Eine neue Sprache zu früh zu lernen bringt mehr Stress als Nutzen.", "e": "'Ich sehe es kritisch …' = he is against it."}], "hoeren2": {"note": "reconstructed (no transcript available; script written to match the key)", "intro": "Im Radio spricht eine Moderatorin mit Herrn Maurer von der Spitex, einer Organisation für Hilfe und Pflege zu Hause in der Schweiz.", "speakers": ["Moderatorin", "Herr Maurer"], "lines": [["A", "Guten Tag, liebe Hörerinnen und Hörer. In Deutschland gibt es immer mehr Organisationen, die sich um alte und kranke Menschen kümmern. Wie macht man das in der Schweiz? Bei mir im Studio ist Herr Maurer von der Spitex in Zürich. Herr Maurer, was ist die Spitex eigentlich?"], ["B", "Guten Tag. Spitex ist die Abkürzung für „spitalexterne Hilfe und Pflege“. Wir versorgen alte oder kranke Menschen, vor allem bei ihnen zu Hause. Aber wir sind auch schon im Krankenhaus tätig: Wir besuchen die Patienten dort vor der Entlassung und versorgen sie, damit der Übergang nach Hause gut klappt."], ["A", "Was genau machen Ihre Mitarbeiter?"], ["B", "Wir haben eigentlich drei große Bereiche. Erstens die Pflege, also Medikamente geben, Verbände wechseln, Spritzen geben. Zweitens die Hilfe im Haushalt – einkaufen, putzen, kochen. Und drittens die Beratung der Angehörigen."], ["A", "Kann jeder Mitarbeiter alles machen?"], ["B", "Nein. Bestimmte Aufgaben dürfen nur von einer ausgebildeten Krankenschwester gemacht werden, zum Beispiel Spritzen geben oder Wunden versorgen. Für den Haushalt haben wir Haushelferinnen, die keine medizinische Ausbildung brauchen."], ["A", "Sind Ihre Kunden alle alte Menschen?"], ["B", "Nein, gar nicht. Natürlich sind die meisten älter, aber wir betreuen auch junge Mütter nach der Geburt, Menschen nach einem Unfall oder Kinder mit einer Behinderung."], ["A", "Und wer bezahlt das alles? Bekommt die Spitex Geld von den Krankenkassen?"], ["B", "Nicht direkt. Die Patienten bekommen von uns eine Rechnung und bezahlen sie zuerst selbst. Danach holen sie sich das Geld für die Pflege bei ihrer Krankenkasse zurück. Den Rest bezahlen die Gemeinden mit Steuergeldern."], ["A", "Das ist dann für die Krankenkassen bestimmt sehr teuer."], ["B", "Ja, das stimmt. Weil die Menschen immer älter werden und lieber zu Hause bleiben als ins Heim zu gehen, geben die Krankenkassen heute den größten Teil ihres Geldes für die Pflege durch die Spitex aus."], ["A", "Was kostet eine Stunde Spitex für den Patienten?"], ["B", "Für die Haushaltshilfe zahlt man etwa 35 Franken pro Stunde. Ich finde, das ist ein fairer Preis, wenn man bedenkt, dass ein Platz im Pflegeheim viel mehr kostet."], ["A", "Ist die Spitex eine private Firma?"], ["B", "Das ist unterschiedlich. In manchen Kantonen gibt es private Spitex-Firmen, aber in den meisten Kantonen ist die Spitex ein gemeinnütziger Verein, der eng mit der Gemeinde zusammenarbeitet."], ["A", "Wäre das auch ein Modell für Deutschland? Werden Sie bald auch dort alte Menschen betreuen?"], ["B", "Nein, das planen wir nicht. Wir arbeiten nur in der Schweiz. In Deutschland gibt es ja eigene ambulante Pflegedienste, die eine sehr gute Arbeit machen."], ["A", "Herr Maurer, herzlichen Dank für das Gespräch."], ["B", "Ich danke Ihnen."]], "items": [{"n": 46, "s": "In Deutschland gibt es immer mehr Organisationen, die sich um alte und kranke Menschen kümmern.", "a": "r", "e": "'In Deutschland gibt es immer mehr Organisationen, die sich um alte und kranke Menschen kümmern.'"}, {"n": 47, "s": "Die Spitex versorgt alte oder kranke Menschen im Krankenhaus.", "a": "r", "e": "'Wir sind auch schon im Krankenhaus tätig … und versorgen sie.'"}, {"n": 48, "s": "Die Spitex hat zwei große Aufgabenbereiche.", "a": "f", "e": "'Wir haben eigentlich drei große Bereiche.'"}, {"n": 49, "s": "Es gibt Aufgaben, die nur von einer Krankenschwester gemacht werden dürfen.", "a": "r", "e": "'Bestimmte Aufgaben dürfen nur von einer ausgebildeten Krankenschwester gemacht werden.'"}, {"n": 50, "s": "Die Spitex kümmert sich nur um alte Leute.", "a": "f", "e": "'Nein, gar nicht … auch junge Mütter, Menschen nach einem Unfall, Kinder.'"}, {"n": 51, "s": "Die Spitex bekommt Geld von den Krankenkassen.", "a": "f", "e": "'Nicht direkt.' The patients pay and get the money back from their insurance."}, {"n": 52, "s": "Die Krankenkassen geben den größten Teil ihres Geldes für die Spitex aus.", "a": "r", "e": "'…geben die Krankenkassen heute den größten Teil ihres Geldes für die Pflege durch die Spitex aus.'"}, {"n": 53, "s": "Herr Maurer findet den Preis pro Stunde in Ordnung.", "a": "r", "e": "'Ich finde, das ist ein fairer Preis.'"}, {"n": 54, "s": "Die Spitex ist in der ganzen Schweiz eine private Organisation.", "a": "f", "e": "'…in den meisten Kantonen ist die Spitex ein gemeinnütziger Verein.'"}, {"n": 55, "s": "In Zukunft betreut die Spitex auch die alten Menschen in Deutschland.", "a": "f", "e": "'Nein, das planen wir nicht. Wir arbeiten nur in der Schweiz.'"}]}, "hoeren3": [{"n": 56, "s": "Der Fahrer des Wagens mit dem Kennzeichen HB-D 256 soll ins Erdgeschoss kommen.", "a": "r", "t": "Guten Tag. Der Fahrer des Wagens mit dem Kennzeichen HB-D 256 wird gebeten, sofort ins Erdgeschoss zu kommen. Sein Auto steht im Halteverbot und blockiert einen wichtigen Zugang. Bitte kommen Sie schnell zur Information im Erdgeschoss.", "e": "'…wird gebeten, sofort ins Erdgeschoss zu kommen.'"}, {"n": 57, "s": "Die Firma liefert das bestellte Sofa am Dienstagnachmittag zwischen drei und sechs Uhr.", "a": "f", "t": "Guten Morgen. Ihre Möbelbestellung wird nicht am Dienstag, sondern erst am Donnerstag geliefert. Die Lieferung erfolgt zwischen 3 und 6 Uhr am Nachmittag. Bitte stellen Sie sicher, dass Sie am Donnerstag zu Hause sind, damit wir das Sofa problemlos anliefern können.", "e": "The time is right, but the day is Thursday: 'nicht am Dienstag, sondern erst am Donnerstag'."}, {"n": 58, "s": "Der Gasthof Lindner liegt neben einer Tankstelle.", "a": "r", "t": "Herzlich willkommen im Gasthof Lindner. Unser Gasthof liegt direkt neben einer großen Tankstelle am Stadtrand. Wir bieten Ihnen täglich frische Speisen, Frühstücksangebote und gemütliche Pausenmöglichkeiten für Reisende. Wir wünschen eine gute Weiterreise.", "e": "'…liegt direkt neben einer großen Tankstelle.'"}, {"n": 59, "s": "Der Film „Komiker“ wird mehrmals am Tag gezeigt.", "a": "r", "t": "Im Kino läuft aktuell der Film „Komiker“, der mehrmals am Tag gezeigt wird. Es gibt Vorstellungen am Vormittag, am Nachmittag und am Abend. Besonders beliebt sind die Abendvorstellungen am Wochenende.", "e": "Shows in the morning, afternoon and evening = several times a day."}, {"n": 60, "s": "Für den Abend wird kein Regen erwartet.", "a": "f", "t": "Für heute Abend ist leider schlechtes Wetter angekündigt. Laut dem aktuellen Wetterbericht wird es starken Regen und Gewitter geben. Autofahrer sollten besonders vorsichtig sein. Denken Sie daran, einen Regenschirm mitzunehmen.", "e": "'…wird es starken Regen und Gewitter geben.'"}], "schreiben": {"letter": "Liebe(r) …,\n\nich sende Dir ganz viele Grüße aus Rom! Du weißt ja, wie sehr mir diese Stadt gefällt. Ich bin hier von morgens bis abends nur unterwegs. Diese Museen, Parks, Plätze und natürlich das Essen – wunderbar! Gestern Abend war ich übrigens in einem Rockkonzert. Ich fand die Musik ganz toll und die Stimmung war super.\n\nDoch leider ist mein Urlaub schon fast vorbei und in drei Tagen muss ich wieder zurück nach Deutschland. Welche Stadt ist eigentlich Deine Lieblingsstadt? Hast Du schon Pläne für Deinen nächsten Urlaub? Vielleicht können wir uns ja mal wieder treffen.\n\nHerzliche Grüße\nJan", "task": "Antworten Sie Jan. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Ihre Lieblingsstadt", "Welche Musik Sie mögen", "Ihre Pläne für den nächsten Urlaub", "Treffen mit Jan"], "model": "Köln, den 12. Mai 2025\n\nLieber Jan,\n\nvielen Dank für Deine E-Mail aus Rom, über die ich mich sehr gefreut habe. Schön, dass Du so einen tollen Urlaub hast!\n\nRom finde ich auch wunderschön, aber meine Lieblingsstadt ist Wien. Dort gibt es herrliche alte Kaffeehäuser, viele Museen und die Stadt ist sehr sauber. Rockmusik höre ich auch gern, aber am liebsten mag ich Popmusik und manchmal klassische Musik. Letzten Monat war ich in einem Konzert von Adele – es war fantastisch!\n\nIm nächsten Urlaub möchte ich mit meiner Familie nach Spanien fliegen. Wir wollen am Strand liegen, schwimmen und die spanische Küche probieren.\n\nNatürlich möchte ich Dich gern wiedersehen! Wie wäre es mit dem nächsten Wochenende? Wir könnten uns in einem italienischen Restaurant in der Altstadt treffen, dann kannst Du mir Deine Fotos zeigen.\n\nRuf mich an, wenn Du wieder zu Hause bist.\n\nHerzliche Grüße\nDein Ahmed", "phrases": ["Vielen Dank für Deine E-Mail, über die ich mich sehr gefreut habe.", "Meine Lieblingsstadt ist …, weil …", "Am liebsten höre ich …", "Im nächsten Urlaub möchte ich …", "Wie wäre es mit dem nächsten Wochenende?", "Ruf mich an, wenn Du wieder zu Hause bist."]}, "vocab": [["verreisen", "to go away (travel)"], ["nachsenden lassen", "to have forwarded"], ["der Urlaubsort, -e", "holiday destination"], ["kostenlos", "free of charge"], ["die Wanderung, -en", "hike"], ["das Gepäck", "luggage"], ["die Übernachtung, -en", "overnight stay"], ["enthalten sein", "to be included"], ["der Pauschalbetrag, -¨e", "flat rate"], ["der Lärm", "noise"], ["die Mittagsruhe", "midday quiet time"], ["die Ruhestörung, -en", "disturbance of the peace"], ["der Feiertag, -e", "public holiday"], ["das Antiquariat, -e", "second-hand bookshop"], ["leicht zu erreichen", "easy to reach"], ["die Vorstellung, -en", "performance"], ["die Verzögerung, -en", "delay"], ["verzichten auf + Akk", "to do without"], ["die Sicht", "view"], ["betreuen", "to look after"], ["der Schichtbetrieb", "shift work"], ["die Krankenschwester, -n", "nurse"], ["die Erste Hilfe", "first aid"], ["der Aufenthaltsraum, -¨e", "lounge, waiting room"], ["der Wickeltisch, -e", "changing table"], ["die Abwechslung", "variety"], ["bereichernd", "enriching"], ["sich erholen", "to relax, recover"], ["die Kenntnisse (Pl.)", "knowledge, skills"], ["der Reisepartner, -", "travel companion"], ["die Veranstaltung, -en", "event"], ["das Geschäftsjahr, -e", "business year"], ["der Gewinn, -e", "prize, profit"], ["das Preisausschreiben, -", "competition, prize draw"], ["teilnehmen an + Dat", "to take part in"], ["das Versprechen, -", "promise"], ["vorausgesetzt", "provided that"], ["interessiert sein an + Dat", "to be interested in"], ["das Tochterunternehmen, -", "subsidiary"], ["unbekannt", "unknown"], ["die Pflege", "care, nursing"], ["die Krankenkasse, -n", "health insurance"], ["die Rechnung, -en", "bill"], ["gemeinnützig", "non-profit"], ["das Kennzeichen, -", "number plate"], ["das Erdgeschoss, -e", "ground floor"], ["liefern", "to deliver"], ["die Tankstelle, -n", "petrol station"], ["das Gewitter, -", "thunderstorm"], ["die Lieblingsstadt, -¨e", "favourite city"], ["die Stimmung, -en", "atmosphere, mood"]], "grammar": ["Adjective without article, plural: schöne Gewinne", "mit + Dativ: mit unserem Versprechen", "Separable verbs: teilnehmen → Sie nehmen … teil", "immer noch = still; unbedingt = definitely", "interessiert sein an + Dativ", "vor + time (ago): vor zwei Jahren", "zu + Infinitiv after Angebot: das Angebot, … zu arbeiten", "so … wie möglich", "Konjunktiv II: ich würde gerne erzählen", "falls + verb at the end (condition)"]}, {"n": 16, "title": "Zug · Neue Berufe · Liebe Dominique", "lesen1": {"headlines": {"a": "Nur wenige lesen im Zug", "b": "Bahnfahren bei älteren Menschen immer beliebter", "c": "Per Internet leichter ans Ziel", "d": "Männer fahren besser", "e": "Hilfe beim Reisen mit der Bahn", "f": "Frauen finden den richtigen Weg", "g": "Neuer Deutschkurs in Solothurn", "h": "Jetzt wird auch im Zug gelernt", "i": "Lesen im Zug ist beliebt", "j": "Neue Verkehrsregeln für Autofahrer"}, "texts": ["Frauen kommen genauso gut an ihr Ziel wie Männer, sie geben nur nicht so damit an. Das ergab eine Studie der Eberhard-Karls-Universität Tübingen mit 600 Testpersonen. Obwohl Frauen sich so gut zurechtfinden wie Männer, fragen sie öfter nach dem Weg, wenn sie allein unterwegs sind, und freuen sich, wenn ihnen Fremde helfen. Die Tübinger Forscher nennen das ein „kommunikatives Orientierungsmodell“. Männer dagegen verfahren sich lieber dreimal, als einmal um Hilfe zu bitten. Dabei spielt offensichtlich die Erziehung eine Rolle.", "Bahnfahren ist entspannend und lädt zum Lesen ein. Deswegen liest auch etwa die Hälfte aller Reisenden während ihrer Bahnfahrt. Frauen sind dabei lesefreudiger als Männer: 63 Prozent von ihnen steigen mit einem Buch in den Zug. Wer mit der Bahn unterwegs ist, verbringt im Durchschnitt etwa eine Stunde und 28 Minuten mit dem Lesen eines Buches oder einer Zeitung. Ein Zehntel aller Bahnreisenden gesteht, dass sie keine Buchleser sind. Dies sind die wesentlichen Ergebnisse einer Studie der Stiftung Lesen in Zusammenarbeit mit der Deutschen Bahn.", "Der frühere Verein junger Mädchen heißt nun Compagna und hat sich zu einem modernen gemeinnützigen Dienstleistungsbetrieb gewandelt. Das wichtigste Ziel des Vereins ist es weiterhin, Menschen zu begleiten. Diese Dienstleistung richtet sich vor allem an Menschen, die auf Hilfe angewiesen sind: allein reisende Kinder, alte und behinderte Menschen. Die Reisenden werden am Ausgangsbahnhof abgeholt und mit den öffentlichen Verkehrsmitteln bis zum Zielort begleitet.", "Christine Zumstein, Leiterin der Volkshochschule Solothurn (VHS), ist begeistert: Super gelaufen seien die Kurse, die die VHS in den Morgenzügen im letzten Quartal angeboten hat. Weil sich das Pilotprojekt von VHS und RBS auf der Strecke Solothurn–Bern bestens bewährt hat, sollen künftig auch Pendlerinnen und Pendler in umgekehrter Richtung die Möglichkeit erhalten, während der Bahnfahrt Sprachen zu lernen – im Zug ab Bern mit einem Kurs in der neuen Rechtschreibung. Ebenfalls angeboten werden Englisch, Italienisch und Französisch.", "Sie sind in der Schweiz zu einem Fest eingeladen, aber auf der Einladung steht nur die Adresse? Kein Problem, auch ohne Auto: Seit einiger Zeit hat der Internet-Fahrplan der Schweizerischen Bundesbahnen (www.sbb.ch) einen großen Bruder. Bis jetzt konnte man nur Verbindungen von Bahnhof zu Bahnhof oder von Haltestelle zu Haltestelle abfragen. Neuerdings ist das auch für den Weg von einer Adresse zu einer anderen möglich. Der elektronische Fahrplan führt Sie automatisch zum Haltepunkt des öffentlichen Verkehrs, der am nächsten bei der Zieladresse liegt. Das ist mit dem Verkehrsleitsystem für Autos vergleichbar, das Sie aber auch in der verkehrten Richtung durch Einbahnstraßen führen kann. Beim öffentlichen Verkehr kommt das glücklicherweise nicht vor."], "key": ["f", "i", "e", "h", "c"], "why": ["Women find their way as well as men – trap d (men drive better) is not said.", "About half of all travellers read on the train – so a is wrong ('nur wenige').", "Compagna accompanies children, old and disabled people on trains = help when travelling.", "Language courses in commuter trains; not a German course only and not only in Solothurn (trap g).", "The SBB online timetable now guides you from address to address."]}, "lesen2": {"title": "Neue Berufe: Raumberaterin für harmonisches Wohnen", "note": "reconstructed (stems 6, 8, 9 and all answer options missing in the book; written to match the key)", "text": "Räume nach der chinesischen Lehre Feng-Shui zu gestalten, damit sich die Menschen wohl fühlen – das ist der Beruf von Iris Eigenmann.\n\n„Seit knapp einem Jahr bin ich nun selbstständig und bin voller Energie. So stehe ich jeden Tag mit einem Lächeln auf und gehe abends wieder mit einem Lächeln ins Bett.“ Die diplomierte Raumberaterin Iris Eigenmann ist von ihrem Beruf sichtlich begeistert. Da viele mit dem Wort Feng-Shui nichts anfangen können, bezeichnet sie sich selbst als „Raumberaterin für harmonisches Wohnen“. Ihre Aufgabe ist es, Wohnungen, aber auch Büros und andere Arbeitsplätze so einzurichten, dass sich Menschen in diesen Räumen wohl fühlen können.\n\nUrsprünglich ist Frau Eigenmann gelernte Hochbauzeichnerin und hat jahrelang Bauprojekte geleitet. Diese Erfahrungen mit Architektur und Wohnbau helfen ihr nun sehr bei ihrer Tätigkeit als Raumberaterin. Ihre Arbeit besteht darin, den optimalen Energiefluss eines Wohn- oder Arbeitsumfeldes zu finden. Sie macht individuelle Vorschläge für die Raumanordnung, die Farbwahl der Wände oder für die Verwendung von Baumaterialien. „Ich habe alle Ideen zuerst bei mir zu Hause ausprobiert und war selbst überrascht von der positiven Wirkung“, erzählt sie begeistert.\n\nEine Raumberaterin arbeitet in der Regel folgendermaßen: Zuerst besprechen die Leute mit Frau Eigenmann, warum sie sich in ihrer Wohnung nicht wohl fühlen und wie sie ihren Wohnraum verbessern möchten. Dann bittet die Beraterin ihre Kunden, ihr einen genauen Plan der Wohnung zu schicken, auf dem sie die Möbelaufstellung und die genaue Ausrichtung des Hauses sehen kann.\n\nDaraufhin macht Frau Eigenmann einen detaillierten Wohnungsplan mit ausführlichen Erklärungen, wie man die Räume optimal einrichtet, um sich darin zufrieden zu fühlen. Für die Erstellung eines solchen Planes benötigt sie nach eigener Aussage je nach Größe der Wohnung oder des Gebäudes zwischen einem halben und einem ganzen Tag.\n\nAnschließend geht Iris Eigenmann zu den Leuten nach Hause, um die Situation vor Ort zu analysieren und Verbesserungsmöglichkeiten aufzuzeigen.\n\nAuch immer mehr Firmen suchen Rat bei einer Raumberaterin, meistens dann, wenn das Unternehmen nicht mehr so erfolgreich arbeitet. Iris Eigenmann versucht dann, das Arbeitsumfeld so zu verändern, dass sich Kunden und Angestellte wohler fühlen. Das führt in den meisten Fällen dazu, dass auch die Geschäfte wieder besser gehen. Der Preis für die Raumberatung wird je nach Aufwand mit dem Kunden gemeinsam bestimmt. Das Geld aber ist für Frau Eigenmann weniger wichtig als die Möglichkeit, den Menschen zu helfen und ihre positiven Erfahrungen weiterzugeben.\n\nDas persönliche Ziel der Feng-Shui-Raumberaterin für die Zukunft ist es, vermehrt auch im sozialen Bereich zu wirken – zum Beispiel in Krankenhäusern oder Altersheimen. Sie meint, dass mit einfachen Maßnahmen dort die Lebensqualität der Menschen erheblich verbessert werden könnte.", "q": [{"n": 6, "stem": "Iris Eigenmann …", "opts": {"a": "ist seit fast einem Jahr selbstständig und sehr glücklich mit ihrem Beruf.", "b": "arbeitet seit vielen Jahren als Raumberaterin.", "c": "ist manchmal sehr müde von ihrer Arbeit."}, "key": "a", "why": "'Seit knapp einem Jahr bin ich nun selbstständig und bin voller Energie.'"}, {"n": 7, "stem": "Als Raumberaterin kümmert sich Iris Eigenmann darum, …", "opts": {"a": "neue Häuser nach chinesischem Stil zu bauen.", "b": "Möbel für Wohnungen und Büros zu verkaufen.", "c": "dass sich Menschen in Wohnungen und an Arbeitsplätzen wohl fühlen."}, "key": "c", "why": "'…so einzurichten, dass sich Menschen in diesen Räumen wohl fühlen können.'"}, {"n": 8, "stem": "Bei ihrer Arbeit hilft Frau Eigenmann, dass sie …", "opts": {"a": "in China Feng-Shui studiert hat.", "b": "früher als Hochbauzeichnerin Bauprojekte geleitet hat.", "c": "viele Kunden aus ihrer Familie hat."}, "key": "b", "why": "'Diese Erfahrungen mit Architektur und Wohnbau helfen ihr nun sehr.'"}, {"n": 9, "stem": "Bevor Frau Eigenmann ihre Kunden zu Hause besucht, …", "opts": {"a": "streicht sie die Wände neu.", "b": "schickt sie den Kunden einen Plan für neue Möbel.", "c": "erstellt sie nach einem Gespräch einen genauen Wohnungsplan."}, "key": "c", "why": "Order: conversation → client sends plan → she makes a detailed plan → 'Anschließend geht sie zu den Leuten nach Hause.'"}, {"n": 10, "stem": "Frau Eigenmann möchte in Zukunft …", "opts": {"a": "vor allem für große Firmen arbeiten.", "b": "auch in Krankenhäusern und Altersheimen arbeiten.", "c": "mehr Geld für ihre Beratung verlangen."}, "key": "b", "why": "'…vermehrt auch im sozialen Bereich zu wirken – zum Beispiel in Krankenhäusern oder Altersheimen.'"}]}, "lesen3": {"note": "reconstructed (ads a–l missing in the book; written to match the key)", "situations": ["Sie interessieren sich für eine neue Waschmaschine.", "Ihr Freund sucht einen Praktikumsplatz bei einer Zeitung.", "Sie wollen ein neues Musikinstrument spielen lernen.", "In Ihrer Wohnung gibt es Probleme mit dem Wasser in Bad und Küche und Sie wollen das verändern.", "Ihre Wohnung ist immer zu kalt und Sie wollen das ändern.", "Sie suchen einen Klavierlehrer für Ihre Tochter.", "Sie möchten lernen, Kleider selber zu machen.", "In Ihrer Wohnung gibt es Probleme mit feuchten Wänden.", "Sie möchten einen schönen, alten Schrank kaufen.", "Sie wollen lernen, wie man kleine Geschichten auf Deutsch schreibt, und suchen einen passenden Kurs."], "ads": {"a": "Creative Writing Workshop: Write your own short stories in English! Six evenings with the American author Jane Miller. Volkshochschule Hamburg-Ost.", "b": "Antiquitäten Weber: Schränke, Kommoden und Tische aus dem 18. und 19. Jahrhundert, liebevoll restauriert. Besuchen Sie unsere Ausstellung in der Altstadt, Di–Sa 10–18 Uhr.", "c": "Sanitär Müller: Tropft der Wasserhahn? Ist der Abfluss verstopft? Wir reparieren und erneuern Wasserleitungen in Bad und Küche – schnell und zuverlässig. Notdienst rund um die Uhr: 040/23 45 67.", "d": "Hamburger Morgenpost sucht Praktikantinnen und Praktikanten für die Lokalredaktion. Sie schreiben gern und interessieren sich für Journalismus? Dauer: 3 Monate. Bewerbungen an redaktion@mopo-praktikum.de.", "e": "Heizung zu schwach? Firma Wärme & Co. prüft Ihre Heizungsanlage, baut neue Heizkörper ein und berät Sie zur Wärmedämmung von Fenstern und Türen. Kostenlose Beratung!", "f": "Möbelhaus Nordlicht: Moderne Einbauküchen zu Tiefstpreisen. Planung und Montage inklusive.", "g": "Nasse Keller, feuchte Wände, Schimmel? Die Bautrocknung Schulz hilft! Wir finden die Ursache und machen Ihre Wände wieder trocken. Tel. 040/88 99 00.", "h": "Nähkurs für Anfänger: Lernen Sie, Röcke, Blusen und Kleider selbst zu nähen. Nähmaschinen sind vorhanden. Stoffladen Fadenreich, jeden Mittwoch 18–20 Uhr.", "i": "Konzert der Musikschule: Unsere Klavierschülerinnen und -schüler spielen Werke von Mozart und Chopin. Sonntag, 16 Uhr, Aula des Gymnasiums. Eintritt frei.", "j": "Klavierstimmer Hansen: Ihr Klavier klingt nicht mehr gut? Wir stimmen und reparieren Klaviere und Flügel aller Marken.", "k": "Nie zu spät für Musik! Saxophon-, Gitarren- und Schlagzeugunterricht für Erwachsene, auch für absolute Anfänger. Musikstudio Klangwerk, erste Probestunde gratis.", "l": "Elektro-Discount: Waschmaschinen, Trockner und Kühlschränke der Spitzenmarken stark reduziert! Lieferung und Anschluss kostenlos."}, "key": ["l", "d", "k", "c", "e", "x", "h", "g", "b", "x"], "why": ["Ad l: washing machines on sale.", "Ad d: internship at a newspaper.", "Ad k: lessons for a new instrument (sax, guitar, drums) for adults.", "Ad c: plumber for water pipes in bathroom and kitchen.", "Ad e: heating company – flat too cold.", "No ad: i is only a concert of piano students and j tunes pianos – no piano teacher.", "Ad h: sewing course to make clothes.", "Ad g: drying company for damp walls.", "Ad b: antique cupboards.", "No ad: a is a writing course, but in English – not in German."]}, "sprach1": {"note": "partly reconstructed (options for 22 and parts of 23/25/27/30 unreadable; completed around the key)", "text": "Liebe Dominique,\n\nda ich dich telefonisch nicht erreiche, auch nicht per E-Mail, schreibe ich dir einen Brief. Es ist nämlich etwas ganz Besonderes [21]: Stell [22] vor, ich habe die Stelle bei der EU in Brüssel bekommen!\n\nDu weißt noch: Es gab ungefähr 300 Bewerber, und unter denen [23] die besten ausgesucht. Ich hatte mich auf das Vorstellungsgespräch schon [24] Zeit vorher vorbereitet. Trotzdem – ohne meine Sprachkenntnisse und meine Auslandserfahrung [25] ich die Stelle sicher nicht bekommen. Aber ein bisschen Glück braucht man auch, [26] so etwas gelingt.\n\nNun bitte ich dich [27] ein paar gute Tipps. Vielleicht kennst du auch jemanden, von [28] ich Informationen über das Leben in Belgien bekommen kann? Ich würde dich am liebsten kurz [29], um mit dir persönlich zu sprechen. Geht das vielleicht [30] zwei Wochen, z. B. am übernächsten Wochenende? Bitte gib mir Bescheid.\n\nHerzliche Grüße\nKatie", "q": [{"n": 21, "opts": {"a": "geschah", "b": "geschehen", "c": "geschieht"}, "key": "b", "why": "Perfekt with sein: Es ist … geschehen (Partizip II)."}, {"n": 22, "opts": {"a": "dich", "b": "dir", "c": "sich"}, "key": "b", "why": "sich (Dat) etwas vorstellen → Stell dir vor!"}, {"n": 23, "opts": {"a": "haben", "b": "wären", "c": "wurden"}, "key": "c", "why": "Passive past: die besten wurden ausgesucht."}, {"n": 24, "opts": {"a": "lange", "b": "langem", "c": "langer"}, "key": "c", "why": "Genitive of time without article: langer Zeit vorher (feminine die Zeit, -er ending)."}, {"n": 25, "opts": {"a": "habe", "b": "hätte", "c": "wäre"}, "key": "b", "why": "Unreal past (Konjunktiv II Vergangenheit): hätte … bekommen."}, {"n": 26, "opts": {"a": "als", "b": "damit", "c": "ob"}, "key": "b", "why": "damit = so that (purpose)."}, {"n": 27, "opts": {"a": "für", "b": "auf", "c": "um"}, "key": "c", "why": "jemanden um etwas bitten."}, {"n": 28, "opts": {"a": "dem", "b": "den", "c": "denen"}, "key": "c", "why": "Key 'denen' (Dativ plural relative pronoun after von)."}, {"n": 29, "opts": {"a": "getroffen", "b": "treffe", "c": "treffen"}, "key": "c", "why": "würde + infinitive: würde dich treffen."}, {"n": 30, "opts": {"a": "bis", "b": "in", "c": "an"}, "key": "b", "why": "in + time = in two weeks' time."}]}, "sprach2": {"text": "Sehr geehrte Frau Campe,\n\nmein Deutschlehrer hat mich [31] informiert, dass Sie in St. Andreasberg Intensivkurse in Deutsch anbieten.\n\nIch lerne [32] zwei Jahren Deutsch in Yverdon, einer kleinen Stadt in der Westschweiz. Es gefällt mir hier, aber ich lebe in einer französischsprachigen Region und auch meine Arbeitskollegen [33] nur Französisch (oder Englisch) mit mir. So habe ich einfach zu [34] Gelegenheit, Deutsch zu sprechen. Deshalb interessiere ich mich [35] für Ihre Intensivkurse. Die Oberpfalz [36] ich schon seit langem einmal kennen lernen. Ich habe schon viel darüber gehört und gelesen, war aber selber noch nie dort.\n\nBevor ich mich für einen Sprachkurs in St. Andreasberg entscheide, [37] ich noch einige Fragen. Bieten Sie auch Sprachkurse an, in denen man international anerkannte Diplome erwerben kann? [38] Studenten nehmen an einem Kurs teil? Kann man abends auch noch individuell mit dem Computer weiterlernen? Muss man für die Exkursionen extra bezahlen oder sind die Kosten [39] schon im Kursgeld enthalten?\n\nFür Ihre Antwort [40] meine Fragen bedanke ich mich vielmals.\n\nMit freundlichen Grüßen\nNadia Grade", "words": {"a": "auf", "b": "dafür", "c": "darüber", "d": "hätte", "e": "kann", "f": "können", "g": "möchte", "h": "sehr", "i": "seit", "j": "sprechen", "k": "vor", "l": "wenig", "m": "wie", "n": "wie viele", "o": "wissen"}, "key": ["c", "i", "j", "l", "h", "g", "d", "n", "m", "a"], "why": ["jemanden darüber informieren, dass …", "seit + Dativ for an action still going on: seit zwei Jahren.", "Plural subject Kollegen → sprechen.", "zu wenig Gelegenheit = too little opportunity.", "sich sehr für etwas interessieren.", "möchte … kennen lernen (modal + infinitive).", "Polite Konjunktiv: ich hätte noch einige Fragen.", "Question about number: Wie viele Studenten …?", "Book key: 'wie' (e.g. 'wie üblich schon im Kursgeld enthalten').", "eine Antwort auf + Akk."]}, "hoeren1": [{"n": 41, "s": "Die Sprecherin fühlt sich durch Handys gestört.", "a": "r", "t": "Also, ich finde Handys oft störend. Neulich war ich im Café, und jemand telefonierte laut neben mir. Ich konnte mein eigenes Gespräch kaum führen. Auch im Kino nervt es mich, wenn Leute ständig aufs Display schauen. Man sollte mehr Rücksicht nehmen und das Handy öfter ausschalten.", "e": "'Ich finde Handys oft störend.'"}, {"n": 42, "s": "Der Sprecher benützt das Handy für Gespräche mit Freunden.", "a": "f", "t": "Ich telefoniere eigentlich nie mit Freunden. Wir schreiben uns ab und zu Nachrichten, aber telefonieren mag ich nicht. Das ist mir oft zu laut und zu privat. Ich benutze mein Handy mehr für Termine und E-Mails, aber persönliche Gespräche führe ich damit fast nie.", "e": "'Ich telefoniere eigentlich nie mit Freunden.'"}, {"n": 43, "s": "Der Sprecher ruft gern seine Partnerin mit dem Handy an.", "a": "f", "t": "Meine Partnerin rufe ich selten mit dem Handy an. Meistens sehen wir uns sowieso zu Hause. Wenn ich sie erreichen will, schreibe ich ihr lieber eine Nachricht. Telefonieren finde ich anstrengend, besonders unterwegs.", "e": "'Meine Partnerin rufe ich selten … an.'"}, {"n": 44, "s": "Die Sprecherin findet Handys für Kinder nicht gut.", "a": "r", "t": "Ich finde Handys für Kinder problematisch. Viele schauen den ganzen Tag auf den Bildschirm. Sie spielen nicht mehr draußen oder mit Freunden. Manche werden auch unruhig, wenn sie das Handy nicht haben. Kinder sollten lieber Bücher lesen oder Sport machen.", "e": "'Ich finde Handys für Kinder problematisch.'"}, {"n": 45, "s": "Der Sprecher hätte auch gern ein Handy.", "a": "f", "t": "Ich habe schon ein gutes Smartphone. Es funktioniert einwandfrei und ich brauche kein weiteres. Ein neues Handy interessiert mich nicht. Ich finde, man muss nicht immer das Neueste haben. Hauptsache, es funktioniert.", "e": "He already has a smartphone and wants no new one."}], "hoeren2": {"intro": "Ein Reporter spricht mit Frau Imbach, Mitarbeiterin der Freien Filmbühne, eines kleinen Kinos in Burgoberdorf.", "speakers": ["Reporter", "Frau Imbach"], "lines": [["A", "Guten Tag, Frau Imbach. Sie arbeiten bei der Freien Filmbühne in Burgoberdorf. Können Sie uns ein bisschen über das Kino erzählen?"], ["B", "Ja, gerne. Die Freie Filmbühne ist ein kleines Kino hier in Burgoberdorf. Es gibt uns schon seit vielen Jahren. Wir zeigen besondere Filme, keine Blockbuster, sondern eher Filme mit tieferem Inhalt."], ["A", "Und wie läuft es zurzeit?"], ["B", "Leider gibt es Probleme. Unser Gebäude soll abgerissen werden. Es ist alt und der Besitzer hat andere Pläne. Das bedeutet, unser Kino muss schließen."], ["A", "Das ist schade. Gibt es Pläne für einen neuen Standort?"], ["B", "Nein, noch nicht. Wir haben bisher nichts Passendes gefunden. Es ist schwierig, ein günstiges Gebäude zu finden, das sich für ein Kino eignet."], ["A", "Hat das Kino dieses Jahr einen Preis bekommen?"], ["B", "Ja, tatsächlich. Wir haben einen Preis für unser besonderes Programm erhalten. Es war das erste Mal, dass wir so eine Auszeichnung bekommen haben. Wir waren sehr stolz."], ["A", "Was war früher in dem Gebäude, in dem das Kino heute ist?"], ["B", "Oh, das war kein Schulgebäude, wie manche denken. Früher war es ein kleines Gemeindehaus. Später wurde es dann zum Kino umgebaut."], ["A", "Gibt es in der Nähe vom Kino Cafés oder Bars?"], ["B", "Nein, nicht direkt. Die nächste Möglichkeit ist etwa 15 Minuten zu Fuß entfernt. Viele Besucher gehen danach einfach nach Hause."], ["A", "Was passiert mit dem Gelände, wenn das Gebäude abgerissen wird?"], ["B", "Dort sollen neue Wohnungen gebaut werden und auch ein kleines Freizeitzentrum. Der Eigentümer hat schon Pläne beim Rathaus eingereicht."], ["A", "Und wann soll das alles fertig sein?"], ["B", "Der Bau soll schnell gehen. Zwei Jahre wird es wohl nicht dauern, vielleicht ein Jahr oder etwas mehr. Die Stadt möchte alles zügig umsetzen."], ["A", "Hat sich das Interesse am Kino verändert?"], ["B", "Ja, das stimmt leider. Am Anfang hatten viel mehr Menschen Interesse an der Freien Filmbühne. Heute ist das Interesse deutlich geringer. Viele entdecken unser Kino erst jetzt, wo es bald schließen muss."], ["A", "Was ist Ihre persönliche Meinung? Wünschen Sie sich einen Umzug?"], ["B", "Ehrlich gesagt, nein. Ich bin traurig, dass wir schließen müssen, aber ich finde, ein neues Gebäude wäre nicht das Gleiche. Es geht nicht nur um Filme, sondern auch um die Atmosphäre."], ["A", "Und bis zur Schließung gibt es noch Filmvorführungen?"], ["B", "Natürlich. Wir zeigen weiterhin Filme bis zum letzten Tag. Wir wollen uns mit einem schönen Programm verabschieden. Die Leute sollen noch ein letztes Mal die besondere Stimmung erleben."], ["A", "Vielen Dank, Frau Imbach, für das Gespräch und alles Gute für die Zukunft."], ["B", "Danke Ihnen."]], "items": [{"n": 46, "s": "Das Kino Freie Filmbühne ist in Burgoberdorf.", "a": "r", "e": "'Die Freie Filmbühne ist ein kleines Kino hier in Burgoberdorf.'"}, {"n": 47, "s": "Die Freie Filmbühne wird geschlossen.", "a": "r", "e": "'Das bedeutet, unser Kino muss schließen.'"}, {"n": 48, "s": "Die Freie Filmbühne hat dieses Jahr zum ersten Mal einen Preis gewonnen.", "a": "r", "e": "'Es war das erste Mal, dass wir so eine Auszeichnung bekommen haben.'"}, {"n": 49, "s": "Das Haus, in dem die Freie Filmbühne jetzt ist, war früher eine Schule.", "a": "f", "e": "'…das war kein Schulgebäude … Früher war es ein kleines Gemeindehaus.'"}, {"n": 50, "s": "In der Nähe des Kinos kann man etwas trinken gehen.", "a": "f", "e": "'Nein, nicht direkt. Die nächste Möglichkeit ist etwa 15 Minuten zu Fuß entfernt.'"}, {"n": 51, "s": "Wo jetzt die Freie Filmbühne ist, sollen Wohnungen und ein Freizeitzentrum gebaut werden.", "a": "r", "e": "'Dort sollen neue Wohnungen gebaut werden und auch ein kleines Freizeitzentrum.'"}, {"n": 52, "s": "Es wird wahrscheinlich zwei Jahre dauern, bis die neuen Gebäude fertig sind.", "a": "f", "e": "'Zwei Jahre wird es wohl nicht dauern, vielleicht ein Jahr.'"}, {"n": 53, "s": "Es haben jetzt weniger Leute Interesse an der Freien Filmbühne als am Anfang.", "a": "r", "e": "'Am Anfang hatten viel mehr Menschen Interesse … Heute ist das Interesse deutlich geringer.'"}, {"n": 54, "s": "Frau Imbach möchte, dass die Freie Filmbühne umzieht.", "a": "f", "e": "'Wünschen Sie sich einen Umzug?' – 'Ehrlich gesagt, nein.'"}, {"n": 55, "s": "Bis die Freie Filmbühne schließt, werden keine Filme mehr gezeigt.", "a": "f", "e": "'Wir zeigen weiterhin Filme bis zum letzten Tag.'"}]}, "hoeren3": [{"n": 56, "s": "Wegen des Nebels sollte man heute nicht nach München fahren.", "a": "f", "t": "Achtung, Autofahrer! Trotz des Nebels ist die Autobahn Richtung München frei. Alle Strecken sind befahrbar, aber bitte fahren Sie vorsichtig. Die Sicht ist in manchen Bereichen eingeschränkt. Es gibt aktuell keine offiziellen Warnungen oder Sperrungen für München.", "e": "'Trotz des Nebels ist die Autobahn … frei' – you can drive, just carefully."}, {"n": 57, "s": "In der Buchabteilung ist ein berühmter Autor zu Gast.", "a": "r", "t": "Heute Nachmittag gibt es eine besondere Lesung in der Buchabteilung des Kaufhauses Mehr. Zu Gast ist der bekannte Autor Klaus Bernhardt. Er liest aus seinem neuen Roman und beantwortet Fragen  uns ja wieder einmal treffen?\n\nBis hoffentlich bald\nViktor", "task": "Antworten Sie auf diesen Brief. Schreiben Sie in Ihrem Brief etwas zu den folgenden vier Punkten.", "points": ["Ihre Hobbys", "Reaktion auf das Buch", "Ihre Pläne für den nächsten Urlaub", "Treffen mit Viktor"], "model": "Köln, den 12. Mai 2025\n\nLieber Viktor,\n\nvielen Dank für Deinen Brief aus Malta, über den ich mich sehr gefreut habe. Schön, dass Ihr einen so tollen Urlaub habt!\n\nAuch für das Buch über Malta möchte ich mich herzlich bedanken. Die Bilder sind wunderschön und ich habe schon viel über die Geschichte der Insel gelesen. Jetzt möchte ich Malta auch einmal besuchen.\n\nMeine Hobbys sind Kochen und Radfahren. Am Wochenende mache ich oft lange Radtouren am Rhein, und abends koche ich gern für meine Freunde. Fotografieren finde ich auch interessant, aber ich habe leider keine gute Kamera.\n\nIm nächsten Urlaub möchte ich mit meiner Familie in die Berge nach Österreich fahren. Dort wollen wir wandern und die frische Luft genießen.\n\nNatürlich möchte ich Dich gern wiedersehen! Wie wäre es, wenn Du und Katja uns im Juni besucht? Dann kannst Du mir Deine Fotos zeigen und ich koche etwas Leckeres für Euch.\n\nViele Grüße an Katja und die Kinder\nDein Omar", "phrases": ["Vielen Dank für das Buch, ich habe mich sehr darüber gefreut.", "Das Buch gefällt mir sehr, weil …", "In meiner Freizeit … ich gern …", "Im nächsten Urlaub möchte ich …", "Wie wäre es, wenn wir uns im … treffen?", "Viele Grüße an Katja und die Kinder."]}, "vocab": [["angeben mit + Dat", "to show off with"], ["sich zurechtfinden", "to find one's way"], ["nach dem Weg fragen", "to ask the way"], ["sich verfahren", "to get lost (driving)"], ["um Hilfe bitten", "to ask for help"], ["die Erziehung", "upbringing"], ["entspannend", "relaxing"], ["im Durchschnitt", "on average"], ["das Ergebnis, -se", "result"], ["begleiten", "to accompany"], ["angewiesen sein auf + Akk", "to depend on"], ["behindert", "disabled"], ["der Pen const TABS = [["l1","Lesen 1"],["l2","Lesen 2"],["l3","Lesen 3"],["s1","Sprachb. 1"],["s2","Sprachb. 2"],["h","Hören"],["w","Schreiben"],["v","Wörter"]];
let cur = 0, tab = "l1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

function best(sec, score, max) {
  const all = store.get("b1best") || {}, k = cur + "_" + sec;
  if (all[k] == null || score > all[k]) { all[k] = score; store.set("b1best", all); }
  return `Score: ${score} / ${max}` + (all[k] != null ? ` · best ${all[k]}/${max}` : "");
}

function renderPicker() {
  $("#picker").innerHTML = EXAMS.map((e, i) => `<button aria-pressed="${i===cur}" data-i="${i}">${e.n}</button>`).join("");
  $("#picker").querySelectorAll("button").forEach(b => b.onclick = () => { stopAudio(); cur = +b.dataset.i; tab = "l1"; render(); });
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<button aria-pressed="${k===tab}" data-k="${k}">${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { stopAudio(); tab = b.dataset.k; render(); });
  $("#examTitle").textContent = `Prüfung ${EXAMS[cur].n}: ${EXAMS[cur].title || ""}`;
}

/* generic choice widget */
function choices(id, opts, labelFn) {
  return `<div class="row" data-q="${id}">` + opts.map(o => `<button class="choice" aria-pressed="false" data-v="${o}">${labelFn ? labelFn(o) : o}</button>`).join("") + `</div>`;
}
function wireChoices(root) {
  root.querySelectorAll("[data-q]").forEach(r => r.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    r.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", x === b)); r.dataset.ans = b.dataset.v; }));
}
function grade(root, items, sec) {
  let s = 0;
  items.forEach(it => {
    const r = root.querySelector(`[data-q="${it.id}"]`), card = root.querySelector(`#c_${it.id}`);
    const got = r.dataset.ans, ok = got === it.key; if (ok) s++;
    card.classList.toggle("ok", ok); card.classList.toggle("bad", !ok);
    let fb = card.querySelector(".fb"); if (!fb) { fb = document.createElement("div"); fb.className = "fb"; card.appendChild(fb); }
    fb.innerHTML = `<b>${ok ? "✓" : "✗"} Lösung: ${esc(it.keyLabel || it.key)}</b> — ${esc(it.why || "")}` + (it.script ? `<div class="script">„${esc(it.script)}"</div>` : "");
  });
  root.querySelector(".score").textContent = best(sec, s, items.length);
}
function timerHTML(min) { return `<div class="row"><button id="tstart">⏱ Start ${min}-min timer</button><span class="big" id="tclock">${min}:00</span></div>`; }
let tInt = null;
function wireTimer(min) {
  const b = $("#tstart"); if (!b) return;
  b.onclick = () => { clearInterval(tInt); let left = min * 60; b.disabled = true;
    tInt = setInterval(() => { left--; const c = $("#tclock"); if (!c) return clearInterval(tInt);
      c.textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; if (left <= 0) { clearInterval(tInt); c.textContent = "Time is up!"; } }, 1000); };
}
const fill = (t, f) => esc(t).replace(/\[(\d\d)\]/g, (_, n) => f(+n));

/* ---------- audio ---------- */
let voices = [], stopFlag = false;
function loadVoices() { voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("de")); }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(text, who) {
  return new Promise(res => {
    if (stopFlag || !("speechSynthesis" in window)) return res();
    const u = new SpeechSynthesisUtterance(text); u.lang = "de-DE";
    if (voices.length) u.voice = voices[(who === "B" && voices.length > 1) ? 1 : 0];
    if (who === "B" && voices.length < 2) u.pitch = 1.35;
    if (who === "I") u.pitch = 0.9;
    if (who === "C") u.pitch = 0.75;
    u.rate = parseFloat(($("#speed") || {}).value || 0.95);
    u.onend = res; u.onerror = res; speechSynthesis.speak(u);
  });
}
function wait(sec, label) {
  return new Promise(res => { let left = sec; const st = $("#hstat");
    const tick = () => { if (stopFlag) return res(); if (st) st.textContent = `${label}: ${left} s`; if (left-- <= 0) return res(); setTimeout(tick, 1000); }; tick(); });
}
function stopAudio() { stopFlag = true; if ("speechSynthesis" in window) speechSynthesis.cancel(); clearInterval(tInt); }
function mark(ns) { document.querySelectorAll(".now").forEach(x => x.classList.remove("now")); ns.forEach(n => { const c = $("#c_h" + n); if (c) { c.classList.add("now"); } }); if (ns.length) { const c = $("#c_h" + ns[0]); c && c.scrollIntoView({ block: "center", behavior: "smooth" }); } }
const status = t => { const s = $("#hstat"); if (s) s.textContent = t; };

async function runPart(e, p) {
  const h1 = e.hoeren1, h2 = e.hoeren2, h3 = e.hoeren3;
  if (p === 1) {
    status("Teil 1"); await say("Hörverstehen, Teil 1. Sie hören nun fünf kurze Texte. Sie hören diese Texte nur einmal. Lesen Sie jetzt die Aufgaben 41 bis 45. Sie haben dazu 30 Sekunden Zeit.", "I");
    mark(h1.map(x => x.n)); await wait(30, "Reading time");
    for (const x of h1) { mark([x.n]); status(`Text ${x.n} (once)`); await say(`Nummer ${x.n}.`, "I"); await say(x.t); await wait(8, "Decide"); }
  }
  if (p === 2) {
    status("Teil 2"); await say("Hörverstehen, Teil 2. Sie hören nun ein Gespräch. Sie hören das Gespräch zweimal. Lesen Sie jetzt die Aufgaben 46 bis 55. Sie haben dazu eine Minute Zeit.", "I");
    mark(h2.items.map(x => x.n)); await wait(60, "Reading time");
    for (let r = 1; r <= 2 && !stopFlag; r++) {
      status(`Interview, ${r === 1 ? "first" : "second"} time`); if (r === 2) await say("Sie hören das Gespräch noch einmal.", "I");
      if (h2.intro) await say(h2.intro, "I");
      for (const [w, t] of h2.lines) { if (stopFlag) break; await say(t, w); }
      await wait(r === 1 ? 10 : 15, "Check your answers");
    }
  }
  if (p === 3) {
    status("Teil 3"); await say("Hörverstehen, Teil 3. Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Lesen Sie jetzt die Aufgabe.", "I");
    for (const x of h3) { if (stopFlag) break; mark([x.n]); await wait(10, `Read ${x.n}`); status(`Text ${x.n}`); await say(x.t); await wait(3, "Again"); await say(x.t); await wait(8, "Decide"); }
  }
}
async function runListen(parts) {
  stopAudio(); await new Promise(r => setTimeout(r, 150)); stopFlag = false;
  const e = EXAMS[cur];
  for (const p of parts) { if (stopFlag) break; await runPart(e, p); }
  if (!stopFlag) { status("Finished. Press Check answers."); mark([]); }
}

R.h = e => {
  const all = [...e.hoeren1.map(x => ({...x, script:x.t})), ...e.hoeren2.items, ...e.hoeren3.map(x => ({...x, script:x.t}))];
  const card = x => `<div class="card" id="c_h${x.n}"><div><span class="num">${x.n}</span><b>${esc(x.s)}</b></div>${choices("h"+x.n, ["r","f"], v => v === "r" ? "richtig" : "falsch")}</div>`;
  const dialog = e.hoeren2.lines.map(([w,t]) => `${e.hoeren2.speakers["ABC".indexOf(w)] || w}: ${t}`).join("\n");
  return { html: `<h2>Hörverstehen</h2>
   <div class="rules">Like the real exam: spoken instructions, 30 s / 60 s reading time, Part 1 once, Parts 2 and 3 twice. Do not stop. Speed:
    <select id="speed"><option value="0.75">very slow</option><option value="0.85">slower</option><option value="0.95" selected>exam speed</option><option value="1.05">faster</option></select></div>
   <div class="row"><button class="primary" id="hall">▶ Full listening exam</button><button id="hp1">Teil 1</button><button id="hp2">Teil 2</button><button id="hp3">Teil 3</button><button id="hstop">■ Stop</button></div>
   <div class="big" id="hstat" aria-live="polite">Ready</div>
   ${!voices.length ? `<div class="rules">If you hear no German voice, add a German voice in your device's text-to-speech settings.</div>` : ""}
   <h3>Teil 1 (41–45) · once</h3>${e.hoeren1.map(card).join("")}
   <h3>Teil 2 (46–55) · twice</h3><div class="muted">${esc(e.hoeren2.intro || "")}</div>${e.hoeren2.items.map(card).join("")}
   <h3>Teil 3 (56–60) · twice</h3>${e.hoeren3.map(card).join("")}
   <details class="card"><summary>Interview transcript (after the test)</summary><div class="script">${esc(dialog)}</div></details>`,
   items: all.map(x => ({ id:"h"+x.n, key:x.a, why:x.e, script:x.script, keyLabel: x.a === "r" ? "richtig" : "falsch" })),
   after() { $("#hall").onclick = () => runListen([1,2,3]); [1,2,3].forEach(p => $("#hp"+p).onclick = () => runListen([p])); $("#hstop").onclick = () => { stopAudio(); status("Stopped"); }; } };
};

R.w = e => { const d = e.schreiben, key = "b1letter" + cur;
  return { html: `<h2>Schriftlicher Ausdruck</h2><div class="rules">30 minutes. Write a letter (at least 100–150 words) covering all 4 points. Don't forget: Ort/Datum, Anrede, Einleitung, Schluss, Gruß.</div>${timerHTML(30)}
   <div class="card"><div class="text">${esc(d.letter)}</div></div>
   <div class="card"><b>${esc(d.task)}</b><ul>${d.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
   <textarea id="letter" aria-label="Ihr Brief" placeholder="Berlin, den ...&#10;&#10;Liebe ...,"></textarea>
   <div class="row"><span id="wc" class="muted">0 words</span><button id="model">Show model letter</button></div>
   <div class="card" id="modelBox" hidden><h3>Musterbrief</h3><div class="text">${esc(d.model)}</div><h3>Useful phrases</h3><ul>${(d.phrases||[]).map(p => `<li>${esc(p)}</li>`).join("")}</ul>
   <h3>Checklist</h3><ul><li>All 4 points? (each point = 2–3 sentences)</li><li>Verb in position 2; after weil/dass/wenn the verb goes to the end</li><li>Du/Sie consistent (Dich/Dir/Dein)</li><li>Connectors: außerdem, deshalb, trotzdem, leider, zum Schluss</li></ul></div>`,
   noCheck: true,
   after() { const ta = $("#letter"); ta.value = store.get(key) || ""; const wc = () => $("#wc").textContent = (ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0) + " words"; wc();
     ta.oninput = () => { wc(); store.set(key, ta.value); }; $("#model").onclick = () => { $("#modelBox").hidden = !$("#modelBox").hidden; }; } };
};
R.v = e => ({ noCheck: true, html: `<h2>Wörter & Grammatik aus Prüfung ${e.n}</h2>
   <div class="card"><table>${(e.vocab||[]).map(([de,en]) => `<tr><td><b>${esc(de)}</b></td><td>${esc(en)}</td></tr>`).join("")}</table></div>
   <div class="card"><h3>Grammatik</h3><ul>${(e.grammar||[]).map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` });

function render() {
  renderPicker();
  const e = EXAMS[cur], r = R[tab](e), v = $("#view");
  v.innerHTML = r.html + (r.noCheck ? "" : `<button class="primary" id="check">Check answers</button><div class="score" aria-live="polite"></div>`);
  wireChoices(v); wireTimer(r.min || 30);
  if (!r.noCheck) $("#check").onclick = () => grade(v, r.items, tab);
  r.after && r.after();
}
render();
</script>
