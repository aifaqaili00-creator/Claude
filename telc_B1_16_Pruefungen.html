bot und blockiert eine Ausfahrt. Bitte melden Sie sich an der Information im Eingangsbereich. Vielen Dank.", "e": "'... sofort ins Erdgeschoss zu kommen' – true."}, {"n": 57, "s": "Die Firma liefert das bestellte Sofa am Dienstag ab drei Uhr nachmittags.", "a": "f", "t": "Guten Tag, hier ist Ihr Möbelhaus. Die Lieferung des bestellten Sofas erfolgt nicht am Dienstag, sondern am Mittwoch zwischen 10 und 12 Uhr. Bitte sorgen Sie dafür, dass jemand zu Hause ist. Bei Fragen rufen Sie uns gerne an. Vielen Dank für Ihre Bestellung.", "e": "'nicht am Dienstag, sondern am Mittwoch' – false."}, {"n": 58, "s": "Der Gasthof Lindner ist neben einer Tankstelle.", "a": "r", "t": "Willkommen im Gasthof Lindner. Unser Haus liegt direkt neben einer Tankstelle, was besonders für Autofahrer praktisch ist. Sie können dort rund um die Uhr tanken oder Snacks kaufen. Wir wünschen Ihnen einen angenehmen Aufenthalt.", "e": "'direkt neben einer Tankstelle' – true."}, {"n": 59, "s": "Der Film „Komiker“ läuft täglich um 20 Uhr.", "a": "r", "t": "Hier ist Ihr Kinoprogramm: Der beliebte Film „Komiker“ läuft jeden Tag um 20 Uhr im großen Saal. Die Vorstellung dauert etwa 90 Minuten. Tickets gibt es online oder an der Kasse. Bitte kommen Sie spätestens 15 Minuten vor Beginn.", "e": "'jeden Tag um 20 Uhr' – true."}, {"n": 60, "s": "Das Wetter ist am Abend noch gut.", "a": "f", "t": "Der Wetterdienst meldet für heute wechselhaftes Wetter. Am Nachmittag ziehen Wolken auf, und am Abend wird mit starkem Regen gerechnet. Es besteht die Gefahr von Gewittern und starkem Wind. Bitte informieren Sie sich regelmäßig über die aktuellen Wetterwarnungen.", "e": "Strong rain and storms in the evening – false."}], "schreiben": {"letter": "Liebe(r) ...,\n\nheute habe ich Zeit, dir ein paar Zeilen zu schreiben. Der Urlaub war so schön, aber seit ich zurück bin, habe ich im Büro sehr viel Arbeit. Bestimmt brauche ich schon bald wieder Urlaub!\n\nWährend ich weg war, hat sich hier übrigens einiges geändert: Es gibt einen neuen Kollegen, er heißt Roberto. Und das ist die größte Veränderung: Er arbeitet mit mir in meinem Büro, das heißt, ich habe endlich jemanden, mit dem ich mich zwischendurch auch ein bisschen unterhalten kann! Roberto ist aus Spanien hierher gezogen. Er kennt noch niemanden hier, außer mir natürlich, und ist meistens allein. Denkst du, dass ich ihn und ein paar andere Arbeitskollegen einmal einladen sollte? Was würdest du tun?\n\nNa gut, für heute muss ich Schluss machen. Melde dich doch bald einmal bei mir!\n\nViele Grüße\nAndreas", "task": "Antworten Sie Andreas. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Vorschlag, wie Andreas seinem Arbeitskollegen helfen kann", "Wie Sie am liebsten arbeiten (alleine oder mit Kollegen)", "Was Sie nach dem Urlaub gemacht haben", "Was es bei Ihnen Neues gibt"], "model": "Köln, 5. Oktober 20..\n\nLieber Andreas,\n\nvielen Dank für deine nette E-Mail. Ich habe mich sehr darüber gefreut!\n\nSchön, dass du jetzt einen Kollegen in deinem Büro hast. Ich finde deine Idee super: Lade Roberto und ein paar Kollegen doch zu dir nach Hause ein, zum Beispiel zum Grillen. Du könntest ihm auch die Stadt zeigen oder ihm einen Sportverein empfehlen. So lernt er schnell neue Leute kennen.\n\nIch selbst arbeite am liebsten im Team, weil man zusammen bessere Ideen hat und die Arbeit mehr Spaß macht. Allein im Büro wäre es mir zu langweilig.\n\nNach dem Urlaub hatte ich auch viel zu tun. In der ersten Woche musste ich viele E-Mails beantworten, und am Wochenende habe ich meine Fotos sortiert.\n\nBei mir gibt es auch Neuigkeiten: Ich habe mir ein neues Auto gekauft! Vielleicht besuche ich dich bald damit.\n\nMelde dich bald!\n\nViele Grüße\ndein Markus", "phrases": ["Vielen Dank für deine nette E-Mail.", "Ich finde deine Idee super.", "Du könntest ihn doch ... einladen.", "Ich arbeite am liebsten im Team, weil ...", "Nach dem Urlaub musste ich ...", "Bei mir gibt es auch Neuigkeiten: ..."]}, "vocab": [["die Botschaft, -en", "embassy"], ["die Fremdsprache, -n", "foreign language"], ["wählen", "to choose"], ["der/die Verwandte, -n", "relative"], ["der Kaufmann, Kaufleute", "merchant"], ["Handel treiben", "to trade"], ["die Lage, -n", "location"], ["die Gegend, -en", "area, region"], ["die Lebensfreude", "joy of life"], ["entfernt", "away, distant"], ["vollenden", "to complete"], ["verdienen", "to earn"], ["behaupten", "to claim"], ["feststellen", "to find out"], ["sich verdoppeln", "to double"], ["vorteilhaft", "advantageous"], ["der Linkshänder, -", "left-handed person"], ["sich durchsetzen", "to assert oneself"], ["besichtigen", "to visit, view"], ["zwingen (zwang, gezwungen)", "to force"], ["schwerwiegend", "serious"], ["die Folge, -n", "consequence"], ["umschulen", "to retrain"], ["verboten", "forbidden"], ["geeignet für + Akk", "suitable for"], ["die Ermüdung", "tiredness"], ["versetzen", "to transfer"], ["nachahmen", "to imitate"], ["raten + Dat (riet, geraten)", "to advise"], ["die Ernährung", "nutrition"], ["das Lebensmittel, -", "food"], ["abnehmen", "to lose weight"], ["der Rentner, -", "pensioner"], ["die Gesundheit", "health"], ["austragen (Zeitungen)", "to deliver (newspapers)"], ["sich vorstellen", "to introduce oneself"], ["die Tätigkeit, -en", "activity, job"], ["es macht mir nichts aus", "I don't mind"], ["der Stau, -s", "traffic jam"], ["das Verkehrsmittel, -", "means of transport"], ["zuverlässig", "reliable"], ["der Lokführer, - / die Lokführerin, -nen", "train driver"], ["die Lehrstelle, -n", "apprenticeship place"], ["einverstanden sein mit + Dat", "to agree with"], ["die Störung, -en", "fault, disruption"], ["der Nachtdienst, -e", "night shift"], ["erschöpft", "exhausted"], ["ausbilden", "to train"], ["das Kennzeichen, -", "number plate"], ["das Erdgeschoss", "ground floor"], ["liefern", "to deliver"], ["die Tankstelle, -n", "petrol station"], ["sich unterhalten mit + Dat", "to chat with"], ["einladen (lud ein, eingeladen)", "to invite"], ["der Bootsverleih", "boat rental"], ["sich erholen", "to relax, recover"]], "grammar": ["Relative pronouns: der Kurs, den ich besuche (Akk); Menschen, die ... haben (Nom. Pl.).", "zu + dem = zum (Informationen zum Thema).", "im Internet (fixed preposition).", "Präteritum of modal verbs: ich konnte.", "Adjective endings without article: für junge Leute.", "Indirect questions with welche/ob/wie viel – verb at the end.", "Reflexive pronoun with 'man': sich.", "Modal verb + infinitive at the end: kann ... finden.", "Imperative du-form: Schreib(e) mir zurück!", "Konjunktiv II in unreal conditions: Wenn ich die Möglichkeit hätte, würde ...", "zwar ... aber; ohne + Akk; jeden Tag (Akk of time).", "es macht mir nichts aus; geeignet sein für + Akk; bei Ihnen (bei + Dat)."]}, {"n": 7, "title": "Philipp Reis · Herr Schröder · Frau Böck", "lesen1": {"headlines": {"a": "Finanzielle Unterstützung für Kunstprojekte mit Schülern", "b": "Winterveranstaltung auf dem Eis mit Musik", "c": "Aktionsprogramm der EU: Finanzielle Unterstützung für italienische Künstler", "d": "Kunstausstellung von italienischen Schülern", "e": "Deutschlernen mit neuer Methode im Radio", "f": "Geld für gemeinsame europäische Projekte", "g": "Elternverein organisiert Kunstausstellung", "h": "Mit der Eisenbahn ins winterliche Wien", "i": "Mehr Geld für österreichische Musikschulen", "j": "Wie Sprachaufenthalte auswählen?"}, "texts": ["Rund 150 000 Sprachreisen werden von Deutschen jährlich unternommen. Der Wunsch, eine andere Sprache zu lernen, kann verschiedene Gründe haben: private, schulische oder berufliche. Das Angebot an Sprachreisen wächst ständig, über die Qualität ist jedoch wenig oder nichts bekannt. Im „Marktplatz“ geht es diesmal um Kriterien für das Lernen mit Erfolg. Welche Methoden sind zu empfehlen, was kosten die Anbieter? Ihre Fragen werden am Hörertelefon unter 0800-839601 von Fachleuten beantwortet.", "Die Metropole Wien lädt zum winterlichen Eisvergnügen vor dem Wiener Rathaus ein: Vom 22. Januar bis 7. März kann man auf 1800 Quadratmetern übers Eis fahren. Die Musik dazu bestimmt den Fahrstil und reicht vom klassischen Walzer bis zur Discomusik. Nachts werden auf der Eisbahn Partys veranstaltet, vom Samba-Fest bis zum Hip-Hop-Event. Speisen und Getränke gibt es an verschiedenen Ständen, Schlittschuhe und Stiefel kann man leihen. Informationen: Wiener Tourismusverband.", "Für das Aktionsprogramm der Europäischen Union (EU) zur beruflichen Weiterbildung, „Leonardo da Vinci“, können noch bis zum 31. März Anträge gestellt werden. Ziel des Programms ist es, europäische Projekte zur beruflichen Weiterbildung zu unterstützen. Anträge auf finanzielle Unterstützung können Institutionen stellen, die mit mindestens zwei weiteren europäischen Partnern an einem Projekt arbeiten wollen. Information: Nationale Koordinierungsstelle Leonardo da Vinci, Fehrbelliner Platz 3, D-10707 Berlin, Tel. 030/8643-0, Fax -2637.", "Wien (SN/APA). Wie das Unterrichtsministerium mitteilte, sollen im kommenden Jahr monatlich 70 000 Euro für Kulturprojekte an Schulen zur Verfügung gestellt werden. Unterstützt werden damit Veranstaltungen und Projekte, die das Verständnis der Kinder und Jugendlichen für die Künste wecken, das Interesse am Musisch-Kreativen verstärken und zu Kontakten und einer Auseinandersetzung mit Künstlern führen. Dadurch soll in altersgemäßer Form die ganzheitliche Entwicklung der Persönlichkeit von Kindern und Jugendlichen gefördert werden.", "Zum sechsten Mal veranstaltet das Comitato Genitori Binningen/Bottmingen seine breit angelegte multikulturelle Kunstausstellung „Arte“. An der Veranstaltung nehmen 70 Künstlerinnen und Künstler aus der Region sowie Gäste aus Italien, Frankreich, Deutschland und weiteren Ländern teil. Bei dem vor 18 Jahren gegründeten Comitato handelt es sich um einen Elternverein, der damals italienischsprachigen Kindern bei ihren Schulproblemen hilfreich zur Seite stand. Da die jetzige dritte Kindergeneration diese Probleme nicht mehr hat, suchte das Comitato nach neuen Aufgaben und fand in der Organisation der alljährlichen Kunstausstellung ein neues, interessantes Betätigungsfeld."], "key": ["j", "b", "f", "a", "g"], "why": ["A radio programme about criteria for choosing language trips (j); trap e: it is not a new radio method for learning German.", "Ice skating in front of Vienna's town hall with music (b); trap h: no train is mentioned.", "EU money for projects with at least two other European partners (f); trap c: nothing about Italian artists.", "70,000 euros per month for culture projects at schools (a); trap i: not specifically music schools.", "A parents' association (Elternverein) organises the art exhibition (g); trap d: the artists are not Italian pupils."]}, "lesen2": {"title": "Philipp Reis – der wahre Erfinder des Telefons?", "text": "Erfinder, Lehrer, Familienvater – auf den Spuren von Philipp Reis besuchte Susanne Müller seinen Geburtsort.\n\n„Weil mein Vater nie aufgeschrieben hat, was er machte, ist mancher gute Gedanke verloren gegangen“, klagte später einmal Karl Reis. Auch gibt es wenige offizielle Berichte und Dokumente über Philipp Reis in Friedrichsdorf und in seiner Geburtsstadt Gelnhausen. Das gilt besonders für das private Leben der Familie Reis, die ab 1852 in unmittelbarer Nähe des berühmten Garnier-Instituts in Friedrichsdorf ein Haus gefunden hatte. Berichte des Sohnes Karl Reis erzählen ein wenig mehr über das Leben des Erfinders. Karl Reis, der beim Tod des Vaters erst elf Jahre alt war, berichtet von einem lieben und gerechten Vater, der sich sehr um seine Frau und seine Kinder gesorgt hat. Wenn der Vater aber seine Experimente machte, vergaß er alles um sich herum.\n\nPhilipp Reis lernte bereits als Junge viele technische Maschinen kennen und machte eine Reihe von Experimenten, die er als Lehrer am Garnier-Institut fortsetzte. Er entwickelte eine große Anzahl von technischen Geräten, die im Institut gut verwendet werden konnten. Auf die Schüler machte Philipp Reis oft einen sehr merkwürdigen Eindruck. Verunsichert waren die Schüler besonders dann, wenn Reis Aufsicht hatte, aber selbst im Klassenraum gar nicht anwesend war.\n\nTrotzdem konnte Reis alles hören und wusste, was passiert war. Philipp Reis hatte eine besondere Anlage gebaut, mit der er von seinem Arbeitszimmer aus, in dem er gleichzeitig Experimente durchführte, die Klassenräume überwachen konnte. Ein Draht, der über den Schulhof in sein Arbeitszimmer führte, diente als Vorläufer des späteren Telefons. Bei den Schülern und Lehrern entstand so der Ruf, dass Reis auf geheimnisvolle Weise alles mitbekommt.\n\n1883 schrieb der englische Professor Silvanus Thompson einen Bericht über Reis und nannte ihn den wahren Erfinder des Telefons. Philipp Reis habe das Telefon entwickelt, und nicht Graham Bell oder Thomas Edison. Diese beiden amerikanischen Forscher hätten auch bei ihren Arbeiten zur Entwicklung des Telefons auf Philipp Reis' Experimente in Deutschland hingewiesen. Seine offizielle Anerkennung als Erfinder des Telefons hat Philipp Reis allerdings nicht mehr erlebt. Im Jahre 1874 ist er in Friedrichsdorf an einer Lungenkrankheit gestorben.", "note": "reconstructed (question 6 stem and most options; other stems from the book)", "q": [{"n": 6, "stem": "Karl Reis", "opts": {"a": "erzählt, dass sein Vater sich sehr um die Familie gekümmert hat.", "b": "hat alle Ideen seines Vaters aufgeschrieben.", "c": "war beim Tod seines Vaters schon erwachsen."}, "key": "a", "why": "'... von einem lieben und gerechten Vater, der sich sehr um seine Frau und seine Kinder gesorgt hat.' He was only eleven."}, {"n": 7, "stem": "Philipp Reis", "opts": {"a": "begann erst als Lehrer, sich für Technik zu interessieren.", "b": "entwickelte viele Geräte, die im Institut benutzt wurden.", "c": "lebte mit seiner Familie in Gelnhausen."}, "key": "b", "why": "'Er entwickelte eine große Anzahl von technischen Geräten, die im Institut gut verwendet werden konnten.' He experimented already as a boy."}, {"n": 8, "stem": "Die Schüler von Philipp Reis", "opts": {"a": "hatten keinen Respekt vor ihm.", "b": "halfen ihm bei seinen Experimenten.", "c": "wunderten sich, dass er alles wusste, obwohl er nicht im Raum war."}, "key": "c", "why": "'Verunsichert waren die Schüler ... wenn Reis Aufsicht hatte, aber selbst im Klassenraum gar nicht anwesend war. Trotzdem konnte Reis alles hören.'"}, {"n": 9, "stem": "Professor Thompson", "opts": {"a": "hielt Reis für den eigentlichen Erfinder des Telefons.", "b": "war ein Studienkollege von Philipp Reis.", "c": "arbeitete mit Bell und Edison zusammen."}, "key": "a", "why": "'... nannte ihn den wahren Erfinder des Telefons.'"}, {"n": 10, "stem": "Über das private Leben von Philipp Reis", "opts": {"a": "gibt es nur wenige Dokumente.", "b": "kann man in Gelnhausen viel erfahren.", "c": "hat Professor Thompson ein Buch geschrieben."}, "key": "a", "why": "'Auch gibt es wenige offizielle Berichte und Dokumente ... Das gilt besonders für das private Leben.'"}]}, "lesen3": {"note": "reconstructed (ads missing; the book repeats the situations and key of exam 6, so the same ads are used)", "situations": ["Sie lieben Krimis und möchten daher einer Krimiautorin beim Vorlesen zuhören.", "Ihr Bekannter würde gerne am Wochenende ein Boot mieten.", "Sie möchten sich in einem Hotel in den Bergen erholen und mit dem Zug anreisen.", "Sie möchten sich eine Märchenvorstellung im Theater ansehen.", "Ihre Freundin sucht ein angenehmes Hotel, in dem man auch Sport treiben kann.", "Am Sonntag wollen Sie einen kleinen Ausflug mit Kindern machen. Die Kinder mögen Tiere.", "Ihre Bekannten möchten gerne im Mai eine Schiffsfahrt machen.", "Sie möchten gerne am Wochenende tanzen gehen und suchen eine tolle Disco.", "Der kleine Sohn von Freunden ist begeistert von der Eisenbahn. Sie möchten am Wochenende mit ihm etwas Interessantes machen.", "Sie möchten im August eine Woche in den Bergen wandern und brauchen eine erfahrene Person, die mit Ihnen geht."], "ads": {"a": "Bergwanderführer Toni Gruber: Geführte Wanderwochen in den Alpen von Juni bis September. Erfahrener, staatlich geprüfter Bergführer. Kleine Gruppen. Tel. 08821/4471.", "b": "Krimi-Abend in der Buchhandlung Lesezeichen: Der bekannte Krimiautor Jan Brandt stellt seinen neuen Roman vor und liest daraus. Donnerstag, 20 Uhr.", "c": "Bootsverleih am Kleinsee: Ruderboote und Tretboote zu vermieten – nur montags bis freitags, 10 bis 18 Uhr. Am Wochenende geschlossen.", "d": "Hotel Seeblick****: Komfortable Zimmer, Hallenbad, Sauna, Tennisplätze und Fitnessraum. Genießen Sie Ihren Urlaub aktiv und entspannt!", "e": "Stadttheater: „Hänsel und Gretel“ – das beliebte Märchen als Theaterstück für Groß und Klein. Vorstellungen samstags und sonntags um 15 Uhr.", "f": "Berghotel Alpenrose: Ruhe und Erholung in 1200 m Höhe. Nur 5 Minuten vom Bahnhof – Abholservice vom Zug kostenlos!", "g": "Wildpark Schwarzach: Rehe, Hirsche, Wildschweine und ein Streichelzoo für Kinder. Täglich geöffnet, auch an Sonn- und Feiertagen, 9–18 Uhr.", "h": "Eisenbahnmuseum: Historische Lokomotiven zum Anschauen und Anfassen! Am Wochenende Fahrten mit der Dampflok für Kinder. Samstag und Sonntag 10–17 Uhr.", "i": "Tanzschule Weber: Neue Kurse für Anfänger – Walzer, Tango, Salsa. Kursbeginn jeweils dienstags, 19 Uhr.", "j": "Schifffahrt auf dem Bodensee: Rundfahrten ab Konstanz von Juli bis Oktober täglich. Gruppenrabatt möglich.", "k": "Krimifestival: Die Krimiautorin Petra Hammesfahr liest aus ihrem neuen Buch „Die Mutter“. Freitag, 19.30 Uhr, Stadtbibliothek. Eintritt frei.", "l": "Neckar-Schifffahrt: Saisonbeginn am 1. Mai! Täglich Ausflugsfahrten von Heidelberg nach Neckarsteinach. Info: Tel. 06221/20181."}, "key": ["k", "x", "f", "e", "d", "g", "l", "x", "h", "a"], "why": ["Ad k: a female crime author (Krimiautorin) reads from her book; ad b is a male author.", "x – the boat rental (c) is closed at the weekend.", "Ad f: mountain hotel 5 minutes from the station with pick-up from the train.", "Ad e: the fairy tale 'Hänsel und Gretel' at the theatre.", "Ad d: hotel with swimming pool, tennis and fitness room.", "Ad g: wildlife park with petting zoo, open on Sundays.", "Ad l: Neckar boat trips start on 1 May; ad j only from July.", "x – ad i is a dance school with courses on Tuesdays, not a disco.", "Ad h: railway museum with steam-train rides at the weekend.", "Ad a: experienced mountain guide, hiking weeks June–September."]}, "sprach1": {"note": "options partly reconstructed (OCR lost several options; correct words from the key)", "text": "An alle Kunden – Gewinnen!\n\nSehr geehrter Herr Schröder,\n\nzum Start [21] das neue Geschäftsjahr haben wir uns für Sie etwas ganz Besonderes ausgedacht: einen attraktiven Gewinn! [22] dem Beginn des neuen Geschäftsjahres feiern wir unsere erfolgreiche Buchidee. Machen Sie mit! Es warten auf Sie sehr [23] Gewinne im Wert von vielen Tausend Euro. Mit Ihrer Kundennummer können Sie an einem Preisausschreiben teilnehmen. Senden Sie uns [24] das beigefügte Antwortschreiben zurück und bestellen Sie damit – ohne Risiko – das Buch des Monats. Sie erhalten dieses Buch mit [25] Versprechen, es nach 10 Tagen zurückgeben zu können, sollte Ihnen das Buch nicht gefallen. Ohne irgendetwas zu zahlen! Behalten Sie das Buch, was wir [26] hoffen, zahlen Sie nur 50 Prozent des sonst üblichen Preises in einer Buchhandlung. Gleichzeitig nehmen Sie an einem Preisausschreiben [27].\n\nBitte bedenken Sie: Sollte Ihre Kundennummer [28] den richtigen Zahlen sein, haben Sie die Chance, ein Auto, eine Reise und viele weitere Preise zu erhalten. Antworten Sie [29] noch diese Woche! Dann haben Sie in jedem Fall die Chance auf den Hauptgewinn – einen Mercedes der S-Klasse. Wenn Sie innerhalb der kommenden vier Wochen antworten, nehmen Sie immer [30] an unserer Gewinnverteilung teil – vorausgesetzt, Sie haben die richtige Kundennummer.\n\nMit freundlichen Grüßen\nPetra Obermoser\nLeiterin der Abteilung Marketing", "q": [{"n": 21, "opts": {"a": "auf", "b": "in", "c": "mit"}, "key": "b", "why": "Fixed phrase: der Start in + Akk (in das neue Geschäftsjahr)."}, {"n": 22, "opts": {"a": "Mit", "b": "Neben", "c": "Vor"}, "key": "a", "why": "'mit dem Beginn' = at the same time as the beginning."}, {"n": 23, "opts": {"a": "schöne", "b": "schönen", "c": "schöner"}, "key": "a", "why": "Plural nominative without article: schöne Gewinne."}, {"n": 24, "opts": {"a": "einfach", "b": "immer", "c": "schon"}, "key": "a", "why": "'einfach' = simply; typical in imperatives in advertising."}, {"n": 25, "opts": {"a": "unsere", "b": "unserem", "c": "unseren"}, "key": "b", "why": "mit + Dativ; das Versprechen (neuter) → unserem."}, {"n": 26, "opts": {"a": "natürlich", "b": "leider", "c": "kaum"}, "key": "a", "why": "Meaning: of course they hope you keep the book; 'leider/kaum' are illogical."}, {"n": 27, "opts": {"a": "mit", "b": "teil", "c": "an"}, "key": "b", "why": "Separable verb teilnehmen an: Sie nehmen an ... teil."}, {"n": 28, "opts": {"a": "unter", "b": "neben", "c": "vor"}, "key": "b", "why": "The book's key gives 'neben' (next to the winning numbers); follow the key."}, {"n": 29, "opts": {"a": "sehr", "b": "schnell", "c": "unbedingt"}, "key": "c", "why": "'unbedingt' = definitely; strengthens the imperative."}, {"n": 30, "opts": {"a": "noch", "b": "schon", "c": "immer"}, "key": "a", "why": "'immer noch' = still (you still take part)."}]}, "sprach2": {"text": "Sehr geehrte Damen und Herren,\n\nseit Längerem plane ich eine Wanderreise in die Sahara-Länder. Nun ist mir beim Lesen der Zeitschrift „Berge“ die Anzeige von Geo-Tours aufgefallen, denn [31] steht, dass Sie auf Erlebnisreisen in Wüstenregionen spezialisiert sind. Vielleicht haben Sie das richtige Angebot für uns – [32] für mich und meine 17-jährige Tochter. Unsere Vorstellungen sind im Einzelnen diese:\n\nZuerst eine Wanderreise, etwa 10 Tage, möglichst leichte Tageswanderungen (ca. 4–5 Stunden), und [33] ein Erholungsurlaub am Meer. Bieten Sie solche Kombinationen an? Und [34] ja, zu welchem Preis? Zur Wanderreise [35] ich noch folgende Fragen: Wird das Gepäck von einem Übernachtungsort zum nächsten transportiert? Schläft man immer [36] freiem Himmel? Ich [37] auch wissen, wie die Reisegruppen zusammengesetzt sind, [38] Sprache die Reiseleiterin/der Reiseleiter spricht und ob ein Arzt [39] ist.\n\nIch freue mich auf Ihr [40].\n\nMit freundlichen Grüßen\nAnnette Luchsinger", "words": {"a": "ANFRAGE", "b": "ANGEBOT", "c": "DABEI", "d": "DAFÜR", "e": "DANACH", "f": "DARIN", "g": "DESHALB", "h": "HÄTTE", "i": "MIT", "j": "MÖCHTE", "k": "NÄMLICH", "l": "UNTER", "m": "WÄRE", "n": "WELCHE", "o": "WENN"}, "key": ["f", "k", "e", "o", "h", "l", "j", "n", "c", "b"], "why": ["'darin' = in it (in the ad): darin steht, dass ...", "'nämlich' explains/specifies: namely for me and my daughter.", "'danach' = afterwards (first hiking, then a beach holiday).", "'wenn ja' = if so.", "Polite Konjunktiv II: Ich hätte noch folgende Fragen.", "Fixed expression: unter freiem Himmel = outdoors.", "Polite wish: Ich möchte wissen.", "Indirect question with an article word: welche Sprache.", "'dabei sein' = to be present / come along.", "'sich freuen auf Ihr Angebot' – neuter noun after 'Ihr'."]}, "hoeren1": [{"n": 41, "s": "Der Sprecher könnte sich vorstellen, mit dem Bus zur Arbeit zu fahren.", "a": "f", "t": "Ich finde Busfahren ehrlich gesagt nicht so gut. Der Bus ist oft zu voll und unpünktlich. Außerdem muss ich zweimal umsteigen. Deshalb nehme ich lieber mein Auto oder fahre mit dem Fahrrad. Das ist für mich einfacher und schneller. Der Bus ist nur eine Notlösung.", "e": "He does not like the bus and prefers car or bike – false."}, {"n": 42, "s": "Die Sprecherin geht gern zu Fuß.", "a": "f", "t": "Zu Fuß zur Arbeit gehen? Nein, das mache ich fast nie. Es ist zu weit, ich würde über eine Stunde brauchen. Ich gehe zwar manchmal spazieren, aber nicht gern lange zu Fuß. Ich nehme meistens das Auto oder fahre mit dem Motorrad. Das ist für mich bequemer.", "e": "Trap 'zwar manchmal spazieren': she finds walking too far and prefers car/motorbike – false."}, {"n": 43, "s": "Der Sprecher findet es in Ordnung, dass seine Frau immer das Auto hat.", "a": "r", "t": "Meine Frau nimmt jeden Morgen das Auto zur Arbeit. Ich finde das völlig in Ordnung. Wir haben nur ein Auto, und sie hat einen längeren Weg. Ich fahre mit dem Fahrrad. Das klappt gut, und ich bin sowieso gern draußen an der frischen Luft.", "e": "'Ich finde das völlig in Ordnung' – true."}, {"n": 44, "s": "Die Sprecherin fährt jeden Tag mit ihrem Motorrad zur Arbeit.", "a": "r", "t": "Ich fahre jeden Tag mit meinem Motorrad zur Arbeit. Das ist praktisch, weil ich keinen Parkplatz suchen muss und schneller durch den Verkehr komme. Auch bei Regen fahre ich, ich habe gute Kleidung dafür. Ich liebe mein Motorrad.", "e": "'jeden Tag mit meinem Motorrad' – true."}, {"n": 45, "s": "Die Sprecherin fährt immer mit dem Fahrrad zur Arbeit.", "a": "f", "t": "Mit dem Fahrrad zur Arbeit fahre ich eigentlich nie. Ich habe gar kein Fahrrad mehr. Vor zwei Jahren habe ich mir ein Motorrad gekauft, und das benutze ich jetzt jeden Tag. Das ist für mich einfach viel bequemer und schneller.", "e": "She has no bike any more and uses a motorbike – false."}], "hoeren2": {"intro": "Im Radio spricht eine Moderatorin mit Frau Böck vom Verein UKI über Integration in Österreich.", "speakers": ["Moderatorin", "Frau Böck"], "lines": [["A", "Guten Tag, Frau Böck. Vielen Dank, dass Sie heute Zeit für unser Gespräch gefunden haben."], ["B", "Sehr gerne. Ich freue mich, hier zu sein."], ["A", "Viele Menschen glauben, dass Ihr Verein UKI vor allem für ausländische Bürger in Österreich da ist. Stimmt das?"], ["B", "Viele haben diese Meinung, aber tatsächlich möchten wir, dass alle Menschen in der Stadt gut zusammenleben, egal woher sie kommen. Es geht also nicht nur um Ausländer."], ["A", "Manche denken, dass besonders internationale Manager im Mittelpunkt stehen – vielleicht, weil sie den Verein finanziell unterstützen. Wie ist das?"], ["B", "Das höre ich oft, aber bei uns stehen Familien und Studierende im Vordergrund. Und das Geld kommt von verschiedenen Stellen, nicht von Managern."], ["A", "Berufstätige können abends bei Ihnen Deutsch lernen. Wie lange dauert so ein Abendkurs?"], ["B", "Unsere Abendkurse für Berufstätige dauern neun Monate. Wir haben das extra so organisiert, damit man genug Zeit zum Lernen hat."], ["A", "Gibt es ein besonderes Angebot für Jugendliche, die eine österreichische Hauptschule besuchen möchten?"], ["B", "Ja, für diese Jugendlichen haben wir einen eigenen Kurs entwickelt. Sie bekommen dort genau das, was sie für die Schule brauchen."], ["A", "Bieten Sie außer Deutschkursen noch andere Kurse an?"], ["B", "Natürlich, unser Angebot ist breit. Man kann zum Beispiel auch an Kunst- oder Computerkursen teilnehmen. Es geht also nicht immer nur um die deutsche Sprache."], ["A", "Wer unterrichtet bei Ihnen? Sind die Lehrer auch in anderen Bereichen aktiv?"], ["B", "Ja, unsere Deutschlehrer sind gleichzeitig auch Sozialarbeiter. Sie helfen den Teilnehmern oft auch bei Problemen im Alltag weiter."], ["A", "Unterstützen Ihre Mitarbeiter auch bei Problemen mit Ämtern?"], ["B", "Ja, das ist ein wichtiger Teil unserer Arbeit. Oft brauchen unsere Teilnehmer Hilfe bei Formularen oder Behördengängen, und dabei stehen ihnen unsere Sozialarbeiter zur Seite."], ["A", "Gehört die Vorbereitung von Bewerbungsunterlagen auch zum Kursangebot?"], ["B", "Auf jeden Fall. Im Kurs unterstützen wir die Teilnehmer dabei, Lebensläufe und Bewerbungen zu schreiben. Das ist für viele besonders hilfreich."], ["A", "Lernen Frauen und Kinder bei Ihnen gemeinsam Deutsch?"], ["B", "Nein, normalerweise haben wir getrennte Gruppen. Frauen und Kinder sind in unterschiedlichen Kursen, damit wir besser auf ihre Bedürfnisse eingehen können."], ["A", "Viele sagen, dass neue Gesetze Ihre Arbeit schwerer machen. Ist das wirklich so?"], ["B", "Natürlich gibt es immer wieder neue Vorschriften, aber manchmal erleichtern sie unsere Arbeit sogar. Einige Regeln helfen uns, die Integration besser zu unterstützen."], ["A", "Vielen Dank für die vielen Informationen, Frau Böck."], ["B", "Ich danke Ihnen."]], "items": [{"n": 46, "s": "Das Ziel des Vereins UKI ist, ausländische Bürger in Österreich zu unterstützen.", "a": "f", "e": "'... dass alle Menschen in der Stadt gut zusammenleben ... nicht nur um Ausländer.'"}, {"n": 47, "s": "Der Verein wendet sich besonders an internationale Manager, weil diese den Verein finanziell unterstützen.", "a": "f", "e": "'bei uns stehen Familien und Studierende im Vordergrund.'"}, {"n": 48, "s": "Die Abendkurse für Berufstätige dauern neun Monate.", "a": "r", "e": "'Unsere Abendkurse für Berufstätige dauern neun Monate.'"}, {"n": 49, "s": "Es gibt einen speziellen Deutschkurs für Jugendliche, die eine österreichische Hauptschule besuchen wollen.", "a": "r", "e": "'für diese Jugendlichen haben wir einen eigenen Kurs entwickelt.'"}, {"n": 50, "s": "Es gibt auch Kurse, die nichts mit Deutschlernen zu tun haben.", "a": "r", "e": "'... auch an Kunst- oder Computerkursen teilnehmen.'"}, {"n": 51, "s": "Die Deutschlehrer sind gleichzeitig auch Sozialarbeiter.", "a": "r", "e": "'unsere Deutschlehrer sind gleichzeitig auch Sozialarbeiter.'"}, {"n": 52, "s": "Sozialarbeiter helfen Ausländern bei Problemen mit Ämtern.", "a": "r", "e": "'... bei Formularen oder Behördengängen ... stehen ihnen unsere Sozialarbeiter zur Seite.'"}, {"n": 53, "s": "Im Kurs werden Papiere für eine Bewerbung vorbereitet.", "a": "r", "e": "'Im Kurs unterstützen wir die Teilnehmer dabei, Lebensläufe und Bewerbungen zu schreiben.'"}, {"n": 54, "s": "Frauen und Kinder lernen im Unterricht gemeinsam Deutsch.", "a": "f", "e": "'Nein, normalerweise haben wir getrennte Gruppen.'"}, {"n": 55, "s": "Die Gesetze machen die Arbeit von Frau Böck schwerer.", "a": "f", "e": "'manchmal erleichtern sie unsere Arbeit sogar.'"}]}, "hoeren3": [{"n": 56, "s": "Ihr Flug nach Prag ist nicht pünktlich.", "a": "f", "t": "Guten Tag, meine Damen und Herren. Wir freuen uns, Ihnen mitteilen zu können, dass Ihr Flug nach Prag pünktlich um 14.30 Uhr abfliegt. Bitte gehen Sie rechtzeitig zum Gate B21. Wir wünschen Ihnen eine angenehme Reise.", "e": "'pünktlich um 14.30 Uhr' – false."}, {"n": 57, "s": "Im Speisewagen kann man ins Internet gehen.", "a": "f", "t": "Willkommen im Intercity-Express nach Hamburg. Im Speisewagen bieten wir Ihnen warme und kalte Getränke und Speisen an. Leider gibt es dort keinen Internetzugang. Das Internet können Sie nur an Ihrem Sitzplatz nutzen. Gute Fahrt!", "e": "'Leider gibt es dort keinen Internetzugang' – false."}, {"n": 58, "s": "Montags bis freitags ab 8:00 Uhr kann man sich persönlich beraten lassen.", "a": "r", "t": "Herzlich willkommen bei der Stadtbibliothek. Unsere persönliche Beratung ist von Montag bis Freitag ab 8 Uhr für Sie da. Sie können Fragen stellen, Bücher ausleihen oder Hilfe bei der Recherche bekommen. Kommen Sie einfach vorbei!", "e": "'persönliche Beratung ... Montag bis Freitag ab 8 Uhr' – true."}, {"n": 59, "s": "Das Hörspiel „Katzen in der Nacht“ wird morgen um 20:30 Uhr gesendet.", "a": "f", "t": "Liebe Hörerinnen und Hörer, das Hörspiel „Katzen in der Nacht“ läuft heute Abend um 19.30 Uhr. Schalten Sie rechtzeitig ein! Morgen gibt es eine Wiederholung, aber erst um 22 Uhr. Wir wünschen Ihnen einen gemütlichen Abend.", "e": "Today 19:30, tomorrow only at 22:00 – false."}, {"n": 60, "s": "Das Flugzeug landet mit 20 Minuten Verspätung in Leipzig.", "a": "r", "t": "Sehr geehrte Fluggäste, wir möchten Sie informieren, dass wir in Leipzig mit einer Verspätung von 20 Minuten landen werden. Wir bitten um Ihr Verständnis. Vielen Dank für Ihre Geduld und eine gute Weiterreise.", "e": "'mit einer Verspätung von 20 Minuten landen' – true."}], "schreiben": {"letter": "Liebe(r) ...,\n\nwie geht's dir? Hattest du ein schönes Wochenende? Hier hat es die ganze Zeit geregnet, deshalb bin ich zu Hause geblieben.\n\nDu hattest vorgeschlagen, dass wir im Sommer zusammen verreisen könnten. Die Idee finde ich super! An welches Reiseziel denkst du? Ich bin gerne am Meer, mag aber auch Städtereisen. Wichtig ist für mich nur, dass ich auch ein bisschen Sport machen kann. Die Reise sollte aber nicht zu viel kosten, denn ich habe vor Kurzem schon viel für eine Autoreparatur bezahlen müssen. Was meinst du: Wie können wir günstig Urlaub machen? Es muss ja kein Luxushotel sein.\n\nSchreib mir bald, dann können wir anfangen zu planen.\n\nViele Grüße\nAnnika", "task": "Antworten Sie Annika. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Was Sie am Wochenende unternommen haben", "Wohin Sie gerne reisen würden", "Was Sie im Urlaub gerne machen", "Wie man beim Reisen Geld sparen kann"], "model": "Berlin, 20. April 20..\n\nLiebe Annika,\n\nvielen Dank für deinen Brief! Schade, dass das Wetter bei dir so schlecht war. Ich hatte mehr Glück: Am Samstag war ich mit Freunden im Park, und am Sonntag habe ich meine Eltern besucht.\n\nIch freue mich sehr auf unsere Reise! Ich würde gern nach Kroatien fahren. Dort gibt es schöne Strände, und Städte wie Split oder Dubrovnik sind auch sehr interessant.\n\nIm Urlaub schwimme ich gern im Meer und fahre Fahrrad. Abends bummle ich gern durch die Altstadt. Da kannst du also auch Sport machen.\n\nWir können bestimmt Geld sparen: Wir fahren mit dem Bus oder Zug statt mit dem Flugzeug, und wir buchen früh. Eine Ferienwohnung ist günstiger als ein Hotel, und dort können wir selbst kochen.\n\nWas hältst du davon? Schreib mir bald!\n\nViele Grüße\ndeine Laura", "phrases": ["Schade, dass das Wetter so schlecht war.", "Ich würde gern nach ... fahren.", "Im Urlaub ... ich gern ...", "Wir könnten Geld sparen, indem wir ...", "Eine Ferienwohnung ist günstiger als ein Hotel.", "Was hältst du davon?"]}, "vocab": [["die Sprachreise, -n", "language trip"], ["unternehmen (unternahm, unternommen)", "to undertake, do"], ["der Grund, Gründe", "reason"], ["wachsen (wuchs, gewachsen)", "to grow"], ["der Anbieter, -", "provider"], ["das Vergnügen", "pleasure, fun"], ["veranstalten", "to organise (an event)"], ["der Schlittschuh, -e", "ice skate"], ["die Weiterbildung", "further training"], ["einen Antrag stellen", "to submit an application"], ["unterstützen", "to support"], ["mitteilen", "to inform"], ["zur Verfügung stellen", "to make available"], ["fördern", "to promote"], ["die Ausstellung, -en", "exhibition"], ["der Verein, -e", "club, association"], ["gründen", "to found"], ["der Erfinder, -", "inventor"], ["aufschreiben", "to write down"], ["der Bericht, -e", "report"], ["gerecht", "fair, just"], ["sich sorgen um + Akk", "to care about, worry about"], ["entwickeln", "to develop"], ["das Gerät, -e", "device"], ["der Eindruck, Eindrücke", "impression"], ["anwesend", "present"], ["die Anerkennung", "recognition"], ["erleben", "to experience"], ["das Geschäftsjahr, -e", "business year"], ["der Gewinn, -e", "prize, profit"], ["das Preisausschreiben, -", "prize competition"], ["beigefügt", "enclosed"], ["das Versprechen, -", "promise"], ["teilnehmen an + Dat", "to take part in"], ["vorausgesetzt", "provided that"], ["auffallen (fiel auf, aufgefallen)", "to strike, catch one's eye"], ["die Wüste, -n", "desert"], ["das Gepäck", "luggage"], ["unter freiem Himmel", "outdoors"], ["die Anfrage, -n", "inquiry"], ["umsteigen", "to change (trains/buses)"], ["die Notlösung, -en", "makeshift solution"], ["der Verein unterstützt", "the association supports"], ["der Berufstätige, -n", "working person"], ["der Sozialarbeiter, -", "social worker"], ["das Amt, Ämter / die Behörde, -n", "public office / authority"], ["die Bewerbung, -en", "application"], ["der Lebenslauf, -läufe", "CV"], ["getrennt", "separate"], ["das Gesetz, -e", "law"], ["erleichtern", "to make easier"], ["die Verspätung, -en", "delay"], ["die Beratung, -en", "advice, consultation"], ["die Wiederholung, -en", "repeat"], ["verreisen", "to go on a trip"], ["günstig", "cheap, favourable"]], "grammar": ["der Start in + Akk; mit dem Beginn (mit + Dat).", "Adjective endings without article in the plural: schöne Gewinne.", "mit + Dativ: mit unserem Versprechen (neuter).", "Separable verbs: teilnehmen → Sie nehmen an ... teil.", "Adverbs in ads: einfach, natürlich, unbedingt, immer noch.", "Da-compounds: darin, danach, dabei (dabei sein).", "Konjunktiv II for politeness: Ich hätte noch Fragen; ich möchte wissen.", "Indirect questions: welche Sprache, ob ein Arzt dabei ist.", "wenn ja = if so; nämlich = namely.", "sich freuen auf + Akk: auf Ihr Angebot."]}, {"n": 8, "title": "Lachen · Maria · Spielpark Torgau", "lesen1": {"headlines": {"a": "Zufriedenheit im Job schützt vor Stress", "b": "Erfolgreiche Männer können auch gute Väter sein", "c": "Keiner lacht so fröhlich wie der Weihnachtsmann", "d": "Wie Männer und Frauen lachen", "e": "Weniger Arbeit – weniger Stress", "f": "Schlechte Nachrichten? Sagen Sie es mit einem Lächeln", "g": "Der Beruf ist für Männer wichtiger als die Familie", "h": "Auch ältere Menschen leiden unter Stress", "i": "Frauen reagieren besser auf schlechte Nachrichten als Männer", "j": "Mit 70 Jahren macht das Leben am meisten Spaß"}, "texts": ["Frauen lachen auf viele Arten: Sie kichern, glucksen, und manchmal singen sie fast. Bei Männern dagegen kommt das viel seltener vor. Aber gemeinsam ist Männern und Frauen, dass sie in Vokalen lachen, die im Mundzentrum gebildet werden. Und das ist entscheidend: Nur wenn die Vokale im Mundzentrum gebildet werden, ist das Lachen für uns fröhlich und positiv. Damit ist bewiesen, dass das Lachen des Weihnachtsmanns, das wie ein tiefes „Ho, ho, ho“ klingt, kaum als fröhlich empfunden wird. Denn dieser Laut wird im hinteren Teil des Mundraums gebildet.", "Viel Arbeit, viel Stress? Wer viel arbeitet, muss nicht unbedingt gestresst sein. Frauen in medizinischen Berufen zum Beispiel klagen trotz teilweise hoher Belastung deutlich weniger über stressbedingte Krankheiten als Raumpflegerinnen, Kindergärtnerinnen oder Berufsschullehrerinnen. Das zeigt eine Untersuchung des Hamburger IPO-Instituts, das für eine Studie 1000 Frauen und Männer befragt hat. Vor Stress schützen laut Studie ein angenehmes Betriebsklima, ein gutes Verhältnis zur Chefin oder zum Chef und die Möglichkeit, die eigene Arbeit selbstständig zu planen.", "Ein neues Buch zeigt, wie Männer Fähigkeiten aus dem Arbeitsleben auf die Erziehung übertragen können und so zu erfolgreichen Vätern werden. Da wird die gemeinsame Kindererziehung zur Partnerarbeit (oder sogar zum Joint Venture), geschicktes Verhandeln heißt, das Kind zu überzeugen, dass die Zähne geputzt werden müssen, und der Familienurlaub hat alle Qualitäten einer Tagung oder eines Seminars: Man erhält die Gelegenheit, die Kinder intensiv zu studieren.", "Eine Studie der Universität Essex hat ergeben, dass wir mit siebzig Jahren am glücklichsten sind. Zwar haben die meisten Menschen in diesem Alter gesundheitliche Probleme, aber dafür genießen sie viel Freizeit und haben keinen Stress mehr. Deshalb macht ihnen das Leben so viel Spaß wie nie zuvor. Die Studie besagt auch, dass wir einen ersten Höhepunkt der Lebensfreude mit fünfzehn Jahren erreichen. Danach geht es bergab: Zwischen dreißig und fünfzig Jahren tragen wir am meisten Verantwortung, das Leben ist geprägt von Sachzwängen.", "Warum bleiben manche Managerinnen erfolgreich, obwohl sie Nachrichten mitteilen, die ihr Publikum lieber nicht hören möchte? Ganz einfach: Sie verkaufen die schlechte Nachricht mit Humor. Ein Londoner Soziologe hat während einer Studie beobachtet, dass gerade bei Reden unangenehmen Inhalts oft heiter gelacht wird. Das Lachen wird bewusst provoziert, etwa durch bestimmte Wörter oder durch ein eigenes breites Lächeln. Die fröhliche Stimmung soll dafür sorgen, dass die Zuhörenden das Gefühl haben, mehr zu wissen als alle anderen."], "key": ["d", "a", "b", "j", "f"], "why": ["The text compares how women and men laugh (d); trap c: Santa's 'Ho, ho, ho' is NOT felt as happy.", "Good working climate and planning your own work protect against stress = job satisfaction (a); trap e: it says much work does not have to mean stress.", "Men use work skills to become successful fathers (b); trap g: nothing says work is more important.", "'mit siebzig Jahren am glücklichsten' (j); trap h: old people have NO stress any more.", "Managers sell bad news with humour and a smile (f); trap i: nothing about women vs. men reacting."]}, "lesen2": {"title": "Informationsveranstaltungen sind wichtige Grundlagen für die Berufswahl", "text": "Die Entscheidung, welchen Beruf man erlernen will, ist nicht leicht. Große Firmen bieten spezielle Informationsveranstaltungen für Schülerinnen und Schüler an. Wir haben einen Info-Nachmittag der Bank Credit Suisse in Bern besucht und uns danach bei den Jugendlichen umgehört.\n\n20 Schülerinnen und Schüler kann Irene Leiser um Punkt 13 Uhr zu diesem Info-Nachmittag begrüßen. Die Jugendlichen kommen aus dem ganzen Kanton Bern und haben sich vorher bei der Bank angemeldet. Viermal im Frühling und zwei weitere Male im August werden diese Info-Veranstaltungen bei der Credit Suisse durchgeführt. Sie richten sich vor allem an Schülerinnen und Schüler aus der 8. Klasse. Irene Leiser hat gute Erfahrungen mit diesen Veranstaltungen gemacht: Die Jugendlichen können danach ihre Erwartungen an den Beruf und die Ausbildung an die Realität anpassen.\n\nIm ersten Teil des Nachmittags erklärt Frau Leiser die Hauptaufgaben einer Bank und stellt die Firma vor. Danach treten die Lehrlinge in Aktion: Daniel Sommer und Linda Schmidt sind im zweiten Lehrjahr und erzählen aus ihrem Berufsalltag. Dieser Teil gefällt den Schülerinnen und Schülern besonders gut. Die Jugendlichen identifizieren sich mit den Lehrlingen und sehen, wo sie selbst in zwei Jahren beruflich stehen könnten. Das fasziniert sehr. Zum Schluss folgen Informationen darüber, welche Voraussetzungen man mitbringen muss und wie man sich bewirbt.\n\nUm 16.30 Uhr schließt Frau Leiser die Veranstaltung. Sie ist zufrieden mit dem Nachmittag. Die Gruppe war sehr aufmerksam. Interessierten Schülerinnen und Schülern gibt sie folgenden Tipp: „Gehen Sie auch noch zu anderen Firmen. Fragen Sie dort möglichst viele Lehrlinge und Mitarbeiter nach ihren Erfahrungen.“ Wir haben danach eine Schülerin und einen Schüler gefragt, wie sie den Nachmittag erlebt haben:\n\nTugba Kaptan aus Biel, 8. Klasse: „Mich fasziniert das Umfeld einer Bank. Ich hätte gern mehr Leute bei der Arbeit gesehen, zum Beispiel am Schalter. Aber der Tag hat mir weitergeholfen. Ich habe viele Dinge erfahren, die ich bisher nicht gewusst habe. So ein Nachmittag ist ideal, weil da schulfrei ist.“\n\nAlan Blank aus Mühleberg, 8. Klasse: „Die Bank ist eigentlich mein Traumgebiet und bietet mir nach der Lehre viele Entwicklungsmöglichkeiten. Ich habe mich umgeschaut und mich über viele Berufe informiert. Jetzt weiß ich, dass ich eine Lehre in diesem Bereich machen will. Ich suche nach der optimalen Lehrstelle. Eine Großbank wäre toll für mich. Dieser Nachmittag hat mir gefallen. Alles war sehr gut organisiert. Ich kann solche Veranstaltungen nur empfehlen. Was mir persönlich gefehlt hat, ist eine Führung durch den Betrieb. Es ist wichtig zu sehen, wie das alles genau vor sich geht.“", "note": "reconstructed (question 6 stem and all options; stems 7-10 from the book)", "q": [{"n": 6, "stem": "Die Info-Veranstaltungen der Credit Suisse", "opts": {"a": "finden jeden Monat statt.", "b": "sind vor allem für Jugendliche aus der 8. Klasse gedacht.", "c": "sind für alle Schüler ohne Anmeldung offen."}, "key": "b", "why": "'Sie richten sich vor allem an Schülerinnen und Schüler aus der 8. Klasse.' They take place 4 times in spring and 2 times in August, with registration."}, {"n": 7, "stem": "Frau Leiser", "opts": {"a": "erzählt den Schülern aus ihrer eigenen Lehrzeit.", "b": "meint, dass die Jugendlichen danach realistischere Erwartungen haben.", "c": "war mit der Gruppe nicht zufrieden."}, "key": "b", "why": "'Die Jugendlichen können danach ihre Erwartungen an den Beruf ... an die Realität anpassen.'"}, {"n": 8, "stem": "An dem Informationsnachmittag", "opts": {"a": "machen die Schüler eine Führung durch die Bank.", "b": "berichten zwei Lehrlinge von ihrer Arbeit.", "c": "können sich die Schüler direkt um eine Lehrstelle bewerben."}, "key": "b", "why": "'Daniel Sommer und Linda Schmidt sind im zweiten Lehrjahr und erzählen aus ihrem Berufsalltag.' There was no tour (Alan missed it)."}, {"n": 9, "stem": "Tugba Kaptan", "opts": {"a": "fand den Nachmittag langweilig.", "b": "möchte auf keinen Fall in einer Bank arbeiten.", "c": "hätte gern mehr Menschen bei der Arbeit beobachtet."}, "key": "c", "why": "'Ich hätte gern mehr Leute bei der Arbeit gesehen, zum Beispiel am Schalter.'"}, {"n": 10, "stem": "Alan Blank", "opts": {"a": "will eine Lehre bei einer Bank machen.", "b": "hat schon eine Lehrstelle bei einer Großbank.", "c": "fand die Veranstaltung schlecht organisiert."}, "key": "a", "why": "'Jetzt weiß ich, dass ich eine Lehre in diesem Bereich machen will.' He is still looking for a place."}]}, "lesen3": {"note": "reconstructed (all ads missing in the book; built to match the key)", "situations": ["Ihre Freunde wollen einen Sprachkurs in Spanien machen und ihre Kinder mitnehmen.", "Ihr Auto ist kaputt und Sie brauchen jemanden, der es repariert.", "Sie wollen mit einem Videoprogramm Deutsch lernen.", "Sie wollen Ihrer Kursleiterin eine Kursabschlussreise vorschlagen.", "Ihr Fernseher ist kaputt. Sie wollen ihn reparieren lassen.", "Eine Bekannte hat eine neue Wohnung. Sie möchten ihr etwas für die Küche schenken.", "Sie suchen ein Geschenk für ein 6-jähriges Kind.", "Ihr Kind ist krank. Sie suchen einen Kinderarzt.", "Ihre Tante ist operiert worden. Jetzt ist sie wieder zu Hause und braucht spezielles Essen.", "Sie haben sich beim Tennis den Fuß verletzt und brauchen einen Arzt."], "ads": {"a": "Sprachschule Hispania, Madrid: Intensivkurse Spanisch für Erwachsene. Unterkunft in Gastfamilien. Leider keine Kinderbetreuung möglich.", "b": "Spanisch lernen in Málaga – für die ganze Familie! Während die Eltern im Kurs sind, gibt es ein Kinderprogramm mit Spielen, Strand und Spanisch für Kinder von 4 bis 14 Jahren.", "c": "Reisebüro Globus: Gruppenreisen für Schulklassen und Sprachkurse – z. B. 3 Tage Berlin oder Wien zum Kursabschluss. Günstige Gruppenpreise!", "d": "Autowerkstatt Meier: Reparaturen aller Marken, Inspektion, TÜV, Reifenservice. Schnell und günstig. Mo–Fr 7–18 Uhr, Sa 8–12 Uhr.", "e": "Deutsch lernen mit Bildern: Unser neues Lehrbuch mit Audio-CD für Anfänger. Jetzt in jeder Buchhandlung.", "f": "Fernseh-Service Krause: Reparatur von Fernsehern, DVD-Playern und Radios – auch bei Ihnen zu Hause. Anruf genügt: 040/23 45 67.", "g": "Spielwarenladen Kunterbunt: Spiele, Puzzles, Bücher und Spielzeug für Kinder von 3 bis 10 Jahren. Wir beraten Sie gern bei der Geschenkauswahl!", "h": "Küchenstudio & Haushaltswaren Schmid: Töpfe, Pfannen, Messer, Kaffeemaschinen und schöne Geschenkideen für die Küche. Geschenkverpackung gratis.", "i": "Menü-Service Vital: Wir liefern Ihnen täglich warme Mahlzeiten nach Hause – auch Diät- und Schonkost nach ärztlicher Empfehlung. Tel. 0800/12 34 56.", "j": "Praxis Dr. med. Weber, Frauenärztin. Sprechstunden Mo–Fr 8–12 Uhr und Di, Do 15–18 Uhr.", "k": "Computer-Notdienst: Ihr PC ist kaputt? Wir kommen sofort! Reparaturen und Datenrettung rund um die Uhr.", "l": "Dr. med. Hans Brandt, Facharzt für Orthopädie und Sportmedizin. Behandlung von Sportverletzungen. Termine nach Vereinbarung."}, "key": ["b", "d", "x", "c", "f", "h", "g", "x", "l", "i"], "why": ["Ad b: Spanish course in Málaga with a programme for children; ad a has no childcare.", "Ad d: car repair workshop.", "x – ad e is a book with a CD, not a video programme.", "Ad c: group trips for language courses at the end of the course.", "Ad f: TV repair service.", "Ad h: kitchen shop with gift ideas.", "Ad g: toy shop for children aged 3–10.", "x – ad j is a gynaecologist, not a paediatrician.", "Ad l: sports doctor for sports injuries.", "Ad i: meals delivered home, including special diet food."]}, "sprach1": {"note": "options partly reconstructed (OCR lost several options; correct words from the key)", "text": "Schwarzenbek, den ...\n\nLiebe Maria,\n\ndanke vielmals für die Einladung. Nächste Woche werde ich also [21] dir in Berlin sein. Ich freue mich schon sehr [22], denn schließlich haben wir uns fast ein [23] Jahr nicht gesehen. Wie du ja weißt, wohne ich jetzt auf dem Land hier in der Nähe von Hamburg, und das finde ich ganz toll. [24] ich würde gern auch mal wieder in eine richtige Disco gehen. Mal wieder eine ganze Nacht tanzen, das [25] mein Traum! Und zu zweit macht es viel [26] Spaß!\n\nWeißt du eigentlich, ob die Disco am Wittenbergplatz [27] existiert?\n\nLeider habe ich noch keine Ahnung, [28] ich in Berlin ankommen werde. Jedenfalls [29] ich versuchen, eine Mitfahrgelegenheit zu finden. Es gibt ja im Internet die Mitfahrzentrale, [30] so etwas organisiert. Also mach dir keine Sorgen, wenn ich etwas später komme!", "q": [{"n": 21, "opts": {"a": "bei", "b": "zu", "c": "nach"}, "key": "a", "why": "Being at someone's place (location, no movement): bei + Dat → bei dir."}, {"n": 22, "opts": {"a": "darauf", "b": "darum", "c": "dazu"}, "key": "a", "why": "sich freuen auf + Akk → da-compound: darauf."}, {"n": 23, "opts": {"a": "halben", "b": "halbe", "c": "halbes"}, "key": "c", "why": "ein + neuter noun (das Jahr), accusative → halbes."}, {"n": 24, "opts": {"a": "Aber", "b": "Denn", "c": "Oder"}, "key": "a", "why": "Contrast: she likes the countryside, BUT would like to go to a disco."}, {"n": 25, "opts": {"a": "würde", "b": "wäre", "c": "hätte"}, "key": "b", "why": "Konjunktiv II of sein for a wish: das wäre mein Traum."}, {"n": 26, "opts": {"a": "viele", "b": "mehrere", "c": "mehr"}, "key": "c", "why": "Comparative: viel mehr Spaß."}, {"n": 27, "opts": {"a": "auch", "b": "noch", "c": "schon"}, "key": "b", "why": "'noch existieren' = still exist."}, {"n": 28, "opts": {"a": "wenn", "b": "wann", "c": "als"}, "key": "b", "why": "Indirect question about time: keine Ahnung, wann ..."}, {"n": 29, "opts": {"a": "wird", "b": "werden", "c": "will"}, "key": "c", "why": "Subject 'ich' + infinitive 'versuchen': ich will versuchen ('wird' would be 3rd person)."}, {"n": 30, "opts": {"a": "das", "b": "die", "c": "der"}, "key": "b", "why": "Relative pronoun for 'die Mitfahrzentrale' (feminine, nominative) → die."}]}, "sprach2": {"text": "Frankfurter Allianz\nBahnstr. 99\nMax Kuhne\nTel.: 069-951670\n\nFrankfurt, den ...\n\nNeuer Berater für Ihre Versicherungen\n\nSehr geehrter Herr Frankel,\n\nwir möchten Sie darüber informieren, [31] Ihre Versicherungen künftig von Herrn Max Kuhne bearbeitet werden. Ihm wurden [32] Unterlagen übergeben. Alle Kundendaten [33] selbstverständlich streng vertraulich behandelt. Wenn Sie also [34] zu Ihren Versicherungen haben, wenden Sie sich in Zukunft bitte an Herrn Kuhne. Er berät und [35] Sie gern. Auch im Schadensfall [36] er Ihnen schnell und zuverlässig weiter. Im Übrigen möchten wir uns [37] einen Fehler in unserer letzten Beitragsrechnung entschuldigen. Leider ist [38] die Adresse von Herrn Kuhne nicht korrekt. Seine [39] Anschrift und Telefonnummer finden Sie auf diesem Brief oben rechts.\n\nWir danken [40] für Ihr Vertrauen.\n\nMit freundlichen Grüßen\nIhre Frankfurter Allianz", "words": {"a": "ANTWORTEN", "b": "AUF", "c": "DASS", "d": "DORT", "e": "FRAGEN", "f": "FÜR", "g": "HABEN", "h": "HILFT", "i": "IHNEN", "j": "IHRE", "k": "INFORMIERT", "l": "OB", "m": "RICHTIGE", "n": "WERDEN", "o": "ZU"}, "key": ["c", "j", "n", "e", "k", "h", "f", "d", "m", "i"], "why": ["informieren, dass ... (statement, not a yes/no question).", "'Ihre Unterlagen' = your documents (possessive before plural noun).", "Passive present: Kundendaten werden behandelt (plural).", "'Fragen haben zu' = to have questions about.", "Two verbs with 'Sie': er berät und informiert Sie.", "weiterhelfen + Dat: er hilft Ihnen weiter.", "sich entschuldigen für + Akk.", "'dort' refers back to the bill: there the address was wrong.", "Adjective after possessive: seine richtige Anschrift.", "danken + Dat: wir danken Ihnen."]}, "hoeren1": [{"n": 41, "s": "Für die Sprecherin ist es unwichtig, ob ihre Kinder in der Schule gut sind.", "a": "f", "t": "Also, ich finde es sehr wichtig, dass meine Kinder gute Noten bekommen. Die Schule ist der Schlüssel für ihre Zukunft. Wenn sie in der Schule gut sind, haben sie später bessere Chancen. Ich achte darauf, dass sie lernen und ihre Hausaufgaben machen.", "e": "'sehr wichtig, dass meine Kinder gute Noten bekommen' – false."}, {"n": 42, "s": "Der Sprecher findet es wichtig, dass Eltern immer für ihre Kinder da sind.", "a": "r", "t": "Für mich ist es selbstverständlich, dass Eltern immer für ihre Kinder da sind. Egal, ob sie Hilfe bei den Hausaufgaben brauchen oder Probleme mit Freunden haben – ich höre zu und unterstütze sie, wann immer sie mich brauchen. Das ist einfach meine Aufgabe als Vater.", "e": "'selbstverständlich, dass Eltern immer für ihre Kinder da sind' – true."}, {"n": 43, "s": "Die Sprecherin glaubt, dass sie mehr mit ihrer Tochter sprechen müsste.", "a": "f", "t": "Ich denke, ich spreche schon sehr oft mit meiner Tochter. Wir erzählen uns alles über die Schule, über Freunde oder wie es uns geht. Ich sehe keinen Grund, warum ich noch mehr mit ihr sprechen sollte. Unsere Beziehung ist gut, so wie sie ist.", "e": "'Ich sehe keinen Grund, warum ich noch mehr ... sprechen sollte' – false."}, {"n": 44, "s": "Es ist dem Sprecher wichtig, dass seine Kinder gesund leben.", "a": "r", "t": "Mir ist es sehr wichtig, dass meine Kinder gesund leben. Sie sollen Obst und Gemüse essen, viel Wasser trinken und sich jeden Tag bewegen. Fernsehen oder Handy gibt es nur begrenzt. Gesundheit steht für mich an erster Stelle.", "e": "'Gesundheit steht für mich an erster Stelle' – true."}, {"n": 45, "s": "Der Sprecher möchte, dass sein Kind die eigenen Ideen realisieren kann.", "a": "r", "t": "Ich möchte, dass mein Kind seine eigenen Ideen verwirklichen kann. Wenn es später Künstler, Ingenieur oder Bäcker werden will, unterstütze ich das. Wichtig ist, dass es glücklich ist und das macht, was ihm wirklich Spaß macht – nicht das, was ich will.", "e": "'seine eigenen Ideen verwirklichen' = realise – true."}], "hoeren2": {"intro": "Im Radio spricht ein Moderator mit Frau Nicole Zimmermann, Mutter und Lehrerin, über den Spielpark Hartenfels in Torgau.", "speakers": ["Moderator", "Frau Zimmermann"], "lines": [["A", "Willkommen bei unserem heutigen Interview. Bei uns zu Gast ist Frau Nicole Zimmermann, Mutter und Lehrerin, die uns von einem besonderen Ort in Torgau erzählt. Frau Zimmermann, was macht diesen Ort für Familien so interessant?"], ["B", "Torgau ist ja allgemein bekannt für seine historischen Sehenswürdigkeiten. Viele Touristen kommen gerade deshalb in die Stadt. Aber für Familien mit Kindern ist der neue Spielpark Hartenfels ein echtes Highlight geworden."], ["A", "Spielpark Hartenfels – das klingt spannend. Seit wann gibt es diesen Park denn?"], ["B", "Der Park wurde erst vor zwei Jahren eröffnet, ist also noch ziemlich neu. Das merkt man auch: Alles ist modern, sicher und gut gepflegt."], ["A", "Und was genau bietet dieser Spielpark den Kindern?"], ["B", "Oh, sehr viel. Es gibt dort Spielmöglichkeiten, die man zu Hause in der Wohnung natürlich nicht hat: große Kletterburgen, Wasserspiele und sogar eine kleine Baustelle, auf der die Kinder selbst mit Sand, Holz und Steinen etwas bauen dürfen. Das ist besonders beliebt."], ["A", "Gibt es auch andere Freizeitangebote für Kinder in der Umgebung?"], ["B", "Ehrlich gesagt nicht wirklich viele. Die Region ist eher ruhig. Abgesehen vom Spielpark gibt es ein paar kleinere Grünflächen, aber keine speziellen Angebote für Kinder, wie zum Beispiel Schwimmbäder oder Kinderbauernhöfe."], ["A", "Manche Eltern haben ja Sorge, dass solche Spielangebote gefährlich sein könnten. Gibt es Risiken?"], ["B", "Die Kinder sollen frei spielen dürfen, aber Sicherheit ist auch wichtig. Das Spielen am Bach war früher ein Problem, aber dieser Bereich wurde inzwischen gesichert und ist derzeit sogar gesperrt. Also kein Grund zur Sorge."], ["A", "Und wie ist es mit der Aufsicht? Müssen beide Elternteile dabei sein?"], ["B", "Nein, das ist gar nicht nötig. Oft ist nur ein Elternteil mit den Kindern dort. Die meisten Eltern sitzen auf den Bänken rund um den Spielbereich, und man hat von fast überall einen guten Überblick."], ["A", "Gibt es auch eine Betreuung für kleinere Kinder?"], ["B", "Im Moment leider nicht. Es war geplant, dass Kinder bis sieben Jahre von Aufsichtspersonen betreut werden, aber das Angebot wurde bisher nicht umgesetzt."], ["A", "Wie sieht es mit dem Eintritt aus?"], ["B", "Der Eintritt in den Spielpark ist zurzeit kostenlos. Ich denke, das ist auch ein Grund, warum so viele Familien regelmäßig kommen."], ["A", "Klingt großartig. Und gibt es auch Führungen durch das Schloss?"], ["B", "Ja, Schlossführungen werden angeboten, aber sie sind eher historisch ausgerichtet. Für Kinder ist das oft zu trocken. Mein Sohn fand es langweilig, er wollte lieber wieder auf die Rutsche. Für Erwachsene kann es interessant sein, aber die Kinder haben meist nicht so viel Spaß daran."], ["A", "Frau Zimmermann, vielen Dank für das Gespräch."], ["B", "Sehr gerne. Es hat mich gefreut."]], "items": [{"n": 46, "s": "Viele Touristen besuchen Torgau wegen seiner historischen Sehenswürdigkeiten.", "a": "r", "e": "'Viele Touristen kommen gerade deshalb in die Stadt.'"}, {"n": 47, "s": "Den Spielpark Hartenfels gibt es schon seit vielen Jahren.", "a": "f", "e": "'Der Park wurde erst vor zwei Jahren eröffnet.'"}, {"n": 48, "s": "Außer dem Spielpark gibt es in der Umgebung viele andere Freizeitmöglichkeiten für die Kinder.", "a": "f", "e": "'Ehrlich gesagt nicht wirklich viele.'"}, {"n": 49, "s": "Der Spielpark bietet den Kindern Spielmöglichkeiten, die sie zu Hause nicht haben.", "a": "r", "e": "'Spielmöglichkeiten, die man zu Hause in der Wohnung natürlich nicht hat.'"}, {"n": 50, "s": "Die Kinder können im Spielpark auch selbst etwas bauen.", "a": "r", "e": "'... auf der die Kinder selbst ... etwas bauen dürfen.'"}, {"n": 51, "s": "Das Spielen am Bach kann für die Kinder gefährlich werden.", "a": "f", "e": "'... wurde inzwischen gesichert und ist derzeit sogar gesperrt. Also kein Grund zur Sorge.'"}, {"n": 52, "s": "Beide Elternteile müssen auf die Kinder aufpassen.", "a": "f", "e": "'Nein, das ist gar nicht nötig. Oft ist nur ein Elternteil ... dort.'"}, {"n": 53, "s": "Im Spielpark können Kinder bis zum Alter von sieben Jahren von Aufsichtspersonen betreut werden.", "a": "f", "e": "'Es war geplant ... aber das Angebot wurde bisher nicht umgesetzt.'"}, {"n": 54, "s": "Der Eintritt in den Spielpark ist zurzeit frei.", "a": "r", "e": "'Der Eintritt ... ist zurzeit kostenlos.'"}, {"n": 55, "s": "Die Schlossführung bereitet Kindern und Erwachsenen viel Spaß.", "a": "f", "e": "'Für Kinder ist das oft zu trocken. Mein Sohn fand es langweilig.'"}]}, "hoeren3": [{"n": 56, "s": "Die Linie 2 fährt zum Hauptbahnhof.", "a": "f", "t": "Achtung, eine Information der Verkehrsbetriebe: Wegen Bauarbeiten fährt die Straßenbahnlinie 2 heute nur bis zum Marktplatz und nicht weiter zum Hauptbahnhof. Fahrgäste zum Hauptbahnhof benutzen bitte die Linie 5. Wir bitten um Ihr Verständnis.", "e": "Line 2 only goes to Marktplatz; take line 5 to the main station – false.", "note": "reconstructed"}, {"n": 57, "s": "Das Hallenbad schließt heute um 21:00 Uhr.", "a": "r", "t": "Liebe Badegäste, wir möchten Sie darauf hinweisen, dass unser Hallenbad heute ausnahmsweise schon um 21 Uhr schließt und nicht wie sonst um 22 Uhr. Der Kassenschluss ist um 20 Uhr. Wir danken für Ihr Verständnis und wünschen Ihnen weiterhin viel Spaß.", "e": "'heute ausnahmsweise schon um 21 Uhr' – true.", "note": "reconstructed"}, {"n": 58, "s": "Sie können mit der S1 nach Hütteldorf fahren.", "a": "f", "t": "Sehr geehrte Fahrgäste, auf der Strecke nach Hütteldorf gibt es heute eine Störung. Die S1 fährt deshalb nicht nach Hütteldorf. Bitte nehmen Sie die U-Bahn-Linie U4 oder die Ersatzbusse vor dem Bahnhof. Wir entschuldigen uns für die Unannehmlichkeiten.", "e": "'Die S1 fährt deshalb nicht nach Hütteldorf' – false.", "note": "reconstructed"}, {"n": 59, "s": "Badezimmerspiegel finden Sie im Untergeschoss.", "a": "r", "t": "Liebe Kundinnen und Kunden, besuchen Sie unsere Badabteilung im Untergeschoss! Dort finden Sie diese Woche Badezimmerspiegel, Handtücher und Duschvorhänge zu besonders günstigen Preisen. Lampen und Möbel finden Sie wie immer im ersten Stock.", "e": "Bathroom mirrors are in the basement (Untergeschoss) – true.", "note": "reconstructed"}, {"n": 60, "s": "Sie können gleich in Richtung Eilenburg umsteigen.", "a": "r", "t": "Meine Damen und Herren, in wenigen Minuten erreichen wir Leipzig Hauptbahnhof. Sie haben Anschluss an den Regionalexpress in Richtung Eilenburg. Der Zug wartet am gegenüberliegenden Gleis, Sie können also gleich umsteigen. Auf Wiedersehen und eine gute Weiterreise.", "e": "The connecting train waits on the opposite platform – true.", "note": "reconstructed"}], "schreiben": {"letter": "Liebe(r) ...,\n\nendlich habe ich die Deutschprüfung hinter mir. Ich glaube, es ist gut gelaufen. Jetzt soll ich für unseren Kurs eine Party organisieren. Du hast doch kürzlich erzählt, dass du für euren Kurs auch ein Abschlussfest organisiert hast. Sicher kannst du mir ein paar Tipps geben. Ich habe mir gedacht, wir könnten vielleicht in einem Restaurant feiern. Da kann jeder essen und trinken, was er will. Was meinst du? Essen zu kochen ist doch ziemlich viel Arbeit. Und natürlich brauchen wir Musik. Welche Musik ist am besten geeignet? Was schlägst du vor?\n\nMelde dich bald. Ich freue mich schon auf deine Antwort.\n\nLiebe Grüße\nIris", "task": "Antworten Sie Ihrer Bekannten. Schreiben Sie etwas zu allen vier Punkten.", "points": ["Reaktion auf die Prüfung", "Wo feiern? Restaurant – Ihre Meinung", "Welche Musik", "Urlaubspläne"], "model": "München, 15. Juni 20..\n\nLiebe Iris,\n\nvielen Dank für deine E-Mail! Herzlichen Glückwunsch – ich bin sicher, dass du die Prüfung bestanden hast. Jetzt kannst du dich endlich ausruhen.\n\nDeine Idee mit dem Restaurant finde ich gut, weil niemand kochen oder aufräumen muss. Reserviere aber früh einen Tisch oder einen eigenen Raum. Bei unserem Fest hat jeder etwas aus seinem Land mitgebracht. Das war auch sehr schön, aber viel Arbeit.\n\nBei der Musik würde ich internationale Hits spielen, die alle kennen. Du könntest auch die Kursteilnehmer bitten, ein Lieblingslied aus ihrer Heimat mitzubringen. So wird es bestimmt lustig, und alle können tanzen.\n\nIm Sommer fahre ich zwei Wochen an die Ostsee. Ich freue mich schon sehr auf den Strand. Was machst du in den Ferien?\n\nViel Spaß bei der Party und liebe Grüße\ndeine Sandra", "phrases": ["Herzlichen Glückwunsch zur Prüfung!", "Deine Idee finde ich gut, weil ...", "Ich würde vorschlagen, dass ...", "Du könntest auch ...", "Im Sommer fahre ich ...", "Viel Spaß bei der Party!"]}, "vocab": [["kichern", "to giggle"], ["gemeinsam", "common, together"], ["entscheidend", "decisive"], ["beweisen (bewies, bewiesen)", "to prove"], ["empfinden (empfand, empfunden)", "to feel, perceive"], ["klagen über + Akk", "to complain about"], ["die Belastung, -en", "strain, workload"], ["befragen", "to survey"], ["schützen vor + Dat", "to protect from"], ["das Betriebsklima", "working atmosphere"], ["das Verhältnis, -se", "relationship"], ["selbstständig", "independently"], ["die Fähigkeit, -en", "ability"], ["die Erziehung", "upbringing"], ["überzeugen", "to convince"], ["die Gelegenheit, -en", "opportunity"], ["genießen (genoss, genossen)", "to enjoy"], ["die Verantwortung", "responsibility"], ["die Nachricht, -en", "news, message"], ["die Stimmung, -en", "mood"], ["die Entscheidung, -en", "decision"], ["sich anmelden", "to register"], ["die Erwartung, -en", "expectation"], ["anpassen an + Akk", "to adapt to"], ["der Lehrling, -e", "apprentice"], ["die Voraussetzung, -en", "requirement"], ["sich bewerben um + Akk", "to apply for"], ["aufmerksam", "attentive"], ["der Schalter, -", "counter"], ["die Führung, -en", "guided tour"], ["die Einladung, -en", "invitation"], ["die Mitfahrgelegenheit, -en", "lift, ride share"], ["keine Ahnung haben", "to have no idea"], ["die Versicherung, -en", "insurance"], ["die Unterlagen (Pl.)", "documents"], ["vertraulich", "confidential"], ["sich wenden an + Akk", "to turn to, contact"], ["beraten (berät, beriet, beraten)", "to advise"], ["der Schadensfall", "case of damage"], ["sich entschuldigen für + Akk", "to apologise for"], ["die Anschrift, -en", "address"], ["das Vertrauen", "trust"], ["die Note, -n", "grade, mark"], ["unterstützen", "to support"], ["verwirklichen", "to realise"], ["die Sehenswürdigkeit, -en", "sight, attraction"], ["eröffnen", "to open"], ["gesperrt", "closed off"], ["die Aufsicht", "supervision"], ["betreuen", "to look after"], ["der Eintritt", "admission"], ["kostenlos", "free of charge"], ["umsteigen (stieg um, umgestiegen)", "to change trains"], ["das Untergeschoss", "basement"], ["die Prüfung bestehen", "to pass the exam"], ["vorschlagen (schlug vor, vorgeschlagen)", "to suggest"], ["geeignet", "suitable"]], "grammar": ["bei + Dat for being at someone's place: bei dir.", "sich freuen auf + Akk → darauf (da-compound).", "Adjective endings after 'ein' with neuter nouns: ein halbes Jahr.", "Konjunktiv II of sein for wishes: Das wäre mein Traum!", "viel mehr + noun (comparative).", "noch existieren = still exist.", "wann (indirect question about time) vs. wenn (condition) vs. als (one time in the past).", "Modal verb wollen: ich will versuchen.", "Relative pronouns: die Mitfahrzentrale, die ... organisiert.", "informieren, dass ...; Passive: werden behandelt.", "Verbs with dative: helfen (er hilft Ihnen weiter), danken (wir danken Ihnen).", "sich entschuldigen für + Akk; Fragen haben zu + Dat."]}, {"n": 9, "title": "Frankfurter Flughafen · Computerprobleme · Wallner-Calletti", "lesen1": {"headlines": {"a": "Familienbildung: Schwerpunkt Beruf und Familie", "b": "Demonstration gegen Fluglärm", "c": "Flughafen Frankfurt wird 10 Jahre", "d": "Flughafen Frankfurt beliebter Veranstaltungsort", "e": "Experten gegen Vergrößerung des Flughafens", "f": "Diskussion über Flughafen und Arbeitsplätze", "g": "Neue Kurse: Spiele für Mütter und Kinder", "h": "Umwelt und Flughafen: Ein Informationsabend der Bürger", "i": "Neue Kurse für Kinder", "j": "Neue Kurse: Museumsführung für junge Väter"}, "texts": ["Der Frankfurter Flughafen wird weiter ausgebaut. Eine Gruppe von Frankfurter Bürgern aus den östlichen Stadtteilen, die sich seit Jahren aktiv für den Naturschutz und die Umwelt einsetzt, lädt für Donnerstag dieser Woche um 19.30 Uhr zu einem Informationsabend über den Ausbau des Frankfurter Flughafens ein. Im Bürgerhaus Ostend, Parkstraße 24, Clubraum 12, werden verschiedene Sprecher zu hören sein. Die Gruppe möchte Antworten auf folgende Fragen suchen: Wie viel Lärm durch Flugzeuge verträgt die Stadt? Welche Auswirkungen hat der Flugverkehr auf Umwelt und Natur?", "Der Frankfurter Flughafen erfreut sich bei vielen Firmen als beliebter Ort für Veranstaltungen und Tagungen. Dies zeigt ein Bericht des Frankfurter Flughafens, der beim zehnjährigen Jubiläum des Kongresszentrums vorgelegt wurde. Im Jubiläumsjahr haben am Frankfurter Flughafen 6800 Veranstaltungen mit insgesamt 72000 Teilnehmern stattgefunden. Im Jahr davor waren es nur 6300 Veranstaltungen mit 70000 Gästen. Im Kongresszentrum, das direkt gegenüber dem Hauptgebäude des Flughafens liegt, gibt es 28 Konferenzräume für bis zu 200 Teilnehmer. Modernste Technik wie Laptop-Anschlüsse und Internetzugänge in allen Konferenzräumen sind ebenso vorhanden wie ein Dolmetscherdienst und verschiedene Speisemöglichkeiten. Eine transportable Videokonferenz-Anlage ermöglicht Verbindungen in die ganze Welt.", "Eine Bürgergruppe mit dem Namen „Südliches Frankfurt“ lädt für Montag kommender Woche um 19.30 Uhr ins Pfarrhaus St. Mauritius, Mauritiusstraße 14, zu einer öffentlichen Expertenbefragung zum Thema Arbeitsplätze am Frankfurter Flughafen ein. Der Gruppe liegen Berichte und Daten vor, die nach den Worten der Sprecher der Gruppe sehr fantastisch und zweifelhaft sind. Deshalb hat die Bürgergruppe den Personalleiter des Frankfurter Flughafens, einen Experten aus dem Wirtschaftsministerium, einen bekannten Stadtentwicklungsplaner und einen Soziologen, der sich mit der Arbeitsplatzentwicklung in der Frankfurter Region beschäftigt, eingeladen. Im Anschluss an die Vorträge der Experten haben die Gäste Zeit, Fragen zu stellen.", "Das neue Halbjahresprogramm der Evangelischen Familienbildungsstätte bringt eine Übersicht über viele Veranstaltungen. Neben Kursen wie Geburtsvorbereitung und Babypflege steht diesmal das Thema „Berufstätige Eltern“ im Mittelpunkt. In Gruppen und Kursen vor allem für Frauen geht es darum, wie sich nach der Geburt eines Kindes Beruf und Familie miteinander vereinbaren lassen. Das Verhältnis zwischen Mann und Frau spielt eine große Rolle im Angebot der Familienbildung; hierzu gibt es wieder spezielle Programme nur für Frauen oder nur für Männer. Auch zum Verhältnis der Generationen (Großeltern und Enkelkinder) gibt es wieder Angebote. Darüber hinaus wartet das Programm mit Kursen für Entspannung und Zeitmanagement auf, die bei Fragen des Alltags helfen wollen.", "Die Volkshochschule Dornbirn bietet in den kommenden Wochen neue Kurse an. Am Mittwoch nächster Woche beginnen zwei Malkurse für Kinder. Zweieinhalb- bis vierjährige Kinder treffen sich um 15.30 Uhr, Kinder im Alter von fünf und sechs Jahren um 17.00 Uhr. Für Kinder im Alter zwischen eineinhalb und sechs Jahren und ihre Väter beginnt am Samstag um 10.00 Uhr eine feste Vater-Kind-Gruppe. Am darauffolgenden Samstag gibt es dann auch ein Treffen für Väter und Kinder bis dreieinhalb Jahre. Etwas anderes ist die Kultur- und Kreativwerkstatt am Montag nächster Woche: Aus Ton und Erde sollen Figuren nach afrikanischen Beispielen gebastelt werden. Zur Vorbereitung treffen sich die Teilnehmer am kommenden Montag zuerst im Museum. Anmeldung spätestens morgen bis 15.00 Uhr."], "key": ["h", "d", "f", "a", "i"], "why": ["A citizens' environmental group invites to an 'Informationsabend' about noise and nature – not a demonstration (b) and not experts against expansion (e).", "6800 events and 72000 participants: the airport is a popular 'Ort für Veranstaltungen'. The 10-year anniversary is of the congress centre, not the airport (trap c).", "An 'Expertenbefragung zum Thema Arbeitsplätze' with questions from guests = a discussion about the airport and jobs.", "Focus 'Berufstätige Eltern': how to combine 'Beruf und Familie' – a family education programme.", "Painting courses and father-child groups for children; the museum is only a preparation meeting (trap j), and there are no games for mothers (trap g)."]}, "lesen2": {"title": "Computerprobleme – ein Kinderspiel", "text": "Computerprobleme – ein Kinderspiel\nAnne und Melanie (beide 6) stehen Erzieherinnen mit Vorschlägen hilfreich zur Seite\nVon Christiane Altenberger\n\nSie sind die Problemlöser im Kindergarten an der Munckerstraße. Wenn das Malprogramm spinnt oder plötzlich ein Spiel auftaucht, das keiner kennt, dann rufen die Erzieherinnen nach Anne und Melanie. Die sind zwar erst sechs Jahre alt, aber mit den Computerspielen kennen sie sich aus. „Die Kinder wissen manchmal mehr als wir“, sagt Eva Schilling, Leiterin des Kindergartens. Gelernt haben die beiden ihr Know-how bei „Multimedia-Landschaften für Kinder“, einem Projekt, das das Schulamt zusammen mit dem „Studio im Netz“ gestartet hat.\n\nIm Rahmen dieses Projekts werden in städtischen Kindergärten zwei Wanderstationen mit je drei Multimedia-Computern und einem Farbdrucker installiert. Die Stationen wandern durch 14 Kindergärten, wo sie jeweils für vier Wochen installiert werden. Mit dabei in den Kindergärten: ein ganzer Satz von Spiel-Software.\n\nVierjährige am Computer? „In Pädagogenkreisen sind viele Berührungsängste da“, weiß Edith Ilg, Fachberaterin für Kindergärten beim Schulamt, „aber wir können uns aus dieser Entwicklung nicht ausklinken. Die Kinder wollen sich mit ihrer Umwelt auseinandersetzen.“ Angefangen hat diese Auseinandersetzung im „Studio im Netz“ – 193 Kinder waren eingeladen, um erste Erfahrungen am Computer zu sammeln. „Die Kinder waren absolut begeistert, haben immer wieder gefragt: Wann gehen wir da wieder hin?“, so Frau Ilg.\n\nBevor jedoch die Computer in die Kindergärten kamen, waren die Eltern aufzuklären. Bei manchen Eltern löste das Stichwort „Computer“ akute Ängste aus nach dem Motto: Mein fröhliches, gesundes Kind setzt sich vor den Computer und steht sechs Stunden später krank, sprachlos und einsam wieder auf.\n\nDiese Ängste haben sich inzwischen gelegt, und die Erfahrung vor Ort zeigt, dass sie weitgehend überflüssig sind. Die Erzieherinnen achten auch darauf, dass die Kinder nie länger als 15 bis 20 Minuten vor den Computern sitzen, und holen vor allem kreative Software auf den Bildschirm.\n\nDas einsame Dämmern vor dem Computer ist wohl ohnehin eher Sache der Erwachsenen – die Kinder spielen immer zu zweit oder zu dritt an der Maschine. Eva Schilling hat beobachtet, dass die Kinder am Computer sehr friedlich miteinander umgehen: Sie helfen sich gegenseitig, es gibt wenig Konflikte. Dabei entwickeln gerade Kinder, die sich sonst nur schwer auf etwas konzentrieren können, plötzlich ungeahnte Konzentrationszeiten. Eva Schilling kann sich deshalb die Computer als Dauereinrichtung im Kindergarten vorstellen.", "q": [{"n": 6, "stem": "Das Schulamt hat ein Projekt gestartet, bei dem", "opts": {"a": "Kinder in Kindergärten mit Computern spielen können.", "b": "Computerspiele für Vierjährige entwickelt werden sollen.", "c": "Erzieherinnen einen Computerkurs machen."}, "key": "a", "why": "'Multimedia-Landschaften für Kinder': computer stations with game software travel through 14 kindergartens. Nobody develops new games (b)."}, {"n": 7, "stem": "Die Kinder", "opts": {"a": "wollten immer wieder ins Studio im Netz gehen.", "b": "wussten nicht, wann sie ins Studio im Netz gehen sollten.", "c": "hatten Angst vor dem Computer."}, "key": "a", "why": "'haben immer wieder gefragt: Wann gehen wir da wieder hin?' – the question 'wann' shows enthusiasm, not confusion (trap b)."}, {"n": 8, "stem": "Eltern fürchten, dass", "opts": {"a": "ihre Kinder durch den Computer krank und einsam werden.", "b": "die Computer im Kindergarten zu teuer sind.", "c": "ihre Kinder zu Hause keinen Computer haben."}, "key": "a", "why": "'steht sechs Stunden später krank, sprachlos und einsam wieder auf' – that was the parents' fear."}, {"n": 9, "stem": "Die Erzieherinnen", "opts": {"a": "lassen die Kinder so lange spielen, wie sie wollen.", "b": "wissen mehr über Computer als die Kinder.", "c": "wählen für die Kinder die Software aus."}, "key": "c", "why": "'holen vor allem kreative Software auf den Bildschirm' – they choose the programs; time is limited to 15–20 minutes (not a)."}, {"n": 10, "stem": "Wenn die Kinder am Computer sitzen, dann", "opts": {"a": "spielt jedes Kind allein.", "b": "hilft ein Kind dem anderen.", "c": "gibt es oft Streit."}, "key": "b", "why": "'sie helfen sich gegenseitig, es gibt wenig Konflikte' – they play in twos or threes."}]}, "lesen3": {"note": "reconstructed", "situations": ["Sie wollen am Wochenende gerne in ein Klavierkonzert gehen.", "Sie sind in Füssen und wollen am Montag ins Museum gehen.", "Sie sind in Süddeutschland im Urlaub und möchten gerne eine bayerische Spezialität essen.", "Sie haben sich mit Bekannten zu einem Fischessen verabredet.", "Sie sind in Bayern und wollen Käsespezialitäten einkaufen.", "Sie möchten einen Deutschkurs in Wien besuchen.", "Ihr 16-jähriger Sohn soll in den Ferien im Ausland Englisch lernen.", "Sie interessieren sich für einen Sprachkurs auf CD.", "Sie wollen, dass Ihre 10-jährige Tochter in den Ferien eine Fremdsprache lernt.", "Eine Bekannte will ihren Geburtstag in einem Restaurant feiern und dort auch übernachten."], "ads": {"a": "Orgelkonzert im Dom zu Passau: Täglich um 12.00 Uhr spielt Domorganist Ludwig Ruckdeschel auf der größten Kirchenorgel der Welt. Eintritt 4 Euro.", "b": "Gasthof Zur Post, Garmisch: Original Weißwürste mit süßem Senf und frischen Brezen, dazu Schweinebraten mit Knödeln – echte bayerische Küche seit 1890. Täglich ab 11 Uhr geöffnet.", "c": "Allgäuer Käsehaus, Kempten: Über 100 Sorten Bergkäse, Emmentaler und Weißlacker direkt vom Hersteller. Probieren Sie vor dem Kauf! Mo–Sa 8–18 Uhr.", "d": "Museum der Stadt Füssen im ehemaligen Kloster St. Mang: Geschichte des Geigenbaus. Geöffnet Dienstag bis Sonntag 11–17 Uhr, montags geschlossen.", "e": "Schloss Elmau: Wochenend-Konzertreihe „Klavier am See“. Samstag und Sonntag, 20 Uhr: Werke von Chopin und Schubert mit der Pianistin Martha Klein. Karten ab 25 Euro.", "f": "Füssen: Das Museum im Hohen Schloss mit Gemälden aus Spätgotik und Renaissance ist täglich, auch am Montag, von 10 bis 17 Uhr geöffnet.", "g": "Englisch lernen in Brighton! Sprachreisen für Erwachsene ab 25 Jahren: 2 bis 6 Wochen, Unterricht am Vormittag, Unterkunft im Hotel. Info: Sprachreisen Weltweit, Tel. 089/23 45 67.", "h": "Sprachferien in England und Irland für Jugendliche von 14 bis 18 Jahren: Englischunterricht mit Muttersprachlern, Wohnen in Gastfamilien, Sport- und Freizeitprogramm. Juli und August.", "i": "Sprachschule Lingua Salzburg: Intensivkurse Deutsch für Ausländer, alle Niveaus, Beginn jeden Montag. Mitten in der Altstadt.", "j": "Deutsch in Wien! Das Sprachinstitut Danubia bietet Deutschkurse für alle Stufen: 4 Wochen, 20 Stunden pro Woche, mit Kulturprogramm. Anmeldung online.", "k": "Fischrestaurant Seestern am Starnberger See: Frische Renken und Forellen aus dem See, Fischplatte für zwei Personen. Reservierung empfohlen: Tel. 08151/12 34.", "l": "Landhotel Alpenblick: Feiern Sie Ihr Fest bei uns! Restaurant mit Saal für bis zu 80 Gäste und 30 gemütliche Gästezimmer – so können Ihre Gäste nach der Feier gleich übernachten."}, "key": ["e", "f", "b", "k", "c", "j", "h", "x", "x", "l"], "why": ["Ad e: piano concerts ('Klavier') on Saturday and Sunday. Ad a is an organ concert at noon.", "Ad f: museum in Füssen open 'auch am Montag'. Ad d is closed on Mondays.", "Ad b: Weißwürste and Schweinebraten – typical Bavarian food.", "Ad k: fish restaurant with fresh fish from the lake.", "Ad c: cheese shop in the Allgäu (Bavaria).", "Ad j: German courses in Vienna. Ad i is in Salzburg.", "Ad h: language holidays in England for teenagers 14–18. Ad g is only for adults over 25.", "No ad offers a language course on CD.", "No ad offers language holidays for a 10-year-old (h starts at 14).", "Ad l: restaurant with hall plus guest rooms to stay overnight."]}, "sprach1": {"text": "Liebe Catherine,\n\nseit ich dir das letzte Mal von meinem Sprachaufenthalt in der Schweiz [21] habe, ist viel passiert. Ich kenne [22] Land jetzt schon recht gut.\n\nDie Schweiz ist ja wirklich nicht groß, [23] in jeder Gegend wird ein anderer Dialekt oder gar eine andere Sprache gesprochen. Das ist [24] mich fast unglaublich! Bei uns in Australien fährt man mit dem Auto 24 Stunden lang geradeaus, und [25] man ankommt, dann sprechen die Leute dort immer noch dieselbe Sprache.\n\nAm Anfang hat mich das Sprachgemisch [26] sehr verwirrt, aber [27] verstehe ich fast alles, wenn jemand auf Schweizerdeutsch zu mir spricht. Ich kann aber nur auf Hochdeutsch antworten.\n\nZwischen der Schule hier und unserem Schulsystem in Australien gibt es einige [28]: In der Schweiz sprechen die Lehrer viel und die Schüler [29] vieles im Kopf behalten oder aufschreiben. In Australien arbeiten wir meistens im Rahmen von Projek
